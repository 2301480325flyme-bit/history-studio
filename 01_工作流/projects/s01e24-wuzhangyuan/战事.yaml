open_questions:
- 229年陈式攻武都、阴平，原文仅记“平二郡”；疆域.yaml只将武都郡归蜀汉，阴平在当时的郡级名称和归属如何对应，需统一地图表达。
- 231年张郃追击地，《后主传》作青封、《张郃传》作木门；两名是否同地、木门的现代比定是否适用于青封，未核。
- 234年《晋书》记阳遂、积石临原交战及魏军袭蜀营，《三国志》重点记百余日相持、屯田；旁白“司马懿扎营，就是不出战”省略了这些战斗，是否需要地图表现由Claude决定。
- 228年蜀军自陈仓撤退后与王双交战，原文未载具体战场；234年魏延、杨仪交兵的地点、行军路线及撤军途中驻点也都未核。
accepted: 2026-10-25 Claude 验收：统一地名、补 skip、去掉对不上脚本的途经点
