  # ---------------- 冷开场 ----------------
  - say: 诸葛亮死后，司马懿走进他留下的营寨，一处一处看过去，最后只说了一句：
    map: '228-12'
    year: 234
    phase: 奇才
    sources: [sgz-35]
    camera: {focus: [五丈原, 斜谷], zoom: 12, move: 1.6}
    show:
      - sfx: 重拍转场
      - enter: {who: 司马懿, side: right, cue: 司马懿, for: 4.4}

  - say: 此人，真是天下奇才！
    speaker: 司马懿
    style: 缓缓叹息，又敬又惧，低沉
    sources: [sgz-35]
    show:
      - quote: {text: 天下奇才也, source: 三国志·诸葛亮传, era: 建兴十二年, for: 3.6}

  - say: 可这位奇才北伐了一次又一次，为什么始终没打下来？
    sources: [sgz-35]
    camera: {focus: [汉中, 祁山, 长安], zoom: fit, move: 1.6}

  # ---------------- 第一章 陈仓 ----------------
  - say: 街亭失败的那年冬天，诸葛亮又出散关，围住陈仓。
    phase: 陈仓
    year: 228
    sources: [sgz-35]
    tells: [e02]
    show:
      - title_bar: {text: 五丈原, sub: 三国 · 第24集, for: 3.2}
      - sfx: 片头鼓
      - army: {head: 诸葛亮, from: 汉中, via: [散关], to: 陈仓, faction: 蜀汉, banner: 汉, troops: infantry, size: 2.6, cue: 散关, grow: 2.6}

  - say: 可曹真早就料到他会走陈仓，提前派郝昭加固了城墙。蜀军攻不下来，粮食吃完，只好撤退。
    sources: [sgz-09, sgz-35]
    camera: {focus: [散关, 陈仓], zoom: 12, move: 1.2}
    tells: [e01, e03, e04]
    show:
      - enter: {who: 郝昭, side: left, cue: 郝昭, for: 3.4}
      - enter: {who: 曹真, side: right, cue: 曹真, for: 3.4}
      - battle: {at: 陈仓, text: 已有备而不能克, cue: 攻不下来}
      - army: {head: 诸葛亮, from: 陈仓, via: [散关], to: 汉中, faction: 蜀汉, banner: 汉, troops: infantry, size: 2.2, cue: 撤退, grow: 2.0}   # 2026-10-25 补撤退：不然诸葛亮一直留在陈仓
      - flag: {at: 陈仓, name: 郝昭, sub: 治其城, faction: 魏, cue: 郝昭}   # 2026-10-25 战事账：郝昭、王生先守陈仓

  - say: 第二年，诸葛亮派陈式拿下了武都、阴平两个郡。刘禅恢复了他的丞相之位。
    map: '229-03'
    owners_cue: 拿下
    year: 229
    sources: [sgz-35]
    camera: {focus: [汉中, 武都, 祁山], zoom: fit, move: 1.4}
    tells: [e06, e10]
    show:
      - march: {from: 汉中, to: 武都, faction: 蜀汉, label: 平二郡, cue: 武都, grow: 1.6}
      - sfx: {name: 疆域易手, cue: 拿下}

  # ---------------- 第二章 木牛 ----------------
  - say: 二三一年，诸葛亮再出祁山。这一次，他用上了一种新的运粮工具：木牛。
    phase: 木牛
    year: 231
    sources: [sgz-35, sgz-33]
    camera: {focus: [汉中, 祁山, 木门], zoom: fit, move: 1.4}
    tells: [e11]
    show:
      - army: {head: 诸葛亮, from: 汉中, to: 祁山, faction: 蜀汉, banner: 汉, troops: infantry, size: 2.8, cue: 祁山, grow: 2.0}
      - act: {act: prop, at: 祁山, item: 粮草, text: 以木牛运, cue: 木牛, size: 1.2, for: 4}   # 木牛流马素材待补（第8批）

  - say: 对面来救祁山的，是司马懿和张郃。
    sources: [sgz-33]
    tells: [e12]
    show:
      - versus: {left: 司马懿, right: 张郃, label: 救祁山, cue: 司马懿, for: 3.6}
      - army: {head: 司马懿, from: 长安, to: 祁山, faction: 魏, banner: 司马, troops: cavalry, size: 2.8, cue: 司马懿, grow: 2.2, camp: false}   # 2026-10-25 战事账：懿、郃救祁山（出发地未载，按都督雍凉驻长安画）

  - say: 可粮食还是接不上。夏天，蜀军退兵。张郃追到木门，右膝中了一箭，死了。
    sources: [sgz-35, sgz-17]
    camera: {focus: [祁山, 木门], zoom: 12, move: 1.2}
    tells: [e15]
    show:
      - army: {head: 诸葛亮, from: 祁山, to: 汉中, faction: 蜀汉, banner: 汉, troops: infantry, size: 2.4, cue: 退兵, grow: 2.0}
      - battle: {at: 木门, text: 飞矢中郃右膝, cue: 中了一箭}
      - exit: {who: 张郃, at: 木门, verb: 卒, portrait: true, cue: 死了}
      - sfx: {name: 中箭, cue: 中了一箭}

  - say: 负责督运粮草的李严，也因为这次运粮的事，被撤职流放。
    sources: [sgz-33]
    show:
      - enter: {who: 李严, side: right, cue: 李严, for: 3}

  # ---------------- 第三章 五丈原 ----------------
  - say: 二三四年春，诸葛亮带着全部人马，出斜谷，用流马运粮，在五丈原扎下大营。
    phase: 五丈原
    year: 234
    sources: [sgz-35]
    camera: {focus: [汉中, 斜谷, 五丈原, 长安], zoom: fit, move: 1.6}
    tells: [e16, e17]
    show:
      - army: {head: 诸葛亮, from: 汉中, via: [斜谷], to: 五丈原, faction: 蜀汉, banner: 汉, troops: infantry, size: 3.2, cue: 斜谷, grow: 2.6}
      - sfx: {name: 低音转场, delay: -0.3}

  - say: 隔着渭水，司马懿扎下营寨，就是不出战。
    sources: [sgz-35]
    camera: {focus: 五丈原, zoom: 14, move: 1.2}
    show:
      - flag: {at: 五丈原, name: 司马懿, sub: 对于渭南, faction: 魏, cue: 司马懿}

  - say: 诸葛亮每次都愁粮食接不上。这一回，他干脆分兵种地，准备长期耗下去。
    sources: [sgz-35]
    show:
      - quote: {text: 亮每患粮不继，使己志不申, source: 三国志·诸葛亮传, era: 建兴十二年, cue: 粮食, for: 4.4}
      - act: {act: farm, at: 五丈原, cue: 种地, for: 4}

  - say: 蜀军就在渭水边，和当地百姓一起耕田。百姓照样安居，军中没有一个人侵扰他们。
    sources: [sgz-35]
    show:
      - card: {title: 渭滨屯田, body: 耕者杂于渭滨居民之间，而百姓安堵，军无私焉, cue: 安居}

  - say: 据说，诸葛亮还派人给司马懿送去一套女人的头巾和衣服，笑他不敢出战。
    sources: [sgz-03]
    show:
      - card: {title: 据说 · 巾帼之饰, body: 出自明帝纪注引《魏氏春秋》, cue: 女人}

  - say: 司马懿不生气，只问来使：诸葛公睡得怎么样，吃得多少，忙不忙？
    sources: [sgz-03]
    show:
      - vignette: {image: illus_simayi_envoy, cue: 只问来使, for: 8, text: 问寝食，不问军事}

  - say: 使者说：丞相起早贪黑，打二十军棍以上的处罚，都要亲自过问；一天吃的不过几升米。
    sources: [sgz-03]

  - say: 诸葛亮吃得这么少，事情这么多，还能撑多久？
    speaker: 司马懿
    style: 不动声色，慢条斯理，带着一丝冷笑
    sources: [sgz-03]

  # ---------------- 第四章 星落 ----------------
  - say: 两军对峙了一百多天。这年八月，诸葛亮病逝在军中，只有五十四岁。
    phase: 星落
    sources: [sgz-35]
    camera: {focus: 五丈原, zoom: 10, move: 1.0}
    show:
      - exit: {who: 诸葛亮, at: 五丈原, verb: 卒, portrait: true, cue: 病逝}
      - sfx: {name: 退场钟, cue: 病逝}
      - headline: {text: 星落五丈原, sub: 建兴十二年, cue: 五十四岁, for: 3.4}

  - say: 他一死，大将魏延和长史杨仪争权，带兵互相攻打。魏延兵败被杀。
    sources: [sgz-33]
    show:
      - versus: {left: 魏延, right: 杨仪, label: 争权不和, cue: 争权, for: 3}
      - exit: {who: 魏延, at: 汉中, verb: 诛, portrait: true, cue: 被杀}

  - say: 杨仪带着全军，退回了成都。
    sources: [sgz-33]
    camera: {focus: [五丈原, 斜谷, 汉中, 成都], zoom: fit, move: 1.4}
    tells: [e26]
    show:
      - march: {from: 五丈原, via: [斜谷, 汉中], to: 成都, faction: 蜀汉, label: 率诸军还成都, cue: 退回, grow: 3.2}   # 2026-10-25 原来一条直线翻过秦岭，改走斜谷、汉中

  - say: 等蜀军走远了，司马懿才走进他留下的营寨。这就是开头那一句：天下奇才。
    sources: [sgz-35]

  - say: 北伐为什么一直没成？诸葛亮自己最怕的，就是粮食接不上。何况对面，还是一个最能熬的司马懿。
    sources: [sgz-35]
    camera: {focus: [汉中, 五丈原, 长安, 成都], zoom: fit, move: 1.6}
    show:
      - card: {title: 演义 vs 正史, body: 死诸葛走生仲达只见于注引《汉晋春秋》；七星灯续命、木牛流马自己会走都是小说, cue: 司马懿}

  - say: 白帝城那句"竭尽全力，到死为止"，他用一辈子兑现了。
    sources: [sgz-35]

  - say: 如果诸葛亮多活十年，你觉得他能打下长安吗？
    territory_hold: 设问，长安没有易手
    sources: [sgz-35]

  - say: 诸葛亮走了。三国里最能熬的那个人，只剩下了司马懿。
    sources: [sgz-35]
    show:
      - enter: {who: 司马懿, side: right, cue: 司马懿, for: 3.4}
      - title_bar: {text: 下集, sub: 高平陵之变, cue: 司马懿, delay: 0.6, for: 3.0}
