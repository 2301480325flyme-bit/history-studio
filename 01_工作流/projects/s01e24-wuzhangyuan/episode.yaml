# 快节奏版（2026-10-14，按抖音数据：冷开场、只讲有戏的、无背景音乐）
# 《三国到隋》第24集：陈仓、取武都阴平、木牛与张郃之死、五丈原、诸葛亮病逝、魏延之死（228–234）
# 本地语料核对：
# 诸葛亮传"冬，亮复出散关，围陈仓，曹真拒之，亮粮尽而还。魏将军王双率骑追亮，亮与战，破之，斩双。七年，亮遣陈式攻武都、阴平…遂平二郡…今复君丞相"；
#   "九年，亮复出祁山，以木牛运，粮尽退军，与魏将张郃交战，射杀郃。十二年春，亮悉大众由斜谷出，以流马运，据武功五丈原，与司马宣王对于渭南。亮每患粮不继，使己志不申，是以分兵屯田，为久驻之基。耕者杂于渭滨居民之间，而百姓安堵，军无私焉。相持百余日。其年八月，亮疾病，卒于军，时年五十四。及军退，宣王案行其营垒处所，曰：天下奇才也！"；
# 曹真传"真以亮惩于祁山，后出必从陈仓。乃使将军郝昭、王生守陈仓，治其城。明年春，亮果围陈仓，已有备而不能克"；张郃传"郃追至木门，与亮军交战，飞矢中郃右膝，薨"；
# 后主传"九年…魏司马懿、张郃救祁山…秋八月，都护李严废徙梓潼郡"；"十二年…秋八月，亮卒渭滨。征西大将军魏延与丞相长史杨仪争权不和，举兵相攻，延败走。斩延首，仪率诸军还成都"。
# 注文（片中标"据说"）：明帝纪注引魏氏春秋"亮既屡遣使交书，又致巾帼妇人之饰，以怒宣王…宣王见亮使，唯问其寝食及其事之烦简…使对曰：诸葛公夙兴夜寐，罚二十已上，皆亲览焉；所啖食不过数升。宣王曰：亮体毙矣，其能久乎"。
# 不用：死诸葛走生仲达（汉晋春秋，注文）；七星灯续命、木牛流马自己会走（演义）；魏延子午谷奇谋（魏略，注文）。

id: s01e24-wuzhangyuan
title: 五丈原
series: 三国 · 第24集
year: 234

notes:
  - 主线问题：这位被对手称作"天下奇才"的人，北伐一次又一次，为什么始终没打下来？——粮食。他自己最怕的就是"粮不继"；对面又是一个肯熬的司马懿。
  - 反差：活着的时候司马懿不敢出战；死了以后，对手走进他的空营，只说了一句"天下奇才"。
  - 细节：曹真料到他走陈仓；木牛流马运粮；渭水边和百姓一起种地，"百姓安堵，军无私焉"；司马懿只问寝食；二十军棍以上的处罚亲自过问。
  - 动机：诸葛亮屯田，是为了解决粮道翻越秦岭、接济不上的问题。
  - 演义对照：死诸葛走生仲达只见于注引《汉晋春秋》；七星灯续命、木牛流马自己会走都是小说。

