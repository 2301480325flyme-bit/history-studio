publish:
  hook: 十几万联军，为什么打不过一个董卓？
  big: [斩华雄的, 不是关羽]
  hero: 孙坚
  at: 30
  summary: |
    公元190年，关东诸侯起兵讨董，号称十几万大军。可董卓烧了洛阳、挟天子西迁，酸枣的诸侯却天天喝酒开会，谁也不肯先打。
    真正拼命的只有两个人：曹操兵败汴水，靠曹洪让马才捡回一命；孙坚丢了赤帻、斩了华雄、打进洛阳，却被自己人卡住军粮。小说说的"温酒斩华雄"，史书上其实是孙坚。
  tags: [讨董卓, 孙坚, 曹操, 华雄, 十八路诸侯]
  next: 袁绍一兵未动拿下冀州，董卓死在了干儿子手里
