# 《三国到隋》第3集：关东诸侯讨董卓——十几万联军，为什么打不过一个董卓？
# 2026-10-11 按"慢慢讲故事 + 人物亲口说"重写（旧稿：series/三国到隋/第03集-关东讨董.md 的 v1）。
# 关键原文均在本地语料核过：臧洪盟辞（臧洪传）、曹操责诸将（武帝纪）、曹洪让马（曹洪传）、
# 孙坚赤帻 / 阳人斩华雄 / 夜驰见袁术 / 拒李傕和亲（孙破虏传）、焚洛阳"二百里内无复孑遗"（后汉书·董卓传）、王匡河阳津（后汉书·董卓传）。

id: s01e03-taodong
title: 关东讨董
series: 三国 · 第3集
year: 190

notes:
  - 主线问题：十几万联军，为什么打不过一个董卓？答案：打的是讨董的旗号，算的是自己的地盘；真拼命的只有曹操、孙坚。
  - 演义对照两处：十八路诸侯（史书点名十来家）；温酒斩华雄（史书是孙坚在阳人斩华雄）。
  - 传国玉玺出自《三国志·孙坚传》注引《吴书》，旁白用"据说"。
  - 孙坚梁东之败、赤帻、阳人之战在初平二年（191）；曹操汴水在初平元年（190）。
  - 地点"阳人""孟津（河阳津）"为示意点（2026-10-11 入库，误差 5–15 km）。

