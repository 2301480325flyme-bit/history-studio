  summary: |
    公元184年，张角喊出"苍天已死，黄天当立"，七州二十八郡同时响应。一个乡下道士为什么能一呼百应？答案藏在洛阳的皇宫里——汉灵帝在西园明码标价卖官。
    本集从黄巾起义讲到汉灵帝驾崩：长社一把火、卢植被诬下狱、刘焉"废史立牧"，朝廷平定了黄巾，却亲手造出了一个个地方诸侯。
  tags: [黄巾起义, 张角, 汉灵帝]
  next: 何进召董卓

