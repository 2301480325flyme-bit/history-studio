open_questions:
- 《法正传》将进言及刘备率诸将进兵系于建安二十二年（217）；《先主传》称建安二十三年（218）刘备进兵、分遣吴兰雷铜并驻阳平关。是分阶段还是纪年异文，需定地图开战年份口径。
- 《先主传》称“瓦口”，《张飞传》详写宕渠、蒙头、荡石；地名的准确位置和相互关系未核。
- 215年曹操“至阳平”后首轮攻不克并引军还，随后夜袭破敌；“引军还”是短暂退兵还是撤围后再返，史文未细明。
- 刘备军北上汉中的出发地、路径以及阳平后渡沔水的具体渡口山岭均未载；episode.yaml 的成都起点和曹军退往长安方向属路线推定。
- 夏侯渊死后郭淮、杜袭推张郃为军主，收整魏军的会合地点和日期未载。
- 《先主传》只记“夏”，未给撤军月份；疆域.yaml标219-05是地图取月口径，是否保留该月待定。曹操退军终点、归路、驻点未核；汉中转蜀汉依据是“曹公果引军还，先主遂有汉中”，不是逐城陷落记录。
- episode.yaml 地图日期止于219-05，末尾旁白跳到同年关羽攻樊；原文只记“是岁”，没有证明攻樊已发生在称王当时。关羽北进起点、完整路线和月份须另核。
