# 快节奏版（2026-10-14，按抖音数据：冷开场、只讲有戏的、无背景音乐）
# 《三国到隋》第18集：法正献策、定军山斩夏侯渊、曹操退兵、刘备称汉中王（217–219）
# 本地语料核对：
# 夏侯渊传"太祖常戒曰：为将当有怯弱时，不可但恃勇也。将当以勇为本，行之以智计；但知任勇，一匹夫敌耳"；"二十三年，刘备军阳平关，渊率诸将拒之。相守连年。二十四年正月，备夜烧围鹿角。渊使张郃护东围，自将轻兵护南围。备挑郃战，郃军不利。渊分所将兵半助郃，为备所袭，渊遂战死"；
# 法正传"曹操一举而降张鲁，定汉中，不因此势以图巴、蜀，而留夏侯渊、张郃屯守，身遽北还，此非其智不逮而力不足也，必将内有忧逼故耳。今策渊、郃才略，不胜国之将帅…此盖天以与我，时不可失也"；
# 先主传"二十四年春，自阳平南渡沔水，缘山稍前，于定军兴势作营。渊将兵来争其地。先主命黄忠乘高鼓噪攻之，大破渊军，斩渊…曹公自长安举众南征。先主遥策之曰：曹公虽来，无能为也，我必有汉川矣。及曹公至，先主敛众拒险，终不交锋，积月不拔，亡者日多。夏，曹公果引军还，先主遂有汉中"；"秋，群下上先主为汉中王…遂于沔阳设坛场…御王冠于先主"；
# 黄忠传"忠推锋必进，劝率士卒，金鼓振天，欢声动谷，一战斩渊…先主为汉中王，欲用忠为后将军，诸葛亮说先主曰：忠之名望，素非关、马之伦也…关遥闻之，恐必不悦…先主曰：吾自当解之"；
# 张郃传"渊遂没…三军皆失色。渊司马郭淮乃令众曰：张将军，国家名将，刘备所惮…遂推郃为军主"；
# 武帝纪注引九州春秋"鸡肋"（注文，片中标"据说"）。
# 不用：赵云汉水空营（云别传，注文且情节过细）；黄忠刀劈夏侯渊、法正举旗为号（演义）。

id: s01e18-dingjunshan
title: 定军山
series: 三国 · 第18集
year: 219

notes:
  - 主线问题：刘备凭什么从曹操手里夺下汉中？——法正看准曹操家里有事；抢占定军山的高处；曹操亲自来了就守着不打，拖到他自己走。
  - 反差：曹操一再告诫夏侯渊"当将军要有怕的时候"，他偏偏死在逞勇上；曹操亲征，刘备却放话"他来了也没用"。
  - 细节：夜烧鹿角；夏侯渊把一半兵分给张郃；黄忠从山上擂鼓冲下，喊声震动山谷；"鸡肋"（据说）；沔阳设坛称王。
  - 动机：法正判断曹操"内有忧逼"——不是不想打巴蜀，是后方有事。
  - 演义对照：黄忠刀劈夏侯渊、法正山头举旗为号都是小说；史书只写黄忠"乘高鼓噪"，一战斩渊。

