beats:
  # ---------------- 冷开场 ----------------
  - say: 曹操一直提醒一员大将：当将军，得有害怕的时候。光知道逞勇，不过是个匹夫。
    map: '215-08'
    year: 219
    phase: 怯弱
    sources: [sgz-09]
    camera: {focus: [长安, 南郑], zoom: fit, move: 1.6}
    show:
      - sfx: 重拍转场
      - quote: {text: 为将当有怯弱时，不可但恃勇也, source: 三国志·夏侯渊传, cue: 害怕, for: 4.4}

  - say: 这员大将叫夏侯渊。他没听进去，死在了定军山。
    sources: [sgz-09]
    show:
      - enter: {who: 夏侯渊, at: 南郑, side: right, cue: 夏侯渊, for: 4}

  # ---------------- 第一章 天以与我 ----------------
  - say: 四年前，曹操拿下汉中，留夏侯渊、张郃把守，自己急匆匆回了北方。
    audit_ok: [易手]
    phase: 天以与我
    year: 215
    sources: [sgz-37]
    camera: {focus: [南郑, 长安, 邺], zoom: fit, move: 1.6}
    tells: [e11]
    show:
      - title_bar: {text: 定军山, sub: 三国 · 第18集, for: 3.2}
      - sfx: 片头鼓
      - flag: {at: 南郑, name: 夏侯渊 · 张郃, sub: 屯守汉中, faction: 曹操, cue: 把守}
      - arrow: {from: 南郑, to: 邺, kind: direction, faction: 曹操, cue: 回了北方, grow: 1.6}

  - say: 两年后，法正对刘备说：
    year: 217
    scene: 军帐
    sources: [sgz-37]
    show:
      - enter: {who: 法正, side: left, cue: 法正, for: 2.4}

  - say: 曹操不趁势打巴蜀，自己急着北还，不是他不想，是家里有麻烦。
    speaker: 法正
    style: 冷静锐利，胸有成竹，压低声音
    scene: 军帐
    to: 刘备
    sources: [sgz-37]

  - say: 夏侯渊、张郃，比不上咱们的将领。这是老天送给我们的机会！
    speaker: 法正
    style: 越说越笃定，语气上扬，催促决断
    scene: 军帐
    to: 刘备
    sources: [sgz-37]

  - say: 刘备亲率大军北上，在阳平关和夏侯渊对峙，一耗就是一年多。
    year: 218
    sources: [sgz-09, sgz-32]
    camera: {focus: [成都, 阳平关, 南郑], zoom: fit, move: 1.6}
    tells: [e20, e21, e22]
    show:
      - army: {from: 成都, to: 阳平关, faction: 刘备, banner: 刘, head: 刘备, troops: infantry, size: 2.8, cue: 北上, grow: 2.2}
      - sfx: {name: 低音转场, delay: -0.3}
      - flag: {at: 阳平关, name: 夏侯渊 · 张郃, sub: 拒守阳平, faction: 曹操, cue: 夏侯渊}   # 2026-10-25 战事账：渊、郃并拒刘备于阳平

  # ---------------- 第二章 定军山 ----------------
  - say: 二一九年正月，刘备南渡沔水，沿着山往前推，在定军山抢占了高处。
    phase: 定军山
    year: 219
    sources: [sgz-32]
    camera: {focus: [阳平关, 定军山, 沔阳], zoom: 14, move: 1.4}
    map: '219-01'
    owners_cue: 定军山
    tells: [e23, e24]
    show:
      # 刘备 moves his camp from 阳平关 onto 定军山 (先主传：于定军山势作营); the camp label is the unit (第12批 接入)
      - army: {from: 阳平关, to: 定军山, faction: 刘备, banner: 刘, head: 刘备, troops: infantry, size: 2.4, cue: 南渡, grow: 2.0}

  - say: 夜里，他放火烧了魏军营外的鹿角。夏侯渊让张郃守东边，自己带轻兵守南边。
    sources: [sgz-09]
    show:
      - fire: {at: 定军山, cue: 放火, radius: 0.6, for: 4}
      - sfx: {name: 点火, cue: 放火}

  - say: 刘备先猛攻张郃。张郃顶不住，夏侯渊把自己一半人马分去救他。
    sources: [sgz-09]
    tells: [e26]
    show:
      - enter: {who: 张郃, side: right, cue: 张郃, for: 3}
      - battle: {at: 定军山, text: 先攻郃东围, cue: 猛攻}

  - say: 就在这时，黄忠从山上冲了下来，擂鼓呐喊，喊声震动了山谷。
    sources: [sgz-36, sgz-32]
    tells: [e27]
    show:
      - enter: {who: 黄忠, side: left, cue: 黄忠, for: 3.6}
      - sfx: {name: 古风擂鼓, cue: 擂鼓}
      - quote: {text: 金鼓振天，欢声动谷, source: 三国志·黄忠传, era: 建安二十四年, cue: 喊声, for: 4}
      - battle: {at: 定军山, text: 乘高鼓噪, cue: 冲了下来}

  - say: 一战，斩了夏侯渊。
    sources: [sgz-36]
    camera: {focus: 定军山, zoom: 18, move: 1.0}
    show:
      - exit: {who: 夏侯渊, at: 定军山, verb: 斩, portrait: true, cue: 斩了}
      - sfx: {name: 碎玻璃, cue: 斩了}

  - say: 魏军丢了主帅，个个吓得变了脸色。部将郭淮推张郃当主将，才勉强稳住。
    sources: [sgz-17]
    show:
      - enter: {who: 郭淮, side: right, cue: 郭淮, for: 3.4}

  # ---------------- 第三章 鸡肋 ----------------
  - say: 曹操亲率大军，从长安出斜谷南下。刘备隔着秦岭放话：
    phase: 鸡肋
    sources: [sgz-32]
    camera: {focus: [长安, 斜谷, 南郑], zoom: fit, move: 1.6}
    tells: [e29]
    show:
      - army: {from: 长安, via: [斜谷], to: 阳平关, faction: 曹操, banner: 曹, head: 曹操, troops: infantry, size: 3.2, cue: 南下, grow: 3.2}   # 2026-10-25 两段接力改一条：箭头按距离定速后，接力的 delay 对不上

  - say: 曹操来了也没用，汉中，我拿定了！
    speaker: 刘备
    style: 沉稳自信，难得的豪气，一字一顿
    sources: [sgz-32]

  - say: 曹操到了，刘备守住险要，就是不跟他打。
    sources: [sgz-32]
    camera: {focus: [南郑, 定军山, 阳平关], zoom: 10, move: 1.2}
    tells: [e30]

  - say: 一耗好几个月，攻不下来，曹军的逃兵，一天比一天多。
    sources: [sgz-32]

  - say: 据说这时曹操下了一道口令：鸡肋。主簿杨修听了，就开始收拾行装。
    sources: [sgz-01]
    show:
      - card: {title: 据说 · 鸡肋, body: 弃之如可惜，食之无所得——出自武帝纪注引《九州春秋》, cue: 鸡肋}
      - enter: {who: 杨修, side: right, cue: 杨修, for: 3.6}

  - say: 夏天，曹操撤军。汉中，归了刘备。
    map: '219-05'
    owners_cue: 归了
    sources: [sgz-32]
    camera: {focus: [南郑, 长安, 成都], zoom: fit, move: 1.4}
    tells: [e33]
    show:
      - rout: {at: 阳平关, via: [斜谷], to: 长安, faction: 曹操, banner: 曹, head: 曹操, cue: 撤军, size: 2.4}
      - sfx: {name: 疆域易手, cue: 归了}

  # ---------------- 第四章 汉中王 ----------------
  - say: 这一年秋天，刘备在沔阳设坛，戴上王冠，称汉中王。
    phase: 汉中王
    sources: [sgz-32]
    camera: {focus: [沔阳, 南郑], zoom: 10, move: 1.2}
    tells: [e34]
    show:
      - army: {from: 定军山, to: 沔阳, faction: 刘备, banner: 刘, head: 刘备, troops: infantry, size: 2.0, cue: 设坛, grow: 1.6}
      - headline: {text: 汉中王, sub: 建安二十四年, cue: 汉中王, for: 3.4}
      - sfx: {name: 铜锣, cue: 王冠}

  - say: 从涿郡起兵算起，整整三十五年。
    sources: [sgz-32]

  - say: 刘备要封黄忠做后将军，和关羽、张飞、马超平起平坐。诸葛亮担心：关羽在荆州听说了，恐怕不高兴。
    sources: [sgz-36]
    show:
      - versus: {left: 黄忠, right: 关羽, label: 同列, cue: 关羽, for: 4}

  - say: 刘备说：我自己去跟他解释。
    sources: [sgz-36]

  - say: 刘备凭什么夺下汉中？看准曹操后方有事；抢下定军山的高处；曹操来了就守着不打，拖到他自己走。
    audit_ok: [易手]
    sources: [sgz-37, sgz-32]
    camera: {focus: [南郑, 长安, 成都], zoom: fit, move: 1.4}
    show:
      - card: {title: 演义 vs 正史, body: 黄忠刀劈夏侯渊、法正山头举旗为号是小说；史书只写黄忠乘高鼓噪，一战斩渊, cue: 定军山}

  - say: 定军山这一仗，头功你给黄忠，还是给法正？
    sources: [sgz-36]

  - say: 就在刘备称王的时候，荆州的关羽，已经带兵北上，围住了樊城。
    sources: [sgz-32]
    camera: {focus: [江陵, 樊城, 南郑], zoom: fit, move: 1.6}
    tells: [e35]
    show:
      - march: {from: 江陵, to: 樊城, faction: 刘备, label: 关羽北伐, cue: 樊城, grow: 1.8}
      - title_bar: {text: 下集, sub: 水淹七军, cue: 樊城, delay: 0.4, for: 3.0}
