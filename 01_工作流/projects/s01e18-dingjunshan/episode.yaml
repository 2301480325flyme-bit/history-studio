publish:
  hook: 曹操一再提醒他要怕，他没听，死在了定军山
  big: [定军山]
  hero: 黄忠
  at: 30
  summary: |
    曹操拿下汉中，留夏侯渊、张郃把守，自己匆匆北还。法正说：这是老天送的机会。刘备北上和夏侯渊对峙一年多，南渡沔水，抢占定军山。黄忠从山上擂鼓冲下，一战斩了夏侯渊——曹操早就告诫过他"为将当有怯弱时"。
    曹操亲率大军南下，刘备放话"曹公虽来，无能为也"，守住险要就是不打。几个月后曹军逃兵越来越多，曹操撤军。这年秋天，刘备在沔阳称汉中王。
  tags: [定军山, 黄忠, 夏侯渊, 法正, 汉中王]
  next: 关羽水淹七军

