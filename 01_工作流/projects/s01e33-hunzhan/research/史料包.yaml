differences_and_disputes:
  - 《三国演义》是三国故事，不叙八王之乱本段；网络上“火烧长沙王乂”等故事须回到《晋书》传文。正史写司马越收捕乂、张方营中炙杀。
  - 《晋书》帝纪将荡阴系在永兴元年七月，后写八月王浚乌丸骑攻邺；《晋书》颖传补充腾与羯朱联军。用户背景把“304年七月荡阴”与“后被赶出邺”分两段，时间表达与纪年吻合。
  - 陆机传把乂与机交战地点写作鹿苑、死者赴七里涧；不能把这场战斗与石超在荡阴击败惠帝军合并。
  - 张方攻洛的伤亡数字互异：乂传写其初战死者五千余，惠帝纪写入京后死者万计。所指阶段不同，暂不判为矛盾。
  - 《晋书》记乂“时年二十八”；生年在任务资料中未核，因此不从年差反算。
  - 刘渊称汉王时的实际地望：惠帝纪只记刘元海僭号汉王；载记先记其至左国城、刘宣等上大单于号，再记称汉。按疆域图仅作西河郡根据地示意，不等同占领全郡。
  - 李雄攻取成都叙在惠帝纪前一个编年段，称成都王记于永兴元年。旁白应把军事夺城与称王分开，不声称同日。
  - 《晋书》没有给张方从长安到洛阳的完整关隘路线，也没有给王浚/腾从幽州驻地至邺的逐站路线；只记冀州屯驻、对邺用兵。地理线索不能补成确定路线。
  - 本地 sources 未返回《资治通鉴》卷八十二至八十四可核段落；通鉴互证暂标未核，不能把同书纪、传互见说成两部史书。

