illustration_and_tactical_scenes:
  - {scene: 东海王越逮捕司马乂，张方军营炙杀, source: [{quote: "潜与殿中将收乂送金墉城。", para: 晋书-p04621}, {quote: "方遣部将郅辅勒兵三千，就金墉收乂，至营，炙而杀之。", para: 晋书-p04622}]}
  - {scene: 惠帝北征在荡阴中伏，侍中嵇绍护驾而死, source: [{quote: "六军败绩于荡阴，矢及乘舆，百官分散，侍中嵇绍死之。帝伤颊，中三矢，亡六玺。", para: 晋书-p00101}, {quote: "唯绍俨然端冕，以身捍卫，兵交御辇，飞箭雨集，绍遂被害于帝侧，血溅御服", para: 晋书-p06256}]}
  - {scene: 张方军攻洛阳城门、城外营垒与城内火灾, source: [{quote: "方遂进攻西明门。乂率中军左右卫击之", para: 晋书-p04636}, {quote: "张方入京城，烧清明、开阳二门，死者万计。", para: 晋书-p00100}]}
  - {scene: 陆机军与长沙王乂战鹿苑、败退七里涧, source: [{quote: "长沙王乂奉天子与机战于鹿苑，机军大败，赴七里涧而死者如积焉，水为之不流", para: 晋书-p04328}]}
  - {scene: 王浚、东嬴公腾联军与乌丸、羯朱破邺，颖与惠帝单车出逃, source: [{quote: "与腾及乌丸、羯硃袭颖。候骑至鄴，颖遣幽州刺史王斌及石超、李毅等距浚，为羯硃等所败。鄴中大震，百僚奔走，士卒分散。", para: 晋书-p04630}, {quote: "颖舆帝单车走洛阳", para: 晋书-p00101}]}
  - {scene: 羯朱追至朝歌未及，惠帝五日至洛阳, source: [{quote: "五日至洛。羯硃追至朝歌，不及而还。", para: 晋书-p04630}]}
  - {scene: 刘渊到左国城后聚众，刘宣上尊号, source: [{quote: "元海至左国城，刘宣等上大单于之号，二旬之间，众已五万，都于离石。", para: 晋书-p07033}]}
  - {scene: 李雄由郫城攻成都，罗尚弃城, source: [{quote: "李雄自郫城攻益州刺史罗尚，尚委城而遁，雄尽有成都之地。", para: 晋书-p00100}]}
