episode: s01e33-hunzhan
title: 长沙王、成都王、河间王混战，刘渊李雄起兵
year: 302-304
handoff:
  - 上接第32集：司马乂已因讨赵王伦受封长沙王；本集从其与齐王冏冲突讲起。
  - 本集范围至304年秋冬：司马乂被杀、荡阴败战、颖失邺、刘渊与李雄称王；司马越得势作下集钩子。
  - 《晋书》惠帝纪记304年八月王浚乌丸骑攻邺；成都王颖传补东嬴公腾、羯朱及“朝歌—洛阳”退路。月份按纪年，不把战斗日写精确。
  - 本地 sources 对《资治通鉴》卷八十二至八十四未检得可用段落；以下逐条注明，事件至少以《晋书》纪传互见，不把通鉴内容冒充本地引文。

events:
  - id: e01
    date: 302-12
    people: [司马乂, 司马冏, 司马颙, 司马颖, 司马歆, 司马虓]
    place: 洛阳南止车门
    event: 河间王颙上表指齐王冏有无君之心；长沙王乂奉惠帝屯南止车门，攻杀冏。冏诸子幽金墉城。具体战斗日为十二月丁卯，公历年依编年换算为302年。
    evidence:
      - {quote: "十二月丁卯，河间王颙表齐王冏窥伺神器，有无君之心，与成都王颍、新野王歆、范阳王虓同会洛阳，请废冏还第。长沙王乂奉乘舆屯南止车门，攻冏，杀之", para: 晋书-p00099}
      - {quote: "十二月，荧惑袭太白于营室。占曰；“天下兵起，亡君之戒。”一曰：“易相。”初，齐王冏之京都，因留辅政，遂专傲无君。是月，成都、河间檄长沙王乂讨之，冏、乂交战，攻焚宫阙，冏兵败，夷灭。", para: 晋书-p00630}
    note: 惠帝纪与天文志均将事件系于十二月；公历换算按年表，日不换算。旁白所说“乂杀冏”可用。
  - id: e02
    date: 303-08
    people: [司马颖, 司马颙, 司马乂, 张方, 陆机, 牵秀, 石超]
    place: 洛阳
    event: 成都王颖与河间王颙举兵讨乂。颙遣张方、颖遣陆机、牵秀、石超等向洛阳；战争延续至304年正月。
    evidence:
      - {quote: "八月，河间王颙、成都王颖举兵讨长沙王乂，帝以乂为大都督，帅军御之。", para: 晋书-p00100}
      - {quote: "颙遣其将张方，颍遣其将陆机、牵秀、石超等来逼京师。", para: 晋书-p00100}
      - {quote: "领精卒七万向洛", para: 晋书-p04636}
    note: 颖传载陆机军从朝歌列阵至河桥、与乂战鹿苑；“朝歌至河桥”是军阵范围描述，不能直接推成完整行军路线。
  - id: e03
    date: 303-08
    people: [张方, 皇甫商, 司马乂]
    place: 宜阳
    event: 惠帝出十三里桥，遣皇甫商在宜阳抵御张方；皇帝其后退回宣武。
    evidence:
      - {quote: "乙丑，帝幸十三里桥，遣将军皇甫商距方于宜阳。己巳，帝旋军于宣武。", para: 晋书-p00100}
      - {quote: "颙遣其将张方，颍遣其将陆机、牵秀、石超等来逼京师。", para: 晋书-p00100}
      - {quote: "领精卒七万向洛", para: 晋书-p04636}
    note: 原文只给宜阳对阵和宣武退军，未说中间道路、渡口或交战结果细节。
  - id: e04
    date: 303-09
    people: [张方, 皇甫商, 司马衷]
    place: 河桥、芒山、偃师、豆田、缑氏
    event: 惠帝行军路线记为宣武—石楼—河桥—芒山—偃师—豆田—缑氏；皇甫商在河桥一带为张方所败，惠帝后击退牵秀。
    evidence:
      - {quote: "己巳，帝旋军于宣武。庚午，舍于石楼。天中裂，无云而雷。九月丁丑，帝次于河桥。壬午，皇甫商为张方所败。甲申，帝军于芒山。丁亥，幸偃师。辛卯，舍于豆田。癸巳，尚书右仆射、兴晋侯羊玄之卒。帝旋于城东。丙申，进军缑氏，击牵秀，走之。", para: 晋书-p00100}
      - {quote: "颖遣其将石超距战。", para: 晋书-p00101}
    note: 第二出处只证颖军作战，不是每个行军地名的独立佐证。站点顺序照惠帝纪，河桥究竟是何桥址尚未定位。
  - id: e05
    date: 303-09
    people: [张方, 司马乂, 司马衷]
    place: 洛阳西明门、清明门、开阳门
    event: 张方攻西明门并在洛城外筑垒；其军破入京城，焚清明、开阳二门，死者甚众。乂曾出击张方但未能解围。
    evidence:
      - {quote: "乂率中军左右卫击之", para: 晋书-p04636}
      - {quote: "张方入京城，烧清明、开阳二门，死者万计。", para: 晋书-p00100}
    note: 两段记载的伤亡口径/阶段不同（五千余、万计），不合并为单一数字。驻营点“駃水桥西”尚未定位。
  - id: e06
    date: 303-09/10
    people: [张方, 司马乂, 司马衷]
    place: 洛阳
    event: 张方军长期围攻洛阳，乂屡次出战；城中军民粮尽，曾决千金堨取水，后以奴婢舂米供军，米价至每石万钱。
    evidence:
      - {quote: "乂前后破颖军，斩获六七万人。战久粮乏，城中大饥，虽曰疲弊，将士同心，皆愿效死。", para: 晋书-p04621}
      - {quote: "方初于駃水桥西为营，于是筑垒数重，外引廪谷，以足军资。乂复从天子出攻方，战辄不利。", para: 晋书-p04636}
    note: 围城期跨年，原文没有逐月连续战况。本事件不作郡级易手。
  - id: e07
    date: 304-01
    people: [司马越, 司马乂, 张方, 潘滔, 郅辅]
    place: 金墉城、洛阳
    event: 东海王越担心战事不利，暗中逮捕乂送金墉城；潘滔建议密告张方，张方遣郅辅率兵三千到金墉收人，带回营中炙杀。乂死时二十八岁。
    evidence:
      - {quote: "而东海王越虑事不济，潜与殿中将收乂送金墉城。", para: 晋书-p04621}
      - {quote: "黄门郎潘滔劝越密告张方，方遣部将郅辅勒兵三千，就金墉收乂，至营，炙而杀之。乂冤痛之声达于左右，三军莫不为之垂涕。时年二十八。", para: 晋书-p04622}
    note: 传文给出“至营”即张方军营，未精确说明营地坐标；不要说在金墉城内烧死。
  - id: e08
    date: 304-07
    people: [司马衷, 司马越, 王戎, 司马简, 司马模, 石超, 嵇绍]
    place: 洛阳至安阳
    event: 陈眕奉诏讨成都王颖，惠帝与诸王率十余万北征，军至安阳；颖遣石超抵御。
    evidence:
      - {quote: "右卫将军陈以诏召百僚入殿中，因勒兵讨成都王颖。戊戌，大赦，复皇后羊氏及皇太子覃。己亥，司徒王戎、东海王越、高密王简、平昌公模、吴王晏、豫章王炽、襄阳王范、右仆射荀籓等奉帝北征，至安阳，众十余万，颖遣其将石超距战。", para: 晋书-p00101}
      - {quote: "军次安阳，众十余万，鄴中震惧。颖欲走，其掾步熊有道术，曰：“勿动！南军必败。”", para: 晋书-p04629}
    note: 源文以安阳为北征到达点，未列沿途关隘渡口；十余万是奉驾北征军总数。
  - id: e09
    date: 304-07
    people: [司马衷, 司马颖, 石超, 嵇绍]
    place: 荡阴
    event: 石超率军在荡阴迎击，晋军大败，惠帝中箭受伤、失六玺，侍中嵇绍死于帝侧；石超奉帝至邺。
    evidence:
      - {quote: "己未，六军败绩于荡阴，矢及乘舆，百官分散，侍中嵇绍死之。帝伤颊，中三矢，亡六玺。帝遂幸超军，馁甚，超进水，左右奉秋桃。超遣弟熙奉帝之鄴，颖帅群官迎谒道左。", para: 晋书-p00101}
      - {quote: "颖从之，乃遣奋武将军石超率众五万，次于荡阴。二弟匡、规自鄴赴王师，云：“鄴中皆已离散。”由是不甚设备。超众奄至，王师败绩，矢及乘舆，侍中嵇绍死于帝侧，左右皆奔散，乃弃天子于藁中。超遂奉帝幸鄴。", para: 晋书-p04629}
      - {quote: "长沙王乂奉天子与机战于鹿苑，机军大败，赴七里涧而死者如积焉，水为之不流，将军贾棱皆死之。", para: 晋书-p04328}
    note: 鹿苑、七里涧记的是此前陆机对乂之战，不是荡阴战场；不可混为一役。荡阴古址约在今河南汤阴一带，具体交战点未核。
  - id: e10
    date: 304-07
    people: [司马衷, 司马颖, 司马炽, 王戎, 荀籓]
    place: 邺
    event: 惠帝被迎入邺，成都王颖迎于道左；次日乘法驾至邺，颖改元建武并控制朝廷。
    evidence:
      - {quote: "颖帅群官迎谒道左。帝下舆涕泣，其夕幸于颖军。颖府有九锡之仪，陈留王送貂蝉文衣鹖尾，明日，乃备法驾幸于鄴，唯豫章王炽、司徒王戎、仆射荀籓从。", para: 晋书-p00101}
      - {quote: "超遂奉帝幸鄴。颖改元建武，害东安王繇，署置百官，杀生自己，立郊于鄴南。", para: 晋书-p04629}
    note: 记为成都王政权控制的魏郡（示意）而非另立朝代的郡级归属。
  - id: e11
    date: 304-08
    people: [王浚, 司马腾, 羯朱, 司马颖, 司马衷, 王斌, 石超, 李毅]
    place: 邺
    event: 王浚、东嬴公腾联络乌丸、羯朱袭颖；颖遣王斌、石超、李毅抵御而败。王浚以乌丸骑攻邺，颖兵大败。
    evidence:
      - {quote: "安北将军王浚遣乌丸骑攻成都王颖于鄴，大败之。", para: 晋书-p00101}
      - {quote: "安北将军王浚、宁北将军东嬴公腾杀颖所置幽州刺史和演，颖征浚，浚屯冀州不进，与腾及乌丸、羯硃袭颖。候骑至鄴，颖遣幽州刺史王斌及石超、李毅等距浚，为羯硃等所败。鄴中大震，百僚奔走，士卒分散。", para: 晋书-p04630}
    note: “王浚屯冀州”是屯驻记录，不等于明确出发城邑；两传只称攻邺，未记从蓟、涿或其他地点至邺的具体路线。
  - id: e12
    date: 304-08
    people: [司马颖, 司马衷, 卢志, 羯朱]
    place: 邺—朝歌—洛阳
    event: 邺城军队溃散后，颖与惠帝乘单车逃走；五日至洛阳，羯朱追至朝歌未及而还。卢志传补称当时贼军距邺八十里，惠帝在汲郡遇上守洛阳的郝昌兵。
    evidence:
      - {quote: "颖惧，将帐下数十骑，拥天子，与中书监虑志单车而走，五日至洛。羯硃追至朝歌，不及而还。", para: 晋书-p04630}
      - {quote: "志曰：“贼去鄴尚八十里，而人士一朝骇散，太弟今欲奉陛下还洛阳。”帝曰：“甚佳。”于是御犊车便发。屯骑校尉郝昌先领兵八千守洛阳，帝召之，至汲郡而昌至，兵仗甚盛。", para: 晋书-p03824}
    note: “朝歌”是追兵到达点；原文未列逃亡车驾途经点。两源分别给五日和汲郡会师信息。
  - id: e13
    date: 304-08
    people: [司马颖, 司马衷, 王浚, 司马腾]
    place: 魏郡（邺）
    event: 王浚方击败颖军后，邺不再由成都王颖控制；按疆域账现有事件将魏郡改回晋，属于治所郡示意，非全郡逐县占领记录。
    evidence:
      - {quote: "安北将军王浚遣乌丸骑攻成都王颖于鄴，大败之。颖舆帝单车走洛阳", para: 晋书-p00101}
      - {quote: "鄴中大震，百僚奔走，士卒分散。", para: 晋书-p04630}
    note: territory 按疆域.yaml 现有 304-08 事件填晋。若把“破邺”解释为对魏郡全域的即时有效控制，属于地图表达口径，不是史文逐县记载。
  - id: e14
    date: 304-10
    people: [刘渊（刘元海）, 刘宣]
    place: 左国城（离石）
    event: 刘渊于左国城称汉王，国号汉。其先受成都王颖授北单于，至左国城后聚众；左国城与离石关系按《晋书》地理说明标为今离石附近。
    evidence:
      - {quote: "辛丑，复皇后羊氏。李雄僭号成都王，刘元海僭号汉王。", para: 晋书-p00101}
      - {quote: "颖悦，拜元海为北单于、参丞相军事。元海至左国城，刘宣等上大单于之号，二旬之间，众已五万，都于离石。", para: 晋书-p07033}
      - {quote: "今见众十余万，皆一当晋十，鼓行而摧乱晋，犹拉枯耳。上可成汉高之业，下不失为魏氏。虽然，晋人未必同我。汉有天下世长，恩德结于人心，是以昭烈崎岖于一州之地，而能抗衡于天下。吾又汉氏之甥，约为兄弟，兄亡弟绍，不亦可乎？且可称汉，追尊后主，以怀人望。", para: 晋书-p07034}
    note: 《惠帝纪》记汉王；载记补此前“北单于/大单于”阶段。疆域账仅作西河郡起兵根据地示意，不能据此说全郡已稳定占领。
  - id: e15
    date: 304-10
    people: [李雄, 罗尚]
    place: 郫城、成都
    event: 李雄从郫进攻益州刺史罗尚，罗尚弃城逃走，李雄据成都；惠帝纪同年记李雄僭号成都王。注意《晋书》惠帝纪载攻成都的日期在太安三年正月，称王则在永兴元年秋，分作军事夺城与称王两件事。
    evidence:
      - {quote: "李雄自郫城攻益州刺史罗尚，尚委城而遁，雄尽有成都之地。", para: 晋书-p00100}
      - {quote: "辛丑，复皇后羊氏。李雄僭号成都王，刘元海僭号汉王。", para: 晋书-p00101}
    note: 《晋书》纪年分布显示称王在304年秋、夺成都叙于前一编年段；不能把攻城与称王压成同一天。疆域.yaml 将成汉势力起点登记在304-10，作势力形成示意。

