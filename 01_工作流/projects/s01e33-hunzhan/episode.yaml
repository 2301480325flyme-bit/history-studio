  - say: 城里断了粮，米涨到一万钱一石，连王公家的奴婢都拉去舂米。可将士们一条心，都愿意拼到底。
    sources: [js-04, js-59]
    show:
      - act: {act: coins, at: 洛阳, text: 米石万钱, cue: 一万钱, for: 3}
      - quote: {text: 虽曰疲弊，将士同心，皆愿效死, source: 晋书·长沙王乂传, cue: 一条心, for: 4}

  # ---------------- 第三章 出卖 ----------------
  - say: 拖到后来，张方自己也觉得打不下来，准备撤回长安了。
    phase: 出卖
