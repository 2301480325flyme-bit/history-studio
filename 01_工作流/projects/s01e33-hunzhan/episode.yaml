  big: [长沙王, 自己人]
  hero: 司马乂
  at: 3
  summary: |
    302 年十二月，长沙王司马乂奉惠帝在洛阳宫门外攻杀骄横的齐王冏，接掌朝政。303 年八月，成都王颖、河间王颙联兵讨伐：河间王大将张方带七万精兵东来，成都王的陆机大军"鼓声闻数百里"。长沙王在鹿苑大破陆机，逃兵跳进七里涧，尸体堵得河水不流，前后斩获六七万人。
    张方攻进城烧了两座城门，又在城西筑垒久围，城里米价涨到一万钱一石，将士仍愿死战。张方已打算撤回长安，东海王司马越却先怕了：304 年正月他暗中抓了长沙王送进金墉城，又密告张方。长沙王被押到张方营中活活烧死，年仅二十八岁，喊冤之声三军落泪。
  tags: [西晋, 八王之乱, 长沙王司马乂, 张方, 东海王司马越, 陆机]
  next: 荡阴之战

