  # ---------------- 第一章 齐王之死 ----------------
  - say: 先说上一集的齐王。他在洛阳辅政一年多，骄横得谁也管不了。
    phase: 齐王
    year: 302
    sources: [js-04]
    camera: {focus: [洛阳, 邺, 长安], zoom: fit, move: 1.4}
    show:
      - title_bar: {text: 长沙王之死, sub: 两晋 · 第33集, for: 3.2}
      - sfx: 片头鼓
      - enter: {who: 司马冏, side: left, cue: 齐王, for: 3.4}

  - say: 关中的河间王上表：齐王想当皇帝。三零二年十二月，长沙王带着傻皇帝，在宫门外攻打齐王。
    sources: [js-04]
    camera: {focus: 洛阳, zoom: 8, move: 1.2}
    tells: [e01]
    show:
      - act: {act: edict, at: 洛阳, text: 窥伺神器, sub: 河间王表, cue: 上表, for: 3}
      - battle: {at: 洛阳, text: 南止车门, cue: 攻打齐王}
      - sfx: {name: 刀剑交击, cue: 攻打}

  - say: 两边在洛阳城里打了几天，宫殿都烧了起来。齐王兵败被杀。
    sources: [js-04, js-12]
    show:
      - fire: {at: 洛阳, cue: 烧了起来, radius: 1.0, for: 3.6}
      - exit: {who: 司马冏, at: 洛阳, verb: 诛, portrait: true, cue: 被杀}
      - sfx: {name: 处斩, cue: 被杀}

  - say: 长沙王掌了朝政。可邺城的成都王、长安的河间王，都盯着洛阳。
    sources: [js-04]
    camera: {focus: [洛阳, 邺, 长安], zoom: fit, move: 1.4}
    show:
      - flag: {at: 邺, name: 成都王, sub: 司马颖, faction: 成都王, cue: 成都王, until: beat+3}
      - flag: {at: 长安, name: 河间王, sub: 司马颙, faction: 河间王, cue: 河间王, until: beat+3}

  # ---------------- 第二章 围城 ----------------
  - say: 三零三年八月，两个王联手讨伐长沙王。河间王的大将张方，带着七万精兵从关中东来。
