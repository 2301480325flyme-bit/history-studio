      - sfx: {name: 册封, cue: 皇太弟}

  # ---------------- 收 ----------------
  - say: 长沙王为什么打赢了还会死？城外的敌人他打得过，城里的自己人，他防不住。
    sources: [js-59]
    camera: {focus: [洛阳, 邺, 长安], zoom: fit, move: 1.6}
    show:
