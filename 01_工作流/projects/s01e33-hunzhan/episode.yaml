      - quote: {text: 列军自朝歌至于河桥，鼓声闻数百里, source: 晋书·陆机传, era: 太安二年, cue: 几百里, for: 4}

  - say: 长沙王带着皇帝出城迎战，大破陆机。逃兵跳进七里涧，尸体堆得河水都不流了。
    sources: [js-54]
