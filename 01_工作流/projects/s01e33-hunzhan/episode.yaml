      - sfx: {name: 步兵行军, cue: 东来}

  - say: 成都王派陆机带兵南下，从朝歌一直排到黄河边的河桥，鼓声传出几百里。
    sources: [js-54]
    camera: {focus: [邺, 朝歌, 河桥, 洛阳], zoom: fit, move: 1.4}
    tells: [e02]
    show:
      - enter: {who: 司马颖, side: right, cue: 成都王, for: 3}
      - army: {unit: 陆机, from: 邺, via: [朝歌], to: 河桥, faction: 成都王, banner: 陆, troops: infantry, size: 3.2, cue: 南下, grow: 2.2}
