  - say: 八王之乱打到这一步，已经没人在乎谁对谁错，只在乎自己能不能活。
    sources: [js-59]
    show:
      - headline: {text: 只求自己能活, sub: 八王之乱第三年, cue: 能不能活, for: 3.4}
      - sfx: {name: 史诗冲击, cue: 能不能活}

  - say: 如果你是东海王，城眼看守不住了，你会交出长沙王吗？
    sources: [js-59]
