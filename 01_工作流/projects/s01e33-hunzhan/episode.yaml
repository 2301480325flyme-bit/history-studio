# 快节奏版（2026-10-25）
# 《三国到隋》第33集 · 两晋：长沙王之死（302–304 年正月）。大纲第 29 条前半（后半荡阴、刘渊李雄拆到第 34 集）。
# 本地语料核对（晋书）：
# 惠帝纪 p00099 太安元年"十二月丁卯，河间王颙表齐王冏窥伺神器…长沙王乂奉乘舆屯南止车门，攻冏，杀之"；天文志 p00630"冏、乂交战，攻焚宫阙，冏兵败，夷灭"；
# 惠帝纪 p00100 太安二年"八月，河间王颙、成都王颖举兵讨长沙王乂…颙遣其将张方，颍遣其将陆机、牵秀、石超等来逼京师"；"遣将军皇甫商距方于宜阳"；"张方入京城，烧清明、开阳二门，死者万计"；"方决千金堨，水碓皆涸。乃发王公奴婢手舂给兵禀…公私穷踧，米石万钱"；"癸亥，东海王越执长沙王乂，幽于金墉城，寻为张方所害"；
# 河间王颙传 p04636 张方"领精卒七万向洛"；"方初于駃水桥西为营，于是筑垒数重…乂复从天子出攻方，战辄不利"；
# 陆机传 p04328"列军自朝歌至于河桥，鼓声闻数百里，汉、魏以来，出师之盛，未尝有也。长沙王乂奉天子与机战于鹿苑，机军大败，赴七里涧而死者如积焉，水为之不流"；
# 长沙王乂传 p04621"乂前后破颖军，斩获六七万人。战久粮乏，城中大饥，虽曰疲弊，将士同心，皆愿效死…张方以为未可克，欲还长安。而东海王越虑事不济，潜与殿中将收乂送金墉城"；
#   p04622"黄门郎潘滔劝越密告张方，方遣部将郅辅勒兵三千，就金墉收乂，至营，炙而杀之。乂冤痛之声达于左右，三军莫不为之垂涕。时年二十八"；
# 成都王颖传 p04628"颖既入京师，复旋镇于鄴…立颖为皇太弟，丞相如故…乘舆服御皆迁于鄴"。
# 不用：鹿苑、七里涧、駃水桥、西明门的精确地点（未定位，交战标在洛阳）；十三里桥—宣武—石楼—河桥—芒山—偃师—豆田—缑氏的惠帝行军全程（旁白不讲）；陆机被杀与"华亭鹤唳"（本集只一句带过陆机兵败）。

id: s01e33-hunzhan
title: 长沙王之死
series: 两晋 · 第33集
year: 302

notes:
  - 主线问题：长沙王守住了洛阳，几乎每一仗都赢了，为什么死得最惨？——敌人张方都打算撤回长安了，城里的东海王先怕了，把他抓起来，送进了敌营。
  - 钩子候选：①"敌人都准备撤兵了，他却被自己人绑了，送进敌营"（反差3 具体2 悬念3 兑现3=11）②"他打赢了几乎每一仗，最后被活活烧死"（反差3 具体2 悬念2 兑现3=10）③"二十八岁的王爷，死在自己人手里"（反差2 具体2 悬念2 兑现3=9）→ 选①。
  - 反差：陆机的大军"鼓声传出几百里"，一仗就溃；城里饿到米一万钱一石，将士却都愿拼命；张方准备撤了，东海王先投了降。
  - 细节：南止车门、宫殿起火；七里涧尸体堵住河水；烧了清明、开阳两座城门；王公家的奴婢亲手舂米给士兵；三千人到金墉城押人；喊冤声三军落泪。
  - 动机：东海王"虑事不济"，怕城破被清算；张方"以为未可克"。
  - 演义对照卡：结尾卡"史书怎么写"（长沙王乂传：张方以为未可克，欲还长安）。

