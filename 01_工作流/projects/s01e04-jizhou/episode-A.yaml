notes:
  - 主线问题：讨董联军散了，谁捡到了最大的便宜？谁又杀了董卓？
  - 孙坚死年史书有初平二年 / 三年两说，旁白只说"不久"，不标年份。
  - 貂蝉是小说人物；史书只说吕布"与卓侍婢私通"。用卡片点出。
  - 点天灯只用一句旁白 + 小灯，不画血腥。
  - 用户未定：孙坚之死放本集（按大纲默认）。

