beats:
  - say: 八百人，对三万。
    map: '191-05'
    year: 191
    phase: 八百对三万
    sources: [sgz-06, hhs-74]
    show:
      - forces: {left: {name: 袁绍先锋, sub: 八百人, who: 麴义}, right: {name: 公孙瓒, sub: 步骑三万, who: 公孙瓒}, loser: right, for: 4.6}
      - sfx: 重拍转场

  - say: 结果，三万人跑了。这一仗，打出了一个河北霸主。
    sources: [sgz-06, hhs-74]
    show:
      - sfx: {name: 碎玻璃, delay: 1.35}

  - say: 可这一切，得从袁绍白捡的一块地盘说起。
    phase: 空手套冀州
    sources: [sgz-06, hhs-74]
    camera: {focus: [河内, 邺], zoom: fit, move: 2.0}
    map: '191-05'
    show:
      - sfx: 片头鼓
      - flag: {at: 河内, name: 袁绍, sub: 联军盟主, faction: 袁绍, cue: 袁绍}
      - flag: {at: 邺, name: 韩馥, sub: 冀州牧, faction: 韩馥}
      - act: {act: courier, places: [邺, 河内], text: 军粮, grow: 1.4, for: 3}
      - sfx: {name: 低音转场, delay: -0.3}

  - say: 讨董联军散了伙，盟主袁绍手里有兵，却连军粮都要靠冀州牧韩馥接济。
    sources: [sgz-06]
    show:
      - enter: {who: 袁绍, side: left, cue: 袁绍, for: 3}

  - say: 袁绍想了一招：借刀杀人。他写信请北边的公孙瓒南下打冀州，
    sources: [sgz-06, hhs-74]
    camera: {focus: [河内, 邺, 蓟], zoom: fit, move: 1.4}
    show:
      - act: {act: courier, places: [河内, 蓟], text: 密信, cue: 写信, grow: 1.8, for: 3.4}
      - flag: {at: 蓟, name: 公孙瓒, sub: 奋武将军, faction: 公孙瓒, cue: 公孙瓒}

  - say: 再派人去吓唬韩馥：挡不住的，不如把冀州让给袁家。
    sources: [sgz-06, hhs-74]
    camera: {focus: [河内, 邺], zoom: fit, move: 1.4}
    show:
      - act: {act: courier, places: [河内, 邺], text: 说客, grow: 1.4, for: 3}

  - say: 韩馥竟然动了心。长史耿武急了：
    scene: 朝堂
    sources: [sgz-06, hhs-74]
    show:
      - enter: {who: 韩馥, side: right, cue: 韩馥, for: 3}

  - say: 冀州带甲百万，粮食够吃十年！袁绍就像抱在手里的婴儿，断了奶，立刻饿死！
    speaker: 耿武
    style: 又急又气，拍着桌子苦劝，声音发颤
    scene: 朝堂
    sources: [sgz-06, hhs-74]

  - say: 我本来就是袁家的旧部，才能又不如袁本初。让贤，是古人推崇的事！
    speaker: 韩馥
    style: 软弱迟疑，慢条斯理，自我安慰
    scene: 朝堂
    sources: [sgz-06, hhs-74]
    show:
      - versus: {left: 耿武, right: 韩馥, label: 让州, for: 7}

  - say: 就这样，袁绍一兵未动，拿下了天下最富的冀州。
    sources: [hhs-74, sgz-06]
    map: '191-07'
    owners_cue: 拿下
    camera: {focus: [河内, 邺], zoom: fit, move: 1.4}
    show:
      - act: {act: prop, at: 邺, item: 印绶, text: 让印, cue: 一兵未动, for: 3}
      - takeover: {at: 邺, from: 韩馥, to: 袁绍, cue: 拿下, name: 袁绍, sub: 冀州牧}
      - sfx: {name: 疆域易手, cue: 拿下}

  - say: 被当枪使的公孙瓒，大举南下。他有一支王牌：白马义从。胡人一见就喊：快躲开白马！
    phase: 界桥
    sources: [sgz-08, hhs-74]
    camera: {focus: [蓟, 邺], zoom: fit, move: 1.6}
    show:
      - enter: {who: 公孙瓒, at: 蓟, side: right, cue: 公孙瓒, settle: true, settle_sub: 白马将军}
      - sfx: {name: 登场, cue: 公孙瓒}
      - quote: {text: 虏相告云"当避白马", source: 三国志·公孙瓒传注引英雄记, era: 东汉末, cue: 躲开白马}
      - sfx: {name: 低音转场, delay: -0.3}

  - say: 两军在界桥摆开阵势。三万步兵结成方阵，上万骑兵护住两翼，旌旗铠甲，光照天地。
    sources: [sgz-06, hhs-74]
    show:
      - tactic: {layout: square_wings, phase: deploy, title: 界桥之战 · 示意, attacker: 公孙瓒, defender: 袁绍, banner_a: 公, banner_d: 麴}
      - quote: {text: 旌旗铠甲，光照天地, source: 三国志·袁绍传注引英雄记, era: 初平三年, cue: 旌旗}


  - say: 袁绍的先锋，就是开头那八百人。领头的，叫麴义。
    sources: [sgz-06, hhs-74]
    show:
      - tactic: {layout: square_wings, phase: deploy, title: 界桥之战 · 示意, attacker: 公孙瓒, defender: 袁绍, banner_a: 公, banner_d: 麴}
      - person_card: {who: 麴义, cue: 麴义}


  - say: 公孙瓒下令骑兵冲过去。八百人伏在盾牌底下，一动不动。
    sources: [sgz-06]
    show:
      - tactic: {layout: square_wings, phase: charge, title: 界桥之战 · 示意, attacker: 公孙瓒, defender: 袁绍, banner_a: 公, banner_d: 麴, cue: 冲过去}
      - sfx: {name: 骑兵行军, cue: 冲过去, len: 4}
      - card: {title: 伏楯不动, body: 义兵皆伏楯下不动，未至数十步乃同时俱起, cue: 一动不动}


  - say: 等到几十步内，同时跃起，强弩齐发！
    sources: [sgz-06, hhs-74]
    show:
      - tactic: {layout: square_wings, phase: volley, title: 界桥之战 · 示意, attacker: 公孙瓒, defender: 袁绍, banner_a: 公, banner_d: 麴, cue: 同时跃起}
      - sfx: {name: 喊杀, cue: 同时跃起}
      - sfx: {name: 箭雨, cue: 强弩齐发}


  - say: 公孙瓒大败。河北的主动权，到了袁绍手里。
    sources: [sgz-06, hhs-74]
    show:
      - tactic: {layout: square_wings, phase: rout, title: 界桥之战 · 示意, attacker: 公孙瓒, defender: 袁绍, banner_a: 公, banner_d: 麴, cue: 大败}
      - headline: {text: 界桥之战, sub: 八百先登 · 白马溃散, cue: 主动权, for: 3.2}


  - say: 差不多同时，南边的孙坚替袁术打刘表，把刘表围在了襄阳。
    phase: 岘山冷箭
    sources: [sgz-46]
    camera: {focus: [鲁阳, 襄阳], zoom: fit, move: 1.6}
    show:
      - versus: {left: 袁术, right: 刘表, label: 争荆州, cue: 刘表, for: 3.6}
      - army: {from: 鲁阳, to: 襄阳, faction: 孙坚, banner: 孙, troops: infantry, size: 2, grow: 2.4}
      - siege: {at: 襄阳, text: 围, faction: 孙坚, cue: 围在, for: 2.6}
      - sfx: {name: 低音转场, delay: -0.3}

  - say: 他一个人骑马追进岘山，林子里一支冷箭射来。江东猛虎，就这样死了。
    sources: [sgz-46]
    camera: {focus: [襄阳, 岘山], zoom: 14, move: 1.4}
    show:
      - flag: {at: 岘山, name: 黄祖, sub: 刘表部将, faction: 刘表, side: left}
      - march: {from: 襄阳, to: 岘山, faction: 孙坚, grow: 1.4}
      - act: {act: arrows, places: [岘山], for: 2.2}
      - exit: {who: 孙坚, at: 岘山, verb: 卒, cue: 死了, portrait: true}
      - sfx: {name: 退场钟, cue: 死了}
      - sfx: {name: 中箭, cue: 冷箭}

  - say: 再看长安。董卓当了太师，在郿县修了座万岁坞，囤的粮食够吃三十年。
    phase: 董卓之死
    sources: [sgz-06]
    camera: {focus: [长安, 郿], zoom: fit, move: 1.6}
    show:
      - enter: {who: 董卓, at: 长安, side: right, cue: 董卓, settle: true, settle_sub: 太师}
      - act: {act: prop, at: 郿, item: 城池, text: 万岁坞, cue: 万岁坞, size: 1.3, for: 3.4}
      - act: {act: prop, at: 郿, item: 粮仓, text: 积谷三十年, cue: 三十年, for: 3}
      - sfx: {name: 低音转场, delay: -0.3}

  - say: 事成了，我雄据天下；事不成，守着它也够我养老！
    speaker: 董卓
    style: 得意洋洋，粗声大笑，狂妄自负
    sources: [hhs-72]

  - say: 司徒王允，一直想除掉董卓。可董卓身边，有个谁也打不过的保镖：吕布。
    sources: [sgz-06, sgz-07]
    show:
      - enter: {who: 王允, side: left, cue: 王允, for: 3.4}
      - enter: {who: 吕布, side: right, cue: 保镖, for: 1.4}

  - say: 董卓跟吕布发誓结为父子。可他脾气一上来，拔出手戟就朝吕布扔。
    sources: [sgz-07, hhs-75]
    show:
      - versus: {left: 董卓, right: 吕布, label: 父子, cue: 董卓, for: 3.2}
      - act: {act: prop, at: 长安, item: 手戟, text: 掷戟, cue: 手戟, size: 1.3, for: 3}

  - say: 吕布还跟董卓的侍女私通，整天提心吊胆，怕哪天被发现。
    sources: [sgz-07]
    show:
      - card: {title: 三国志·吕布传, body: 布与卓侍婢私通，恐事发觉，心不自安, cue: 私通}

  - say: 他跑去找同乡王允，诉苦说董卓好几次差点杀了他。王允趁机劝他动手。吕布犹豫：
    sources: [sgz-07]
    to: 王允

  - say: 可我跟他，毕竟是父子啊！
    speaker: 吕布
    to: 王允
    style: 为难犹豫，压低声音
    quote: 奈如父子何！
    sources: [sgz-07]

  - say: 你姓吕，他姓董，本来就不是骨肉。你现在保命都来不及，还谈什么父子？
    speaker: 王允
    to: 吕布
    style: 低声冷静，字字点破
    quote: 君自姓吕，本非骨肉。今忧死不暇，何谓父子？
    sources: [sgz-07]

  - say: 吕布，答应了。
    sources: [sgz-07]

  - say: 公元一百九十二年四月，王允、吕布在北掖门设下埋伏。
    year: 192
    sources: [sgz-06, hhs-75]
    show:
      - versus: {left: 王允, right: 吕布, label: 密谋, for: 4}

  # ---------------- 第五章 未央殿 ----------------
      - act: {act: prop, at: 长安, item: 宫殿, text: 未央殿, for: 6}

  - say: 李肃一戟刺来，没刺穿铠甲。董卓摔下车，回头大喊：
    scene: 宫门
    sources: [hhs-72]
    show:
      - sfx: {name: 刀剑, cue: 一戟}

  - say: 吕布何在？！
    speaker: 董卓
    style: 惊恐暴怒，摔倒在地嘶声大喊
    scene: 宫门
    sources: [hhs-72]

  - say: 有诏讨贼臣！
    speaker: 吕布
    style: 冷硬决绝，高声宣告，杀气腾腾
    scene: 宫门
    sources: [hhs-72]
    show:
      - versus: {left: 董卓, right: 吕布, label: 讨贼, for: 4}

  - say: 庸狗！你敢如此！
    speaker: 董卓
    style: 破口大骂，又惊又怒，声嘶力竭
    scene: 宫门
    sources: [hhs-72]

  - say: 话音未落，吕布一矛刺死了董卓。
    scene: 宫门
    sources: [hhs-72]
    owners_cue: 刺死
    map: '192-04'
    show:
      - act: {act: execute, at: 长安, text: 诛董卓, tone: red, cue: 刺死, for: 3}
      - exit: {who: 董卓, at: 长安, verb: 诛, cue: 刺死, portrait: true}
      - sfx: {name: 处斩, cue: 刺死}

  - say: 长安百姓买酒买肉庆贺。守尸的士兵在董卓肚脐上点了盏灯，一烧就是好几天。
    sources: [hhs-72]
    show:
      - act: {act: prop, at: 长安, item: 酒瓮, text: 士女相庆, cue: 买酒买肉, for: 3.4}
      - sfx: {name: 欢呼, cue: 庆贺}
      - act: {act: prop, at: 长安, item: 火把, text: 然火置脐, for: 3}

  - say: 可王允不肯赦免董卓的旧部。走投无路的西凉兵，决定打回长安。
    sources: [hhs-72]
    camera: {focus: [长安, 陕], zoom: fit, move: 1.4}
    show:
      - flag: {at: 陕, name: 李傕 · 郭汜, sub: 董卓旧部, faction: 凉州军}
      - act: {act: courier, places: [陕, 长安], text: 求赦, grow: 1.4, for: 3}

  - say: 如果你是王允，饶，还是不饶？
    sources: [hhs-72]
    show:
      - march: {from: 陕, to: 长安, faction: 凉州军, grow: 1.6}
      - title_bar: {text: 下集, sub: 李傕郭汜破长安, delay: 0.6, for: 3.0}

