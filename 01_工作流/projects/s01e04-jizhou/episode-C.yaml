beats:
  - say: 他死后，守尸的士兵在他肚脐上点了一盏灯。灯火一直亮到天明，接连烧了好几天。
    camera: {focus: [长安], zoom: 7, move: 1.2}
    music: 底声·阴沉
    map: '191-05'
    year: 192
    phase: 天灯
    sources: [hhs-72]
    show:
      - exit: {who: 董卓, at: 长安, verb: 诛, portrait: true, side: left}
      - act: {act: prop, at: 长安, item: 火把, text: 然火置脐, cue: 点了一盏灯, for: 3}
      - sfx: 重拍转场

  - say: 他是东汉最有权势的人，董卓。杀他的，是跟他发誓结为父子的吕布。
    sources: [sgz-07]
    show:
      - versus: {left: 董卓, right: 吕布, label: 父子, for: 5}

  - say: 这一年，天下大变。
    sources: [sgz-07]

  - say: 袁绍借刀杀人，吓唬冀州牧韩馥。
    music: 底声·紧张
    phase: 天下大变
    sources: [sgz-06, hhs-74]
    year: 191
    camera: {focus: [河内, 邺], zoom: fit, move: 2.0}
    map: '191-05'
    show:
      - sfx: 片头鼓
      - flag: {at: 河内, name: 袁绍, sub: 联军盟主, faction: 袁绍, cue: 袁绍}
      - flag: {at: 邺, name: 韩馥, sub: 冀州牧, faction: 韩馥, cue: 韩馥}
      - act: {act: courier, places: [邺, 河内], text: 军粮, grow: 1.4, for: 3}
      - sfx: {name: 低音转场, delay: -0.3}

  - say: 胆小的韩馥，竟把天下最富的冀州，拱手让了出去。
    sources: [hhs-74, sgz-06]
    map: '191-07'
    camera: {focus: [河内, 邺], zoom: fit, move: 1.4}
    show:
      - act: {act: prop, at: 邺, item: 印绶, text: 让印, for: 3}
      - takeover: {at: 邺, from: 韩馥, to: 袁绍, name: 袁绍, sub: 冀州牧}
      - sfx: {name: 疆域易手}

  - say: 公孙瓒南下来抢。界桥一战，袁绍八百人强弩齐发，射垮了三万大军。
    sources: [sgz-06, hhs-74]
    camera: {focus: [邺, 界桥, 广宗], zoom: fit, move: 1.2}
    show:
      - army: {from: 邺, to: 界桥, faction: 袁绍, banner: 袁, troops: infantry, size: 2, grow: 1.8}
      - act: {act: arrows, places: [邺, 界桥], cue: 强弩齐发, for: 4}
      - act: {act: prop, at: 界桥, item: 箭, text: 强弩雷发, cue: 强弩齐发, size: 1.3, for: 4}
      - sfx: {name: 箭雨, cue: 强弩齐发}
      - sfx: {name: 喊杀}
      - sfx: {name: 箭雨, cue: 强弩齐发}

  - say: 南边，江东猛虎孙坚追进岘山，死于一支冷箭。
    sources: [sgz-46]
    camera: {focus: [襄阳, 岘山], zoom: 14, move: 1.4}
    show:
      - flag: {at: 岘山, name: 黄祖, sub: 刘表部将, faction: 刘表, side: left}
      - march: {from: 襄阳, to: 岘山, faction: 孙坚, grow: 1.4}
      - act: {act: arrows, places: [岘山], for: 2.2}
      - exit: {who: 孙坚, at: 岘山, verb: 卒, portrait: true}
      - sfx: {name: 退场钟}
      - sfx: {name: 中箭, cue: 冷箭}

  - say: 而长安城里，董卓当了太师，在郿县修了座万岁坞，囤的粮食够吃三十年。
    phase: 万岁坞
    sources: [sgz-06]
    camera: {focus: [长安, 郿], zoom: fit, move: 1.6}
    show:
      - enter: {who: 董卓, at: 长安, side: right, cue: 董卓, settle: true, settle_sub: 太师}
      - act: {act: prop, at: 郿, item: 城池, text: 万岁坞, cue: 万岁坞, size: 1.3, for: 3.4}
      - act: {act: prop, at: 郿, item: 粮仓, text: 积谷三十年, cue: 三十年, for: 3}
      - sfx: {name: 低音转场, delay: -0.3}

  - say: 事成了，我雄据天下；事不成，守着它也够我养老！
    speaker: 董卓
    style: 得意洋洋，粗声大笑，狂妄自负
    sources: [hhs-72]

  - say: 他宴请百官，当场折磨降兵，官员们吓得筷子都拿不住，他照样吃喝。
    sources: [hhs-72]
    camera: {focus: 长安, zoom: 4, move: 1.2}
    show:
      - act: {act: prop, at: 长安, item: 宴饮, text: 横门宴, cue: 宴请百官, for: 3.4}

  - say: 司徒王允想除掉他，可董卓身边站着吕布。
    sources: [sgz-06]
    show:
      - enter: {who: 王允, side: left, cue: 王允, for: 3}
      - enter: {who: 吕布, side: right, cue: 吕布, for: 3}
      - versus: {left: 董卓, right: 吕布, label: 父子, for: 5}

  - say: 可董卓脾气一上来，拔出手戟就朝吕布扔。
    sources: [sgz-07, hhs-75]
    show:
      - act: {act: prop, at: 长安, item: 手戟, text: 掷戟, cue: 手戟, size: 1.3, for: 3}

  - say: 吕布还跟董卓的侍女私通，整天提心吊胆。
    sources: [sgz-07, hhs-75]
    show:
      - card: {title: 演义 vs 正史, body: 史书只说"与卓侍婢私通"，貂蝉是小说人物, cue: 侍女}

  - say: 王允看准了，把吕布拉进了刺杀计划。
    sources: [sgz-06, hhs-75]
    show:
      - versus: {left: 王允, right: 吕布, label: 密谋, cue: 刺杀, for: 4}

  # ---------------- 第五章 未央殿 ----------------

  - say: 公元一百九十二年四月，董卓进宫。
    year: 192
    scene: 宫门
    phase: 北掖门
    sources: [sgz-06]
    camera: {focus: 长安, zoom: 6, move: 1.2}
    show:
      - act: {act: prop, at: 长安, item: 宫殿, text: 未央殿, for: 6}
      - sfx: {name: 低音转场, delay: -0.3}

  - say: 车到宫门，马突然受惊不肯走。董卓心里发毛，吕布劝他进去。
    scene: 宫门
    sources: [hhs-72]
    show:
      - act: {act: prop, at: 长安, item: 马车, text: 马惊不行, for: 6}
      - sfx: {name: 马嘶, cue: 受惊}

  - say: 一进门，李肃一戟刺来，没刺穿铠甲。董卓摔下车，回头大喊：
    scene: 宫门
    sources: [hhs-72]
    show:
      - sfx: {name: 刀剑, cue: 一戟}

  - say: 吕布何在？！
    speaker: 董卓
    style: 惊恐暴怒，摔倒在地嘶声大喊
    scene: 宫门
    sources: [hhs-72]

  - say: 有诏讨贼臣！
    speaker: 吕布
    style: 冷硬决绝，高声宣告，杀气腾腾
    scene: 宫门
    sources: [hhs-72]
    show:
      - versus: {left: 董卓, right: 吕布, label: 讨贼, for: 4}

  - say: 庸狗！你敢如此！
    speaker: 董卓
    style: 破口大骂，又惊又怒，声嘶力竭
    scene: 宫门
    sources: [hhs-72]

  - say: 话音未落，吕布一矛刺死了董卓。
    scene: 宫门
    sources: [hhs-72]
    owners_cue: 刺死
    map: '192-04'
    show:
      - act: {act: execute, at: 长安, text: 诛董卓, tone: red, cue: 刺死, for: 3}
      - exit: {who: 董卓, at: 长安, verb: 诛, cue: 刺死, portrait: true}
      - sfx: {name: 处斩, cue: 刺死}

  - say: 长安百姓卖了衣服首饰，买酒买肉，挤满了大街小巷。
    sources: [hhs-72]
    show:
      - act: {act: prop, at: 长安, item: 酒瓮, text: 士女相庆, cue: 买酒买肉, for: 3.4}
      - sfx: {name: 欢呼}

  - say: 可王允不肯赦免董卓的旧部。走投无路的西凉兵，决定打回长安。
    sources: [hhs-72]
    camera: {focus: [长安, 陕], zoom: fit, move: 1.4}
    show:
      - flag: {at: 陕, name: 李傕 · 郭汜, sub: 董卓旧部, faction: 凉州军}
      - act: {act: courier, places: [陕, 长安], text: 求赦, grow: 1.4, for: 3}

  - say: 如果你是王允，饶，还是不饶？
    sources: [hhs-72]
    show:
      - march: {from: 陕, to: 长安, faction: 凉州军, grow: 1.6}
      - title_bar: {text: 下集, sub: 李傕郭汜破长安, delay: 0.6, for: 3.0}

