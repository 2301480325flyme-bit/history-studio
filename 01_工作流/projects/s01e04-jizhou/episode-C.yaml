publish:
  hook: 肚脐点灯烧了好几天，董卓是怎么死的？
  big: [肚脐点灯]
  hero: 董卓
  at: 20
  summary: |
    讨董联军一散，袁绍靠一封信、一番话，兵不血刃拿下天下最富的冀州；界桥一战，麴义八百人伏在盾下，打垮了公孙瓒的白马义从。
    南边，孙坚单骑追进岘山，死于冷箭。长安城里，董卓修郿坞囤粮三十年，却在未央殿门口被干儿子吕布一矛刺死。
  tags: [董卓之死, 吕布, 袁绍, 公孙瓒, 孙坚]
  next: 李傕郭汜攻破长安

