# 第4集 版本C：细节冷开场「肚脐点灯」，单线董卓之死（快节奏对比稿，2026-10-13）
# 《三国到隋》第4集：袁绍空手套冀州，界桥大破白马义从，孙坚死于岘山，吕布刺杀董卓（191–192）
# 2026-10-11 按故事稿（series/三国到隋/故事稿/第04集-…）写成旁白。关键原文均在本地语料核过：
# 耿武"仰我鼻息"、韩馥"度德而让"（袁绍传注引英雄记 / 后汉书袁绍传）；界桥"白马义从""强弩千张"（袁绍传注、后汉书）；
# 孙坚"单马行岘山，为祖军士所射杀"（孙破虏传）；郿坞"守此足以毕老"、"吕布何在／有诏讨贼臣／庸狗敢如是邪"、
# "卓素充肥…然火置卓脐中，光明达曙"、"一岁不可再赦"（后汉书·董卓列传）；手戟、侍婢、誓为父子（吕布传）。

