    曹操派钟繇讨汉中张鲁，关中的马超、韩遂以为是冲自己来的，联合十路兵马堵住潼关。曹操正面相持，暗派徐晃夜渡蒲阪津；自己北渡时被马超追上，许褚左手举马鞍挡箭、右手撑船，才救下曹操。
    贾诩献计假装讲和，曹操和韩遂马上叙旧、拍手大笑，又送去一封涂改过的信——马超起了疑心。决战之日虎豹骑两面夹击，关中平定。敌人每来一支，曹操为什么反而高兴？
