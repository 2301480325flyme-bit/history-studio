# 快节奏版（2026-10-14，按抖音数据：冷开场、只讲有戏的、无背景音乐）
# 《三国到隋》第15集：潼关之战——曹操西征，离间马超韩遂，平定关中（211）
# 原大纲第12集第④章，单独成集。本地语料核对（三国志·武帝纪、许褚传）：
# "张鲁据汉中，三月，遣钟繇讨之…是时关中诸将疑繇欲自袭，马超遂与韩遂、杨秋、李堪、成宜等叛…超等屯潼关，公敕诸将：关西兵精悍，坚壁勿与战。秋七月，公西征…与超等夹关而军。
# 公急持之，而潜遣徐晃、朱灵等夜渡蒲阪津，据河西为营。公自潼关北渡，未济，超赴船急战。校尉丁斐因放牛马以饵贼，贼乱取牛马，公乃得渡，循河为甬道而南…潜以舟载兵入渭，为浮桥，夜，分兵结营于渭南"；
# "超等…固请割地，求送任子，公用贾诩计，伪许之。韩遂请与公相见，公与遂父同岁孝廉，又与遂同时侪辈，于是交马语移时，不及军事，但说京都旧故，拊手欢笑。既罢，超等问遂：公何言？遂曰：无所言也。超等疑之。
# 他日，公又与遂书，多所点窜，如遂改定者；超等愈疑遂。公乃与克日会战，先以轻兵挑之，战良久，乃纵虎骑夹击，大破之，斩成宜、李堪等。遂、超等走凉州，杨秋奔安定，关中平"；
# "始，贼每一部到，公辄有喜色…关中长远，若贼各依险阻，征之，不一二年不可定也。今皆来集，其众虽多，莫相归服，军无适主，一举可灭，为功差易，吾是以喜"；
# 许褚传"超将步骑万余人，来奔太祖军，矢下如雨…褚斩攀船者，左手举马鞍蔽太祖。船工为流矢所中死，褚右手并泝船，仅乃得渡"；"超负其力，阴欲前突太祖…乃问太祖曰：公有虎侯者安在？太祖顾指褚，褚瞋目盼之。超不敢动"。
# 不用：娄子伯"起沙为城，以水灌之"（曹瞒传，裴松之已疑"九月水未应冻"）；割须弃袍（演义）。

id: s01e15-tongguan
title: 潼关之战
series: 三国 · 第15集
year: 211

notes:
  - 主线问题：关中十路兵马十几万，敌人每来一支，曹操为什么反而高兴？——各守险要要打一两年；凑到一起，谁也不服谁，一仗就能解决。
  - 反差：最该担心的时候，曹操面有喜色；十几万人没输在战场，输在彼此猜疑。
  - 细节：许褚左手举马鞍挡箭、右手撑船；丁斐放牛马，敌兵抢牛马；曹操和韩遂马上叙旧、拍手大笑；涂改过的信；"公有虎侯者安在"。
  - 动机：马超韩遂起兵，是怕钟繇"借道打张鲁"其实是来打自己（武帝纪"疑繇欲自袭"）。
  - 演义对照：割须弃袍、许褚裸衣斗马超是小说；史书里险些丧命的是渡河那一刻。

