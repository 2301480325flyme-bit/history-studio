  "differences_and_debates": [
    "大纲“327年苏峻攻陷建康”应拆为327年十一月起兵、328年正月渡江、328年二月陷宫城；若按年写，327年是起兵年而非陷都年。证据：晋书-p00154、晋书-p00155。",
    "元帝323年崩；本纪记崩，天文志说其“屈辱，制于强臣”，未核实具体疾病病因。“忧愤”适合作叙事概括，不应写成医学死因。",
    "周札开门迎王敦。郗鉴反对王导事后赠官周札，认为开城门导致王师不振，存在史家评价分歧。证据：晋书-p05052。",
    "324年第二次进军时，王敦已屯姑孰/于湖，亲征军由王含等率水陆五万进至南岸；不宜写作王敦亲自再从武昌走到石头。",
    "苏峻军渡横江、登牛渚、次陵口、至蒋山；渡点和陵口古址未定。",
    "暂未核到演义对本段的可验证改写；《资治通鉴》卷九十至九十四本地未命中，不能声称已做逐条比较。",
    "这是晋内部叛乱与都城短期易手，没有汉赵、后赵、成汉与晋之间的郡级易主；战事账 territory 为 null，地图可讨论丹阳等郡争夺斜纹。",
    "《资治通鉴》补充了苏峻军“二万人”及军于陵口、陶侃“戎卒四万”、蔡洲/查浦/沙门浦分屯、白木陂斩苏峻、329年二月石头城破等细节；晋书本纪与载记略有省略。维基文库卷九十二至九十四已对校。"
  ],
