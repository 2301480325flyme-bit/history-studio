  - say: 太子司马绍即位，就是晋明帝，二十多岁。他的母亲是北方燕代人，他长着一把黄胡子。
    sources: [js-06]
    show:
      - enter: {who: 司马绍, side: right, cue: 司马绍, for: 3.6}
      - act: {act: enthrone, who: 司马绍, at: 建康, text: 即位, sub: 晋明帝, cue: 即位, for: 3}

  # ---------------- 第三章 黄须 ----------------
  - say: 三二四年，病重的王敦又带兵东下，屯在于湖，离建康只有一百多里。
    phase: 黄须
    year: 324
    sources: [js-06]
    camera: {focus: [武昌, 于湖, 建康], zoom: fit, move: 1.4}
    tells: [e10]
    show:
      - army: {head: 王敦, from: 武昌, to: 于湖, faction: 王敦, banner: 王, troops: infantry, size: 3.0, cue: 东下, grow: 2.2}

  - say: 六月，年轻的皇帝骑着一匹快马，偷偷跑到于湖，把王敦的营寨看了个遍。
    sources: [js-06]
    camera: {focus: [于湖, 建康], zoom: 9, move: 1.2}
    tells: [e11]
    show:
      - march: {from: 建康, to: 于湖, faction: 晋, label: 微行察营, cue: 偷偷, grow: 1.4}
      - sfx: {name: 马嘶, cue: 快马}

  - say: 王敦正在睡午觉，梦见太阳绕着城转，惊醒大喊：
    sources: [js-06]
    scene: 军帐

  - say: 一定是那个黄胡子的鲜卑小子来了！
    speaker: 王敦
    style: 病中惊醒，又惊又怒，声音沙哑却凶狠
    scene: 军帐
    quote: 此必黄须鲜卑奴来也
    sources: [js-06]

  - say: 他派五个骑兵去追。皇帝一边跑，一边往马粪上浇水，让粪凉下来。
    sources: [js-06]
    camera: {focus: [于湖, 建康], zoom: 9, move: 1.2}
    show:
      - quote: {text: 帝亦驰去，马有遗粪，辄以水灌之, source: 晋书·明帝纪, cue: 浇水, for: 4}

  - say: 他还把七宝马鞭送给路边卖饭的老太太：后面有人追来，就给他们看。
    sources: [js-06]
    show:
      - vignette: {image: illus_mingdi_whip, cue: 马鞭, for: 8, text: 以七宝鞭与之}

  - say: 追兵围着鞭子传着看，耽误了半天。一摸马粪是凉的，以为追不上了。
    sources: [js-06]
    show:
      - quote: {text: 五骑传玩，稽留遂久，又见马粪冷，以为信远而止不追, source: 晋书·明帝纪, cue: 凉的, for: 4.4}

  - say: 七月，王敦的哥哥王含带五万人杀到秦淮河南岸。温峤一把火烧了朱雀桥，叛军过不了河。
    sources: [js-06]
    camera: {focus: [于湖, 建康], zoom: fit, move: 1.4}
    tells: [e12]
    show:
      - army: {unit: 王含, from: 于湖, to: 建康, faction: 王敦, banner: 含, troops: infantry, size: 3.0, cue: 南岸, grow: 1.6, stop: approach}
      - enter: {who: 温峤, side: right, cue: 温峤, for: 3}
      - vignette: {image: illus_zhuque_fire, cue: 一把火, for: 5, text: 烧朱雀桁}
      - fire: {at: 建康, cue: 一把火, radius: 0.6, for: 3.4}

  - say: 半夜，皇帝派一千人偷偷渡河，天亮在越城大破叛军。
    sources: [js-06]
    tells: [e14]
    show:
      - act: {act: night, places: [建康], cue: 半夜, for: 3}
      - battle: {at: 建康, text: 越城大破之, cue: 大破}
      - sfx: {name: 刀剑交击, cue: 大破}

  - say: 王敦听到消息，又气又恨，病死在军中。
    sources: [js-06]
    show:
      - exit: {who: 王敦, at: 于湖, verb: 卒, portrait: true, cue: 病死}
      - sfx: {name: 落幕锣, cue: 病死}

  # ---------------- 收 ----------------
  - say: 王敦为什么当不了皇帝？第一次，他赢了兵，没赢人心，连王导都不站他那边。
    sources: [js-06, js-65]
    camera: {focus: [武昌, 于湖, 建康], zoom: fit, move: 1.6}
    show:
      - enter: {who: 王导, side: left, cue: 王导, for: 3}

  - say: 第二次，他碰上了一个敢亲自去看敌营的皇帝。
    sources: [js-06]
    show:
      - versus: {left: 司马绍, right: 王敦, label: 黄须, cue: 皇帝, for: 3.6}

  - say: 王家撑起了东晋，也差一点掀翻了东晋。
    sources: [js-65]
    show:
      - headline: {text: 王与马，共天下, sub: 也差点掀翻天下, cue: 掀翻, for: 3.4}
      - sfx: {name: 史诗冲击, cue: 掀翻}

  - say: 王导眼看好友被杀，一句话没说。你觉得，他有没有罪？
    audit_ok: [死亡]
    sources: [js-69]
    show:
      - card: {title: 成语出处, body: 伯仁由我而死——周顗传：吾虽不杀伯仁，伯仁由我而死, cue: 有没有罪, for: 3.6}

  - say: 王敦死了。三年后，又一个手握重兵的人，打进了建康。
    audit_ok: [死亡, 易手]
