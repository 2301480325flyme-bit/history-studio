publish:
  hook: 堂兄起兵造反，他每天带着全家跪在宫门外请罪
  big: [王敦之乱, 伯仁由我而死]
  hero: 王导
  at: 3
  summary: |
    322 年正月，镇守武昌的大将军王敦以"诛刘隗"为名起兵。刘隗劝晋元帝杀尽王氏，王导便带二十多个族人每天一早到宫门外请罪，元帝光着脚扶起他："我还要把天下托付给你。"四月王敦前锋到石头城，守将周札开门，朝廷三路出兵皆败，刁协被杀、刘隗北逃。王敦三次问王导该不该杀周顗，王导都不说话，周顗遂被杀；后来王导翻到周顗上书救自己的奏章，流泪说："吾虽不杀伯仁，伯仁由我而死。"
    323 年元帝在屈辱中去世，太子司马绍即位为晋明帝。324 年病重的王敦再度东下屯于湖，明帝骑快马亲自去看他的营寨，王敦惊呼"黄须鲜卑奴来了"，派骑兵追赶；明帝往马粪上浇水、把七宝鞭送给卖饭老妪，骗过追兵。七月温峤烧朱雀桁，千人夜渡在越城大破叛军，王敦愤惋而死。
  tags: [东晋, 王敦之乱, 王导, 晋明帝, 伯仁由我而死, 王与马共天下]
  next: 苏峻之乱

