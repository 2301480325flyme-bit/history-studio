beats:
  # ---------------- 冷开场 ----------------
  - say: 堂兄起兵造反，他每天一早，带着全家二十多口人，跪在宫门外请罪。
    map: '321-09'
    year: 322
    phase: 起兵
    sources: [js-65]
    camera: {focus: 建康, zoom: 7, move: 1.2}
    show:
      - sfx: 重拍转场
      - spot: {at: 建康, text: 诣台待罪, cue: 跪在宫门外}

  - say: 跪着的人，是丞相王导。造反的，是他的堂兄王敦。
    sources: [js-65]
    show:
      - enter: {who: 王导, side: left, cue: 王导, for: 3.4}
      - enter: {who: 王敦, side: right, cue: 王敦, for: 3.4}
      - sfx: {name: 悬疑, cue: 造反}

  # ---------------- 第一章 起兵 ----------------
  - say: 先说祖逖死后第二年，三二二年正月。王敦在武昌起兵，说要清除皇帝身边的奸臣刘隗。
    sources: [js-06]
    camera: {focus: [武昌, 建康], zoom: fit, move: 1.4}
    show:
      - title_bar: {text: 王敦之乱, sub: 东晋 · 第39集, for: 3.2}
      - sfx: 片头鼓
      - flag: {at: 武昌, name: 王敦, sub: 以诛刘隗为名, faction: 王敦, cue: 起兵, until: beat+2}
      - sfx: {name: 誓师, cue: 起兵}

  - say: 刘隗劝皇帝：把王家的人，全杀了。王导就带着二十多个族人，天天一早去宫门外跪着。
    sources: [js-65]
    camera: {focus: 建康, zoom: 7, move: 1.2}
    show:
      - enter: {who: 刘隗, side: right, cue: 刘隗, for: 3}
      - vignette: {image: illus_wangdao_kneel, cue: 跪着, for: 8, text: 每旦诣台待罪}

  - say: 晋元帝光着脚迎上去，拉住他的手：我还要把天下托付给你呢！
    sources: [js-65]
    show:
      - enter: {who: 司马睿, side: right, cue: 晋元帝, for: 3.4}

  - say: 四月，王敦的兵打到石头城，守将周札开门迎了进去。朝廷三路出兵，全败了。
    sources: [js-06]
    camera: {focus: [武昌, 石头城, 建康], zoom: fit, move: 1.4}
    tells: [e01, e05, e06, e07]
    show:
      - army: {head: 王敦, from: 武昌, to: 石头城, faction: 王敦, banner: 王, troops: infantry, size: 3.0, cue: 石头城, grow: 2.4}
      - battle: {at: 石头城, text: 周札开门 · 六军败绩, cue: 全败了}
      - sfx: {name: 刀剑交击, cue: 全败了}

  - say: 刘隗逃到了北方石勒那里，另一个大臣刁协在逃跑路上被杀。
    audit_ok: [死亡]
    sources: [js-06]
    show:
      - quote: {text: 尚书令刁协奔于江乘，为贼所害。镇北将军刘隗奔于石勒, source: 晋书·元帝纪, era: 永昌元年四月, cue: 刁协, for: 4}

  - say: 王敦问王导：周顗该不该杀？连问了几遍，王导一句话也不说。王敦就把周顗杀了。
    sources: [js-69]
    camera: {focus: [石头城, 建康], zoom: fit, move: 1.2}
    show:
      - quote: {text: 敦曰：若不尔，正当诛尔。导又无言, source: 晋书·周顗传, cue: 一句话也不说, for: 4}
      - sfx: {name: 处斩, cue: 杀了}

  - say: 后来王导翻旧文书，才发现周顗当初上书，拼命为他求过情。他捧着奏章，哭着说：
    sources: [js-69]
    scene: 书房

  - say: 我虽然没有杀伯仁，伯仁却是因为我而死的！
    speaker: 王导
    style: 捧着旧奏章，悔恨交加，泣不成声
    scene: 书房
    quote: 吾虽不杀伯仁，伯仁由我而死
    sources: [js-69]

  # ---------------- 第二章 强臣 ----------------
  - say: 王敦杀了一批忠臣，却连皇帝的面都不去见，说自己病了，回了上游的武昌。
    phase: 强臣
    sources: [js-49]
    camera: {focus: [武昌, 建康], zoom: fit, move: 1.4}
    show:
      - army: {head: 王敦, from: 石头城, to: 武昌, faction: 王敦, banner: 王, troops: infantry, size: 2.6, cue: 武昌, grow: 2.2}

  - say: 从此朝廷的大事，都得看他的脸色。
    sources: [js-49]
    show:
      - flag: {at: 武昌, name: 王敦, sub: 遥控朝廷, faction: 王敦, cue: 脸色}

  - say: 第二年闰十二月，晋元帝死了。史书说他一辈子受制于强臣，大耻未雪。
    year: 323
    sources: [js-12]
    camera: {focus: 建康, zoom: 6, move: 1.2}
    show:
      - exit: {who: 司马睿, at: 建康, verb: 卒, portrait: true, cue: 死了}
