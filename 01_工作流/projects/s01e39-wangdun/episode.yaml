# 快节奏版（2026-10-25）
# 《三国到隋》第39集 · 东晋：王敦之乱（322–324）。大纲第 34 条前半（苏峻之乱拆到第 40 集）。
# 本地语料核对（晋书）：
# 元帝纪 p00140 永昌元年"戊辰，大将军王敦举兵于武昌，以诛刘隗为名"；"四月，敦前锋攻石头，周札开城门应之…王导、周顗、郭逸、虞潭等三道出战，六军败绩。尚书令刁协奔于江乘，为贼所害。镇北将军刘隗奔于石勒"；"戴若思…周顗为敦所害"；
# 王导传 p04940"王敦之反也，刘隗劝帝悉诛王氏…导率群从昆弟子侄二十余人，每旦诣台待罪。帝以导忠节有素，特还朝服，召见之…帝跣而执之曰：茂弘，方托百里之命于卿，是何言邪"；
# 周顗传 p05180"敦既得志，问导曰：周顗、戴若思南北之望，当登三司…导不答…敦曰：若不尔，正当诛尔。导又无言。导后料检中书故事，见顗表救己…导执表流涕…曰：吾虽不杀伯仁，伯仁由我而死"；
# 天文志 p00546"元帝屈辱，制于强臣，即而晏驾，大耻不雪"；p00669"闰十二月，帝崩"；
# 明帝纪 p00146"夏四月，敦下屯于湖"；p00147"六月，敦将举兵内向，帝密知之，乃乘巴滇骏马微行，至于湖，阴察敦营垒而出…敦正书寝，梦日环其城，惊起曰：此必黄须鲜卑奴来也。帝母荀氏，燕代人，帝状类外氏，须黄…于是使五骑物色追帝。帝亦驰去，马有遗粪，辄以水灌之。见逆旅卖食妪，以七宝鞭与之…五骑传玩，稽留遂久，又见马粪冷，以为信远而止不追"；"敦遣其兄含及钱凤…水陆五万，至于南岸。温峤移屯水北，烧硃雀桁，以挫其锋…甲卒千人渡水，掩其未备。平旦，战于越城，大破之…王敦愤惋而死"。
# 不用：王敦"以如意击唾壶""老骥伏枥"（与本集主线无关）；王敦死后"出尸斩首"（本地语料未检到）；元帝"忧愤而死"（史料包：不宜写作确定病因，旁白只说"一辈子受制于强臣"）。

id: s01e39-wangdun
title: 王敦之乱
series: 东晋 · 第39集
year: 322

notes:
  - 主线问题：王敦两次带兵打向建康，为什么始终没坐上那把椅子？——第一次他赢了兵，赢不了人：王家人自己跪在宫门外请罪；第二次，他碰上一个敢亲自去看他营寨的年轻皇帝，病死在了军中。
  - 钩子候选：①"堂兄起兵造反，他每天带着全家跪在宫门外请罪"（反差3 具体3 悬念3 兑现3=12）②"我没杀伯仁，伯仁却因我而死"（反差2 具体3 悬念2 兑现3=10）③"皇帝往马粪上浇水"（反差3 具体3 悬念2 兑现3=11）→ 选①开场，③放高潮。
  - 反差：造反的是王家人，跪着请罪的也是王家人；皇帝光着脚迎请罪的臣子；王导一句话没说，好友就被杀；皇帝亲自当探子。
  - 细节：二十多口人每天一早跪宫门；周札开门；王敦问三次王导都不答；周顗的救人奏章；黄胡子鲜卑小子；往马粪上浇水；七宝鞭送卖饭老太太；烧朱雀桥；千人夜渡。
  - 演义对照卡：结尾卡"成语出处"——"伯仁由我而死"（周顗传）。

