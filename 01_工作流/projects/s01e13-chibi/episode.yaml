  big: [火烧赤壁]
  hero: 周瑜
  at: 30
  summary: |
    刘表病死，刘琮举荆州投降，曹操追刘备到当阳长阪，张飞据水断桥一声吼，赵云怀抱阿斗突围。曹操一封"治水军八十万众，方与将军会猎于吴"，吓得江东群臣纷纷劝降。
    鲁肃一句"将军迎操，欲安所归"，诸葛亮一番激将，周瑜一句"操自送死"，孙权拔刀斫案。赤壁一把东南风，黄盖诈降的几十艘火船，烧出了三分天下。
  tags: [赤壁之战, 周瑜, 诸葛亮, 孙权, 长坂坡]
  next: 刘备借荆州

