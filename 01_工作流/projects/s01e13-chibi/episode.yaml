# 快节奏版（2026-10-13，按抖音数据：冷开场、只讲有戏的、无背景音乐）
# 《三国到隋》第12集：曹操南下荆州，长坂坡，孙刘结盟，赤壁之战（208）
# 2026-10-11 写成（原大纲第11集，因第10集拆分顺延）。关键原文核对：
# 本地语料："太祖军到襄阳，琮举州降"（刘表传注）；张飞"据水断桥，瞋目横矛曰：身是张益德也，可来共决死"；赵云"身抱弱子，即后主也"（关张马黄赵传）；
# 鲁肃"今肃可迎操耳，如将军，不可也…将军迎操，欲安所归"（鲁肃传）；诸葛亮"若能以吴、越之众与中国抗衡，不如早与之绝；若不能当，何不案兵束甲，北面而事之…田横，齐之壮士耳"、
# 孙权"吾不能举全吴之地，十万之众，受制于人"（诸葛亮传）；周瑜"操虽托名汉相，其实汉贼也…况操自送死，而可迎之耶"（周瑜传）；
# 黄盖"今寇众我寡，难与持久。然观操军船舰，首尾相接，可烧而走也"…"先书报曹公，欺以欲降…时风盛猛，悉延烧岸上营落"（周瑜传）；
# 华容道"悉使羸兵负草填之…刘备，吾俦也。但得计少晚"（武帝纪注引山阳公载记）。
# Wikisource 核对（本地语料未收）：曹公与权书"今治水军八十万众，方与将军会猎于吴"（吴主传注引江表传）；孙权"拔刀斫前奏案…与此案同"（周瑜传注引江表传）。

id: s01e13-chibi
title: 赤壁之战
series: 三国 · 第13集
year: 208

notes:
  - 主线问题：曹操号称八十万，怎么一夜之间就输了？——北方兵不习水战、染上疾病，船连在一起，一把火。
  - 演义对照：草船借箭、借东风、苦肉计、连环计（庞统献计）都是小说；史书只有黄盖诈降火攻。"八十万"是曹操自己信里的说法，周瑜估计实际十五六万。
  - 华容道"关羽义释曹操"是小说；史书是曹操让羸兵填路，自己说"刘备，吾俦也"。

