  big: [借荆州]
  hero: 周瑜
  at: 30
  summary: |
    赤壁之后，周瑜和曹仁在江陵对峙一年多，周瑜冲阵中箭，带伤巡营，逼走曹仁；刘备趁机南下，荆南四郡太守全部投降。孙权把妹妹嫁给刘备——侍女百余人，个个带刀。
    周瑜劝孙权把刘备"养"在吴地，孙权不听；周瑜在去取蜀的路上病逝，年仅三十六。鲁肃劝孙权把南郡借给刘备，曹操听到消息，手里的笔掉在了地上。
  tags: [借荆州, 周瑜, 鲁肃, 刘备, 孙权]
  next: 曹操西征，潼关大战马超

