beats:
  # ---------------- 冷开场 ----------------
  - say: 赤壁输了，曹操还能大笑。可这一回，一个消息传来，他手里的笔，掉在了地上。
    map: '208-09'
    year: 210
    phase: 落笔
    sources: [sgz-54]
    camera: {focus: [许, 江陵, 京口], zoom: fit, move: 1.6}
    show:
      - sfx: 重拍转场
      - enter: {who: 曹操, at: 许, side: left, cue: 曹操, for: 4.4}
      - quote: {text: 方作书，落笔于地, source: 三国志·鲁肃传, era: 建安十五年, cue: 笔, for: 4}
      - sfx: {name: 碎玻璃, cue: 掉在}

  - say: 让他失态的，是孙权借给刘备的一块地。
    sources: [sgz-54]
    show:
      - versus: {left: 孙权, right: 刘备, label: 借荆州, cue: 借给, for: 3.6}

  # ---------------- 第一章 江陵一年 ----------------
  - say: 赤壁之后，曹操回了北方，留大将曹仁守江陵。
    phase: 江陵一年
    year: 209
    sources: [sgz-47, sgz-54]
    camera: {focus: [乌林, 江陵, 襄阳], zoom: fit, move: 1.6}
    show:
      - title_bar: {text: 借荆州, sub: 三国 · 第14集, for: 3.2}
      - sfx: 片头鼓
      - flag: {at: 江陵, name: 曹仁, sub: 守江陵, faction: 曹操, cue: 曹仁}
      - enter: {who: 曹仁, side: left, cue: 曹仁, for: 3.4}

  - say: 周瑜追到江陵城下，这一围，就是一年多。
    sources: [sgz-47]
    camera: {focus: [江陵, 乌林], zoom: fit, move: 1.4}
    show:
      - enter: {who: 周瑜, side: right, cue: 周瑜, for: 3}
      - army: {from: 乌林, to: 江陵, faction: 孙权, banner: 周, troops: infantry, size: 2.4, cue: 追到, grow: 2.0}
      - sfx: {name: 低音转场, delay: -0.3}

  - say: 周瑜亲自骑马冲阵，一支流箭，正中右肋。
    sources: [sgz-54]
    camera: {focus: 江陵, zoom: 8, move: 1.2}
    show:
      - battle: {at: 江陵, text: 流矢中右胁, cue: 流箭}
      - sfx: {name: 中箭, cue: 流箭}

  - say: 曹仁听说周瑜躺着起不来，马上带兵出城挑战。
    sources: [sgz-54]
    show:
      - battle: {at: 江陵, text: 勒兵就陈, cue: 出城}   # 曹仁在江陵城外列阵逼周瑜营（不是去夷陵）

  - say: 周瑜咬牙爬起来，带伤在军营里来回巡视，给将士们打气。
    sources: [sgz-54]
    show:
      - enter: {who: 周瑜, side: right, cue: 爬起来, for: 3.6}
      - sfx: {name: 古风擂鼓, cue: 巡视}

  - say: 曹仁一看，只好退兵。
    sources: [sgz-54]

  # ---------------- 第二章 刘备南下 ----------------
  - say: 周瑜在江陵拼命的时候，刘备在干什么？
    phase: 刘备南下
    sources: [sgz-32]
    camera: {focus: [江陵, 公安, 长沙], zoom: fit, move: 1.4}
    show:
      - enter: {who: 刘备, at: 公安, side: left, cue: 刘备, for: 3}

  - say: 他往南走，武陵、长沙、桂阳、零陵，四个郡的太守，一个接一个投降。
    map: '209-06'
    owners_cue: 投降
    sources: [sgz-32]
    camera: {focus: [武陵, 长沙, 桂阳, 零陵], zoom: fit, move: 1.6}
    show:
      - march: {from: 公安, to: 武陵, faction: 刘备, label: 南征, cue: 武陵, grow: 1.0}
      - march: {from: 公安, to: 长沙, faction: 刘备, cue: 长沙, grow: 1.0}
      - march: {from: 长沙, to: 桂阳, faction: 刘备, cue: 桂阳, grow: 1.0}
      - march: {from: 长沙, to: 零陵, faction: 刘备, cue: 零陵, grow: 1.0}
      - sfx: {name: 疆域易手, cue: 投降}

  - say: 东奔西跑二十多年，刘备头一回有了一大片自己的地盘。
    sources: [sgz-32]
    show:
      - headline: {text: 荆南四郡, sub: 建安十四年, for: 3}

  - say: 江陵这边，曹仁守了一年多，终于弃城北撤。孙权让周瑜做了南郡太守。
    map: '209-12'
    owners_cue: 弃城
    sources: [sgz-47]
    camera: {focus: [江陵, 襄阳, 公安], zoom: fit, move: 1.4}
    show:
      - flee: {from: 江陵, to: 襄阳, faction: 曹操, cue: 北撤}
      - flag: {at: 江陵, name: 周瑜, sub: 南郡太守, faction: 孙权, cue: 南郡太守}

  - say: 刘表的长子刘琦病死，部下推刘备做荆州牧，驻在公安。
    sources: [sgz-32]
    camera: {focus: [公安, 江陵], zoom: 6, move: 1.2}
    show:
      - flag: {at: 公安, name: 刘备, sub: 荆州牧, faction: 刘备, cue: 公安, guest: true}

  - say: 一条长江，北岸是周瑜，南岸是刘备，两家挨得太近了。
    sources: [sgz-54]
    show:
      - versus: {left: 周瑜, right: 刘备, label: 隔江相望, cue: 太近, for: 3.6}

  # ---------------- 第三章 京口 ----------------
  - say: 孙权有点怕了。他想了个办法：把亲妹妹嫁给刘备。
    phase: 京口
    sources: [sgz-32]
    camera: {focus: [公安, 柴桑, 京口], zoom: fit, move: 1.6}
    show:
      - enter: {who: 孙权, at: 京口, side: right, cue: 孙权, for: 3}
      - act: {act: courier, places: [京口, 公安], text: 进妹固好, cue: 嫁给, grow: 1.6, for: 3.4}

  - say: 这位孙夫人性格刚猛，身边一百多个侍女，个个带着刀站岗。
    sources: [sgz-37]
    show:
      - card: {title: 孙夫人, body: 才捷刚猛，有诸兄之风；侍婢百余人，皆亲执刀侍立, cue: 侍女}
      - enter: {who: 孙夫人, side: right, cue: 孙夫人, for: 4}

  - say: 刘备每次进她的屋，心里都直发怵。
    sources: [sgz-37]

  - say: 不久，刘备亲自坐船到京口见孙权，想把整个荆州都管起来。
    sources: [sgz-54, sgz-32]
    show:
      - march: {from: 公安, to: 京口, faction: 刘备, label: 诣京见权, cue: 京口, grow: 2.2}
      - sfx: {name: 低音转场, delay: -0.3}

  - say: 周瑜听说了，赶紧给孙权上书：
    scene: 军帐
    sources: [sgz-54]
    show:
      - enter: {who: 周瑜, side: left, cue: 周瑜, for: 2.4}

  - say: 刘备是一代枭雄，手下又有关羽、张飞这样的猛将，绝不会久居人下！
    speaker: 周瑜
    style: 急切恳切，语气凌厉，忧心忡忡
    scene: 军帐
    to: 孙权
    sources: [sgz-54]

  - say: 不如把他留在吴地，多给宫殿美女，消磨他的志气；把关羽、张飞分开，各放一方。
    speaker: 周瑜
    style: 压低声音，冷静献策，字字分明
    scene: 军帐
    to: 孙权
    sources: [sgz-54]
    show:
      - quote: {text: 恐蛟龙得云雨，终非池中物也, source: 三国志·周瑜传, for: 5}

  - say: 孙权没听。北边还有曹操，他要的是多拉拢英雄。刘备平平安安回了公安。
    sources: [sgz-54]
    camera: {focus: [京口, 公安], zoom: fit, move: 1.4}
    show:
      - march: {from: 京口, to: 公安, faction: 刘备, cue: 回了公安, grow: 2.0}

  # ---------------- 第四章 借荆州 ----------------
  - say: 周瑜还有更大的计划：先取益州，再联合西凉的马超，回头和孙权两路夹击曹操。
    phase: 借荆州
    year: 210
    sources: [sgz-54]
    camera: {focus: [江陵, 成都, 襄阳], zoom: fit, move: 1.6}
    show:
      - arrow: {from: 江陵, to: 成都, kind: direction, faction: 孙权, cue: 益州, grow: 1.6}
      - arrow: {from: 江陵, to: 襄阳, kind: direction, faction: 孙权, cue: 夹击, grow: 1.2}

  - say: 孙权答应了。周瑜回江陵准备出兵，走到巴丘，病倒了。
    sources: [sgz-54]
    camera: {focus: [江陵, 巴丘, 柴桑], zoom: fit, move: 1.4}
    show:
      - march: {from: 京口, to: 巴丘, faction: 孙权, label: 还江陵, cue: 回江陵, grow: 2.0}

  - say: 这一病，再也没起来。周瑜死的时候，只有三十六岁。
    sources: [sgz-54]
    camera: {focus: 巴丘, zoom: 6, move: 1.2}
    show:
      - exit: {who: 周瑜, at: 巴丘, verb: 卒, portrait: true, cue: 三十六}
      - sfx: {name: 退场钟}

  - say: 临死前，他推荐了接班人：鲁肃。
    sources: [sgz-54]
    show:
      - enter: {who: 鲁肃, side: right, cue: 鲁肃, for: 3.4}

  - say: 可鲁肃的想法，和周瑜正好相反。
    sources: [sgz-54]

  - say: 曹操太强，江东一家扛不住。不如把南郡借给刘备，让他替咱们挡在前面。
    speaker: 鲁肃
    style: 沉稳持重，推心置腹，深谋远虑
    scene: 朝堂
    to: 孙权
    sources: [sgz-54]

  - say: 孙权听了鲁肃的。南郡，借给了刘备。
    map: '210-12'
    owners_cue: 借给
    sources: [sgz-54]
    camera: {focus: [江陵, 公安, 襄阳], zoom: fit, move: 1.4}
    show:
      - takeover: {at: 江陵, to: 刘备, cue: 借给}
      - sfx: {name: 疆域易手, cue: 借给}
      - headline: {text: 借荆州, sub: 建安十五年, cue: 借给, for: 3.2}

  - say: 消息传到北方，曹操正在写信，笔一下掉在了地上。
    sources: [sgz-54]
    camera: {focus: [许, 江陵], zoom: fit, move: 1.4}
    show:
      - enter: {who: 曹操, at: 许, side: left, cue: 曹操, for: 3.6}
      - sfx: {name: 碎玻璃, cue: 掉在}

  - say: 孙权为什么肯借？曹操还在，江东一家扛不住。借出去的，是一道挡在前面的墙。
    sources: [sgz-54]
    camera: {focus: [许, 江陵, 京口], zoom: fit, move: 1.4}

  - say: 刘备东奔西跑二十多年，终于有了一块站得住脚的地方。可借来的东西，总是要还的。
    sources: [sgz-32]
    show:
      - card: {title: 演义 vs 正史, body: 三气周瑜、赔了夫人又折兵都是小说；周瑜病逝于取蜀途中, cue: 借来}

  - say: 你觉得，这块地该不该借？
    sources: [sgz-54]

  - say: 而北边的曹操，已经把目光转向了西边的关中。
    sources: [sgz-47]
    camera: {focus: [许, 江陵], zoom: fit, move: 1.4}
    show:
      - title_bar: {text: 下集, sub: 潼关之战, cue: 关中, delay: 0.4, for: 3.0}
