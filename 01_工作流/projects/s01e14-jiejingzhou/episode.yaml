# 快节奏版（2026-10-14，按抖音数据：冷开场、只讲有戏的、无背景音乐）
# 《三国到隋》第14集：江陵之战、刘备取荆南、孙刘联姻、周瑜之死、借荆州（209–210）
# 原大纲第12集的前三章；潼关之战（211）单独做第15集。
# 本地语料核对：
# 吴主传"十四年，瑜、仁相守岁余，所杀伤甚众。仁委城走。权以瑜为南郡太守"；
# 周瑜传"瑜即遣甘宁前据夷陵…瑜亲跨马擽陈，会流矢中右胁，疮甚，便还。后仁闻瑜卧未起，勒兵就陈。瑜乃自兴，案行军营，激扬吏士，仁由是遂退"；
# 先主传"先主表琦为荆州刺史，又南征四郡，武陵太守金旋、长沙太守韩玄、桂阳太守赵范、零陵太守刘度皆降…琦病死，群下推先主为荆州牧，治公安。权稍畏之，进妹固好"；
# 法正传"孙权以妹妻先主，妹才捷刚猛，有诸兄之风，侍婢百余人，皆亲执刀侍立，先主每入，衷心常凛凛"；
# 周瑜传"刘备以枭雄之姿，而有关羽、张飞熊虎之将，必非久屈为人用者…宜徙备置吴，盛为筑宫室，多其美女玩好，以娱其耳目，分此二人，各置一方…恐蛟龙得云雨，终非池中物也。权以曹公在北方，当广揽英雄…故不纳"；
# 周瑜传"乞与奋威俱进取蜀，得蜀而并张鲁…好与马超结援。瑜还与将军据襄阳以蹙操，北方可图也。权许之。瑜还江陵为行装，而道于巴丘（本地语料作马丘）病卒，时年三十六"；
# 鲁肃传"后备诣京见权，求都督荆州，惟肃劝权借之，共拒曹公。曹公闻权以土地业备，方作书，落笔于地"。
# 不用：庞统传注引江表传刘备"天下智谋之士，所见略同"（本地语料未收，未核对）。

id: s01e14-jiejingzhou
title: 借荆州
series: 三国 · 第14集
year: 209

notes:
  - 主线问题：周瑜拼了一年、中了一箭才打下的南郡，孙权为什么要借给刘备？——曹操还在北方，江东一家扛不住；借出去的，是一道挡在前面的墙。
  - 反差：曹操在赤壁输了都能大笑，听说孙权把地借给刘备，笔却掉在了地上。
  - 细节：周瑜中箭后带伤巡营；孙夫人身边一百多个侍女个个带刀，刘备每次进门心里发怵；周瑜劝孙权用宫殿美女把刘备"养"在吴地。
  - 动机：鲁肃"劝权借之，共拒曹公"——说白了，让刘备替江东守住长江中游这道门。
  - 演义对照："刘备借荆州，有借无还"、"三气周瑜"、"赔了夫人又折兵"都是小说情节；史书里周瑜是病死在去取蜀的路上。

