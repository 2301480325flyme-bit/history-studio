publish:
  hook: 喝粥都流一胸口的老人，一天夺了魏国
  big: [高平陵之变]
  hero: 司马懿
  at: 30
  summary: |
    238 年，司马懿说"往百日，还百日，攻百日"，一年平定辽东。魏明帝临终拉着他的手托孤，让他和曹爽一起辅佐八岁的曹芳。曹爽很快架空了他，司马懿干脆称病不出；李胜来探病，他喝粥流了一胸口，还故意把荆州听成并州。
    249 年正月，曹爽兄弟陪皇帝出城拜高平陵。"快死"的司马懿当天关闭城门、夺下禁军，屯兵洛水浮桥。桓范劝曹爽挟天子去许昌，曹爽却信了司马懿的洛水之誓："我回家当个富家翁。"几天后，曹爽三族被诛。
  tags: [高平陵之变, 司马懿, 曹爽, 装病, 三国]
  next: 淮南三叛，司马昭之心

