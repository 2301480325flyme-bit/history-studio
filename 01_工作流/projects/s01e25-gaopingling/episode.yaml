# 快节奏版（2026-10-14，按抖音数据：冷开场、只讲有戏的、无背景音乐）
# 《三国到隋》第25集：司马懿平辽东、受遗诏辅政、装病、高平陵之变（238–249）
# 本地语料核对（晋书·宣帝纪为主）：
# "天子曰：往还几时？对曰：往百日，还百日，攻百日，以六十日为休息，一年足矣"；"景初二年，帅牛金、胡遵等步骑四万发自京都"；公孙度传附渊"壬午，渊众溃…斩渊父子"；明帝纪"渊自俭还，遂自立为燕王"；
# 明帝纪"太尉宣王还至河内，帝驿马召到，引入卧内，执其手谓曰：吾疾甚，以后事属君，君其与爽辅少子。吾得见君，无所恨！宣王顿首流涕。即日，帝崩于嘉福殿，时年三十六"；
# 宣帝纪"曹爽用何晏、邓扬、丁谧之谋，迁太后于永宁宫，专擅朝政，兄弟并典禁兵，多树亲党…五月，帝称疾不与政事"；
#   "会河南尹李胜将莅荆州，来候帝。帝诈疾笃，使两婢侍，持衣衣落，指口言渴，婢进粥，帝不持杯饮，粥皆流出霑胸…胜曰：当还忝本州，非并州。帝乃错乱其辞"；
#   "嘉平元年春正月甲午，天子谒高平陵，爽兄弟皆从…帝于是奏永宁太后，废爽兄弟。时景帝为中护军，将兵屯司马门…大司农桓范出赴爽，蒋济言于帝曰：智囊往矣。帝曰：爽与范内疏而智不及，驽马恋栈豆，必不能用也…帝亲帅太尉蒋济等勒兵出迎天子，屯于洛水浮桥"；
#   "桓范劝爽车驾幸许昌，移檄征天下兵。爽不能用…帝又遣爽所信殿中校尉尹大目谕爽，指洛水为誓，爽意信之…乃曰：司马公正当欲夺吾权耳。吾得以侯还第，不失为富家翁。范拊膺曰：坐卿，灭吾族矣！…乃收爽兄弟及其党与何晏、丁谧、邓扬、毕轨、李胜、桓范等诛之"；三少帝纪"夷三族"；
#   宣帝纪 制曰（唐太宗）"天子在外，内起甲兵，陵土未乾，遽相诛戮"。
# 注文：曹芳"年八岁"（明帝纪注引魏氏春秋）。
# 不用：李胜说"司马公尸居余气"（魏末传，注文）。

id: s01e25-gaopingling
title: 高平陵之变
series: 三国 · 第25集
year: 249

notes:
  - 主线问题：一个七十岁、"病得快死"的老人，怎么一天之内夺了魏国大权？——装两年病让对手放下戒心；趁他们全出了城，关城门、夺禁军；最后一句洛水之誓，骗曹爽自己交出兵权。
  - 反差：喝粥都流一胸口的老人，几个月后指挥了一场政变；曹爽手握皇帝，却只想回家当富家翁。
  - 细节：往百日、还百日、攻百日；曹叡拉着他的手托孤；粥流到胸口、故意把荆州听成并州；"驽马恋栈豆"；桓范捶胸"灭吾族矣"。
  - 动机：曹爽架空司马懿、迁太后、把禁军都交给自己兄弟；司马懿称病，是在等对方犯错。
  - 史评：唐太宗在《晋书》里批他"天子在外，内起甲兵，陵土未乾，遽相诛戮"。

