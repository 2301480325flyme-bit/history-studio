publish:
  hook: 东奔西跑二十多年，刘备凭什么三分天下？
  big: [凡三往乃见]
  hero: 诸葛亮
  at: 30
  summary: |
    四十多岁的刘备寄居新野，东奔西跑了半辈子，还没有一块自己的根据地。徐庶说：卧龙只能亲自去请。刘备三次登门，史书只有一句"凡三往，乃见"。
    二十七岁的诸葛亮给他画了一张天下的地图：曹操不可争锋，孙权可援不可图，跨有荆益，天下有变则两路北伐——这就是"隆中对"。
  tags: [隆中对, 诸葛亮, 刘备, 三顾茅庐, 徐庶]
  next: 曹操南下，长坂坡

