beats:
  # ---------------- 第一章 兵贵神速 ----------------
  - say: 东奔西跑二十多年，他凭什么三分天下？
    map: '206-03'
    year: 207
    phase: 三顾茅庐
    sources: [sgz-35]
    show:
      - headline: {text: 隆中对, sub: 建安十二年 · 三分天下, cue: 三分天下, for: 3.4}
      - sfx: 重拍转场

  - say: 答案，是一个二十七岁的年轻人，和一张地图。
    sources: [sgz-35]

  - say: 公元二百零七年，荆州新野。刘备寄居在刘表手下，东奔西跑了半辈子。
    phase: 三顾茅庐
    sources: [sgz-35]
    camera: {focus: [新野, 襄阳, 隆中], zoom: fit, move: 1.8}
    show:
      - enter: {who: 刘备, at: 新野, side: right, cue: 刘备, settle: true, settle_sub: 寄居新野}

  - say: 徐庶向他推荐了一个人：
    scene: 朝堂
    sources: [sgz-35]

  - say: 诸葛孔明，是一条卧龙。将军愿意见见他吗？
    speaker: 徐庶
    style: 诚恳郑重，压低声音推荐
    scene: 朝堂
    to: 刘备
    sources: [sgz-35]

  - say: 刘备说：那你带他来吧。徐庶摇了摇头：
    scene: 朝堂
    sources: [sgz-35]

  - say: 这个人，只能您亲自去见，不能把他叫来。
    speaker: 徐庶
    style: 恳切而坚定，一字一句
    scene: 朝堂
    to: 刘备
    sources: [sgz-35]

  - say: 于是刘备亲自去了隆中。前后去了三次，才见到他。
    sources: [sgz-35]
    camera: {focus: [新野, 隆中], zoom: 10, move: 1.4}
    show:
      - march: {from: 新野, to: 隆中, faction: 刘备, label: 凡三往, cue: 三次, grow: 2.0}
      - act: {act: prop, at: 隆中, item: 草庐, text: 隆中草庐, cue: 隆中, size: 1.4, for: 5}

  - say: 风雪天、睡午觉、张飞要放火，都是小说加的。史书上只有一句：凡三往，乃见。
    sources: [sgz-35]
    show:
      - card: {title: 三顾茅庐, body: 诸葛亮传："凡三往，乃见"；《魏略》另说是诸葛亮先去见刘备, cue: 凡三往}

  - say: 刘备让旁人退下，开门见山：
    scene: 草庐
    sources: [sgz-35]
    show:
      - enter: {who: 诸葛亮, at: 隆中, side: left, cue: 开门见山, for: 3.4}

  - say: 汉室衰败，奸臣专权。我智谋短浅，落到今天这步田地，可志向还没有完。先生，该怎么办？
    speaker: 刘备
    style: 恳切谦卑，又带着不甘，郑重请教
    scene: 草庐
    to: 诸葛亮
    sources: [sgz-35]
    show:
      - versus: {left: 诸葛亮, right: 刘备, label: 问计, for: 12}

  # ---------------- 第五章 隆中对 ----------------

  - say: 二十七岁的诸葛亮，给他画了一张天下的地图：
    scene: 草庐
    phase: 隆中对
    sources: [sgz-35]
    camera: {focus: [许, 吴, 襄阳, 成都], zoom: fit, move: 2.0}
    show:
      - sfx: {name: 低音转场, delay: -0.3}

  - say: 曹操拥兵百万，挟天子而令诸侯，不能跟他争锋。孙权据有江东三代，只能结为援手。
    speaker: 诸葛亮
    style: 从容不迫，娓娓道来，胸有成竹
    sources: [sgz-35]
    show:
      - flag: {at: 许, name: 曹操, sub: 不可争锋, faction: 曹操, cue: 曹操}
      - flag: {at: 吴, name: 孙权, sub: 可援不可图, faction: 孙权, cue: 孙权}

  - say: 荆州是用武之地，主人守不住；益州沃野千里，刘璋昏弱。这是上天留给将军的！
    speaker: 诸葛亮
    style: 目光炯炯，语气渐强，指点江山
    sources: [sgz-35]
    show:
      - spot: {at: 襄阳, text: 荆州, cue: 荆州}
      - spot: {at: 成都, text: 益州, cue: 益州}

  - say: 拿下荆益，外结孙权，等天下有变，两路北伐，霸业可成，汉室可兴！
    speaker: 诸葛亮
    style: 慷慨激昂，掷地有声，一气呵成
    sources: [sgz-35]
    show:
      - arrow: {from: 襄阳, to: 宛, kind: direction, faction: 刘备, grow: 1.2}
      - arrow: {from: 宛, to: 洛阳, kind: direction, faction: 刘备, grow: 1.0}
      - arrow: {from: 成都, to: 长安, kind: direction, faction: 刘备, grow: 1.6}
      - sfx: {name: 时代转折, cue: 霸业可成}

  - say: 刘备说：好！从此，两人的感情一天比一天深。
    sources: [sgz-35]
    show:
      - versus: {left: 诸葛亮, right: 刘备, label: 隆中对, cue: 好, for: 4}

  - say: 东奔西跑了半辈子的刘备，就在这一年，找到了这个人，也找到了一张地图。
    sources: [sgz-35]
    show:
      - headline: {text: 隆中对, sub: 建安十二年 · 三分天下, for: 3.4}

  - say: 隆中对这张图，你觉得哪一步最难？
    sources: [sgz-01]
    camera: {focus: [许, 襄阳], zoom: fit, move: 1.4}

  - say: 而北方已定的曹操，下一个目标，正是荆州。
    sources: [sgz-01]
    camera: {focus: [许, 襄阳], zoom: fit, move: 1.4}
    show:
      - arrow: {from: 许, to: 襄阳, kind: direction, faction: 曹操, cue: 荆州, grow: 1.6}
      - title_bar: {text: 下集, sub: 曹操南下荆州, cue: 荆州, delay: 0.6, for: 3.0}

