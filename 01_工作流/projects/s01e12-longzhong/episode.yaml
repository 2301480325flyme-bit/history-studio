# 快节奏版（2026-10-13，按抖音数据：冷开场、只讲有戏的、无背景音乐）
# 《三国到隋》第11集：北征乌桓、白狼山斩蹋顿；三顾茅庐、隆中对（207）
# 2026-10-11 由原第10集故事稿下半拆出。关键原文均在本地语料核过：
# 郭嘉"表，坐谈客耳…虽虚国远征，公无忧矣""兵贵神速…不如留辎重，轻兵兼道以出，掩其不意"（郭嘉传）；
# 田畴"陷坏断绝，垂二百载，而尚有微径可从…蹋顿之首可不战而擒也""署大木表…方今暑夏，道路不通，且俟秋冬，乃复进军。虏候骑见之，诚以为大军去也"（田畴传）；
# "登白狼山，卒与虏遇…车重在后，被甲者少，左右皆惧。公登高，望虏陈不整…使张辽为先锋，虏众大崩，斩蹋顿…胡、汉降者二十余万口"、
# "吾方使康斩送尚、熙首，不烦兵矣""彼素畏尚等，吾急之则并力，缓之则自相图，其势然也"（武帝纪）；
# 徐庶"诸葛孔明者，卧龙也…此人可就见，不可屈致也"、"凡三往，乃见"、刘备"汉室倾颓，奸臣窃命，主上蒙尘…君谓计将安出"、隆中对全文（诸葛亮传）。

id: s01e12-longzhong
title: 隆中对
series: 三国 · 第12集
year: 207

notes:
  - 主线问题：东奔西跑二十多年、还没有一块根据地的刘备，凭什么后来能三分天下？——这一年，他找到了诸葛亮。
  - 三顾茅庐的风雪、午睡、张飞要放火都是小说；史书只有"凡三往，乃见"。《魏略》另说诸葛亮先见刘备，用卡片提一句。
  - 郭嘉遗计定辽东是小说；史书是曹操自己判断公孙康会杀二袁。
  - 郭嘉卒年岁数本地语料未核到，旁白不说年龄。诸葛亮二十七岁按卒年推算。
  - 用户未定：隆中对两路北伐箭头默认画出（伏笔）。

