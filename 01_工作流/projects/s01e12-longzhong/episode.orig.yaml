beats:
  # ---------------- 第一章 兵贵神速 ----------------
  - say: 上回说到，袁尚、袁熙逃到了长城外的乌桓。辽西乌桓的首领叫蹋顿，是袁绍生前一直拉拢的盟友。
    phase: 兵贵神速
    sources: [sgz-01]
    year: 207
    camera: {focus: [邺, 柳城], zoom: fit, move: 2.0}
    map: '206-03'
    show:
      - title_bar: {text: 隆中对, sub: 三国 · 第12集, cue: 上回, for: 3.2}
      - sfx: 片头鼓
      - enter: {who: 蹋顿, at: 柳城, side: right, cue: 蹋顿, settle: true, settle_sub: 辽西乌桓}

  - say: 曹操想斩草除根，远征乌桓。可很多将领反对：大军远出塞外，荆州的刘表要是派刘备偷袭许县，怎么办？
    sources: [sgz-14]
    camera: {focus: [许, 襄阳, 柳城], zoom: fit, move: 1.4}
    show:
      - arrow: {from: 襄阳, to: 许, kind: direction, faction: 刘表, cue: 偷袭许县, grow: 1.4}

  - say: 只有郭嘉力主出兵：
    scene: 军帐
    sources: [sgz-14]
    show:
      - enter: {who: 郭嘉, side: left, cue: 郭嘉, for: 2.6}

  - say: 刘表，不过是个坐着空谈的人。他知道自己管不住刘备，重用怕控制不了，轻用刘备又不肯出力。主公就算倾国远征，也不用担心！
    speaker: 郭嘉
    style: 轻快自信，带着几分不屑，笃定地劝
    scene: 军帐
    to: 曹操
    sources: [sgz-14]

  - say: 大军走到易县，郭嘉又说：
    scene: 军帐
    sources: [sgz-14]
    camera: {focus: [邺, 易], zoom: fit, move: 1.2}

  - say: 兵贵神速！千里奔袭，辎重太多，走不快，对方听到风声，一定有防备。不如把辎重留下，轻兵日夜兼程，打他个措手不及！
    speaker: 郭嘉
    style: 果决干脆，语速明快，斩钉截铁
    scene: 军帐
    to: 曹操
    sources: [sgz-14]
    show:
      - quote: {text: 兵贵神速, source: 三国志·郭嘉传, era: 建安十二年, cue: 兵贵神速}

  # ---------------- 第二章 卢龙塞 ----------------
  - say: 七月，下起了大雨。沿海的大路被水淹了，车马过不去。
    phase: 卢龙塞
    sources: [sgz-01, sgz-11]
    camera: {focus: [无终, 卢龙塞, 柳城], zoom: fit, move: 1.4}
    show:
      - act: {act: thunder, at: 无终, cue: 大雨, for: 3}

  - say: 当地有个名士叫田畴，给曹操出了个主意：
    scene: 军帐
    sources: [sgz-11]

  - say: 从前郡城在平冈，有条路从卢龙口出去，直通柳城。这条路荒废快两百年了，可还有小路能走。敌人以为我们只会走无终，从这里绕过去，蹋顿的人头，不用打就能拿下！
    speaker: 田畴
    style: 沉稳笃定，熟门熟路地比划，压低声音献计
    scene: 军帐
    to: 曹操
    sources: [sgz-11]

  - say: 曹操说：好！他让人在路边立起一块大木牌，上面写着：现在是盛夏，道路不通，等秋冬再进军。
    sources: [sgz-11]
    show:
      - act: {act: prop, at: 无终, item: 竹简, text: 俟秋冬乃复进军, cue: 大木牌, for: 4}

  - say: 乌桓的探子看见了，真以为曹军撤了。
    sources: [sgz-11]

  - say: 曹军却悄悄出了卢龙塞，跟着田畴在山里开路填谷，走了五百多里，绕到了乌桓背后。
    sources: [sgz-01, sgz-11]
    show:
      - replay: {path: [无终, 卢龙塞, 白狼山], faction: 曹操, label: 出卢龙塞, cue: 卢龙塞}
      - sfx: {name: 骑兵行军, cue: 开路, len: 5}

  # ---------------- 第三章 白狼山 ----------------
  - say: 八月，曹军登上白狼山，迎面撞上了蹋顿和二袁的几万骑兵。
    phase: 白狼山
    sources: [sgz-01]
    camera: {focus: [白狼山, 柳城], zoom: 8, move: 1.4}
    show:
      - campaign:
          at: 白狼山
          title: 白狼山之战
          clash: 撞上
          sides:
            - {from: 卢龙塞, faction: 曹操, banner: 曹, troops: cavalry, size: 1.6}
            - {from: 柳城, faction: 乌桓, banner: 蹋, troops: cavalry, size: 3.2}

  - say: 曹军的辎重都留在后面，穿着铠甲的人很少，左右的人都怕了。
    sources: [sgz-01]

  - say: 曹操登上高处一望：敌人的阵型不整齐！他立刻让张辽打头阵，冲下山去。
    sources: [sgz-01]
    show:
      - enter: {who: 张辽, side: left, cue: 张辽, for: 3}
      - march: {from: 白狼山, to: 柳城, faction: 曹操, cue: 冲下山去, grow: 1.2}
      - sfx: {name: 喊杀, cue: 冲下山去}

  - say: 乌桓大军一下子崩溃，蹋顿被斩。胡人、汉人投降的，有二十多万口。
    sources: [sgz-01]
    show:
      - act: {act: execute, at: 白狼山, text: 斩蹋顿, cue: 蹋顿被斩, for: 2.6}
      - exit: {who: 蹋顿, at: 柳城, verb: 斩, cue: 蹋顿被斩, portrait: true}
      - headline: {text: 白狼山之战, sub: 斩蹋顿 · 降者二十余万, cue: 二十多万, for: 3.2}

  - say: 袁尚、袁熙又逃到辽东，投奔太守公孙康。有人劝曹操乘胜打过去。曹操却说：
    sources: [sgz-01]
    camera: {focus: [柳城, 襄平], zoom: fit, move: 1.4}
    show:
      - flee: {from: 柳城, to: 襄平, faction: 袁绍, cue: 辽东}
      - flag: {at: 襄平, name: 公孙康, sub: 辽东太守, faction: 公孙康, cue: 公孙康}

  - say: 我正等着公孙康，把袁尚、袁熙的人头送来，用不着动兵。
    speaker: 曹操
    style: 胸有成竹，轻描淡写，嘴角带笑
    sources: [sgz-01]

  - say: 九月，曹操从柳城撤军。没过多久，公孙康果然斩了二袁，把人头送了过来。
    sources: [sgz-01]
    show:
      - act: {act: courier, places: [襄平, 柳城], text: 传首, cue: 人头送了过来, grow: 1.6, for: 3}

  - say: 将领们问这是为什么。曹操说：
    scene: 军帐
    sources: [sgz-01]

  - say: 公孙康一向怕袁尚他们。我逼得急，他们就联手；放一放，他们自己就会互相算计。形势就是这样。
    speaker: 曹操
    style: 从容解释，带着几分得意
    scene: 军帐
    sources: [sgz-01]
    show:
      - card: {title: 演义 vs 正史, body: 郭嘉遗计定辽东是小说；史书是曹操自己的判断, cue: 形势}

  - say: 北方，平定了。可就在回军前后，郭嘉病死了。曹操悲痛万分。
    sources: [sgz-14]
    show:
      - exit: {who: 郭嘉, at: 易, verb: 卒, cue: 病死, portrait: true}
      - sfx: {name: 退场钟, cue: 病死}

  # ---------------- 第四章 三顾茅庐 ----------------
  - say: 同一年的荆州新野。四十多岁的刘备，寄居在刘表手下，东奔西跑了半辈子，还没有一块自己的根据地。
    phase: 三顾茅庐
    sources: [sgz-35]
    camera: {focus: [新野, 襄阳, 隆中], zoom: fit, move: 1.8}
    show:
      - enter: {who: 刘备, at: 新野, side: right, cue: 刘备, settle: true, settle_sub: 寄居新野}

  - say: 一个叫徐庶的人，向他推荐了一个年轻人：
    scene: 朝堂
    sources: [sgz-35]

  - say: 诸葛孔明，是一条卧龙。将军愿意见见他吗？
    speaker: 徐庶
    style: 诚恳郑重，压低声音推荐
    scene: 朝堂
    to: 刘备
    sources: [sgz-35]

  - say: 刘备说：那你带他来吧。徐庶摇了摇头：
    scene: 朝堂
    sources: [sgz-35]

  - say: 这个人，只能您亲自去见，不能把他叫来。将军应该屈尊，去拜访他。
    speaker: 徐庶
    style: 恳切而坚定，一字一句
    scene: 朝堂
    to: 刘备
    sources: [sgz-35]

  - say: 于是刘备亲自去了隆中。前后去了三次，才见到他。
    sources: [sgz-35]
    camera: {focus: [新野, 隆中], zoom: 10, move: 1.4}
    show:
      - march: {from: 新野, to: 隆中, faction: 刘备, label: 凡三往, cue: 三次, grow: 2.0}
      - act: {act: prop, at: 隆中, item: 草庐, text: 隆中草庐, cue: 隆中, size: 1.4, for: 5}

  - say: 风雪天、睡午觉、张飞要放火，那些都是小说加的。史书上只有一句：凡三往，乃见。
    sources: [sgz-35]
    show:
      - card: {title: 三顾茅庐, body: 诸葛亮传："凡三往，乃见"；《魏略》另说是诸葛亮先去见刘备, cue: 凡三往}

  - say: 刘备让旁人都退下，开门见山：
    scene: 草庐
    sources: [sgz-35]
    show:
      - enter: {who: 诸葛亮, at: 隆中, side: left, cue: 开门见山, for: 3.4}

  - say: 汉室衰败，奸臣专权，天子流离。我不自量力，想为天下伸张大义，可惜智谋短浅，落到今天这步田地。但我的志向，还没有完。先生，您看该怎么办？
    speaker: 刘备
    style: 恳切谦卑，又带着不甘，郑重请教
    scene: 草庐
    to: 诸葛亮
    sources: [sgz-35]
    show:
      - versus: {left: 诸葛亮, right: 刘备, label: 问计, for: 12}

  # ---------------- 第五章 隆中对 ----------------
  - say: 二十七岁的诸葛亮，给他画了一张天下的地图：
    scene: 草庐
    phase: 隆中对
    sources: [sgz-35]
    camera: {focus: [许, 吴, 襄阳, 成都], zoom: fit, move: 2.0}

  - say: 曹操已经拥兵百万，挟天子而令诸侯，不能跟他正面争锋。孙权占据江东已经三代，地势险要，百姓归附，只能结为援手，不能打他的主意。
    speaker: 诸葛亮
    style: 从容不迫，娓娓道来，胸有成竹
    sources: [sgz-35]
    show:
      - flag: {at: 许, name: 曹操, sub: 不可争锋, faction: 曹操, cue: 曹操}
      - flag: {at: 吴, name: 孙权, sub: 可援不可图, faction: 孙权, cue: 孙权}

  - say: 荆州北靠汉水，南通南海，东连吴会，西通巴蜀，是用武之地，可它的主人守不住；益州山川险要，沃野千里，刘璋又昏弱。这是上天留给将军的！
    speaker: 诸葛亮
    style: 目光炯炯，语气渐强，指点江山
    sources: [sgz-35]
    show:
      - spot: {at: 襄阳, text: 荆州, cue: 荆州}
      - spot: {at: 成都, text: 益州, cue: 益州}

  - say: 将军如果拿下荆、益二州，西和诸戎，南抚夷越，外结孙权，内修政理；等天下有变，派一员上将带荆州兵直指宛城、洛阳，将军亲率益州大军出秦川，霸业可成，汉室可兴！
    speaker: 诸葛亮
    style: 慷慨激昂，掷地有声，一气呵成
    sources: [sgz-35]
    show:
      - arrow: {from: 襄阳, to: 宛, kind: direction, faction: 刘备, cue: 宛城, grow: 1.2}
      - arrow: {from: 宛, to: 洛阳, kind: direction, faction: 刘备, cue: 洛阳, grow: 1.0}
      - arrow: {from: 成都, to: 长安, kind: direction, faction: 刘备, cue: 秦川, grow: 1.6}
      - sfx: {name: 时代转折, cue: 霸业可成}

  - say: 刘备说：好！从此，两人的感情一天比一天深。
    sources: [sgz-35]
    show:
      - versus: {left: 诸葛亮, right: 刘备, label: 隆中对, cue: 好, for: 4}

  - say: 东奔西跑二十多年的人，凭什么后来能三分天下？就凭这一年，他找到了这个人，也找到了一张地图。
    sources: [sgz-35]
    show:
      - headline: {text: 隆中对, sub: 建安十二年 · 三分天下, cue: 三分天下, for: 3.4}

  - say: 而北方已定的曹操，下一个目标，正是荆州。
    sources: [sgz-01]
    camera: {focus: [许, 襄阳], zoom: fit, move: 1.4}
    show:
      - arrow: {from: 许, to: 襄阳, kind: direction, faction: 曹操, cue: 荆州, grow: 1.6}
      - title_bar: {text: 下集, sub: 曹操南下荆州, cue: 荆州, delay: 0.6, for: 3.0}
