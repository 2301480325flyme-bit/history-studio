  big: [隆中对]
  hero: 诸葛亮
  at: 30
  summary: |
    曹操听郭嘉"兵贵神速"，跟着田畴走一条荒废两百年的旧道出卢龙塞，白狼山一战斩蹋顿，再等公孙康把二袁的人头送来，北方平定。
    同一年，寄居新野的刘备三次登门，见到了二十七岁的诸葛亮：曹操不可争锋，孙权可援不可图，跨有荆益，天下有变则两路北伐——这就是"隆中对"。
  tags: [隆中对, 诸葛亮, 刘备, 三顾茅庐, 北征乌桓]
  next: 曹操南下荆州

