  hero: 曹操
  at: 40
  summary: |
    汉献帝从长安一路逃难，在曹阳被追兵杀得七零八落，回到洛阳时宫殿全成了废墟，百官拨开荆棘、靠着断墙栖身，有人就饿死在墙根下。
    袁绍的谋士沮授早就劝他"挟天子而令诸侯"，袁绍嫌皇帝是累赘；曹操却听了毛玠、荀彧，把天子接到许县，又募民屯田，一年得谷百万斛。
  tags: [曹操, 汉献帝, 挟天子以令诸侯, 袁绍, 屯田]
  next: 吕布偷袭下邳

