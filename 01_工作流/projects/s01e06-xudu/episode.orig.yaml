beats:
  # ---------------- 第一章 天子东归 ----------------
  - say: 上回说到，李傕、郭汜在长安反目。一个劫持了皇帝，一个扣押了公卿，两边在城里你来我往，死了上万人。
    phase: 天子东归
    sources: [sgz-06, hhs-09]
    year: 195
    camera: {focus: 长安, zoom: 3.0, move: 2.0}
    map: '195-09'
    show:
      - title_bar: {text: 曹操迎天子, sub: 三国 · 第6集, cue: 上回, for: 3.2}
      - sfx: 片头鼓
      - versus: {left: 李傕, right: 郭汜, label: 相攻, cue: 反目, for: 4.6}
      - sfx: {name: 交战, cue: 你来我往}

  - say: 七月，在董承、杨奉这些将领护送下，汉献帝终于离开长安，往东走，想回洛阳。
    sources: [sgz-01, hhs-09]
    show:
      - enter: {who: 刘协, side: right, cue: 汉献帝, for: 3}
      - enter: {who: 董承, side: left, cue: 董承, for: 3}

  - say: 可皇帝刚走，李傕、郭汜就后悔了：把皇帝放走，自己还拿什么号令天下？两人居然又和好了，一起追了上来。
    sources: [sgz-06]
    camera: {focus: [长安, 曹阳], zoom: fit, move: 1.4}
    show:
      - march: {from: 长安, to: 曹阳, faction: 汉室, label: 天子东归, cue: 刚走, grow: 2.2}
      - army: {from: 长安, to: 曹阳, faction: 凉州军, banner: 李, troops: cavalry, size: 2.6, cue: 追了上来, grow: 2.4}

  - say: 在弘农的曹阳，追兵大败护驾的军队，百官和宫女死伤无数。
    sources: [sgz-01, sgz-06]
    camera: {focus: [弘农, 曹阳, 陕], zoom: fit, move: 1.2}
    show:
      - battle: {at: 曹阳, text: 曹阳之败, cue: 大败}
      - sfx: {name: 溃败哭喊, cue: 死伤}

  - say: 走投无路之下，皇帝一行趁着夜色，从陕县偷偷渡过黄河，逃到了河东的安邑。
    sources: [sgz-01]
    camera: {focus: [陕, 安邑], zoom: fit, move: 1.2}
    show:
      - act: {act: night, cue: 夜色, for: 4}
      - march: {from: 陕, to: 安邑, faction: 汉室, label: 渡河, cue: 渡过黄河, grow: 1.8}

  # ---------------- 第二章 废墟洛阳 ----------------
  - say: 在安邑熬了大半年。第二年七月，汉献帝终于回到了洛阳。
    phase: 废墟洛阳
    sources: [sgz-01, hhs-09]
    year: 196
    camera: {focus: [安邑, 洛阳], zoom: fit, move: 1.4}
    show:
      - march: {from: 安邑, to: 洛阳, faction: 汉室, label: 还洛阳, cue: 回到了洛阳, grow: 2.0}

  - say: 六年前董卓那一把火，把宫殿全烧光了。街道上长满荒草，到处是断墙。
    sources: [sgz-06]
    camera: {focus: 洛阳, zoom: 4, move: 1.2}
    show:
      - act: {act: fall, at: 洛阳, text: 宫室烧尽, cue: 烧光, for: 4}
      - sfx: {name: 凄凉风, cue: 荒草}

  - say: 百官只能拨开荆棘，靠着断墙栖身。各州郡手里都握着重兵，却没有一个人送粮来。
    sources: [sgz-06]
    show:
      - quote: {text: 百官披荆棘，依丘墙间, source: 三国志·董卓传注, era: 建安元年, cue: 荆棘}

  - say: 尚书郎以下的官员，只好自己出城砍柴、挖野菜，有人就饿死在墙根底下。
    sources: [sgz-06]
    show:
      - act: {act: locusts, at: 洛阳, text: 饥馑, cue: 饿死, for: 3}

  - say: 堂堂大汉朝廷，竟然落到了这个地步。那么，谁来接这位落难的皇帝？
    sources: [sgz-06]
    camera: {focus: [洛阳, 邺, 鄄城], zoom: fit, move: 1.4}
    show:
      - spot: {at: 洛阳, cue: 落难}

  # ---------------- 第三章 谁来接皇帝 ----------------
  - say: 其实早在之前，袁绍的谋士沮授就劝过他：
    scene: 朝堂
    phase: 谁来接皇帝
    sources: [sgz-06, hhs-74]
    camera: {focus: [洛阳, 邺], zoom: fit, move: 1.4}
    show:
      - enter: {who: 袁绍, at: 邺, side: left, cue: 袁绍, for: 3}

  - say: 如今朝廷流离失所，各州郡嘴上喊着义兵，心里只想吞并别人，没有一个真心保护天子。将军应当把天子接到邺城，挟天子而令诸侯，谁能挡得住您！
    speaker: 沮授
    style: 恳切急迫，目光长远，压低声音劝主公
    scene: 朝堂
    sources: [sgz-06, hhs-74]

  - say: 袁绍有点心动。可部将淳于琼反对：
    scene: 朝堂
    sources: [hhs-74]

  - say: 把天子接到身边，什么事都得先上奏。听他的，咱们的权就轻了；不听，就是抗旨。这不是好主意！
    speaker: 淳于琼
    style: 不以为然，粗声粗气，摆手反对
    scene: 朝堂
    sources: [hhs-74, sgz-06]
    show:
      - versus: {left: 沮授, right: 淳于琼, label: 迎不迎, for: 8}

  - say: 沮授还在争：现在不接，一定会被别人抢先！袁绍终究没听。
    scene: 朝堂
    sources: [sgz-06]

  - say: 你没听错。"挟天子而令诸侯"这句话，史书里本来是说给袁绍听的。
    sources: [sgz-06]
    show:
      - card: {title: 挟天子而令诸侯, body: 出自沮授劝袁绍（三国志·袁绍传注引《献帝传》）, cue: 挟天子}

  - say: 而曹操那边，谋士毛玠早就给他出过主意：
    scene: 朝堂
    sources: [sgz-12]
    camera: {focus: [洛阳, 鄄城], zoom: fit, move: 1.4}
    show:
      - enter: {who: 曹操, at: 鄄城, side: right, cue: 曹操, for: 3}

  - say: 打仗要靠义名，守地盘要靠钱粮。应当尊奉天子去号令不服的人，再开荒种地、囤积军粮，霸王之业就能成！
    speaker: 毛玠
    style: 朴实诚恳，条理清楚，语气笃定
    scene: 朝堂
    to: 曹操
    sources: [sgz-12]

  - say: 皇帝回到洛阳后，荀彧也劝他：
    scene: 朝堂
    sources: [sgz-10]

  - say: 趁着这个时机，尊奉天子来顺从民心，这是大顺！若不早定，四方都会起心思，到时候后悔就来不及了！
    speaker: 荀彧
    style: 从容笃定，语气坚决，催促决断
    scene: 朝堂
    to: 曹操
    sources: [sgz-10]
    show:
      - versus: {left: 荀彧, right: 曹操, label: 迎驾, for: 7}

  - say: 曹操不再犹豫。八月，他带兵进入洛阳，拜见了天子。
    sources: [sgz-01]
    camera: {focus: [鄄城, 洛阳], zoom: fit, move: 1.4}
    show:
      - army: {from: 鄄城, to: 洛阳, faction: 曹操, banner: 曹, troops: cavalry, size: 2, cue: 带兵进入洛阳, grow: 2.4}

  - say: 洛阳已经残破得没法住人。九月，曹操把天子迁到了自己地盘上的许县。
    sources: [sgz-01, hhs-09]
    camera: {focus: [洛阳, 许], zoom: fit, move: 1.4}
    owners_cue: 许县
    map: '196-05'
    show:
      - march: {from: 洛阳, to: 许, faction: 曹操, label: 迁都许, cue: 迁到, grow: 1.8}
      - act: {act: enthrone, who: 刘协, title: 汉献帝, text: 都许, side: right, cue: 许县, for: 3.4}
      - sfx: {name: 帝王登场, cue: 许县}

  - say: 从此，许县成了大汉的都城。曹操发出的每一道命令，都可以用皇帝的名义。
    sources: [sgz-01]
    show:
      - act: {act: edict, at: 许, text: 诏, sub: 奉天子以令不臣, side: left, cue: 皇帝的名义, for: 3.4}
      - headline: {text: 奉迎天子, sub: 建安元年 · 迁都许, cue: 都城, for: 3.2}

  - say: 天子封袁绍做太尉，位置排在曹操的大将军后面。袁绍觉得丢人，不肯接受。
    sources: [sgz-01]
    camera: {focus: [许, 邺], zoom: fit, move: 1.4}
    show:
      - versus: {left: 袁绍, right: 曹操, label: 争班, cue: 太尉, for: 5}

  - say: 曹操知道现在还惹不起袁绍，干脆把大将军让给了他，自己当了司空。
    sources: [sgz-01]
    show:
      - act: {act: prop, at: 许, item: 印绶, text: 让大将军, cue: 让给了他, for: 3}

  # ---------------- 第四章 屯田 ----------------
  - say: 光有皇帝还不够，还得有粮。那几年天下大饥荒，好多军阀饿了就抢，吃饱了就把剩下的扔掉，不少队伍没打仗就自己散了。
    phase: 屯田
    sources: [sgz-01]
    camera: {focus: 许, zoom: 3.4, move: 1.4}

  - say: 这一年，曹操采纳枣祗、韩浩的建议，招募流民，在许县周围开荒种地，叫做"屯田"。
    sources: [sgz-01, sgz-16]
    show:
      - act: {act: farm, at: 许, text: 屯田许下, cue: 屯田, for: 5}

  - say: 当年就收了一百万斛粮食。后来各州郡都设了管屯田的官，曹操打仗，再也不愁粮草。
    sources: [sgz-01, sgz-16]
    show:
      - act: {act: prop, at: 许, item: 粮仓, text: 得谷百万斛, cue: 一百万斛, size: 1.3, for: 3.6}

  - say: 有了天子，有了粮食，曹操这才算有了跟群雄争天下的本钱。
    sources: [sgz-01]
    camera: {focus: [许, 下邳, 寿春], zoom: fit, move: 1.4}
    show:
      - flag: {at: 许, name: 曹操, sub: 司空 · 奉天子, faction: 曹操, cue: 本钱}

  - say: 而东边的徐州，刘备正和袁术在淮河一带打得难解难分。寄住在小沛的吕布，正盯着刘备空虚的老家：下邳。
    sources: [sgz-01]
    show:
      - campaign:
          at: 盱眙
          title: 刘备拒袁术
          clash: 难解难分
          sides:
            - {from: 下邳, faction: 刘备, banner: 刘, troops: infantry, size: 1.6}
            - {from: 寿春, faction: 袁术, banner: 袁, troops: infantry, size: 2}
      - flag: {at: 小沛, name: 吕布, sub: 寄身小沛, faction: 吕布, cue: 吕布}
      - arrow: {from: 小沛, to: 下邳, kind: direction, faction: 吕布, cue: 下邳, grow: 1.2}
      - title_bar: {text: 下集, sub: 吕布夺徐州 · 袁术称帝, cue: 下邳, delay: 0.6, for: 3.0}
