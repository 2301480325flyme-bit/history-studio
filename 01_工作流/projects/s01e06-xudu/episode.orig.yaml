# 《三国到隋》第6集：汉献帝逃出长安，饿着肚子回到废墟洛阳；袁绍不接，曹操迎天子都许（195–196）
# 2026-10-11 按故事稿写成旁白。关键原文均在本地语料核过：
# "天子东迁，败于曹阳，渡河幸安邑"（武帝纪）；"宫室烧尽，街陌荒芜，百官披荆棘，依丘墙间…尚书郎以下，自出樵采，或饥死墙壁间"（董卓传注）；
# 沮授"挟天子而令诸侯"、淳于琼"从之则权轻，违之则拒命"（袁绍传注引献帝传 / 后汉书袁绍传）；
# 毛玠"奉天子以令不臣，修耕植，畜军资"（毛玠传）；荀彧"奉主上以从民望，大顺也"（荀彧传）；
# "庚申，迁都许"（后汉书·献帝纪）；袁绍"耻班在公下"、"以大将军让绍"、"募民屯田许下，得谷百万斛"（武帝纪及注引魏书）。

id: s01e06-xudu
title: 曹操迎天子
series: 三国 · 第6集
year: 195

notes:
  - 主线问题：皇帝落难，人人都能接，为什么最后接走他的是曹操？
  - 反差："挟天子而令诸侯"这句话，史书里本来是沮授说给袁绍听的。
  - 沮授劝迎驾的年份各书不一，旁白说"早在之前"。许县此时叫"许"，旁白说"许县"。

