open_questions:
- 《吴主传》把关羽被擒与“遂定荆州”连记，未逐郡、逐城记录零陵、武陵的接收过程；本账依疆域.yaml记于219-12，两郡能否同时对应章乡这一战事节点，需结合疆域检查器决定。
- 张飞遇害只记“临发”，未记营地准确位置；张达、范强“顺流而奔孙权”未给水道、途中地点或正式受降地点，地图只能标阆中概略起点和未核终点。
- 刘备伐吴记于221年秋七月，且军次秭归；本集疆域时间止于221-08。巫、秭归所在郡的县级归属与占领状态需核，本账只按南郡记争夺，不宣称郡域易手。东征后续战事延续至222年猇亭，超出本集时段，未提前画入。
