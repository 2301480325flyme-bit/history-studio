  summary: |
    220 年正月，曹操在洛阳病逝，遗令"敛以时服，无藏金玉珍宝"。十月，汉献帝把皇位"让"给曹丕，曹丕在繁阳登坛称帝，东汉灭亡；献帝被封山阳公，好好活了下去。第二年，刘备在成都称帝，国号仍然叫汉。
    孙权向曹丕称臣，送还于禁——这位老将须发皓白，被派去拜曹操陵墓，墙上画着他跪地投降的样子，他羞愤病死。刘备要东征报仇，张飞却在出发前被部下杀害。
  tags: [曹丕称帝, 汉献帝, 刘备称帝, 张飞之死, 于禁]
