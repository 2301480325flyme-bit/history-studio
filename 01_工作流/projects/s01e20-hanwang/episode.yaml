beats:
  # ---------------- 冷开场 ----------------
  - say: 四百年的大汉，没打一仗，就这么没了。
    map: '219-12'
    year: 220
    phase: 汉亡
    sources: [sgz-02]
    camera: {focus: [洛阳, 许, 繁阳], zoom: fit, move: 1.6}
    show:
      - sfx: 重拍转场
      - enter: {who: 汉献帝, side: right, cue: 大汉, for: 4}

  - say: 送走它的，是曹操的儿子，曹丕。
    sources: [sgz-02]
    show:
      - enter: {who: 曹丕, side: left, cue: 曹丕, for: 3.4}

  # ---------------- 第一章 遗令 ----------------
  - say: 公元二二零年正月，曹操在洛阳病逝，终年六十六岁。
    phase: 遗令
    sources: [sgz-01]
    camera: {focus: 洛阳, zoom: 5, move: 1.2}
    show:
      - title_bar: {text: 汉亡, sub: 三国 · 第20集, for: 3.2}
      - sfx: 片头鼓
      - exit: {who: 曹操, at: 洛阳, verb: 卒, portrait: true, cue: 病逝}
      - sfx: {name: 退场钟, cue: 病逝}

  - say: 他留下遗言：天下还没安定，丧事从简。穿平常的衣服下葬，不放金玉珍宝。
    sources: [sgz-01]
    show:
      - quote: {text: 敛以时服，无藏金玉珍宝, source: 三国志·武帝纪, era: 建安二十五年, cue: 平常的衣服, for: 4.4}

  - say: 长子曹丕，接过了魏王的位子。
    sources: [sgz-02]

  # ---------------- 第二章 禅让 ----------------
  - say: 这年十月，汉献帝派人捧着玉玺，把皇位"让"给了曹丕。
    phase: 禅让
    sources: [sgz-02]
    camera: {focus: [许, 繁阳], zoom: 8, move: 1.2}
    show:
      - act: {act: prop, at: 许, item: 玉玺, text: 奉玺绶禅位, cue: 玉玺, size: 1.2, for: 4}

  - say: 曹丕在繁阳筑起高坛，登坛即位，改年号黄初。东汉，灭亡了。
    map: '220-10'
    owners_cue: 灭亡
    sources: [sgz-02]
    show:
      - act: {act: enthrone, who: 曹丕, cue: 登坛, for: 4}
      - headline: {text: 魏代汉, sub: 黄初元年, cue: 灭亡, for: 3.4}
      - sfx: {name: 铜锣, cue: 登坛}

  - say: 汉献帝被封为山阳公，还能用天子的礼仪祭祀，给皇帝上书不用称臣。他好好地活了下去。
    sources: [sgz-02]
    show:
      - vignette: {image: illus_caopi_altar, cue: 山阳公, for: 7, text: 繁阳受禅}

  - say: 其实从曹操把他接到许县算起，二十多年了，皇帝早就只剩一个名号。
    sources: [sgz-02]

  # ---------------- 第三章 两个皇帝 ----------------
  - say: 消息传到成都，还有传言说，汉献帝已经被害了。
    audit_ok: [死亡]
    phase: 两个皇帝
    year: 221
    sources: [sgz-32]
    camera: {focus: [洛阳, 成都], zoom: fit, move: 1.6}

  - say: 刘备给献帝发丧，第二年四月，在成都武担山南登基称帝，国号还叫汉。
    map: '221-04'
    owners_cue: 称帝
    sources: [sgz-32]
    camera: {focus: 成都, zoom: 5, move: 1.2}
    show:
      - enter: {who: 刘备, side: left, cue: 刘备, for: 3.6}
      - headline: {text: 刘备称帝, sub: 章武元年, cue: 称帝, for: 3.2}

  - say: 他的理由很直接：曹丕篡位，汉朝的香火，由我来接。
    sources: [sgz-32]

  - say: 孙权呢？他把都城搬到武昌，转头向曹丕称臣，还把关了两年的于禁送了回去。
    sources: [sgz-47, sgz-02]
    camera: {focus: [武昌, 洛阳], zoom: fit, move: 1.4}
    show:
      - enter: {who: 孙权, side: right, cue: 孙权, for: 3}
      - act: {act: courier, places: [武昌, 洛阳], text: 奉章称藩, cue: 称臣, grow: 1.8, for: 3.4}

  - say: 于禁回来时，胡子头发全白了，憔悴不堪，跪在地上直哭。
    sources: [sgz-17]
    show:
      - enter: {who: 于禁, side: left, cue: 于禁, for: 4}

  - say: 曹丕让他先去邺城，拜曹操的陵墓。陵屋的墙上，早就画好了：关羽得胜、庞德怒骂、于禁跪地投降。
    audit_ok: [投降]
    territory_hold: 拜陵，邺没有易手
    scene: 陵屋
    sources: [sgz-17]
    camera: {focus: 邺, zoom: 6, move: 1.2}
    show:
      - card: {title: 陵屋壁画, body: 画关羽战克、庞德愤怒、禁降服之状, cue: 墙上}

  - say: 于禁看了，又羞又恨，没多久就病死了。
    sources: [sgz-17]
    show:
      - exit: {who: 于禁, at: 邺, verb: 卒, portrait: true, cue: 病死}

  - say: 八月，曹丕封孙权为吴王。
    map: '221-08'
    owners_cue: 吴王
    sources: [sgz-02]
    camera: {focus: [洛阳, 成都, 武昌], zoom: fit, move: 1.4}

  # ---------------- 第四章 张飞 ----------------
  - say: 刘备称帝后的第一件大事：东征孙权，替关羽报仇。
    phase: 张飞
    sources: [sgz-36]
    show:
      - arrow: {from: 成都, to: 白帝, kind: direction, faction: 蜀汉, cue: 东征, grow: 1.6}

  - say: 张飞带一万人，要从阆中出发，到江州会合。
    sources: [sgz-36]
    camera: {focus: [阆中, 江州, 成都], zoom: fit, move: 1.4}
    tells: [e04]
    show:
      - enter: {who: 张飞, side: right, cue: 张飞, for: 3.4}
      - flag: {at: 阆中, name: 张飞, sub: 率兵万人, faction: 蜀汉, cue: 阆中}
      - arrow: {from: 阆中, to: 江州, kind: direction, faction: 蜀汉, cue: 江州, grow: 1.6}   # 2026-10-25 战事账：临发遇害，没有真的出发，只画打算

  - say: 刘备早就警告过他：你杀人太多，又天天鞭打士兵，还把他们留在身边，迟早要出事。
    sources: [sgz-36]

  - say: 张飞没改。临出发，部将张达、范强杀了他，提着他的头，顺江投奔了孙权。
    sources: [sgz-36]
    camera: {focus: 阆中, zoom: 8, move: 1.2}
    show:
      - exit: {who: 张飞, at: 阆中, verb: 卒, portrait: true, cue: 杀了他}
      - flee: {from: 阆中, to: 武昌, faction: 吴, cue: 投奔}

  - say: 张飞营里的都督送来奏表。刘备一听是都督上表，不是张飞自己，就说：
    sources: [sgz-36]

  - say: 唉！张飞，死了。
    audit_ok: [死亡]
    speaker: 刘备
    style: 一声长叹，声音发颤，强忍悲痛
    sources: [sgz-36]

  - say: 四百年的大汉，怎么一仗没打就没了？兵、地、官，早就姓了曹。禅让，只是把最后一块招牌摘了下来。
    sources: [sgz-02]
    camera: {focus: [洛阳, 成都, 武昌], zoom: fit, move: 1.6}
    show:
      - card: {title: 演义 vs 正史, body: 曹植七步诗出自《世说新语》，不是正史, cue: 招牌}

  - say: 如今洛阳一个皇帝，成都一个皇帝，武昌还有一个吴王。
    sources: [sgz-02, sgz-32, sgz-47]
    show:
      - headline: {text: 三国鼎立, sub: 公元二二一年, cue: 吴王, for: 3.2}

  - say: 曹丕称帝，你觉得是篡位，还是水到渠成？
    sources: [sgz-02]

  - say: 刘备不听劝阻，亲率大军顺江东下。等着他的，是一个书生：陆逊。
    sources: [sgz-32]
    camera: {focus: [白帝, 公安, 武昌], zoom: fit, move: 1.6}
    show:
      - title_bar: {text: 下集, sub: 夷陵之战, cue: 陆逊, delay: 0.4, for: 3.0}
