# 快节奏版（2026-10-14，按抖音数据：冷开场、只讲有戏的、无背景音乐）
# 《三国到隋》第20集：曹操病逝、曹丕代汉、刘备称帝、于禁之死、张飞遇害（220–221）
# 本地语料核对：
# 武帝纪"庚子，王崩于洛阳，年六十六。遗令曰：天下尚未安定，未得遵古也…敛以时服，无藏金玉珍宝"；
# 文帝纪"汉帝以众望在魏…使兼御史大夫张音持节奉玺绶禅位…乃为坛于繁阳。庚午，王升坛即阼…改延康为黄初"；"以河内之山阳邑万户奉汉帝为山阳公，行汉正朔，以天子之礼郊祭，上书不称臣"；"孙权遣使奉章，并遣于禁等还…封吴王，加九锡"；
# 先主传"魏文帝称尊号，改年曰黄初。或传闻汉帝见害，先主乃发丧制服…即皇帝位于成都武担之南…操子丕，载其凶逆，窃居神器…备宜修之"；
# 于禁传"帝引见禁，须发皓白，形容憔瘁，泣涕顿首…欲遣使吴，先令北诣邺谒高陵。帝使豫于陵屋画关羽战克、庞德愤怒、禁降服之状。禁见，惭恚发病薨"；
# 张飞传"先主常戒之曰：卿刑杀既过差，又日鞭挝健儿，而令在左右，此取祸之道也。飞犹不悛。先主伐吴，飞当率兵万人，自阆中会江州。临发，其帐下将张达、范强杀之，持其首，顺流而奔孙权。飞营都督表报先主，先主闻飞都督之有表也，曰：噫！飞死矣"。
# 吴主传"二年四月，刘备称帝于蜀。权自公安都鄂，改名武昌"。
# 不用：曹丕"舜禹之事，吾知之矣"（魏氏春秋，注文，本地语料未收）；七步诗（世说新语，不属正史）。

id: s01e20-hanwang
title: 汉亡
series: 三国 · 第20集
year: 220

notes:
  - 主线问题：四百年的大汉，怎么一仗没打就没了？——兵、地、官早就姓了曹；禅让，只是把最后一块招牌摘下来。
  - 反差：改朝换代没流一滴血；被"让"掉皇位的汉献帝，反而好好地活了下去。
  - 细节：曹操遗令"穿平常衣服下葬，不放金玉"；繁阳筑坛；于禁须发皓白，看见陵屋壁画羞愤而死；刘备一听是都督上表，就知道"飞死矣"。
  - 动机：刘备称帝的理由——汉帝传闻遇害，曹丕"窃居神器"，汉朝的香火由他来接。
  - 演义对照：曹植七步诗出自《世说新语》，不是正史。

