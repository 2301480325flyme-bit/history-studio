  debates:
  - issue: 八王之乱终点
    note: 惠帝死、怀帝立、越居权力中心可作传统分期终点；不可说战事彻底停止。
    evidence:
    - quote: 以太傅、东海王越录尚书。
      para: 晋书-p00103
    - quote: 石勒寇常山，安北将军王浚讨破之。
      para: 晋书-p00110
  - issue: 张方之死
    note: 颙杀方、斩首传至越处；死地及行刑者未载，不是越亲手杀方。
    evidence:
    - quote: 河间王颙闻刘乔破，大惧，遂杀张方。
      para: 晋书-p00103
    - quote: 河间王颙闻乔败，斩张方，传首于越。
      para: 晋书-p03440
  - issue: 内乱十六年耗尽精兵
    note: 本地语料无兵额总数或“精兵耗尽”量化依据。宜说长期内战削弱中央和州郡军力，不作兵力归零断言。
    evidence:
