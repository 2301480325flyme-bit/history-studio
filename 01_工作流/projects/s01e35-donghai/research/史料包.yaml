episode: s01e34-donghai
scope: 主体305–306，含304背景与308钩子
source_note: 本地 sources 找到《晋书》帝纪、列传；《资治通鉴》卷82–84检索未返回可用段落。纪传互见；无第二独立出处处标明，未凭记忆补引。
sections:
  events:
  - id: e01
    date: 305-07（永兴二年）
    people:
    - 司马越
    - 刘乔
    place: 徐方、萧县
    event: 越率甲卒三万西迎惠帝至萧县；刘乔不受节度、遣子刘祐阻击，越军败。
    source_coverage: 帝纪、越传互见
    evidence:
    - quote: 唱义奉迎大驾，还复旧都，率甲卒三万，西次萧县。豫州刺史刘乔不受越命，遣子祐距之，越军败。
      para: 晋书-p04641
    - quote: 东海王越严兵徐方，将西迎大驾。
      para: 晋书-p00102
  - id: e02
    date: 305-07/08
    people:
    - 司马虓
    - 田徽
    - 刘祐
    - 司马越
    place: 谯、阳武
    event: 虓遣田徽率突骑八百迎越，在谯遇刘祐、祐众溃，越屯阳武。
    source_coverage: 战斗详节仅越传；虓传可互证其受王浚资兵南渡河击乔
    evidence:
    - quote: 范阳王虓遣督护田徽以突骑八百迎越，遇祐于谯，祐众溃，越进屯阳武。
      para: 晋书-p04641
    - quote: 虓自拔渡河，王浚表虓领翼州刺史，资以兵马。虓入翼州发兵，又南济河，破乔等。
      para: 晋书-p03440
  - id: e03
    date: 306-01（光熙元年）
    people:
    - 司马颙
    - 张方
    - 司马越
    - 司马颖
    - 宋胄
    place: 长安、洛阳
    event: 颙闻刘乔败杀张方、传首越处求和，越拒绝；宋胄等破颖将楼裒、逼近洛阳，颖逃长安。
    source_coverage: 惠帝纪、颖传互见；张方死地执行者未载
    evidence:
    - quote: 河间王颙闻刘乔破，大惧，遂杀张方，请和于东海王越，越不听。宋胄等破颖将楼裒，进逼洛阳，颖奔长安。
      para: 晋书-p00103
    - quote: 颖还长安，未至而闻颙斩张方，求和于越。
      para: 晋书-p03826
  - id: e04
    date: 306-01/05
    people:
    - 司马越
    - 祁弘
    - 宋胄
    - 司马纂
    - 彭随
    - 刁默
    place: 温、湖
    event: 越派祁弘等迎驾，四月屯温；颙派彭随刁默于湖阻击，祁弘胜、刁默败。
    source_coverage: 惠帝纪及越传互见
    evidence:
    - quote: 甲子，越遣其将祁弘、宋胄、司马纂等迎帝。
      para: 晋书-p00103
    - quote: 夏四月己巳，东海王越屯于温。颙遣弘农太守彭随、北地太守刁默距祁弘等于湖。
      para: 晋书-p00103
    - quote: 壬辰，祁弘等与刁默战，默大败，颙、颍走南山，奔于宛。
      para: 晋书-p00103
    - quote: 越率诸侯及鲜卑许扶历、驹次宿归等步骑迎惠帝反洛阳。
      para: 晋书-p04641
  - id: e05
    date: 306-05/06
    people:
    - 惠帝
    - 祁弘
    - 司马越
    place: 长安至洛阳
    event: 祁弘等奉惠帝东还，帝乘牛车、官员步行，六月至洛阳旧殿、谒太庙。
    source_coverage: 帝纪、越传互见；沿途节点未载；新安是304年西迁点，不能挪作东还路线
    evidence:
    - quote: 己亥，弘等奉帝还洛阳，帝乘牛车，行宫藉草，公卿跋涉。
      para: 晋书-p00103
    - quote: 六月丙辰朔，至自长安，升旧殿，哀感流涕。谒于太庙。复皇后羊氏。
      para: 晋书-p00103
    - quote: 越与虓西迎帝，而颙出奔。于是奉天子还都。
      para: 晋书-p03440
  - id: e06
    date: 306-09/10
    people:
    - 冯嵩
    - 司马颖
    - 刘舆
    - 司马虓
    place: 鄴（颖被害处未明）
    event: 冯嵩捕颖送鄴；虓死后其长史刘舆杀颖。鄴仅为捕送地，不能断为死地。
    source_coverage: 帝纪记捕送被杀；颖传记复颖还鄴
    evidence:
    - quote: 虓长史刘舆害成都王颖。
      para: 晋书-p00103
    - quote: 及东海王越奉迎大驾，颙启帝复颖还鄴，以志为魏郡太守，加左将军，随颖北镇。
      para: 晋书-p03826
  - id: e07
    date: 306-11-庚午
    people:
    - 惠帝司马衷
    place: 洛阳显阳殿
    event: 惠帝崩，年四十八；可作八王之乱传统分期终点标记，非晋境战事终止。
    source_coverage: 惠帝纪、怀帝纪互见
    evidence:
    - quote: 十一月庚午，帝崩于显阳殿，时年四十八，葬太阳陵。
      para: 晋书-p00103
    - quote: 光熙元年十一月庚午，孝惠帝崩。
      para: 晋书-p00108
  - id: e08
    date: 306-11/12
    people:
    - 怀帝司马炽
    - 司马越
    place: 洛阳
    event: 司马炽即位，司马越任太傅录尚书成为权力中心；阶段性收束，不是天下太平。
    source_coverage: 怀帝纪与惠帝纪
    evidence:
    - quote: 癸酉，即皇帝位，大赦，尊皇后羊氏为惠皇后，居弘训宫。
      para: 晋书-p00108
    - quote: 以太傅、东海王越录尚书。
      para: 晋书-p00103
  - id: e09
    date: 306-12
    people:
    - 司马模
    - 司马颙
    place: 雍谷
    event: 司马模杀颙；行军及地点未详。
    source_coverage: 怀帝纪、志第三互见；未检出颙传独立段落
    evidence:
    - quote: 南阳王模杀河间王颙于雍谷。
      para: 晋书-p00108
    - quote: 是年，苟晞破公师籓，张方破范阳王猇，关西诸将攻河间王颙，颙奔走，东海王迎杀之。
      para: 晋书-p00666
  - id: e10
    date: 307年五月（永嘉元年）
    people:
    - 汲桑
    - 石勒
    - 司马腾
    - 冯嵩
    place: 鄴
    event: 307年五月，汲桑聚众起事，石勒为前锋攻鄴，击败冯嵩，陷鄴城并杀新蔡王腾。疆域仅能确认城池陷落，魏郡整体控制不明，战事账记争夺。
    source_coverage: 怀帝纪与石勒载记互证。
    evidence:
    - quote: 夏五月，马牧帅汲桑聚众反，败魏郡太守冯嵩，遂陷鄴城，害新蔡王腾。
      para: 晋书-p00109
    - quote: 桑进军攻鄴，以勒为前锋都督，大败腾将冯嵩，因长驱入鄴，遂害腾
      para: 晋书-p07147
  - id: e11
    date: 308-10（永嘉二年）
    people:
    - 刘元海（刘渊）
    place: 平阳
    event: 刘元海称帝、仍称汉，作为本集钩子，超出主体年份。
    source_coverage: 称帝仅怀帝纪；载记只旁证此前称汉王
    evidence:
    - quote: 冬十月甲戌，刘元海僭帝号于平阳，仍称汉。
      para: 晋书-p00110
    - quote: 刘元海称汉王于黎亭
      para: 晋书-p07147
