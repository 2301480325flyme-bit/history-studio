open_questions:
- 越军徐方—萧县—谯—阳武之后的完整西进行程、津渡、关隘未载，勿直线补造。
- 越军初败刘祐的准确交战地点不详；史文仅能确定田徽在谯再遇祐。
- 祁弘迎驾军从何处出发、赴湖及转往长安路线未详；湖地精确位置需考证。
- 惠帝306年还洛只有长安—洛阳起终点，途中关隘渡口、驿站无原文依据。
- 张方确由颙杀/斩、首级送越，但日期、死地、执行者不详；传首地不可当死地。
- 刘舆杀司马颖地点未载；鄴仅确定为冯嵩送达处。
- 雍谷、南山均未能可靠落点。
- 疆域.yaml没有302–303、305–307年条目；已有304-08魏郡、304-10汉赵/成汉记录。请逐项判断305–307是否应补刘乔与越争郡、长安/洛阳控制、司马腾在307年五月被汲桑、石勒攻鄴杀害（已由帝纪与载记互证）。现有战事未确认完整郡级转手，均记territory:null。
- 308刘元海称帝是政权节点而非已证实的郡界变化，是否在疆域增加该事件待Claude决定。
- 汲桑、石勒攻鄴的准确出发地、行军路线及关隘未载；司马越七月屯官渡的前一营地亦未明。
