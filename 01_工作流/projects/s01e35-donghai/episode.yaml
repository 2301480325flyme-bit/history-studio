# 快节奏版（2026-10-25）
# 《三国到隋》第35集 · 两晋：东海王胜出，八王之乱收场（305–307）。大纲第 30 条。
# 本地语料核对（晋书）：
# 东海王越传 p04641"越唱义奉迎大驾，还复旧都，率甲卒三万，西次萧县。豫州刺史刘乔不受越命，遣子祐距之，越军败。范阳王虓遣督护田徽以突骑八百迎越，遇祐于谯，祐众溃，越进屯阳武…颙斩送张方首求和，寻变计距越。越率诸侯及鲜卑许扶历、驹次宿归等步骑迎惠帝反洛阳。诏越以太傅录尚书"；
# 惠帝纪 p00103 光熙元年"河间王颙闻刘乔破，大惧，遂杀张方，请和于东海王越，越不听"；"颙遣弘农太守彭随、北地太守刁默距祁弘等于湖…祁弘等与刁默战，默大败，颙、颍走南山，奔于宛。弘等所部鲜卑大掠长安，杀二万余人"；"弘等奉帝还洛阳，帝乘牛车，行宫藉草，公卿跋涉"；"六月丙辰朔，至自长安，升旧殿，哀感流涕"；"十一月庚午，帝崩于显阳殿，时年四十八"；
# 惠帝纪 p00104"后因食饼中毒而崩，或云司马越之鸩"（旁白说"据说"）；
# 河间王颙传 p04639"南阳王模遣将梁臣于新安雍谷车上扼杀之，并其三子"；怀帝纪 p00108"癸酉，即皇帝位"；
# 石勒载记 p07145"东嬴公腾执诸胡于山东卖充军实…勒时年二十余，亦在其中…既而卖与茌平人师欢为奴"；p07147"桑进军攻鄴，以勒为前锋都督，大败腾将冯嵩，因长驱入鄴，遂害腾"；怀帝纪 p00109 永嘉元年"夏五月，马牧帅汲桑聚众反…遂陷鄴城，害新蔡王腾"；
# 怀帝纪 p00110 永嘉二年"冬十月甲戌，刘元海僭帝号于平阳，仍称汉"。
# 不用：成都王颖被杀的具体地点（史料包：鄴仅为捕送地，死地不明，旁白只说"被抓、被杀"）；张方被杀的执行者与地点（颙传说郅辅夜斩方，旁白只说"砍了张方"）。

id: s01e35-donghai
title: 八王之乱收场
series: 两晋 · 第35集
year: 305

notes:
  - 主线问题：八个王打了十六年，最后赢的东海王，到底赢到了什么？——一个守不住的洛阳，一支打不动的军队；而当年被晋朝王爷卖做奴隶的羯人石勒，已经提刀回来了。
  - 钩子候选：①"八个王打了十六年，最后赢的那个，接到手的是个空壳子"（反差3 具体2 悬念3 兑现3=11）②"当年卖他做奴隶的王爷，后来死在他刀下"（反差3 具体2 悬念3 兑现3=11，留作结尾高潮）③"砍下自己大将的头，去求和"（反差2 具体2 悬念2 兑现3=9）→ 选①开场，②收尾。
  - 反差：河间王砍了自己的大将求和，对方不收；接皇帝回京的鲜卑兵，先把长安抢了；八王打完，赢家接手的是空壳。
  - 细节：三万人刚出门就败；八百突骑；张方的人头；皇帝坐牛车、睡草上、大臣步行；回到旧殿哭了；颙在车上被掐死；"或云司马越之鸩"；石勒两人一枷被押去卖。
  - 演义对照卡：本集无演义，结尾卡"史书怎么写"（石勒载记：东嬴公腾执诸胡于山东卖充军实）。

