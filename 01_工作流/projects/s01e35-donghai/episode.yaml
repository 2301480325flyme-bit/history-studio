  hero: 司马越
  at: 3
  summary: |
    305 年，荡阴兵败逃回东海的东海王司马越，打着迎回皇帝的旗号带三万人西进，刚到萧县就被刘乔之子刘祐打败，靠范阳王虓的八百突骑在谯县翻盘，进屯阳武，又借来王浚的鲜卑骑兵。306 年正月，关中的河间王颙砍了大将张方的头求和，东海王不收；五月祁弘在湖县大破刁默，鲜卑兵冲进长安杀两万多人。
    六月晋惠帝坐牛车、睡草上回到洛阳，登上旧殿哭了；十一月惠帝在显阳殿突然死去，"或云司马越之鸩"。弟弟司马炽即位，东海王以太傅录尚书，成了八王之乱最后的赢家。可第二年，当年被司马腾卖做奴隶的羯人石勒，带头攻破邺城，杀了司马腾；308 年，刘渊在平阳称帝。
  tags: [西晋, 八王之乱, 东海王司马越, 石勒, 刘渊, 晋怀帝]
  next: 永嘉之乱

