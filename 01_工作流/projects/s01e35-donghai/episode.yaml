beats:
  # ---------------- 冷开场 ----------------
  - say: 八个王，打了十六年。最后赢的那个，接到手的是个空壳子。
    map: '304-10-20'
    year: 306
    phase: 西进
    sources: [js-04, js-59]
    camera: {focus: [洛阳, 长安, 东海, 邺], zoom: fit, move: 1.2}
    show:
      - sfx: 重拍转场
      - headline: {text: 八王之乱 · 十六年, sub: 二九一至三〇六, cue: 十六年, for: 3.4}

  - say: 他就是东海王，司马越。
    sources: [js-59]
    show:
      - enter: {who: 司马越, side: right, cue: 司马越, for: 3.6}
      - sfx: {name: 帝王登场, cue: 司马越}

  # ---------------- 第一章 西进 ----------------
  - say: 先说三零五年。荡阴兵败后，东海王躲在老家东海；皇帝被张方劫到了长安，攥在河间王手里。
    year: 305
    sources: [js-04, js-59]
    camera: {focus: [东海, 洛阳, 长安], zoom: fit, move: 1.4}
    show:
      - title_bar: {text: 八王之乱收场, sub: 两晋 · 第35集, for: 3.2}
      - sfx: 片头鼓
      - flag: {at: 长安, name: 河间王, sub: 挟天子, faction: 河间王, cue: 长安, until: beat+5}

  - say: 东海王打出"迎回皇帝"的旗号，带三万人西进。刚到萧县，就被豫州刺史的儿子刘祐打了个败仗。
    sources: [js-59]
    tells: [e06, e07]
    show:
      - army: {head: 司马越, from: 东海, to: 萧, faction: 东海王, banner: 越, troops: infantry, size: 2.8, cue: 三万人, grow: 1.6}
      - battle: {at: 萧, text: 越军败, cue: 败仗}
      - sfx: {name: 刀剑交击, cue: 败仗}

  - say: 范阳王派来八百骑兵接应，在谯县打垮了刘祐。东海王这才缓过气，一路走到阳武。
    sources: [js-59]
    camera: {focus: [萧, 谯, 阳武, 洛阳], zoom: fit, move: 1.4}
    tells: [e08, e09]
    show:
      - battle: {at: 谯, text: 突骑八百 · 祐众溃, cue: 打垮}
      - army: {head: 司马越, from: 萧, via: [谯], to: 阳武, faction: 东海王, banner: 越, troops: infantry, size: 2.8, cue: 阳武, grow: 2.0}

  - say: 北边，幽州的王浚又借给他一支鲜卑骑兵。东海王的兵，越来越多。
    sources: [js-59]
    show:
      - sfx: {name: 骑兵行军, cue: 鲜卑骑兵}
      - quote: {text: 越率诸侯及鲜卑许扶历、驹次宿归等步骑迎惠帝, source: 晋书·东海王越传, cue: 越来越多, for: 4}

  # ---------------- 第二章 张方的头 ----------------
  - say: 关中的河间王慌了。三零六年正月，他砍下自己的大将张方，把人头送去求和。
    phase: 求和
    year: 306
    sources: [js-04, js-59]
    camera: {focus: [长安, 洛阳, 阳武], zoom: fit, move: 1.4}
    show:
      - enter: {who: 司马颙, side: right, cue: 河间王, for: 3.4}
      - act: {act: courier, places: [长安, 阳武], text: 送张方首, cue: 人头, grow: 1.6, for: 3}
      - sfx: {name: 处斩, cue: 砍下}

  - say: 张方，就是那个烧死长沙王、把皇帝从竹林里拖上车的人。
    sources: [js-04]
    show:
      - quote: {text: 河间王颙闻刘乔破，大惧，遂杀张方，请和于东海王越, source: 晋书·惠帝纪, era: 光熙元年正月, cue: 张方, for: 4}

  - say: 东海王不收。他的大将祁弘带兵西进，在湖县大破河间王的兵。河间王、成都王一起逃进了南山。
    audit_ok: [遗忘]
    sources: [js-04]
    camera: {focus: [洛阳, 湖, 长安, 宛], zoom: fit, move: 1.4}
    tells: [e13, e14]
    show:
      - army: {unit: 祁弘, from: 温, via: [湖], to: 长安, faction: 东海王, banner: 祁, troops: cavalry, size: 2.8, cue: 西进, grow: 2.4}
      - battle: {at: 湖, text: 刁默大败, cue: 大破}
      - flee: {from: 长安, to: 宛, label: 走南山奔宛, cue: 逃进了南山}

  - say: 接皇帝回京的鲜卑兵冲进长安，先抢了一通，杀了两万多人。
    sources: [js-04]
    camera: {focus: 长安, zoom: 7, move: 1.2}
    show:
      - fire: {at: 长安, cue: 冲进长安, radius: 1.0, for: 3.6}
      - quote: {text: 弘等所部鲜卑大掠长安，杀二万余人, source: 晋书·惠帝纪, cue: 两万, for: 4}
      - sfx: {name: 溃败哭喊, cue: 杀了}

  # ---------------- 第三章 牛车 ----------------
  - say: 皇帝坐着牛车回洛阳。路上就睡在草堆上，公卿大臣跟着走路。
    phase: 还洛
    sources: [js-04]
    camera: {focus: [长安, 洛阳], zoom: fit, move: 1.4}
    tells: [e15]
    show:
      - march: {from: 长安, to: 洛阳, faction: 东海王, label: 帝乘牛车, cue: 牛车, grow: 2.4}
      - vignette: {image: illus_oxcart_return, cue: 草堆, for: 5, text: 行宫藉草 公卿跋涉}

  - say: 六月，他回到洛阳的旧宫殿，一坐上去，就哭了。
    sources: [js-04]
    camera: {focus: 洛阳, zoom: 7, move: 1.2}
    show:
      - enter: {who: 司马衷, side: right, cue: 哭了, for: 3.4}
      - quote: {text: 至自长安，升旧殿，哀感流涕, source: 晋书·惠帝纪, era: 光熙元年六月, cue: 旧宫殿, for: 4}
      - army: {head: 司马越, from: 阳武, to: 洛阳, faction: 东海王, banner: 越, troops: infantry, size: 2.6, cue: 回到洛阳, grow: 1.4}   # 2026-10-25 越奉天子还都，营随之入洛

  - say: 九月，成都王被人抓住，后来被杀。十二月，河间王奉诏进京，半路上在车里被人掐死。
    sources: [js-04, js-59]
    camera: {focus: [洛阳, 长安, 邺], zoom: fit, move: 1.4}
    show:
      - exit: {who: 司马颖, at: 邺, verb: 诛, portrait: true, cue: 被杀}
      - exit: {who: 司马颙, at: 长安, verb: 诛, portrait: true, cue: 掐死}
      - sfx: {name: 退场钟, cue: 掐死}

  - say: 就在这中间的十一月，傻皇帝在显阳殿突然死了，四十八岁。史书留了一句：有人说，是东海王下的手。
    sources: [js-04]
    camera: {focus: 洛阳, zoom: 6, move: 1.2}
    show:
      - exit: {who: 司马衷, at: 洛阳, verb: 卒, portrait: true, cue: 四十八}
      - quote: {text: 后因食饼中毒而崩，或云司马越之鸩, source: 晋书·惠帝纪, cue: 下的手, for: 4}
      - sfx: {name: 不祥鼓, cue: 下的手}

  - say: 他的弟弟司马炽即位，就是晋怀帝。东海王当上太傅，大权到手。
    map: '306-12'
    sources: [js-04, js-05]
    show:
      - enter: {who: 司马炽, side: right, cue: 司马炽, for: 3.4}
      - flag: {at: 洛阳, name: 太傅, sub: 东海王司马越, faction: 东海王, cue: 太傅}
      - sfx: {name: 册封, cue: 太傅}

  # ---------------- 第四章 奴隶 ----------------
  - say: 八王之乱，到这儿算打完了。可晋朝能打仗的兵，已经死得差不多了。
    phase: 奴隶
    sources: [js-59]
    camera: {focus: [洛阳, 邺, 长安, 东海], zoom: fit, move: 1.6}
    show:
      - headline: {text: 八王之乱收场, sub: 精兵耗尽, cue: 打完了, for: 3.4}

  - say: 三零七年五月，一伙牧马人起兵，攻破邺城，杀了镇守邺城的新蔡王司马腾。
    year: 307
    map: '307-05'
    owners_cue: 攻破邺城
    sources: [js-05, js-104]
    camera: {focus: [邺, 洛阳], zoom: fit, move: 1.4}
    tells: [e18]
    show:
      - battle: {at: 邺, text: 陷鄴城, cue: 攻破邺城}
      - exit: {who: 司马腾, at: 邺, verb: 诛, portrait: true, cue: 司马腾}
      - sfx: {name: 疆域易手, cue: 攻破}

  - say: 冲在最前面的，是一个二十多岁的羯人，叫石勒。
    sources: [js-104]
    show:
      - spot: {at: 邺, text: 前锋 · 石勒, cue: 石勒}
      - sfx: {name: 重低音落地, cue: 石勒}

  - say: 几年前闹饥荒，司马腾在并州抓了一大批胡人，两个人套一副枷，押去冀州卖钱充军饷。
    sources: [js-104]
    show:
      - vignette: {image: illus_shile_cangue, cue: 两个人套一副枷, for: 6, text: 两胡一枷}

  - say: 被卖去做奴隶的人里，就有石勒。
    sources: [js-104]
    show:
      - quote: {text: 既而卖与茌平人师欢为奴, source: 晋书·石勒载记, cue: 奴隶, for: 3.6}
      - sfx: {name: 悬疑, cue: 石勒}

  # ---------------- 收 ----------------
  - say: 东海王赢到了什么？一座守不住的洛阳，一支打不动的军队。
    sources: [js-59]
    camera: {focus: [洛阳, 邺, 平阳], zoom: fit, move: 1.6}
    show:
      - enter: {who: 司马越, side: right, cue: 东海王, for: 3.4}

  - say: 八个王抢了十六年，没有一个是赢家。真正的赢家，在城外。
