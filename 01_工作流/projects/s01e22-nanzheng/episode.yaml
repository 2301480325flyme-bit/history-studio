    sources: [sgz-35]
    show:
      - enter: {who: 诸葛亮, side: left, cue: 诸葛亮, for: 4}
      - quote: {text: 政事无巨细，咸决于亮, source: 三国志·诸葛亮传, era: 建兴元年, cue: 大事小事, for: 4}

  # ---------------- 第一章 唇齿 ----------------
  - say: 南中造反，诸葛亮却没急着出兵。他先办另一件事：和吴国和好。
    phase: 唇齿
    sources: [sgz-35]
    camera: {focus: [成都, 武昌], zoom: fit, move: 1.4}
    show:
      - title_bar: {text: 平定南中, sub: 三国 · 第22集, for: 3.2}
      - sfx: 片头鼓

  - say: 他派邓芝出使东吴。孙权一开始不见。邓芝上表说：我这次来，也是为了吴国，不只是为了蜀国。
    sources: [sgz-45]
    show:
      - enter: {who: 邓芝, side: left, cue: 邓芝, for: 3.4}
      - act: {act: courier, places: [成都, 武昌], text: 邓芝使吴, cue: 出使, grow: 2.0, for: 3.6}

  - say: 孙权见了他：我是想和蜀国和好，可蜀主年幼，国小势弱，怕被魏吞了，连累自己。
    scene: 朝堂
    sources: [sgz-45]

  - say: 吴、蜀两国，蜀有山川之险，吴有长江之阻。联手，进可以吞并天下，退可以三分鼎立！
    speaker: 邓芝
    style: 从容不迫，雄辩有力，不卑不亢
    scene: 朝堂
    to: 孙权
    sources: [sgz-45]

  - say: 您要是向魏称臣，魏会要您去朝见，要太子去做人质。不答应，就派兵来打。到那时，江南就不归您了。
    speaker: 邓芝
    style: 语速放慢，层层逼近，点到要害
    scene: 朝堂
    to: 孙权
    sources: [sgz-45]

  - say: 孙权沉默了很久，才说：你说得对。
    scene: 朝堂
    sources: [sgz-45]

  - say: 他和魏断了往来，重新与蜀国结盟。东边，稳了。
    sources: [sgz-45, sgz-35]
    camera: {focus: [成都, 武昌, 洛阳], zoom: fit, move: 1.4}
    show:
      - headline: {text: 吴蜀复盟, sub: 建兴元年, cue: 结盟, for: 3}

  # ---------------- 第二章 南征 ----------------
  - say: 二二五年春天，诸葛亮亲自率军南征。
    phase: 南征
    year: 225
    sources: [sgz-35]
    camera: {focus: [成都, 越巂, 滇池, 牂牁], zoom: fit, move: 1.6}
    tells: [e05]
    show:
      - army: {head: 诸葛亮, from: 成都, via: [越巂], to: 滇池, faction: 蜀汉, banner: 诸葛, troops: infantry, size: 2.6, cue: 南征, grow: 3.4}
      - sfx: {name: 低音转场, delay: -0.3}

  - say: 据说出发时，马谡送了他一句话：用兵之道，攻心为上，攻城为下。
    sources: [sgz-35]
    show:
      - enter: {who: 马谡, side: right, cue: 马谡, for: 3.4}
      - card: {title: 据说, body: 攻心为上，攻城为下——诸葛亮传注引《襄阳记》, cue: 攻心}

  - say: 据说，南中的首领孟获被抓了七次、放了七次，最后心服口服，不再造反。
    sources: [sgz-35]
    show:
      - enter: {who: 孟获, side: right, cue: 孟获, for: 3.4}
      - card: {title: 据说 · 七擒七纵, body: 出自诸葛亮传注引《汉晋春秋》，正文只有"其秋悉平"四个字, cue: 七次}

  - say: 这年秋天，南中全部平定。
    map: '225-09'
    owners_cue: 平定
    sources: [sgz-35]
    tells: [e12, e13, e14]
    show:
      - sfx: {name: 疆域易手, cue: 平定}
      - quote: {text: 三年春，亮率众南征，其秋悉平, source: 三国志·诸葛亮传, era: 建兴三年, cue: 平定, for: 4}

  - say: 从此南中的物产，源源不断地送进军营。蜀汉，富起来了。
    sources: [sgz-35]
    tells: [e15]
    show:
      - army: {head: 诸葛亮, from: 滇池, via: [越巂], to: 成都, faction: 蜀汉, banner: 诸葛, troops: infantry, size: 2.2, cue: 源源不断, grow: 3.0}   # 2026-10-25 战事账：十二月亮还成都

  # ---------------- 第三章 江冰 ----------------
  - say: 同一年冬天，曹丕亲率十几万大军，开到广陵的长江边，旌旗连绵几百里。
    phase: 江冰
    sources: [sgz-02]
    camera: {focus: [谯, 广陵, 武昌], zoom: fit, move: 1.6}
    tells: [e17, e20]
    show:
      - enter: {who: 曹丕, side: left, cue: 曹丕, for: 3.4}
      - army: {head: 曹丕, from: 谯, to: 广陵, faction: 魏, banner: 魏, troops: infantry, size: 3.4, cue: 十几万, grow: 2.0}

  - say: 偏偏这年特别冷，河道结了冰，战船开不进长江。曹丕只好掉头回去。
    sources: [sgz-02]
    camera: {focus: 广陵, zoom: 6, move: 1.2}
    show:
      - card: {title: 临江而返, body: 是岁大寒，水道冰，舟不得入江，乃引还, cue: 结了冰}
      - sfx: {name: 狂风, cue: 特别冷}

  - say: 第二年五月，曹丕病逝，才四十岁。临终前，他把儿子托付给了几位大臣，其中一个，叫司马懿。
    year: 226
    sources: [sgz-02]
    camera: {focus: 洛阳, zoom: 5, move: 1.2}
    show:
      - exit: {who: 曹丕, at: 洛阳, verb: 卒, portrait: true, cue: 病逝}
      - enter: {who: 司马懿, side: right, cue: 司马懿, for: 3.6}

  # ---------------- 收 ----------------
  - say: 诸葛亮怎么三年收拾了烂摊子？先稳住东边，不两线作战。
    sources: [sgz-35]

  - say: 再平南边，后方有了粮和兵；最后，才轮到北边。
    phase: 收
    sources: [sgz-35]
    camera: {focus: [成都, 武昌, 洛阳, 滇池], zoom: fit, move: 1.6}
    show:
      - card: {title: 演义 vs 正史, body: 火烧藤甲兵、五月渡泸的细节是小说；七擒七纵只见于注文, cue: 北边}

  - say: 刘备留下的，是一个快散架的国家；诸葛亮交出的，是一支准备出征的军队。
    sources: [sgz-35]

  - say: 七擒七纵，你信吗？
    sources: [sgz-35]

  - say: 二二七年，诸葛亮率军北上汉中。临走前，他给刘禅写了一封信：出师表。
    year: 227
    sources: [sgz-35]
    camera: {focus: [成都, 汉中, 洛阳], zoom: fit, move: 1.6}
    show:
      - army: {head: 诸葛亮, from: 成都, to: 汉中, faction: 蜀汉, banner: 诸葛, troops: infantry, size: 2.6, label: 北驻汉中, cue: 北上, grow: 1.8}
