  big: [平定南中]
  hero: 诸葛亮
  at: 30
  summary: |
    刘备死后，蜀汉东边刚和吴国打完仗，南中几个郡接连造反，北边曹丕虎视眈眈。诸葛亮先不打南中，派邓芝出使东吴："蜀有重险之固，吴有三江之阻，合此二长，进可并兼天下，退可鼎足而立。"孙权沉默良久，与魏断交，重结吴蜀之好。
    东边稳了，诸葛亮亲率大军南征，当年秋天南中平定，军资从此源源不断。同年冬天，曹丕十几万大军开到广陵江边，偏偏碰上大寒，江面结冰，船进不了长江，只好回去。
  tags: [诸葛亮, 平定南中, 邓芝, 七擒孟获, 曹丕]
  next: 出师表，街亭之战

