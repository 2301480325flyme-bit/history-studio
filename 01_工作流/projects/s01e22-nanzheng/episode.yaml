# 快节奏版（2026-10-14，按抖音数据：冷开场、只讲有戏的、无背景音乐）
# 《三国到隋》第22集：诸葛亮治蜀、邓芝使吴、平定南中、曹丕临江而返（223–226）
# 本地语料核对：
# 诸葛亮传"建兴元年，封亮武乡侯，开府治事。顷之，又领益州牧。政事无巨细，咸决于亮。南中诸郡，并皆叛乱，亮以新遭大丧，故未便加兵，且遣使聘吴，因结和亲，遂为与国"；"三年春，亮率众南征，其秋悉平。军资所出，国以富饶，乃治戎讲武，以俟大举"；
# 后主传"建兴元年夏，牂牁太守朱褒拥郡反。先是，益州郡有大姓雍闿反…越巂夷王高定亦背叛…遣尚书邓芝固好于吴"；
# 邓芝传"芝乃自表请见权曰：臣今来亦欲为吴，非但为蜀也。权乃见之，语芝曰：孤诚愿与蜀和亲，然恐蜀主幼弱，国小势逼，为魏所乘，不自保全，以此犹豫耳。芝对曰：吴、蜀二国四州之地…蜀有重险之固，吴有三江之阻，合此二长，共为唇齿，进可并兼天下，退可鼎足而立…大王今若委质于魏，魏必上望大王之入朝，下求太子之内侍。若不从命，则奉辞伐叛，蜀必顺流见可而进。如此，江南之地非复大王之有也。权默然良久曰：君言是也。遂自绝魏，与蜀连和"；
# 文帝纪"冬十月，行幸广陵故城，临江观兵，戎卒十余万，旌旗数百里。是岁大寒，水道冰，舟不得入江，乃引还"；"夏五月丙辰，帝疾笃，召中军大将军曹真、镇军大将军陈群、征东大将军曹休、抚军大将军司马宣王，并受遗诏辅嗣主…丁巳，帝崩于嘉福殿，时年四十"。
# 注文（片中标"据说"）：马谡"攻心为上，攻城为下"（诸葛亮传注引襄阳记）；七擒七纵孟获（诸葛亮传注引汉晋春秋）——本地语料未收，按注文出处如实标注。
# 不用：曹丕"固天所以限南北也"（注文，本地语料未收）。

id: s01e22-nanzheng
title: 平定南中
series: 三国 · 第22集
year: 223

notes:
  - 主线问题：刘备死后蜀汉三面起火，诸葛亮怎么用三年收拾干净？——先稳东边，不两线作战；再平南边，后方有了粮兵；最后才轮到北边。
  - 反差：南中造反，诸葛亮偏偏先不打，派人去吴国；曹丕十几万大军开到江边，被一场寒冬冻了回去。
  - 细节：邓芝"我来也是为了吴国"；孙权"默然良久"；"政事无巨细，咸决于亮"；江面结冰，船进不了长江。
  - 动机：孙权怕蜀主年幼被魏吞掉、自己孤立，邓芝用"唇齿"和"江南不保"两句话说动他。
  - 演义对照：七擒孟获出自《汉晋春秋》（注文），细节多有争议；"火烧藤甲兵""五月渡泸"是小说情节。

