open_questions:
- 《诸葛亮传》记225年春出兵、秋天平定，《后主传》却记“三年春三月”南征四郡且四郡皆平；本账按《诸葛亮传》采用225-秋作为平定节点，与疆域.yaml的225-09对应，但日月存在原文差异。
- 诸葛亮本军的成都出发点、沿途关隘和滇池终点未见本地原文；剧本所画“成都—越巂—滇池”不能全部当成史书已证路线。李恢本次起点、途经关隘与各段行军日期同样未详。
- “南征四郡”未逐一列名；现疆域时间线只把益州郡、牂牁郡、越巂郡列为叛乱争夺并于225-09归蜀汉，永昌由吕凯、王伉守境未失。第四郡是否指永昌及“皆平”的具体含义待核。
