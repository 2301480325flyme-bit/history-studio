# 演示：复合动作 3 · 势力归附（defect）
id: zz-defect
title: 组件演示 · 韩馥让冀州
series: History Studio 复合动作
year: 191

notes:
  - 初平二年秋七月袁绍取冀州（《武帝纪》"袁绍胁韩馥，取冀州"；《袁绍传》"乃让绍，绍遂领冀州牧"）。
  - 让州前袁绍为勃海太守，此处按勃海郡示意其根基；冀州其余各郡归韩馥。

