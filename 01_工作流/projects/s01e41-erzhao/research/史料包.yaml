scenes:
  - {scene: 赤壁推戴刘曜、呼延晏等自平阳来会, evidence: [{quote: "太保呼延晏等自平阳奔之", para: 晋书-p07099}]}
  - {scene: 刘曜水陆东救蒲坂、卫关北渡、追击高候, evidence: [{quote: "自卫关北济。季龙惧，引师而退。追之，及于高候，大战", para: 晋书-p07137}]}
  - {scene: 刘曜决千金堨灌金墉, evidence: [{quote: "攻石生于金墉，决千金堨以灌之", para: 晋书-p07137}]}
  - {scene: 石勒军大堨渡河、集成皋、由巩訾突袭, evidence: [{quote: "乃卷甲衔枚而诡道兼路，出于巩、訾之间", para: 晋书-p07248}]}
  - {scene: 石堪擒刘曜、西阳门溃战, evidence: [{quote: "大战于西阳门。勒躬贯甲胄，出自阊阖，夹击之。曜军大溃，石堪执曜", para: 晋书-p07248}]}
  - {scene: 前赵官员奔上邽、关中大乱, evidence: [{quote: "帅百官奔于上邽，关中大乱", para: 晋书-p00156}]}
open_questions:
  - 赤壁河津说未核；本地gazetteer同名只指湖北赤壁市。
  - 高候、卫关、襄陵北原、訾、大堨/灵昌津、西阳门今址未核。
  - 石虎攻上邽的起点及中途路线未核，勿补推测站点。
  - 太子毗/熙异名、330称帝月份待核。
  - 本地《资治通鉴》不可用，缺互证。
