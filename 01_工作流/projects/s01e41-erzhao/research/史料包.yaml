comparisons:
  - {topic: 靳准之乱, note: "正史记弑刘粲、并其宗族；不外推刘氏所有支系全灭或添加人数。", evidence: [{quote: "乃起兵杀粲，并其宗族", para: 晋书-p04848}]}
  - {topic: 刘曜被擒, note: "载记写饮酒数斗、马局顿后换小马、石堪乘势擒曜；通俗叙述常缩写为醉酒坠马，当前原文未直写此说。", evidence: [{quote: "曜将战，饮酒数斗", para: 晋书-p07137}, {quote: "石堪执曜", para: 晋书-p07248}]}
