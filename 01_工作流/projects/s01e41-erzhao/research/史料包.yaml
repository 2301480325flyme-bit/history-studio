episode: s01e41-erzhao
period: 318–330
sources: {晋书: "已检本纪及刘聪/刘曜/石勒/石季龙载记", 资治通鉴: "本地 sources 返回空；未引未核文本"}
events:
  - {date: 318, event: "刘聪死、刘粲继位；靳准弑刘粲并杀刘氏宗族。", sources: [{book: 晋书, juan: 载记第二·刘聪, para: 晋书-p00136, quote: "靳准弑刘粲，自号汉王"}, {book: 晋书, juan: 列传第三十三, para: 晋书-p04848, quote: "靳准乃起兵杀粲，并其宗族"}], note: "本纪晋书-p00136互证；精确日次未核。"}
  - {date: 318, event: "刘曜从长安赴平阳，在赤壁受推戴称帝、改元光初。", sources: [{book: 晋书, juan: 载记第三·刘曜, para: 晋书-p07099, quote: "靳准之难，自长安赴之。至于赤壁"}, {book: 晋书, juan: 帝纪第六, para: 晋书-p00136, quote: "刘曜僭即皇帝位于赤壁"}], note: "赤壁今址有异说，河津说未证实。"}
  - {date: 318–319, event: "石勒派张敬前锋、亲率精锐讨靳准；靳准被部下杀，靳明奉玺降刘曜。", sources: [{book: 晋书, juan: 载记第四·石勒上, para: 晋书-p07197, quote: "勒命张敬率骑五千为前锋以讨准，勒统精锐五万继之"}, {book: 晋书, juan: 载记第三·刘曜, para: 晋书-p07100, quote: "乔泰、王腾、靳康、马忠等杀准，推尚书令靳明为盟主"}], note: "多方受降不表示整个河东郡确定易手。"}
  - {date: 319, event: "刘曜迁都长安改国号赵；石勒在襄国称赵王，形成前赵、后赵。", sources: [{book: 晋书, juan: 志第四·地理上, para: 晋书-p00893, quote: "刘曜徙都长安，改号曰赵"}, {book: 晋书, juan: 载记第五·石勒下, para: 晋书-p07197, quote: "进爵赵公"}], note: "此处载记原文记刘曜迁都及石勒进爵赵公；319称王具体文字本地未核，疆域.yaml记势力分置，月份需互校。"}
  - {date: 328-07/08, event: "石虎由轵关西进攻蒲坂；刘曜东救、自卫关北渡河，追至高候大败石虎、斩石瞻。", sources: [{book: 晋书, juan: 载记第三·刘曜, para: 晋书-p07137, quote: "石季龙率众四万，自轵关西入伐曜，河东应之者五十余县，进攻蒲坂"}, {book: 晋书, juan: 帝纪第七, para: 晋书-p00155, quote: "石勒将石季龙攻刘曜于蒲坂"}, {book: 晋书, juan: 载记第三·刘曜, para: 晋书-p07137, quote: "自卫关北济。季龙惧，引师而退。追之，及于高候，大战，败之，斩其将军石瞻"}], note: "本纪称八月战高候；高候、卫关今址未核。"}
  - {date: 328-08, event: "刘曜渡大阳攻金墉石生，决千金堨灌城，后围洛阳。", sources: [{book: 晋书, juan: 载记第三·刘曜, para: 晋书-p07137, quote: "曜遂济自大阳，攻石生于金墉，决千金堨以灌之"}, {book: 晋书, juan: 帝纪第七, para: 晋书-p00155, quote: "曜遂围石生于洛阳"}], note: "金墉是城堡，围城未证河南尹全郡易手。"}
  - {date: 328-10, event: "石勒亲征救洛阳，渡大堨、集结成皋、绕出巩訾；西阳门交战，石堪擒刘曜。", sources: [{book: 晋书, juan: 载记第五·石勒下, para: 晋书-p07248, quote: "勒统步骑四万赴金墉，济自大堨"}, {book: 晋书, juan: 载记第五·石勒下, para: 晋书-p07248, quote: "诸军集于成皋，步卒六万，骑二万七千"}, {book: 晋书, juan: 载记第五·石勒下, para: 晋书-p07248, quote: "出于巩、訾之间"}, {book: 晋书, juan: 载记第五·石勒下, para: 晋书-p07248, quote: "大战于西阳门。勒躬贯甲胄，出自阊阖，夹击之。曜军大溃，石堪执曜"}], note: "载记另写刘曜战前饮酒、马局顿后换乘小马（p07137）；原文未直接写醉酒坠马。"}
  - {date: 329, event: "刘曜太子与刘胤率百官奔上邽；石虎破刘胤，前赵亡。", sources: [{book: 晋书, juan: 帝纪第七, para: 晋书-p00156, quote: "刘曜太子毗与其大司马刘胤帅百官奔于上邽，关中大乱"}], note: "本地只核到本纪记奔上邽、关中大乱；石虎破刘胤、前赵亡的完整句未通过逐字校验，独立第二出处未核；太子毗/熙异名待考。"}
  - {date: 330, event: "石勒称帝。", sources: [{book: 晋书, juan: 帝纪第七, para: 晋书-p00157, quote: "石勒僭即皇帝位"}], note: "本地只核实《成帝纪》一处，独立第二出处未核；具体月份待核。"}
