open_questions:
- 疆域.yaml对照319-11前后赵分置、321扩张、325司兖豫、329-09三辅归后赵；不增无根据郡级易手。
- 蒲坂、金墉、洛阳围城不证明整郡易手，territory为null。
- 329本纪只概括破刘胤、前赵亡；三辅易手细节未核，是否沿用疆域.yaml概括节点待Claude定。
- 石虎攻上邽起点与路线未核，不补推测站点。
- 赤壁、高候、襄陵北原、卫关、訾、大堨、灵昌津、西阳门缺可靠gazetteer点；坐标为低精度示意。
