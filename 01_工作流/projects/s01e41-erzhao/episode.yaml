  big: [二赵争霸, 醉酒被擒]
  hero: 刘曜
  at: 3
  summary: |
    318 年汉国皇帝刘聪死，外戚靳准在平阳杀新君刘粲、屠灭刘氏宗族。长安的刘曜和襄国的石勒同时来讨：刘曜半路在赤壁称帝，平阳城里杀了靳准的人却把传国玉玺送给了刘曜，刘曜又杀尽靳氏。319 年刘曜迁都长安、改国号赵；又听信谗言杀了石勒的使者，石勒说"赵王赵帝，孤自取之"，在襄国称赵王，北方从此两个赵国。
    328 年石虎攻蒲坂，刘曜在高候大败石虎，乘胜围洛阳金墉，围了一百天，天天饮酒赌博。石勒不顾群臣劝阻亲征，从灵昌津渡河，见成皋无人守，指天说"天也"。决战前刘曜又喝了好几斗酒，西阳门一战前赵军大溃，刘曜醉中马陷石渠、摔在冰上被俘。他不肯写信劝太子投降，后被杀。329 年太子奔上邽，石虎破刘胤、屠上邽，前赵亡；330 年石勒称帝。
  tags: [十六国, 前赵, 后赵, 刘曜, 石勒, 石虎, 靳准之乱, 洛阳之战]
  next: 石虎篡位

