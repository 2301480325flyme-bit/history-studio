      - battle: {at: 高候, text: 斩石瞻, cue: 大败}
      - sfx: {name: 刀剑交击, cue: 大败}

  - say: 后赵兵的尸体铺了两百多里，石虎逃到了朝歌。
    sources: [js-103]
    tells: [e12]
    show:
      - rout: {at: 蒲坂, via: [高候], to: 朝歌, faction: 后赵, banner: 虎, head: 石虎, cue: 逃到了朝歌, size: 1.2}
      - quote: {text: 枕尸二百余里, source: 晋书·刘曜载记, cue: 两百多里, for: 3.4}

  - say: 刘曜乘胜围了洛阳，还掘开千金堨，放水灌城。
    map: '328-08'
    owners_cue: 围了
    sources: [js-103]
    camera: {focus: [高候, 洛阳], zoom: fit, move: 1.4}
    tells: [e13, e14, e15]
    show:
      - army: {head: 刘曜, from: 高候, to: 洛阳, faction: 前赵, banner: 曜, troops: cavalry, size: 3.2, cue: 围了洛阳, grow: 1.6}
      - act: {act: flood, at: 洛阳, text: 决千金堨以灌之, cue: 放水灌城, for: 4.4}

  - say: 可围了一百天也没打下来。刘曜天天跟亲信喝酒赌钱，谁劝就杀谁。
    sources: [js-103, js-105]
    camera: {focus: 洛阳, zoom: 7, move: 1.2}
    show:
      - act: {act: prop, at: 洛阳, item: 酒宴, text: 专与嬖臣饮博, cue: 喝酒赌钱, for: 3.6}
      - quote: {text: 左右或谏，曜怒，以为妖言，斩之, source: 晋书·刘曜载记, cue: 谁劝, for: 3.6}

  # ---------------- 第四章 亲征 ----------------
  - say: 石勒要亲自去救，大臣们死命拦着。石勒按着剑，把他们骂了出去。
    phase: 亲征
    sources: [js-105]
    camera: {focus: 襄国, zoom: 7, move: 1.2}
    show:
      - enter: {who: 石勒, side: right, cue: 按着剑, for: 3.4}
      - act: {act: prop, at: 襄国, item: 剑, text: 按剑叱遐等出, cue: 骂了出去, for: 3}

  - say: 他说，刘曜十万人打一座城，一百天打不下，早就累垮了。
    sources: [js-105]
    show:
      - quote: {text: 曜带甲十万攻一城，而百日不克，师老卒殆, source: 晋书·石勒载记下, cue: 累垮了, for: 4.2}

  - say: 这年冬天，石勒让石虎收拢残兵，自己带四万步骑南下，渡过黄河。
    sources: [js-105]
    camera: {focus: [襄国, 灵昌津, 洛阳], zoom: fit, move: 1.4}
    tells: [e16, e17]
    show:
      - camp: {at: 朝歌, unit: 石虎, faction: 后赵, text: 石虎, cue: 收拢残兵}
      - army: {head: 石勒, from: 襄国, to: 灵昌津, faction: 后赵, banner: 勒, troops: cavalry, size: 3.2, cue: 南下, grow: 1.8, camp: false}
      - vignette: {image: illus_lingchang_ice, cue: 渡过黄河, for: 5, text: 济毕，流澌大至}

  - say: 他说：刘曜要是守住成皋关，是上策；坐在洛阳不动，就等着被我抓。
    sources: [js-105]
    show:
      - enter: {who: 徐光, side: left, cue: 他说, for: 2.6}
      - card: {title: 石勒三策, body: 盛兵成皋关，上计也；阻洛水，其次也；坐守洛阳者，成擒也, cue: 上策, for: 6}

  - say: 到了成皋，一个守兵都没有。石勒举手指天：天意啊！
    sources: [js-105]
    tells: [e18]
    show:
      - army: {head: 石勒, from: 灵昌津, to: 成皋, faction: 后赵, banner: 勒, troops: cavalry, size: 3.2, cue: 成皋, grow: 1.4, camp: false}
      - vignette: {image: illus_shile_heaven, cue: 举手指天, for: 5, text: 举手指天，又自指额曰：天也}

  # ---------------- 第五章 西阳门 ----------------
  - say: 决战前，刘曜又灌了好几斗酒。
    phase: 西阳门
    sources: [js-103, js-105]
    camera: {focus: 洛阳, zoom: 8, move: 1.2}
    show:
      - enter: {who: 刘曜, side: left, cue: 刘曜, for: 3.2}
      - act: {act: prop, at: 洛阳, item: 酒瓮, text: 饮酒数斗, cue: 好几斗酒, for: 3.2}

  - say: 平时骑的红马无故跪倒，他换了匹小马，又喝了一斗多。
    sources: [js-103]
    show:
      - act: {act: prop, at: 洛阳, item: 惊马, text: 赤马无故局顿, cue: 跪倒, for: 3.4}

  - say: 石勒、石虎、石堪三路杀到，在洛阳西阳门三面夹击。
    sources: [js-105]
    tells: [e19, e21]
    show:
      - army: {head: 石勒, from: 成皋, to: 洛阳, faction: 后赵, banner: 勒, troops: cavalry, size: 3.4, cue: 杀到, grow: 1.4}
      - army: {head: 石虎, from: 朝歌, to: 洛阳, faction: 后赵, banner: 虎, troops: infantry, size: 2.8, cue: 三路, grow: 1.2, camp: false}
      - battle: {at: 洛阳, text: 西阳门大战, cue: 三面夹击}
      - sfx: {name: 战鼓, cue: 夹击}

  - say: 前赵军大溃。刘曜醉着往回跑，马陷进石渠，他摔在冰上，被活捉。
    sources: [js-103]
    show:
      - vignette: {image: illus_liuyao_ice, cue: 马陷进石渠, for: 5.5, text: 曜昏醉奔退，马陷石渠，坠于冰上}
      - exit: {who: 刘曜, at: 洛阳, verb: 囚, portrait: true, cue: 活捉}
      - sfx: {name: 刀剑交击, cue: 大溃}

  - say: 石王，你还记得当年我们的盟约吗？
    speaker: 刘曜
    style: 重伤被俘，酒还没醒，声音沙哑，强撑着体面，带点哀求
    quote: 石王忆重门之盟不
    sources: [js-103]
    show:
      - enter: {who: 刘曜, side: left, cue: 石王, for: 4}

  - say: 石勒让人回他：今天这事，是老天安排的。
    sources: [js-103]
    show:
      - enter: {who: 徐光, side: right, cue: 回他, for: 3}
      - quote: {text: 今日之事，天使其然，复云何邪, source: 晋书·刘曜载记, cue: 老天安排, for: 4}

  # ---------------- 第六章 上邽 ----------------
  - say: 石勒让他写信叫太子投降。刘曜却写：守好国家，别管我。
    phase: 上邽
    sources: [js-103]
    show:
      - quote: {text: 匡维社稷，勿以吾易意也, source: 晋书·刘曜载记, cue: 别管我, for: 4}

  - say: 后来，石勒杀了他。
    sources: [js-103]
    show:
      - exit: {who: 刘曜, at: 襄国, verb: 杀, portrait: true, cue: 杀了他}

  - say: 第二年正月，太子丢下长安，带着百官逃到上邽。
    year: 329
    map: '329-02'
    owners_cue: 逃到上邽
    sources: [js-07]
    camera: {focus: [长安, 上邽], zoom: fit, move: 1.4}
    tells: [e22]
    show:
      - march: {from: 长安, to: 上邽, faction: 前赵, label: 帅百官奔于上邽, cue: 逃到上邽, grow: 1.6}

  - say: 九月，石虎攻进上邽，把刘家宗室杀了个干净。前赵，亡了。
    map: '329-09'
    owners_cue: 亡了
    sources: [js-07]
    tells: [e23, e24]
    show:
      - army: {head: 石虎, from: 洛阳, via: [长安], to: 上邽, faction: 后赵, banner: 虎, troops: cavalry, size: 3.0, cue: 攻进上邽, grow: 1.6}
      - battle: {at: 上邽, text: 尽灭刘氏, cue: 杀了个干净}
      - sfx: {name: 落幕锣, cue: 亡了}

  - say: 三三零年，石勒称帝，大半个北方都归了后赵。
    year: 330
    sources: [js-07]
    camera: {focus: [长安, 洛阳, 襄国], zoom: fit, move: 1.6}
    show:
      - act: {act: enthrone, who: 石勒, at: 襄国, text: 即皇帝位, sub: 后赵, cue: 称帝, for: 3.2}

  # ---------------- 收 ----------------
  - say: 刘曜为什么输？赢了一仗就围城喝酒，石勒最怕的成皋，他一个兵都没放。
    sources: [js-103, js-105]
    show:
      - versus: {left: 刘曜, right: 石勒, label: 醉 vs 快, cue: 为什么输, for: 4}

  - say: 一场决定北方的大战，输给了几斗酒。
    sources: [js-103]
    show:
      - headline: {text: 二赵争霸, sub: 输给了几斗酒, cue: 几斗酒, for: 3.4}
      - sfx: {name: 史诗冲击, cue: 几斗酒}

  - say: 石勒说是天意。你觉得，是天意，还是刘曜自己作的？
    sources: [js-103]
    show:
      - card: {title: 史书怎么写, body: 刘曜载记：曜昏醉奔退，马陷石渠，坠于冰上, cue: 自己作的, for: 3.6}

  - say: 后赵坐稳了北方。可石勒的侄子石虎，正盯着他的皇位。
    sources: [js-105]
    show:
      - title_bar: {text: 下集, sub: 十六国 · 石虎篡位, cue: 皇位, delay: 0.4, for: 3.0}
      - sfx: {name: 时代转折, cue: 皇位}
