# 快节奏版（2026-10-25）
# 《三国到隋》第41集 · 十六国：前赵后赵争霸（318–330）。大纲第 35 条。
# 史料包：projects/s01e41-erzhao/research/史料包.yaml（Codex）；战事账：战事.yaml。
# 本地语料核对（晋书）：
# 刘聪载记/列传 p04848"靳准乃起兵杀粲，并其宗族"；元帝纪 p00136"靳准弑刘粲，自号汉王"；
# 刘曜载记 p07099"靳准之难，自长安赴之。至于赤壁，太保呼延晏等自平阳奔之…上尊号"；p07100"乔泰、王腾、靳康、马忠等杀准，推尚书令靳明为盟主，遣卜泰奉传国六玺降于曜…明率平阳士女万五千归于曜，曜命诛明，靳氏男女无少长皆杀之…徙都长安…国号曰赵"；
# 石勒载记下 p07197"勒命张敬率骑五千为前锋以讨准，勒统精锐五万继之…勒焚平阳宫室…徙浑仪乐器于襄国"；p07198 曹平乐谗、曜斩王修于粟邑、停太宰之授，勒令"赵王赵帝孤自取之，名号大小岂其所节邪"；
# 刘曜载记 p07137"石季龙率众四万，自轵关西入伐曜，河东应之者五十余县，进攻蒲坂…曜尽中外精锐水陆赴之…追之，及于高候，大战，败之，斩其将军石瞻，枕尸二百余里…季龙奔于朝歌。曜遂济自大阳，攻石生于金墉，决千金堨以灌之。曜不抚士众，专与嬖臣饮博，左右或谏，曜怒，以为妖言，斩之…曜将战，饮酒数斗，常乘赤马无故局顿，乃乘小马，比出，复饮酒斗余…石堪因而乘之，师遂大溃。曜昏醉奔退，马陷石渠，坠于冰上，被疮十余，通中者三，为堪所执…曜曰：石王忆重门之盟不？勒使徐光谓曜曰：今日之事，天使其然，复云何邪"；
#   p07138"勒谕曜与其太子熙书，令速降之。曜但敕熙与诸大臣匡维社稷，勿以吾易意也。勒览而恶之，后为勒所杀"；
# 石勒载记下 p07248"荥阳太守尹矩、野王太守张进等皆降之，襄国大震…程遐等固谏…勒大怒，按剑叱遐等出…曜带甲十万攻一城，而百日不克，师老卒殆…勒统步骑四万赴金墉，济自大堨…流澌大至，勒以为神灵之助也，命曰灵昌津…曜盛兵成皋关，上计也；阻洛水，其次也；坐守洛阳者，成擒也…诸军集于成皋…勒见曜无守军，大悦，举手指天，又自指额曰：天也…季龙步卒三万自城北而西…石堪、石聪等各以精骑八千城西而北…大战于西阳门。勒躬贯甲胄，出自阊阖，夹击之。曜军大溃，石堪执曜…斩首五万余级"；
# 成帝纪 p00155"十二月乙未，石勒败刘曜于洛阳，获之"；p00156"刘曜太子毗与其大司马刘胤帅百官奔于上邽，关中大乱…八月，曜将刘胤等帅众侵石生，次于雍。九月，石勒将石季龙击胤，斩之，进屠上邽，尽灭刘氏，坑其党三千余人"；p00157"秋八月，石勒僭即皇帝位"。
# 不用：重门之盟的具体内容（本地未检到，旁白只说"当年的盟约"）；刘曜身长九尺三寸、眉白目赤（与本集主线无关）；坑三千余人的细节（旁白只说"杀了个干净"）。

id: s01e41-erzhao
title: 二赵争霸
series: 十六国 · 第41集
year: 328

notes:
  - 主线问题：同出汉国的刘曜和石勒，为什么从君臣变成死敌，最后一仗定输赢？——靳准之乱后两人抢平阳，刘曜拿了玉玺、又杀了石勒的使者，石勒干脆自立；十年后刘曜赢了一仗就围城喝酒，石勒亲征，刘曜醉酒坠马被擒，前赵一年后灭亡。
  - 钩子候选：①"一场决定北方归属的大战，开打前，一个皇帝先喝了好几斗酒"（反差3 具体3 悬念3 兑现3=12）②"赵王也好，赵帝也好，我自己拿"（反差2 具体2 悬念2 兑现3=9）→ 选①。
  - 反差：抢着去平叛，玉玺却送给了另一个；刘曜赢了高候，却输在喝酒；石勒最怕刘曜守成皋，成皋一个兵都没有；被俘的刘曜不肯叫儿子投降。
  - 细节：并其宗族；赤壁称帝；传国六玺；靳氏无少长皆杀；浑仪乐器搬回襄国；赵王赵帝孤自取之；枕尸二百余里；决千金堨；饮博、谏者斩；按剑叱遐；灵昌津流澌；上中下三策；举手指天；赤马局顿换小马；马陷石渠坠冰上；石王忆重门之盟不；天使其然；勿以吾易意。
  - 演义对照卡：结尾卡"史书怎么写"（刘曜载记：曜昏醉奔退，马陷石渠，坠于冰上）。

