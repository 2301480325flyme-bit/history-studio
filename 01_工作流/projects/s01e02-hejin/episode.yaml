publish:
  hook: 何进请来的帮手，掀翻了整个东汉
  big: [剑履上殿]
  hero: 董卓
  at: 190
  summary: |
    公元189年，汉灵帝驾崩，大将军何进想把宦官一网打尽，竟召西凉军阀董卓带兵进京。陈琳、卢植苦劝不听，何进先被宦官砍死在宫中。
    董卓趁乱接住少帝，三千人马用疑兵计吓住洛阳，废少帝、立献帝，"剑履上殿"；袁绍挂节出走，曹操改名逃亡——讨董的大幕就此拉开。
  tags: [董卓, 何进, 袁绍, 曹操]
  next: 十几万大军讨董卓，为什么一仗都不敢打？

