  袁绍: {image: 03_素材/人物立绘/yuan_shao.png, title: 司隶校尉, role: 劝诛宦官, faction: 袁绍, voice: 三十多岁的名门公子，男声，嗓音清朗洪亮，骄傲而有气节, voice_sample: 大丈夫立于天地之间，岂能受人胁迫！}
  董卓: {image: 03_素材/人物立绘/dong_zhuo.png, title: 前将军, role: 西凉军阀, faction: 董卓, voice: 五十岁左右的西凉军阀，男声，嗓音粗哑洪亮，蛮横凶悍，说话像吼, voice_sample: 谁敢不从？我手里的刀可不认人！}
