people:
  何进: {image: 03_素材/人物立绘/he_jin.png, title: 大将军, role: 召外兵, faction: 汉室}
  何太后: {image: 03_素材/人物立绘/he_taihou.png, title: 皇太后, role: 临朝称制, faction: 汉室}
  刘辩: {image: 03_素材/人物立绘/liu_bian.png, title: 少帝, role: 十四岁即位, faction: 汉室}
  刘协: {image: 03_素材/人物立绘/liu_xie.png, title: 陈留王, role: 灵帝次子, faction: 汉室}
  张让: {image: 03_素材/人物立绘/zhang_rang.png, title: 中常侍, role: 十常侍之首, faction: 宦官}
  袁绍: {image: 03_素材/人物立绘/yuan_shao.png, title: 司隶校尉, role: 劝诛宦官, faction: 袁绍}
  董卓: {image: 03_素材/人物立绘/dong_zhuo.png, title: 前将军, role: 西凉军阀, faction: 董卓}
  吕布: {image: 03_素材/人物立绘/lv_bu.png, title: 丁原部将, role: 杀丁原, faction: 董卓}
