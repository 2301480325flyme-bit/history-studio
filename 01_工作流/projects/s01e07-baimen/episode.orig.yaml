  big: [是儿, 最叵信者]
  hero: 吕布
  at: 20
  summary: |
    吕布趁刘备出征偷了下邳，又在小沛营门一箭"辕门射戟"替刘备解围；曹操在宛城纳了张济遗孀，被张绣夜袭，长子曹昂、猛将典韦战死。
    袁术在寿春称帝，后宫绫罗、军士饿死。最后曹操水淹下邳，白门楼上吕布求饶："明公将步，令布将骑"——刘备一句话，送他上了路。
  tags: [吕布, 白门楼, 辕门射戟, 典韦, 袁术称帝]
  next: 袁术之死、易京、刘备反曹

