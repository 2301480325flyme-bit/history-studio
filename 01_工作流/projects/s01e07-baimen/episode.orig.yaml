# 《三国到隋》第7集：吕布夺徐州、辕门射戟、宛城之败、袁术称帝、白门楼（196–198）
# 2026-10-11 按故事稿写成旁白。关键原文均在本地语料核过：
# "先主与术相持经月，吕布乘虚袭下邳。下邳守将曹豹反，间迎布。布虏先主妻子"（先主传）；
# 纪灵"步骑三万"、"吾为在术围中，不得不救"、"布性不喜合斗，但喜解斗"、"射戟小支"（吕布传）；
# "太祖纳济妻，绣恨之"（张绣传）；"为流矢所中，长子昂、弟子安民遇害"（武帝纪）；典韦"被数十创…瞋目大骂而死""太祖闻韦死，为流涕"（典韦传）；
# 袁术"自称仲家""后宫数百皆服绮縠…士卒冻馁，江淮间空尽，人民相食"（后汉书 / 袁术传）；陈珪劝绝婚、"女已在涂，追还绝婚，械送韩胤"（吕布传）；
# "用荀攸、郭嘉计，遂决泗、沂水以灌城"（武帝纪）；白门楼"缚太急…缚虎不得不急…明公将步，令布将骑…不见布之事丁建阳及董太师乎…是儿最叵信者"（吕布传）。

id: s01e07-baimen
title: 白门楼
series: 三国 · 第7集
year: 196

notes:
  - 主线问题：天下第一猛将吕布，为什么落得白门楼的下场？——反复无常，最后连一句求情都没人帮他说。
  - 下邳失守按先主传写"守将曹豹反"，不用演义"张飞醉酒"。辕门射戟是《三国志》实录，放进来做反差（吕布也救过刘备）。
  - 不用演义的赤兔马、貂蝉。

