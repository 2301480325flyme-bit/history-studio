publish:
  hook: 敌人替他修好了母亲的坟，自己的朝廷却派人来管住他
  big: [祖逖北伐, 王与马共天下]
  hero: 祖逖
  at: 3
  summary: |
    司马睿在建康立足，靠的是琅邪王氏：王导在朝、王敦握兵，时人说"王与马，共天下"。祖逖北伐，朝廷只给粮布不给兵器。他在谯城一带饿着肚子打仗，夜里被樊雅冲进大营，部将董昭拼死击退；石虎围谯，闻援军至而退；据祖逖传，石虎五万人救陈川也被他设奇击败。
    两军同守一座城的东西两台对峙四十天，祖逖用布袋装沙土冒充米，吓得饥饿的守军没了胆子；石勒千头驴运粮在汴水被截光。黄河以南大多收复，石勒不敢南窥，派人修祖逖母亲的坟、求通互市。321 年朝廷派戴渊来当都督，祖逖又听说王敦、刘隗交恶，忧愤成疾，九月死在雍丘，豫州百姓如丧父母。王敦从此再无顾忌。
  tags: [东晋, 祖逖, 王与马共天下, 北伐, 石勒, 王敦]
  next: 王敦之乱

