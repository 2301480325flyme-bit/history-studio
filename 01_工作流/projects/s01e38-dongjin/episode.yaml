# 快节奏版（2026-10-25）
# 《三国到隋》第38集 · 东晋：王与马共天下，祖逖北伐（317–321）。大纲第 33 条。
# 本地语料核对（晋书）：
# 王敦传 p06838"帝初镇江东，威名未著，敦与从弟导等同心翼戴，以隆中兴，时人为之语曰：王与马，共天下"；
# 祖逖传 p04824"帝嘉逖勋，使运粮给之，而道远不至，军中大饥。进据太丘。樊雅遣众夜袭逖，遂入垒，拔戟大呼，直趣逖幕…督护董昭与贼战，走之"；
#   p04825"石季龙闻而引众围谯，含又遣宣救逖，季龙闻宣至而退"；
#   p04826"川大惧，遂以众附石勒。逖率众伐川，石季龙领兵五万救川，逖设奇以击之，季龙大败…留桃豹等守川故城，住西台。逖遣将韩潜等镇东台。同一大城…相守四旬。逖以布囊盛土如米状，使千余人运上台，又令数人担米，伪为疲极而息于道，贼果逐之，皆弃担而走。贼既获米，谓逖士众丰饱，而胡戍饥久，益惧，无复胆气。石勒将刘夜堂以驴千头运粮以馈桃豹，逖遣韩潜、冯铁等追击于汴水，尽获之。豹宵遁"；
#   p04827"石勒不敢窥兵河南，使成皋县修逖母墓，因与逖书，求通使交市，逖不报书，而听互市，收利十倍…方当推锋越河，扫清冀朔，会朝廷将遣戴若思为都督，逖以若思是吴人…且已翦荆棘，收河南地，而若思雍容，一旦来统之，意甚怏怏。且闻王敦与刘隗等构隙，虑有内难，大功不遂。感激发病…俄卒于雍丘，时年五十六。豫州士女若丧考妣…王敦久怀逆乱，畏逖不敢发，至是始得肆意焉"；
# 元帝纪 p00137"夏四月，龙骧将军陈川以浚仪叛。降于石勒"；"祖逖及石勒将石季龙战于浚仪，王师败绩"（与祖逖传"季龙大败"不同，旁白按祖逖传讲、标"据祖逖传"）；p00139 太兴四年七月"以尚书戴若思为征西将军、都督司兗豫并冀雍六州诸军事、司州刺史，镇合肥"；"九月壬寅，镇西将军、豫州刺史祖逖卒"。
# 不用：中流击楫（第37集已讲）；樊雅、陈川、桃豹等人立绘（缺图，只在旁白提名）；太丘、东燕城、二台、谷水的位置（未定位）。

id: s01e38-dongjin
title: 祖逖北伐
series: 东晋 · 第38集
year: 317

notes:
  - 主线问题：祖逖把石勒打得不敢过河，为什么最后功败垂成？——北边的敌人他不怕，怕的是身后的朝廷：朝廷派人来管他，王敦和刘隗又斗得要出大乱，他忧愤病死；王敦从此再无顾忌。
  - 钩子候选：①"敌人替他修好了母亲的坟，自己的朝廷却派人来管住他"（反差3 具体3 悬念3 兑现3=12）②"一袋沙土，吓退了一城胡兵"（反差2 具体3 悬念2 兑现3=10）③"他死的那天，豫州百姓哭得像死了爹娘"（反差1 具体2 悬念2 兑现3=8）→ 选①。
  - 反差：朝廷只给粮布不给兵器；石勒修敌人母亲的坟；布袋装沙土冒充米；荆棘是他砍的，来管他的却是"慢吞吞的南方人"。
  - 细节：王与马共天下；樊雅夜里拔戟直扑帐篷；同一座城一东一西对峙四十天；千头驴运粮被截；互市获利十倍；妖星；豫州士女若丧考妣。
  - 演义对照卡：结尾卡"史书怎么写"（祖逖传：王敦久怀逆乱，畏逖不敢发，至是始得肆意焉）。

