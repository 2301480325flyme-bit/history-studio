    - scene: 樊雅夜袭祖逖营、拔戟冲幕，董昭迎战击退。
      evidence: [{quote: "樊雅遣众夜袭逖，遂入垒，拔戟大呼，直趣逖幕", para: 晋书-p04824}, {quote: "督护董昭与贼战，走之。", para: 晋书-p04824}]
