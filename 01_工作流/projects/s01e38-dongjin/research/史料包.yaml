episode: s01e38-dongjin
title: 东晋建立，祖逖北伐（317–321）
source_note: studio.py sources 对《资治通鉴》卷90–94未检出；只用本地《晋书》。引文均为 {quote, para}。
sections:
  events:
    - date: 317–318（承接第37集；月未核）
      event: 司马睿在江左延续晋统，王导居中辅政、王敦外镇；史书称当时有“王与马，共天下”之谚。本集不重复称晋王仪式。
      people: [司马睿, 王导, 王敦]
      place: 建康
      evidence:
        - {quote: "征南大将军、汉安侯王敦为大将军，右将军王导都督中外诸军事、骠骑将军", para: 晋书-p00130}
        - {quote: "时人为之语曰：“王与马，共天下。”", para: 晋书-p06838}
      second_source: 本地通鉴未命中；两处为《晋书》不同篇目。
    - date: 318（具体月未核）
      event: 祖逖在谯地争取坞主，诱谢浮杀张平；朝廷粮运不至，军中大饥，进据太丘。樊雅夜袭，董昭击退；陈川遣李头援助，祖逖克谯城。
      people: [祖逖, 谢浮, 张平, 樊雅, 董昭, 陈川, 李头]
      place: 太丘、谯城
      evidence:
        - {quote: "逖诱浮使取平，浮谲平与会，遂斩以献逖。帝嘉逖勋，使运粮给之，而道远不至，军中大饥。进据太丘。", para: 晋书-p04824}
        - {quote: "樊雅遣众夜袭逖，遂入垒，拔戟大呼，直趣逖幕", para: 晋书-p04824}
        - {quote: "督护董昭与贼战，走之。", para: 晋书-p04824}
        - {quote: "蓬陂坞主陈川，自号宁朔将军、陈留太守。逖遣使求救于川，川遣将李头率众援之，逖遂克谯城。", para: 晋书-p04824}
      second_source: 本地通鉴未命中，仅《晋书·祖逖传》。
    - date: 318（月份未核）
      event: 石季龙围谯；王含再遣桓宣援救，石季龙听说桓宣到来便退兵，桓宣留下协助祖逖讨伐未附坞堡。
      people: [祖逖, 石季龙, 王含, 桓宣]
      place: 谯城
      evidence:
        - {quote: "逖既克谯，宣等乃去。石季龙闻而引众围谯，含又遣宣救逖，季龙闻宣至而退。宣遂留，助逖讨诸屯坞未附者。", para: 晋书-p04825}
        - {quote: "石勒将石季龙围谯城，平西将军祖逖击走之。", para: 晋书-p00135}
      second_source: 《晋书》祖逖传、元帝纪互见；通鉴本地未命中。
    - date: 319（太兴二年；具体月份未核）
      event: 陈川杀有意归附祖逖的李头；李头亲党冯宠率四百人归祖逖。魏硕掠豫州，卫策在谷水截击并夺回被掠者。
      people: [祖逖, 陈川, 李头, 冯宠, 魏硕, 卫策]
      place: 谷水、豫州
      evidence:
        - {quote: "川闻而怒，遂杀头。头亲党冯宠率其属四百入归于逖，川益怒，遣将魏硕掠豫州诸郡，大获子女车马。", para: 晋书-p04826}
        - {quote: "逖遣将军卫策邀击于谷水，尽获所掠者，皆令归本，军无私焉。", para: 晋书-p04826}
      second_source: 谷水战只检出祖逖传；元帝纪另载卫策汴水战，不能作同战互证。
    - date: 319（太兴二年，四月叛降、五月交战）
      event: 陈川以浚仪叛降石勒。元帝纪称祖逖与石季龙战浚仪、晋军败绩；祖逖传则称石季龙救陈川时被祖逖设奇击败。可能是不同回合，或有史源张力。
      people: [祖逖, 陈川, 石季龙, 石勒]
      place: 浚仪
      evidence:
        - {quote: "夏四月，龙骧将军陈川以浚仪叛。降于石勒。", para: 晋书-p00137}
        - {quote: "五月癸丑，太阳陵毁，帝素服哭三日。徐杨及江西诸郡蝗。吴郡大饥。平北将军祖逖及石勒将石季龙战于浚仪，王师败绩。", para: 晋书-p00137}
        - {quote: "逖设奇以击之，季龙大败", para: 晋书-p04826}
      second_source: 《晋书》本纪与传互见；通鉴本地未命中。
    - date: 319（月份未核）
      event: 陈川被迁襄国；桃豹等留守陈川故城西台，韩潜镇东台，双方隔同一大城相持四旬。
      people: [祖逖, 陈川, 桃豹, 韩潜, 石季龙]
      place: 陈川故城、襄国
      evidence:
        - {quote: "季龙大败，收兵掠豫州，徙陈川还襄国，留桃豹等守川故城，住西台。逖遣将韩潜等镇东台。同一大城", para: 晋书-p04826}
        - {quote: "徙陈川部众五千余户于广宗。", para: 晋书-p07201}
      second_source: 载记仅互证迁徙户数，不互证东西台细节；后者单源。
    - date: 319–320（月份与先后未核）
      event: 刘夜堂率千驴为桃豹运粮，韩潜、冯铁在汴水截获；桃豹夜退东燕城。韩潜屯封丘逼近，冯铁据二台，祖逖镇雍丘并截击石勒军；濮阳五百家归附，石勒遣万骑仍被击退。
      people: [祖逖, 桃豹, 刘夜堂, 韩潜, 冯铁, 石勒]
      place: 汴水、东燕城、封丘、二台、雍丘、濮阳
      evidence:
        - {quote: "石勒将刘夜堂以驴千头运粮以馈桃豹，逖遣韩潜、冯铁等追击于汴水，尽获之。豹宵遁，退据东燕城，逖使潜进屯封丘以逼之。冯铁据二台，逖镇雍丘", para: 晋书-p04826}
        - {quote: "数遣军要截石勒，勒屯戍渐蹙。候骑常获濮阳人，逖厚待遣归。咸感逖恩德，率乡里五百家降逖。勒又遣精骑万人距逖，复为逖所破", para: 晋书-p04826}
      second_source: 未找到第二书互证；两条同出祖逖传连续叙事。
    - date: 320（太兴三年；月份未核）
      event: 卫策在汴水大破石勒别军，祖逖加镇西将军。
      people: [祖逖, 卫策, 石勒]
      place: 汴水
      evidence:
        - {quote: "祖逖部将卫策大破石勒别军于汴水。加逖为镇西将军。", para: 晋书-p00138}
        - {quote: "逖遣韩潜、冯铁等追击于汴水，尽获之。", para: 晋书-p04826}
      second_source: 《晋书》有两处汴水战叙述，但不确定是同一战；通鉴本地未命中。
    - date: 321（七月任命、九月卒）
      event: 戴若思受命镇合肥、都督六州；祖逖不满其来统，忧王敦与刘隗构隙，发病，九月卒于雍丘，年五十六。
      people: [祖逖, 戴若思, 司马睿, 王敦, 刘隗]
      place: 合肥、雍丘、汝南大木山
      evidence:
        - {quote: "甲戌，以尚书戴若思为征西将军、都督司兗豫并冀雍六州诸军事、司州刺史，镇合肥", para: 晋书-p00139}
        - {quote: "会朝廷将遣戴若思为都督，逖以若思是吴人，虽有才望，无弘致远识，且已翦荆棘，收河南地，而若思雍容，一旦来统之，意甚怏怏。且闻王敦与刘隗等构隙，虑有内难，大功不遂。感激发病", para: 晋书-p04827}
        - {quote: "九月壬寅，镇西将军、豫州刺史祖逖卒。", para: 晋书-p00139}
        - {quote: "俄卒于雍丘，时年五十六。", para: 晋书-p04827}
      second_source: 元帝纪、祖逖传互证任命和死讯。
    - date: 321年后（具体时间未核）
      event: 祖逖死后王敦“始得肆意”，祖约继领其众。石勒载记另称桃豹到蓬关、祖逖退淮南，但不能确定与祖逖死讯的先后。
      people: [祖逖, 王敦, 祖约, 桃豹]
      place: 雍丘、蓬关、淮南
      evidence:
        - {quote: "王敦久怀逆乱，畏逖不敢发，至是始得肆意焉。寻以逖弟约代领其众。", para: 晋书-p04827}
        - {quote: "桃豹至蓬关，祖逖退如淮南。", para: 晋书-p07201}
      second_source: 均为《晋书》互见，但退淮南的年份与失地范围未核。
    - date: 321背景（王敦起兵为后续）
      event: 王敦据武昌拥重兵，朝廷对其威权有戒心；“司马睿已决定削权”没有找到本集时点的直接原文。
      people: [王敦, 司马睿, 刘隗]
      place: 武昌、建康
      evidence:
        - {quote: "加大将军王敦江州牧，进骠骑将军王导开府仪同三司。", para: 晋书-p00136}
        - {quote: "初，刘隗以王敦威权太盛，终不可制，劝帝出诸心腹，以镇方隅。", para: 晋书-p03448}
        - {quote: "戊辰，大将军王敦举兵于武昌，以诛刘隗为名", para: 晋书-p00140}
      second_source: 《晋书》元帝纪、谯王承传；末条是后续起兵，不能提前到321年。
