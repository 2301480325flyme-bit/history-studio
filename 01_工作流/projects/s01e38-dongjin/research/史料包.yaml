  romance_and_debates:
    - 演义差别：祖逖北伐是正史记载；中流击楫上一集讲过，本集不重复。“王与马，共天下”是史书追记时谚，勿写成确定当场对白。
    - 史家争议：元帝纪记浚仪王师败绩；祖逖传称石季龙救援陈川被祖逖设奇击败。可能不同战次，也可能有史源张力。
    - 史家争议：祖逖传称戴若思将来统军，祖逖怏怏，又忧王敦刘隗构隙而发病；不可改写成朝廷已明令夺兵权或“气死”。
    - 北伐成果：祖逖死后王敦“始得肆意”；石勒载记另称桃豹至蓬关、祖逖退淮南，但日期和失去哪些郡县未核。
    - 《资治通鉴》卷90–94本地未检出，未伪造互证。
