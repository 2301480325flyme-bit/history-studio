  summary: |
    曹操平定关中，益州牧刘璋怕汉中不保，听了张松的话请刘备入蜀打张鲁。涪城相会，庞统劝刘备当场拿下刘璋，刘备说"初入他国，恩信未著"。一年后张松密信败露被杀，刘备斩杨怀、占涪城，掉头南下。
    雒城打了将近一年，庞统中流矢而死；张飞在江州活捉严颜——"我州但有断头将军，无有降将军"。马超来投，兵临成都。城中精兵三万、粮够一年，刘璋却说"百姓攻战三年，以璋故也"，开城出降。
  tags: [刘备入蜀, 刘璋, 庞统, 张飞, 严颜]
  next: 孙权讨荆州，张辽威震逍遥津

