# 快节奏版（2026-10-14，按抖音数据：冷开场、只讲有戏的、无背景音乐）
# 《三国到隋》第16集：刘备入蜀，夺取刘璋的益州（211–214）
# 本地语料核对：
# 先主传"璋…遣法正将四千人迎先主…正因陈益州可取之策…至涪，璋自出迎，相见甚欢。张松令法正白先主，及谋臣庞统进说，便可于会所袭璋。先主曰：此大事也，不可仓卒"；
# 庞统传"今因此会，便可执之，则将军无用兵之劳而坐定一州也。先主曰：初入他国，恩信未著，此不可也"；上中下三计（阴选精兵…径袭成都，上计；说荆州有急…执杨怀高沛…中计；退还白帝…下计）；"进围雒县，统率众攻战，为流矢所中，卒，时年三十六"；
# 黄权传"欲以部曲遇之，则不满其心，欲以宾客礼待，则一国不容二君"；刘二牧传"璋率步骑三万余人，车乘帐幔，精光耀目…欢饮百余日"；
# 先主传"先主北到葭萌，未即讨鲁，厚树恩德，以收众心"；"乃从璋求万兵及资实…璋但许兵四千…张松书与先主及法正曰：今大事垂可立，如何释此去乎！松兄广汉太守肃，惧祸逮己，白璋发其谋。于是璋收斩松…璋敕关戍诸将文书勿复关通先主。先主大怒，召璋白水军督杨怀，责以无礼，斩之…进到涪，据其城"；
# "璋复遣李严督绵竹诸军，严率众降…诸葛亮、张飞、赵云等将兵溯流定白帝、江州、江阳，惟关羽留镇荆州。先主进军围雒。时璋子循守城，被攻且一年"；
# 张飞传 严颜"我州但有断头将军，无有降将军也…斫头便斫头，何为怒邪！飞壮而释之"；马超传"超将兵径到城下。城中震怖，璋即稽首"；
# 刘二牧传"十九年，进围成都数十日，城中尚有精兵三万人，谷帛支一年，吏民咸欲死战。璋言：父子在州二十余年，无恩德以加百姓。百姓攻战三年，肌膏草野者，以璋故也，何心能安！遂开城出降，群下莫不流涕"。
# 不用：王累"自倒悬于州门以谏"（本地语料未收，未核对）；张松献图、落凤坡（演义）。

id: s01e16-rushu
title: 刘备入蜀
series: 三国 · 第16集
year: 211

notes:
  - 主线问题：刘璋请刘备来帮忙，怎么把整个益州都请丢了？——请来的是枭雄，内应就在自己身边，而他自己，最后不忍心再打。
  - 反差：庞统劝刘备在酒席上当场抓人，刘备不肯；一年后，刘备还是翻了脸。城里有精兵三万、粮够一年，刘璋却开城投降。
  - 细节：欢饮一百多天；张松的信被亲哥哥告发；庞统三条计；严颜"只有断头将军"；刘璋出降时部下都哭了。
  - 动机：张松、法正嫌刘璋不成器，想换主人（先主传"正因陈益州可取之策"）；刘璋怕曹操取汉中后打益州。
  - 演义对照：张松献西川地图、庞统死在落凤坡都是小说；史书只说庞统在雒城攻城中流矢而死。

