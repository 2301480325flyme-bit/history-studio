beats:
  # ---------------- 冷开场 ----------------
  - say: 酒席对面，坐着请刘备来帮忙的人。庞统却凑过来说：
    map: '211-10'
    year: 211
    phase: 酒席
    scene: 宴席
    sources: [sgz-37, sgz-32]
    show:
      - sfx: 重拍转场

  - say: 就趁这次见面，当场把刘璋拿下！一兵不用，整个益州就是您的！
    speaker: 庞统
    style: 压低声音，急切献策，眼神锐利
    scene: 宴席
    to: 刘备
    sources: [sgz-37]

  - say: 刚到人家的地方，恩信还没立住，这事不能干。
    speaker: 刘备
    style: 温和而坚定，摇头拒绝，沉得住气
    scene: 宴席
    to: 庞统
    sources: [sgz-37]

  - say: 请刘备来的，正是刘璋自己。可三年后，整个益州都成了刘备的。
    sources: [sgz-31]
    camera: {focus: [成都, 涪, 江陵], zoom: fit, move: 1.6}
    show:
      - versus: {left: 刘备, right: 刘璋, label: 请客, cue: 刘璋, for: 4}

  # ---------------- 第一章 请客 ----------------
  - say: 曹操拿下关中，下一个就是汉中的张鲁。汉中一丢，益州的大门就开了。
    phase: 请客
    sources: [sgz-31]
    camera: {focus: [长安, 南郑, 成都], zoom: fit, move: 1.6}
    show:
      - title_bar: {text: 刘备入蜀, sub: 三国 · 第16集, for: 3.2}
      - sfx: 片头鼓
      - arrow: {from: 长安, to: 南郑, kind: direction, faction: 曹操, cue: 汉中, grow: 1.4}

  - say: 别驾张松劝刘璋：请刘备来，替咱们打张鲁。
    sources: [sgz-32]
    show:
      - enter: {who: 张松, side: left, cue: 张松, for: 3}
      - enter: {who: 刘璋, at: 成都, side: right, cue: 刘璋, settle: true, settle_sub: 益州牧}

  - say: 主簿黄权拼命拦：把刘备当部下，他不甘心；当客人，一个国家容不下两个主人。
    sources: [sgz-43]
    show:
      - quote: {text: 一国不容二君, source: 三国志·黄权传, era: 建安十六年, cue: 两个主人, for: 4}
      - enter: {who: 黄权, side: left, cue: 黄权, for: 4}

  - say: 刘璋不听，派法正带着四千人，去荆州接刘备。
    sources: [sgz-32]
    camera: {focus: [成都, 江州, 公安], zoom: fit, move: 1.6}
    show:
      - act: {act: courier, places: [成都, 公安], text: 法正迎先主, cue: 接刘备, grow: 2.0, for: 3.4}

  - say: 可法正一见刘备，就把怎么拿下益州，全说了。
    sources: [sgz-32]
    show:
      - enter: {who: 法正, side: left, cue: 法正, for: 3.4}

  - say: 刘备留下诸葛亮、关羽守荆州，自己带着几万步兵入蜀。
    sources: [sgz-32]
    show:
      - march: {from: 公安, to: 江州, faction: 刘备, label: 入蜀, cue: 入蜀, grow: 2.0}
      - march: {from: 江州, to: 涪, faction: 刘备, cue: 入蜀, delay: 1.6, grow: 1.6}
      - sfx: {name: 低音转场, delay: -0.3}

  - say: 刘璋带着三万步骑到涪城迎接，车马帐幕闪闪发光，两边一喝就是一百多天。
    sources: [sgz-31]
    camera: {focus: [涪, 成都], zoom: 6, move: 1.2}
    show:
      - flag: {at: 涪, name: 刘璋 · 刘备, sub: 涪城相会, faction: 刘璋, cue: 涪城}
      - card: {title: 欢饮百余日, body: 车乘帐幔，精光耀目, cue: 一百多天}

  # ---------------- 第二章 翻脸 ----------------
  - say: 酒喝完了，刘备北上葭萌，却不急着打张鲁，到处施恩，收买人心。
    phase: 翻脸
    sources: [sgz-32]
    camera: {focus: [涪, 葭萌, 南郑], zoom: fit, move: 1.4}
    show:
      - march: {from: 涪, to: 葭萌, faction: 刘备, label: 厚树恩德, cue: 葭萌, grow: 1.6}

  - say: 一年后，曹操南下打孙权。刘备借口回救，向刘璋要一万兵。刘璋只给了四千。
    year: 212
    sources: [sgz-32]
    camera: {focus: [葭萌, 成都, 濡须], zoom: fit, move: 1.6}
    show:
      - arrow: {from: 长安, to: 濡须, kind: direction, faction: 曹操, cue: 打孙权, grow: 1.6}

  - say: 张松急了，写信给刘备：大事眼看就成，怎么能走！
    sources: [sgz-32]
    show:
      - act: {act: courier, places: [成都, 葭萌], text: 张松密书, cue: 写信, grow: 1.2, for: 3}

  - say: 信被他亲哥哥张肃告发。刘璋杀了张松，下令各个关口，不许再和刘备来往。
    sources: [sgz-32]
    show:
      - exit: {who: 张松, at: 成都, verb: 斩, cue: 杀了张松}

  - say: 庞统给刘备出了三条计：
    scene: 军帐
    sources: [sgz-37]
    show:
      - enter: {who: 庞统, side: left, cue: 庞统, for: 2.4}

  - say: 上计，挑精兵日夜赶路，直扑成都；中计，假装回荆州，骗守关的杨怀、高沛来送行，趁机拿下；下计，退回白帝。
    speaker: 庞统
    style: 条理分明，语速快，一口气说完
    scene: 军帐
    to: 刘备
    sources: [sgz-37]
    show:
      - card: {title: 庞统三计, body: 上计 · 径袭成都；中计 · 诱执杨怀高沛；下计 · 退还白帝, for: 8}

  - say: 刘备选了中计。斩了白水军督杨怀，掉头南下，占了涪城。
    map: '212-12'
    owners_cue: 涪城
    sources: [sgz-32]
    camera: {focus: [白水关, 葭萌, 涪], zoom: fit, move: 1.4}
    show:
      - battle: {at: 白水关, text: 斩杨怀, cue: 斩了}
      - march: {from: 葭萌, to: 涪, faction: 刘备, label: 还攻刘璋, cue: 南下, grow: 1.8}
      - sfx: {name: 疆域易手, cue: 涪城}

  # ---------------- 第三章 雒城 ----------------
  - say: 刘璋派兵来挡，接连被打败；守绵竹的李严，干脆投降了。
    phase: 雒城
    year: 213
    sources: [sgz-32]
    camera: {focus: [涪, 雒, 成都], zoom: 6, move: 1.2}

  - say: 可到了雒城，刘璋的儿子刘循死守，一打就是将近一年。
    sources: [sgz-32]
    show:
      - battle: {at: 雒, text: 被攻且一年, cue: 雒城}
      - sfx: {name: 古风擂鼓, cue: 死守}

  - say: 攻城的时候，庞统被流箭射中，死时只有三十六岁。
    sources: [sgz-37]
    show:
      - exit: {who: 庞统, at: 雒, verb: 卒, portrait: true, cue: 流箭}
      - sfx: {name: 中箭, cue: 流箭}

  - say: 刘备只好调兵。诸葛亮、张飞、赵云从荆州逆江而上，只留关羽守荆州。
    year: 214
    sources: [sgz-32]
    camera: {focus: [江陵, 白帝, 江州], zoom: fit, move: 1.6}
    show:
      - march: {from: 江陵, to: 白帝, faction: 刘备, label: 溯江入蜀, cue: 逆江而上, grow: 1.8}
      - march: {from: 白帝, to: 江州, faction: 刘备, delay: 1.8, grow: 1.4}

  - say: 张飞在江州活捉了巴郡太守严颜，喝问他：为什么不投降？
    map: '214-04'
    owners_cue: 活捉
    sources: [sgz-36]
    camera: {focus: 江州, zoom: 8, move: 1.2}
    show:
      - enter: {who: 张飞, side: left, cue: 张飞, for: 3.6}
      - battle: {at: 江州, text: 生获严颜, cue: 活捉}

  - say: 严颜说：我们益州，只有断头的将军，没有投降的将军！
    sources: [sgz-36]
    show:
      - quote: {text: 我州但有断头将军，无有降将军也, source: 三国志·张飞传, era: 建安十九年, for: 5}
      - enter: {who: 严颜, side: right, cue: 严颜, for: 4.4}

  - say: 张飞大怒，要砍他的头。严颜面不改色：砍就砍，发什么火！张飞服了，放了他。
    sources: [sgz-36]
    show:
      - vignette: {image: illus_yanyan_unbowed, cue: 大怒, for: 5.5, text: 断头将军}

  # ---------------- 第四章 出降 ----------------
  - say: 雒城终于攻破，刘备围住了成都。逃到汉中的马超，也写信来投奔。
    phase: 出降
    sources: [sgz-32, sgz-36]
    camera: {focus: [雒, 成都, 南郑], zoom: fit, move: 1.4}
    show:
      - march: {from: 雒, to: 成都, faction: 刘备, label: 围成都, cue: 围住, grow: 1.2}
      - enter: {who: 马超, side: right, cue: 马超, for: 3}

  - say: 马超带兵直接开到成都城下，城里一片惊恐。
    sources: [sgz-36]
    show:
      - march: {from: 南郑, to: 成都, faction: 刘备, label: 马超来投, cue: 城下, grow: 2.0}

  - say: 可城里还有三万精兵，粮食够吃一年，官吏百姓都愿意死战。刘璋却说：
    sources: [sgz-31]
    camera: {focus: 成都, zoom: 6, move: 1.2}

  - say: 我们父子在益州二十多年，没给百姓什么恩德。百姓打了三年仗，尸骨扔在野外，都是因为我。我怎么能安心！
    speaker: 刘璋
    style: 哽咽愧疚，疲惫无奈，缓缓说出
    scene: 朝堂
    sources: [sgz-31]

  - say: 他打开城门投降。部下没有一个不流泪。
    map: '214-06'
    owners_cue: 投降
    sources: [sgz-31]
    camera: {focus: [成都, 江州, 江陵], zoom: fit, move: 1.6}
    show:
      - defect: {who: 刘璋, at: 成都, to: 刘备, from: 刘璋, verb: 降, cue: 投降}
      - sfx: {name: 疆域易手, cue: 投降}
      - headline: {text: 刘备得益州, sub: 建安十九年, cue: 投降, for: 3.2}

  - say: 刘璋是怎么把益州请丢的？请来的是枭雄，内应就在身边，而他自己，不忍心再打下去。
    sources: [sgz-31, sgz-32]
    show:
      - card: {title: 演义 vs 正史, body: 张松献图、庞统死于落凤坡都是小说；史书里庞统死于攻雒城, cue: 枭雄}

  - say: 隆中对里那一步，跨有荆州、益州，刘备做到了。
    sources: [sgz-32]

  - say: 刘璋开城投降，你觉得是软弱，还是仁厚？
    sources: [sgz-31]

  - say: 可刘备刚坐稳成都，孙权的使者就到了：荆州，该还了吧？
    sources: [sgz-32]
    map: '214-10'
    camera: {focus: [成都, 江陵, 柴桑], zoom: fit, move: 1.6}
