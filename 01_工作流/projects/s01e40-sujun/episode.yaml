  big: [苏峻之乱, 宁山头望廷尉]
  hero: 苏峻
  at: 3
  summary: |
    平王敦有功的历阳太守苏峻，手握锐卒万人、收留亡命。晋明帝死后，年幼的晋成帝即位，舅舅庾亮执政，下诏调苏峻进京夺他兵权，苏峻求补一个荒郡也不准，说出"我宁山头望廷尉，不能廷尉望山头"。327 年十一月他联合祖约起兵讨庾亮，次年正月乘风渡横江、登牛渚，二月因风放火攻陷台城，庾亮逃往寻阳，王导守着小皇帝，宫中只剩几石烧剩的米，百官被驱赶着挑担上蒋山。
    庾亮与温峤推荆州陶侃为盟主；陶侃本恨庾亮，笑他"修石头城防我，今天倒来求我"，见他吃薤白留根说"可以种"，转而称叹。五月联军会于石头。九月苏峻见部将得胜，喊"我更不如乎"，率数骑冲阵，在白木陂被彭世、李千投矛刺下马斩首。329 年二月石头城破，叛乱平定。
  tags: [东晋, 苏峻之乱, 庾亮, 陶侃, 温峤, 宁山头望廷尉]
  next: 前赵后赵争霸

