# 快节奏版（2026-10-25）
# 《三国到隋》第40集 · 东晋：苏峻之乱（327–329）。大纲第 34 条后半（王敦之乱在第 39 集）。
# 史料包：projects/s01e39-wangdun/research/史料包.yaml（322–329 两乱合编）。
# 本地语料核对（晋书）：
# 苏峻传 p07004"有锐卒万人，器械甚精…抚纳亡命，得罪之家有逃死者，峻辄蔽匿之"；p07005"乞补青州界一荒郡…复不许…峻曰：台下云我欲反，岂得活邪！我宁山头望廷尉，不能廷尉望山头"；"遣参军徐会结祖约…以讨亮为名…峻自率涣、柳众万人，乘风济自横江…遂据蒋陵覆舟山，率众因风放火，台省及诸营寺署一时荡尽。遂陷宫城，纵兵大掠…驱役百官…逼令担负登蒋山"；
#   p07006"峻望见胤走，曰：孝能破贼，我更不如乎！因舍其众，与数骑北下突阵，不得入，将回趋白木陂，牙门彭世、李千等投之以矛，坠马，斩首"；
# 成帝纪 p00154"十一月，豫州刺史祖约、历阳太守苏峻等反"；p00155"丁未，峻济自横江，登牛渚。二月庚戌，峻至于蒋山…丙辰，峻攻青溪栅，因风纵火…庾亮又败于宣阳门内，遂携其诸弟…奔寻阳。于是司徒王导…卫帝于太极殿…是时太官唯有烧余米数石，以供御膳"；
# 庾亮传 p05330"亮携其三弟…南奔温峤…乃与峤推陶侃为盟主。侃至寻阳，既有憾于亮…亮甚惧，及见侃，引咎自责…乃谓亮曰：君侯修石头以拟老子，今日反见求耶！便谈宴终日。亮啖薤，因留白。侃问曰：安用此为？亮云：故可以种。侃于是尤相称叹"；
# 陶侃传 p04997"五月，与温峤、庾亮等俱会石头"。
# 不用："戎卒四万，旌旗七百余里"（只见资治通鉴，本地未收；旁白不说具体人数）；成帝即位的确切年龄（本地未检到，旁白只说"年幼"）；苏硕发庾亮父母墓（过于残酷，不进旁白）。

id: s01e40-sujun
title: 苏峻之乱
series: 东晋 · 第40集
year: 327

notes:
  - 主线问题：苏峻平王敦有功，为什么三年后自己打进了建康？——执政的庾亮不信他，硬要调他进京夺兵权，连换个荒郡都不准，把他逼到"宁山头望廷尉"的绝路；平乱又靠庾亮去求一向怨他的陶侃。
  - 钩子候选：①"朝廷一纸调令，把平叛的功臣逼成了反贼"（反差3 具体2 悬念3 兑现3=11）②"宁可在山头看法官，也不在牢里看山头"（反差2 具体3 悬念2 兑现3=10）③"宫里只剩几石烧剩的米，给小皇帝做饭"（反差2 具体3 悬念2 兑现3=10）→ 选①。
  - 反差：功臣变反贼；逃走的是执政的舅舅，守着小皇帝的是王导；陶侃恨庾亮，却被一根薤白说服；苏峻嫌部下抢了功，亲自冲阵送了命。
  - 细节：锐卒万人、收留亡命；乞补荒郡不准；宁山头望廷尉；乘风渡横江；因风放火；烧剩的米；百官挑担上蒋山；修石头城防我；薤白留根；"我难道不如他"；投矛坠马。
  - 演义对照卡：结尾卡"史书怎么写"（苏峻传：我宁山头望廷尉，不能廷尉望山头）。

