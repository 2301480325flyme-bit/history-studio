beats:
  - say: 中平六年，天下名义上还是大汉的，只有京城落在了董卓手里。
    year: 189
    sources: [sgz-01]
    owners: {汉室: [冀州, 青州, 幽州, 并州, 兖州, 豫州, 徐州, 扬州, 荆州, 益州, 凉州, 交州], 董卓: [司隶]}

  - say: 可是短短十一年后，同一张地图，已经被群雄瓜分得七零八落。
    sources: [sgz-01]
    owners:
      袁绍: [冀州, 青州, 幽州, 并州]
      曹操: [兖州, 豫州, 徐州, 司隶, 九江郡]
      孙策: [扬州]
      刘表: [荆州]
      刘璋: [益州]
      张鲁: [汉中郡]
      马腾韩遂: [凉州]
      士燮: [交州]
    uncertain: [凉州, 交州, 司隶]
    show:
      - yearshift: {to: 200, cue: 十一年后, ghost: 6}

  - say: 北方袁绍、曹操两强对峙，一场决定天下的大战，即将在官渡打响。
    sources: [sgz-01]
