# 演示：复合动作 4 · 年份变化，地图保留记忆（yearshift）
id: zz-yearshift
title: 组件演示 · 十一年天下巨变
series: History Studio 复合动作
year: 189

notes:
  - 200 年格局按州郡大势示意：袁绍据冀青幽并，曹操据兖豫徐与淮南，孙策据江东，刘表荆州，刘璋益州，张鲁汉中；凉州马腾、韩遂与交州士燮控制范围不稳，画斜纹。
  - 司隶名义上属朝廷（曹操挟天子），关中诸将各自为政，画为曹操斜纹示意。

