  - say: 石虎知道后，废了太子，当天夜里，把他一家二十六口全杀了，埋进同一口棺材。
    sources: [js-106]
    show:
      - act: {act: execute, at: 邺, text: 杀太子邃, cue: 全杀了, for: 2.8}
      - quote: {text: 杀邃及妻张氏并男女二十六人，同埋于一棺之中, source: 晋书·石季龙载记上, cue: 同一口棺材, for: 4}

  # ---------------- 第五章 桓温 ----------------
  - say: 同一时期，南边东晋出了个狠角色，荆州的桓温。
    year: 346
    phase: 灭蜀
    sources: [js-98]
    camera: {focus: [江陵, 成都, 建康], zoom: fit, move: 1.4}
    show:
      - enter: {who: 桓温, side: right, cue: 桓温, for: 3.6}

  - say: 三四六年冬，他上了奏表，不等朝廷回复，就带兵逆长江而上，去打成都的成汉。
    sources: [js-08, js-98]
    tells: [e06, e07]
    show:
      - quote: {text: 伐蜀，拜表辄行, source: 晋书·穆帝纪, cue: 不等朝廷, for: 3.4}
      - army: {head: 桓温, from: 江陵, via: [鱼复], to: 彭模, faction: 晋, banner: 桓, troops: infantry, size: 3.0, cue: 逆长江而上, grow: 2.4}

  - say: 朝廷都替他捏把汗：蜀道万里，他兵又少。
    sources: [js-98]
    show:
      - quote: {text: 朝廷以蜀险远而温兵寡少，深入敌场，甚以为忧, source: 晋书·桓温传, cue: 捏把汗, for: 4}

  - say: 到了彭模，有人主张分兵两路。参军袁乔不同意：深入万里，只有拼死一战。
    sources: [js-83]
    camera: {focus: [彭模, 成都], zoom: 9, move: 1.2}
    show:
      - enter: {who: 袁乔, side: right, cue: 袁乔, for: 3.4}

  - say: 扔掉锅，只带三天口粮，全军一起上！
    sources: [js-83]
    tells: [e08, e09]
    show:
      - vignette: {image: illus_fuzeng, cue: 扔掉锅, for: 5, text: 弃去釜甑，赍三日粮}
      - battle: {at: 彭模, text: 三战三捷, cue: 全军一起上}

  - say: 三四七年春，晋军打到成都城外的笮桥，前锋打输了，眼看要撤。
    year: 347
    sources: [js-83, js-98]
    tells: [e10]
    show:
      - army: {head: 桓温, from: 彭模, to: 成都, faction: 晋, banner: 桓, troops: infantry, size: 3.0, cue: 笮桥, grow: 1.4, stop: approach}
      - battle: {at: 成都, text: 前锋失利, cue: 打输了}

  - say: 慌乱中，鼓手敲错了，敲成了进军鼓。晋军一听，掉头就冲，成汉军反而大溃。
    sources: [js-98]
    tells: [e11]
    show:
      - vignette: {image: illus_wrong_drum, cue: 敲错了, for: 5, text: 鼓吏误鸣进鼓}
      - battle: {at: 成都, text: 势众大溃, cue: 大溃}
      - sfx: {name: 战鼓, cue: 进军鼓}

  - say: 成汉皇帝李势连夜逃走，后来绑着自己，抬着棺材来投降。成汉，亡了。
    map: '347-03'
    owners_cue: 亡了
    sources: [js-08, js-98]
    tells: [e24, e25]
    show:
      - enter: {who: 李势, side: left, cue: 李势, for: 3}
      - march: {from: 成都, to: 葭萌, faction: 成汉, label: 夜遁九十里, cue: 连夜逃走, grow: 1.4}
      - quote: {text: 面缚舆榇请命, source: 晋书·桓温传, cue: 抬着棺材, for: 3.6}
      - sfx: {name: 落幕锣, cue: 亡了}

  - say: 桓温这一仗，一战成名。
    sources: [js-98]
    camera: {focus: [成都, 江陵, 建康], zoom: fit, move: 1.4}
    show:
      - headline: {text: 桓温灭成汉, sub: 益州平, cue: 一战成名, for: 3.2}

  # ---------------- 第六章 石宣 ----------------
  - say: 再回到邺城。新太子石宣，又和弟弟石韬争宠。
    phase: 父子
    sources: [js-107]
    camera: {focus: [长安, 邺, 棘城], zoom: fit, move: 1.4}
    show:
      - versus: {left: 石宣, right: 石韬, label: 争宠, cue: 争宠, for: 3.6}

  - say: 石韬盖了座殿，大梁九丈长。石宣看了大怒，砍了工匠，截断大梁。
    sources: [js-107]
    show:
      - card: {title: 兄弟斗气, body: 梁长九丈。宣视而大怒，斩匠，截梁而去。韬怒，增之十丈, cue: 截断大梁, for: 5}

  - say: 石韬一赌气，加长到十丈。
    sources: [js-107]

  - say: 三四八年，石宣派人杀了石韬，还打算趁父亲来吊丧，连父亲一起干掉。
    year: 348
    sources: [js-107]
    show:
      - quote: {text: 韬既死，主上必亲临丧，因行大事, source: 晋书·石季龙载记下, cue: 吊丧, for: 4}
      - exit: {who: 石韬, at: 邺, verb: 诛, portrait: true, cue: 杀了石韬}

  - say: 石虎查了出来，在邺城北边堆起柴堆，把石宣活活烧死。
    sources: [js-107]
    show:
      - fire: {at: 邺, cue: 烧死, radius: 0.6, for: 3.4}
      - act: {act: execute, at: 邺, text: 焚石宣, cue: 柴堆, for: 2.8}

  - say: 石宣的小儿子才几岁，石虎最疼他，抱着直哭，想饶了他。大臣不答应，孩子被从他怀里拖走杀了。
    sources: [js-107]
    show:
      - vignette: {image: illus_feierzui, cue: 小儿子, for: 6, text: 儿曰：非儿罪}

  - say: 石虎从此一病不起。
    sources: [js-107]
    show:
      - sfx: {name: 退场钟, cue: 一病不起}

  # ---------------- 收 ----------------
  - say: 三四九年正月，石虎终于称了皇帝。四个月后，病死在邺城。
    year: 349
    sources: [js-08]
    camera: {focus: [长安, 邺, 棘城], zoom: fit, move: 1.4}
    show:
      - act: {act: enthrone, who: 石虎, at: 邺, text: 即皇帝位, sub: 太宁元年, cue: 称了皇帝, for: 3}
      - exit: {who: 石虎, at: 邺, verb: 卒, portrait: true, cue: 病死}

  - say: 石虎为什么家破人亡？他抢了石勒儿子的位子，他的儿子们，也学着抢他的。
    sources: [js-106]
    show:
      - headline: {text: 石虎暴政, sub: 父子相残, cue: 学着抢, for: 3.6}
      - sfx: {name: 史诗冲击, cue: 学着抢}

  - say: 鼓手敲错一下鼓，灭了一个国。你觉得，这是运气，还是成汉本来就撑不住了？
    sources: [js-98]
    show:
      - card: {title: 史书怎么写, body: 桓温传：鼓吏误鸣进鼓，于是攻之，势众大溃, cue: 运气, for: 4}

  - say: 石虎一死，后赵乱成一锅粥。他的一个养孙，要出手了。
    sources: [js-107]
    show:
      - title_bar: {text: 下集, sub: 十六国 · 冉闵, cue: 出手, delay: 0.4, for: 3.0}
      - sfx: {name: 时代转折, cue: 出手}
