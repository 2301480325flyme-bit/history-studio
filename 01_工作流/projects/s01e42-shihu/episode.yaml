  # ---------------- 第一章 篡位 ----------------
  - say: 先说三三三年。石勒病死，儿子石弘即位。
    year: 333
    phase: 篡位
    sources: [js-07]
    camera: {focus: [襄国, 邺], zoom: 6, move: 1.4}
    show:
      - title_bar: {text: 石虎暴政, sub: 十六国 · 第42集, for: 3.2}
      - sfx: 片头鼓
      - exit: {who: 石勒, at: 襄国, verb: 卒, portrait: true, cue: 病死}
      - enter: {who: 石弘, side: left, cue: 石弘, for: 2.8}

  - say: 石勒的侄子石虎，早就憋着一肚子火：
    sources: [js-106]
    show:
      - enter: {who: 石虎, side: right, cue: 石虎, for: 3}

  - say: 这赵国江山，是我拼了二十多年打下来的！凭什么交给那个黄毛小儿！
    speaker: 石虎
    style: 咬牙切齿，满腹怨恨，压低嗓子对儿子发狠
    quote: 成大赵之业者我也…而授黄吻婢儿
    sources: [js-106]
    show:
      - enter: {who: 石虎, side: right, cue: 这赵国江山, for: 5}
      - quote: {text: 成大赵之业者我也，而授黄吻婢儿, source: 晋书·石季龙载记上, cue: 黄毛小儿, for: 3.6}

  - say: 石勒一死，他就把持了朝政。第二年，废了石弘，关起来杀了。
    year: 334
    sources: [js-07, js-106]
    show:
      - act: {act: execute, at: 襄国, text: 废弘自立, cue: 废了石弘, for: 3}

  - say: 他不称皇帝，自称居摄赵天王，又把都城从襄国搬到了邺城。
    year: 335
    sources: [js-106]
    camera: {focus: [襄国, 邺], zoom: 8, move: 1.2}
    show:
      - act: {act: enthrone, who: 石虎, at: 邺, text: 居摄赵天王, sub: 建武元年, cue: 赵天王, for: 3}
      - march: {from: 襄国, to: 邺, faction: 后赵, label: 迁都于邺, cue: 邺城, grow: 1.2}

  # ---------------- 第二章 暴政 ----------------
  - say: 他在邺城、襄国大修宫殿，光一座太武殿，台基就有两丈八尺高。
    phase: 暴政
    sources: [js-106]
    camera: {focus: [长安, 邺, 棘城], zoom: fit, move: 1.4}
    show:
      - act: {act: prop, at: 邺, item: 宫殿, text: 太武殿基高二丈八尺, cue: 太武殿, for: 3.6}

  - say: 为了打仗，他一次征发五十万人，造船一万艘，从黄河一直运粮到海边。
    sources: [js-106]
    show:
      - quote: {text: 合鄴城旧军满五十万，具船万艘，自河通海, source: 晋书·石季龙载记上, cue: 五十万人, for: 4}

  # ---------------- 第三章 棘城 ----------------
  - say: 他要打的，是东北的慕容皝。三三七年，慕容皝在棘城自称燕王。
    year: 337
    map: '337-11'
    owners_cue: 自称燕王
    phase: 棘城
    sources: [js-07, js-109]
    camera: {focus: [邺, 棘城], zoom: fit, move: 1.4}
    show:
      - enter: {who: 慕容皝, side: right, cue: 慕容皝, for: 3.4}
      - spot: {at: 棘城, text: 慕容皝自立为燕王, cue: 燕王, for: 3.4}

  - say: 第二年，石虎带着几十万大军北上，过令支，一直杀到棘城下。
    year: 338
    sources: [js-109]
    tells: [e01, e02]
    show:
      - army: {head: 石虎, from: 邺, via: [令支], to: 棘城, faction: 后赵, banner: 虎, troops: infantry, size: 3.6, cue: 北上, grow: 2.2, stop: approach}
