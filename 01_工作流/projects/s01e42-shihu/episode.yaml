publish:
  hook: 他先后杀了两个太子。杀第二个那天，孙子扯着他的衣服喊：不是我的错
  big: [石虎暴政, 桓温灭成汉]
  hero: 石虎
  at: 3
  summary: |
    333 年石勒死，儿子石弘即位。石虎早就不服："成大赵之业者我也"，却给了"黄吻婢儿"。他把持朝政，次年废杀石弘，自称居摄赵天王，迁都邺城，大修宫殿、征发五十万人造船运粮。338 年他率数十万大军攻慕容皝的棘城，围了十几天，慕容恪率两千骑晨出，后赵军以为四面都是敌兵，弃甲而逃。
    家里更乱：太子石邃扬言要杀弟弟石宣，被石虎一夜杀了全家二十六口；新太子石宣又杀了弟弟石韬，348 年被石虎烧死，连几岁的孙子也没保住，孩子扯着他的衣服喊"非儿罪"。石虎从此病倒，349 年称帝，四个月后病死。
    同一时期，东晋荆州的桓温 346 年冬上表就出兵伐蜀，在彭模听袁乔"弃去釜甑，赍三日粮"全军直进，347 年笮桥之战前锋失利，鼓手误敲进军鼓，晋军反攻大胜，李势出降，成汉亡。
  tags: [十六国, 后赵, 石虎, 慕容皝, 慕容恪, 棘城之战, 桓温, 灭成汉, 笮桥之战]
  next: 冉闵

