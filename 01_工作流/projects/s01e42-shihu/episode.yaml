# 快节奏版（2026-10-25）
# 《三国到隋》第42集 · 十六国：石虎暴政，桓温灭成汉（333–349）。大纲第 36 条。
# 史料包：projects/s01e42-shihu/research/史料包.yaml（Codex）；战事账：战事.yaml。
# 本地语料核对（晋书）：
# 石季龙载记上 p07282"季龙自以勋高一时，谓勒即位之后，大单于必在己，而更以授其子弘，季龙深恨之，私谓其子邃曰：主上自都襄国以来，端拱指授，而以吾躬当矢石二十余年…成大赵之业者我也。大单于之望实在于我，而授黄吻婢儿，每一忆此，令人不复能寝食"；
#   p07283"咸康元年，季龙废勒子弘…且可称居摄赵天王"；成帝纪 p00671"十一月废弘自立，遂幽杀之"；
#   p07299"于襄国起太武殿，于鄴造东西宫…太武殿基高二丈八尺"；p07319"合鄴城旧军满五十万，具船万艘，自河通海"；
#   p07304 石邃"我欲至冀州杀石宣，有不从者斩…季龙大怒，废邃为庶人，其夜杀邃及妻张氏并男女二十六人，同埋于一棺之中"；
#   p07360 宣光殿"梁长九丈。宣视而大怒，斩匠，截梁而去。韬怒，增之十丈"；"韬既死，主上必亲临丧，因行大事"；
#   p07361"积柴邺北…送宣于标所…四面纵火…宣小子年数岁，季龙甚爱之，抱之而泣。儿曰：非儿罪。季龙欲赦之，其大臣不听，遂于抱中取而戮之，儿犹挽季龙衣而大叫…季龙因此发病"；
# 慕容皝载记 p07437"季龙进入令支…至于棘城，戎卒数十万…相持旬余…遣子恪等率骑二千，晨出击之。季龙诸军惊扰，弃甲而遁"；石季龙载记 p07307"诸门皆若有师出者，四面如云，季龙大惊，弃甲而遁"；成帝纪 p00164"慕容皝自立为燕王"；
# 穆帝纪 p00179"桓温帅征虏将军周抚…伐蜀，拜表辄行"；袁乔传 p05968"今溯流万里，经历天险…师次彭模…不如全军而进，弃去釜甑，赍三日粮…去成都十里，与贼大战，前锋失利，乔军亦退，矢及马首…乔因麾而进"；
#   桓温传 p06880"势于是悉众与温战于笮桥，参军龚护战没，众惧欲退，而鼓吏误鸣进鼓，于是攻之，势众大溃…势遂夜遁九十里，至晋寿葭萌城…面缚舆榇请命"；穆帝纪 p00180"丁亥，李势降，益州平"；p00182"石季龙僭即皇帝位于鄴…石季龙死"。
# 不用：石宣受刑细节（拔发抽舌、斫眼溃腹，过于残酷；旁白只说"烧死"）；石邃杀人煮食（同上）；棘城"斩获三万余级"（载记战果可能夸大）。

id: s01e42-shihu
title: 石虎暴政
series: 十六国 · 第42集
year: 338

notes:
  - 主线问题：石虎抢了石勒儿子的江山，为什么他自己的家，一代都没撑住？——他抢侄子的位，儿子们也学着抢他的；同一时期东晋桓温一战灭了成汉，北方大乱的种子已经埋下。
  - 钩子候选：①"他先后杀了两个太子。杀第二个那天，孙子扯着他的衣服喊：不是我的错"（反差3 具体3 悬念3 兑现3=12）②"鼓手敲错了一下鼓，灭了一个国"（反差3 具体3 悬念2 兑现3=11）→ 选①，②留作第五章高潮。
  - 反差：江山是我打的却给了黄毛小儿；不称皇帝称天王；几十万人被两千骑吓跑；太子要杀弟弟、弟弟被哥哥杀；敲错鼓反而大胜。
  - 细节：黄吻婢儿；居摄赵天王；太武殿基高二丈八尺；五十万人、船万艘；晨出二千骑、四面如云、弃甲而遁；二十六人同埋一棺；梁九丈截梁、增之十丈；非儿罪；拜表辄行；弃去釜甑赍三日粮；鼓吏误鸣进鼓；面缚舆榇。
  - 演义对照卡：结尾卡"史书怎么写"（桓温传：鼓吏误鸣进鼓，于是攻之，势众大溃）。

