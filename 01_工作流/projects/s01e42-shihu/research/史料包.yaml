      "date": "334（咸康元年十一月）",
      "event": "石虎废杀石弘，自称居摄赵天王",
      "people": "石虎、石弘",
      "place": "襄国",
      "summary": "石虎自称居摄赵天王；此时未称皇帝。",
      "evidence": [
        {
          "quote": "咸康元年，季龙废勒子弘，群臣已下劝其称尊号。季龙下书曰：“王室多难，海阳自弃，四海业重，故免从推逼。朕闻道合乾坤者称皇，德协人神者称帝，皇帝之号非所敢闻，且可称居摄赵天王，以副天人之望。”于是赦其境内，改年曰建武。",
          "para": "晋书-p07283"
        },
        {
          "quote": "石弘虽袭勒位，而石季龙擅威横暴，十一月废弘自立，遂幽杀之。",
          "para": "晋书-p00671"
        }
      ]
    },
