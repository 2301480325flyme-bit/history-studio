      "date": "338（咸康四年二月）",
      "event": "石虎攻棘城败退",
      "people": "石虎、石斌、麻秋、慕容皝、慕容恪",
      "place": "令支、徐无、棘城、易京",
      "summary": "后赵由徐无进令支再至棘城，围十余日；慕容恪率二千骑晨出挑战，后赵军弃甲溃退。石虎自令支经易京返。不要画成襄国直线到棘城。",
      "evidence": [
        {
          "quote": "季龙至徐无，辽奔密云山。季龙进入令支……至于棘城，戎卒数十万……相持旬余……遣子恪等率骑二千，晨出击之。季龙诸军惊扰，弃甲而遁。恪乘胜追之",
          "para": "晋书-p07437"
        },
        {
          "quote": "进师攻棘城，旬余不克。皝遣子恪帅胡骑二千，晨出挑战，诸门皆若有师出者，四面如云，季龙大惊，弃甲而遁。",
          "para": "晋书-p07307"
        },
        {
          "quote": "石季龙为慕容皝所败",
          "para": "晋书-p00165"
        }
      ]
    },
    {
      "date": "337（咸康三年）",
      "event": "太子石邃谋杀石宣，事泄被杀",
      "people": "石邃、石宣、石虎",
      "place": "冀州、东宫",
      "summary": "石邃酒后扬言往冀州杀石宣，未及行动即被拘；不要写成已发生刺杀。",
      "evidence": [
        {
          "quote": "邃称疾不省事，率宫臣文武五百余骑宴于李颜别舍，谓颜等曰：“我欲至冀州杀石宣，有不从者斩！”行数里，骑皆逃散",
          "para": "晋书-p07304"
        },
        {
          "quote": "是年，石季龙杀其子邃",
          "para": "晋书-p00673"
        }
      ]
    },
    {
      "date": "348（永和四年八月）",
      "event": "石宣杀石韬，石虎处死石宣并清洗东宫",
      "people": "石宣、石韬、石虎、李农",
      "place": "邺",
      "summary": "因宣光殿梁木冲突，石宣使人杀石韬；石虎随后杀宣并清洗东宫。刑杀极血腥，载记原话供Claude决定是否引用。",
      "evidence": [
        {
          "quote": "石韬起堂于太尉府，号曰宣光殿，梁长九丈。宣视而大怒，斩匠，截梁而去。韬怒，增之十丈。宣闻之，恚甚，谓所幸杨柸、牟成曰：“韬凶竖勃逆，敢违我如是！汝能杀之者……韬既死，主上必亲临丧，因行大事”",
          "para": "晋书-p07360"
        },
        {
          "quote": "又诛其四率已下三百人，宦者五十人，皆车裂节解，弃之漳水。洿其东宫，养猪牛。",
          "para": "晋书-p07361"
        },
        {
          "quote": "季龙疑宣之害韬也，谋召之",
          "para": "晋书-p07361"
        }
      ]
    },
    {
      "date": "346（永和二年十一月）—347（永和三年）",
      "event": "桓温自江陵伐蜀，溯江抵彭模",
      "people": "桓温、袁乔、周抚、谯王无忌",
      "place": "江陵、长江、鱼复（路线候选）、彭模",
