    {
      "date": "347（永和三年正月）",
      "event": "笮桥之战，成汉军大溃",
      "people": "桓温、袁乔、李势、龚护",
      "place": "笮桥、成都",
      "summary": "成都十里外先失利，袁乔麾军再进；笮桥战中鼓吏误鸣进鼓，晋军遂攻，成汉军大溃。笮桥遗址坐标未核。",
