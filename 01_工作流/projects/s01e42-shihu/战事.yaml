- 后赵远征起点、各段精确日期与线路未载；新地名坐标待考。
- “数十万”“斩获三万余级”来自载记，可能有修辞。
- 江陵至彭模逐站水路未载；鱼复只是地理候选，不标驻屯。
- 彭模、笮桥遗址位置未核。
- 晋寿葭萌、白水城节点关系有歧异。
- 疆域按系列疆域.yaml当前成汉郡清单逐郡列入；原史只称益州平，territory代表制图落点。
- 前燕polity未列入疆域.yaml，未改共享表。
