open_questions:
- 刘备东征起兵的准确出发地、全程水路停泊点，以及221年秋巫至秭归之后冬季至222年正月返回秭归的具体路线，史书未详；旁白“顺江而下，一路打到秭归”可概括方向，不能据此补定中间站点。
- 本集地图标注的范围为221-08–221-08，但战事账所据史料始于221年秋七月，猇亭决战在222年六月，吴军八月收兵还巫；地图时间窗如何涵盖这段战事需Claude核对。
- 旁白“吴军……一守就是七八个月”与史书记刘备222年二月进军驻猇亭、六月陆逊大破刘备的纪月跨度不合；陆逊传虽记“相守”及待敌疲敝，但没有支持七八个月的明确起止日期。
- 佷山、夷道、夷陵道、马鞍山、南山和黄权江北军降地的具体地望或路线关系未核；其中“自佷山通武陵”不等于刘备主力确定翻越佷山，马鞍山、南山尤不宜画成精确定位。
- 黄权降魏是部队归降记载，未见其导致某一郡改属魏的原文；疆域上应保持郡级归属不变，是否另标军队降魏由Claude决定。
accepted: 2026-10-25 Claude 验收：统一地名、补 skip、去掉对不上脚本的途经点
