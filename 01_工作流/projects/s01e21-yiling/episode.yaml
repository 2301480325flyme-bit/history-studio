# 快节奏版（2026-10-14，按抖音数据：冷开场、只讲有戏的、无背景音乐）
# 《三国到隋》第21集：夷陵之战、陆逊火烧连营、白帝城托孤（221–223）
# 本地语料核对：
# 陆逊传"诸将军或是孙策时旧将，或公室贵戚，各自矜恃，不相听从。逊案剑曰…仆虽书生，受命主上…军令有常，不可犯矣"；
#   "诸将并曰：攻备当在初，今乃令入五六百里，相衔持经七八月，其诸要害皆以固守，击之必无利矣。逊曰：备是猾虏，更尝事多，其军始集，思虑精专，未可干也。今住己久，不得我便，兵疲意沮，计不复生，掎角此寇，正在今日。乃先攻一营，不利。诸将皆曰：空杀兵耳。逊曰：吾已晓破之之术。乃敕各持一把茅，以火攻拔之…破其四十余营…备升马鞍山，陈兵自绕。逊督促诸军四面蹙之，土崩瓦解，死者万数。备因夜遁，驿人自担烧铙铠断后，仅得入白帝城。其舟船器械，水步军资，一时略尽，尸骸漂流，塞江而下。备大惭恚，曰：吾乃为逊所折辱，岂非天邪"；
# 先主传"二月，先主自秭归率诸将进军，缘山截岭，于夷道猇亭驻营…先主自猇亭还秭归…由步道还鱼复，改鱼复县曰永安"；文帝纪"备不晓兵，岂有七百里营可以拒敌者乎"；
# 黄权传"道隔绝，权不得还，故率将所领降于魏。有司执法，白收权妻子。先主曰：孤负黄权，权不负孤也"；
# 诸葛亮传"章武三年春，先主于永安病笃，召亮于成都，属以后事，谓亮曰：君才十倍曹丕，必能安国，终定大事。若嗣子可辅，辅之；如其不才，君可自取。亮涕泣曰：臣敢竭股肱之力，效忠贞之节，继之以死！先主又为诏敕后主曰：汝与丞相从事，事之如父"。
# 不用："勿以恶小而为之"（先主传注引诸葛亮集，本地语料未收）；八阵图困陆逊、孙夫人投江（演义）。

id: s01e21-yiling
title: 夷陵之战
series: 三国 · 第21集
year: 222

notes:
  - 主线问题：打了一辈子仗的刘备，怎么输给了一个"书生"？——陆逊不跟他抢第一口气：先等，等他兵疲了、营扎死了，再一把火。
  - 反差：东吴老将都瞧不起陆逊；曹丕隔着千里都看出"刘备不懂打仗"；托孤时刘备说"君可自取"。
  - 细节：陆逊按剑训将；每人一把茅草；驿卒把铠甲堆在山路上点火断后；尸体塞满江面；"孤负黄权，权不负孤"。
  - 动机：刘备东征，为关羽报仇、夺回荆州。
  - 演义对照：诸葛亮八阵图困住陆逊、孙夫人闻讯投江都是小说。

