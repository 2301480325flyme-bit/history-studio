  big: [火烧连营]
  hero: 陆逊
  at: 30
  summary: |
    刘备称帝后亲率大军东征，为关羽报仇。孙权任命陆逊为大都督，东吴老将们不服这个"书生"，陆逊按剑立威。刘备沿山扎营几百里，陆逊一守七八个月，曹丕在洛阳冷笑："哪有扎七百里营来拒敌的！"
    等到蜀军兵疲意沮，陆逊下令每人一把茅草，火攻猇亭，连破四十多营。刘备退守白帝城，第二年病重托孤："君才十倍曹丕……如其不才，君可自取。"诸葛亮泣答："臣敢竭股肱之力，继之以死！"
  tags: [夷陵之战, 陆逊, 刘备, 白帝城托孤, 诸葛亮]
  next: 诸葛亮治蜀，平定南中

