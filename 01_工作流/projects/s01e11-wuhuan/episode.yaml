beats:
  # ---------------- 第一章 兵贵神速 ----------------
  - say: 曹操在路边立了块大木牌：现在是盛夏，道路不通，等秋冬再进军。
    map: '206-03'
    year: 207
    phase: 一块木牌
    sources: [sgz-11]
    show:
      - act: {act: prop, at: 无终, item: 竹简, text: 俟秋冬乃复进军, cue: 大木牌, for: 4}
      - sfx: 重拍转场

  - say: 乌桓的探子看见了，真以为曹军撤了。
    sources: [sgz-11]

  - say: 可曹军正悄悄钻进一条荒废了两百年的山路，绕向乌桓的背后。
    sources: [sgz-11]

  - say: 这一仗，得从袁家兄弟说起。袁尚、袁熙逃到长城外，投奔了乌桓首领蹋顿。
    phase: 兵贵神速
    sources: [sgz-01]
    camera: {focus: [邺, 柳城], zoom: fit, move: 2.0}
    show:
      - title_bar: {text: 北征乌桓, sub: 三国 · 第11集, for: 3.2}
      - sfx: 片头鼓
      - enter: {who: 蹋顿, at: 柳城, side: right, cue: 蹋顿, settle: true, settle_sub: 辽西乌桓}
      - sfx: {name: 低音转场, delay: -0.3}

  - say: 曹操要远征乌桓。将领们反对：荆州的刘表要是派刘备偷袭许县，怎么办？
    sources: [sgz-14]
    camera: {focus: [许, 襄阳, 柳城], zoom: fit, move: 1.4}
    show:
      - arrow: {from: 襄阳, to: 许, kind: direction, faction: 刘表, cue: 偷袭许县, grow: 1.4}

  - say: 只有郭嘉力主出兵：
    scene: 军帐
    sources: [sgz-14]
    show:
      - enter: {who: 郭嘉, side: left, cue: 郭嘉, for: 2.6}

  - say: 刘表不过是个坐着空谈的人，他管不住刘备。主公就算倾国远征，也不用担心！
    speaker: 郭嘉
    style: 轻快自信，带着几分不屑，笃定地劝
    scene: 军帐
    to: 曹操
    sources: [sgz-14]

  - say: 大军走到易县，郭嘉又说：
    scene: 军帐
    sources: [sgz-14]
    camera: {focus: [邺, 易], zoom: fit, move: 1.2}

  - say: 兵贵神速！把辎重留下，轻兵日夜兼程，打他个措手不及！
    speaker: 郭嘉
    style: 果决干脆，语速明快，斩钉截铁
    scene: 军帐
    to: 曹操
    sources: [sgz-14]
    show:
      - quote: {text: 兵贵神速, source: 三国志·郭嘉传, era: 建安十二年, cue: 兵贵神速}

  # ---------------- 第二章 卢龙塞 ----------------

  - say: 七月大雨，沿海的大路被水淹了，车马过不去。
    phase: 卢龙塞
    sources: [sgz-01, sgz-11]
    camera: {focus: [无终, 卢龙塞, 柳城], zoom: fit, move: 1.4}
    show:
      - act: {act: thunder, at: 无终, cue: 大雨, for: 3}
      - sfx: {name: 低音转场, delay: -0.3}

  - say: 当地名士田畴出了个主意：
    scene: 军帐
    sources: [sgz-11]

  - say: 有条小路从卢龙口出去，直通柳城。从这里绕过去，蹋顿的人头，不用打就能拿下！
    speaker: 田畴
    style: 沉稳笃定，熟门熟路地比划，压低声音献计
    scene: 军帐
    to: 曹操
    sources: [sgz-11]

  - say: 于是就有了开头那块木牌。曹军开山填谷，走了五百多里。
    sources: [sgz-01, sgz-11]
    show:
      - replay: {path: [无终, 卢龙塞, 白狼山], faction: 曹操, label: 出卢龙塞}
      - sfx: {name: 骑兵行军, len: 5}

  # ---------------- 第三章 白狼山 ----------------

  - say: 八月，曹军登上白狼山，迎面撞上了蹋顿的几万骑兵。
    phase: 白狼山
    sources: [sgz-01]
    camera: {focus: [白狼山, 柳城], zoom: 8, move: 1.4}
    show:
      - campaign:
          at: 白狼山
          title: 白狼山之战
          clash: 撞上
          sides:
            - {from: 卢龙塞, faction: 曹操, banner: 曹, troops: cavalry, size: 1.6}
            - {from: 柳城, faction: 乌桓, banner: 蹋, troops: cavalry, size: 3.2}
      - sfx: {name: 低音转场, delay: -0.3}

  - say: 辎重都在后面，穿铠甲的人很少，左右的人都怕了。
    sources: [sgz-01]

  - say: 曹操登高一看：敌阵不整齐！立刻让张辽打头阵，冲下山去。
    sources: [sgz-01]
    show:
      - enter: {who: 张辽, side: left, cue: 张辽, for: 3}
      - march: {from: 白狼山, to: 柳城, faction: 曹操, cue: 冲下山去, grow: 1.2}
      - sfx: {name: 刀剑交击, cue: 冲下山去}

  - say: 乌桓大军一下子崩溃，蹋顿被斩，投降的有二十多万口。
    sources: [sgz-01]
    show:
      - act: {act: execute, at: 白狼山, text: 斩蹋顿, cue: 蹋顿被斩, for: 2.6}
      - exit: {who: 蹋顿, at: 柳城, verb: 斩, cue: 蹋顿被斩, portrait: true}
      - headline: {text: 白狼山之战, sub: 斩蹋顿 · 降者二十余万, cue: 二十多万, for: 3.2}

  - say: 袁尚、袁熙又逃到辽东。有人劝曹操追，曹操却说：
    sources: [sgz-01]
    camera: {focus: [柳城, 襄平], zoom: fit, move: 1.4}
    show:
      - flee: {from: 柳城, to: 襄平, faction: 袁尚, cue: 辽东}
      - flag: {at: 襄平, name: 公孙康, sub: 辽东太守, faction: 公孙康}

  - say: 我正等着公孙康，把他们的人头送来。
    speaker: 曹操
    style: 胸有成竹，轻描淡写，嘴角带笑
    sources: [sgz-01]

  - say: 曹操撤军。没过多久，公孙康果然送来了二袁的人头。
    sources: [sgz-01]
    show:
      - act: {act: courier, places: [襄平, 柳城], text: 传首, grow: 1.6, for: 3}

  - say: 将领们问为什么。曹操说：
    scene: 军帐
    sources: [sgz-01]

  - say: 我逼得急，他们就联手；放一放，他们自己就会互相算计。
    speaker: 曹操
    style: 从容解释，带着几分得意
    scene: 军帐
    sources: [sgz-01]
    show:
      - card: {title: 演义 vs 正史, body: 郭嘉遗计定辽东是小说；史书是曹操自己的判断}

  - say: 北方平定了。可就在回军前后，郭嘉病死了。
    sources: [sgz-14]
    show:
      - exit: {who: 郭嘉, at: 易, verb: 卒, cue: 病死, portrait: true}
      - sfx: {name: 退场钟, cue: 病死}

  # ---------------- 第四章 三顾茅庐 ----------------

  - say: 如果郭嘉没死，后来的赤壁，曹操还会输吗？
    sources: [sgz-14]

  - say: 同一年，荆州新野，寄居在刘表手下的刘备，正在找一个人。
    sources: [sgz-35]
    camera: {focus: [新野, 襄阳, 隆中], zoom: fit, move: 1.8}
    show:
      - enter: {who: 刘备, at: 新野, side: right, cue: 刘备, settle: true, settle_sub: 寄居新野}

