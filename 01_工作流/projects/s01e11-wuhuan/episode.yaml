  summary: |
    袁尚、袁熙逃到长城外的乌桓。曹操听郭嘉"兵贵神速"，在路边立了块"道路不通、秋冬再来"的木牌骗过乌桓，跟着田畴走一条荒废两百年的旧道出卢龙塞。
    白狼山一战斩蹋顿，又等着公孙康把二袁的人头送来——北方平定，郭嘉却在回军前后病死，年仅三十八岁。
  tags: [北征乌桓, 曹操, 郭嘉, 白狼山, 田畴]
  next: 三顾茅庐，隆中对

