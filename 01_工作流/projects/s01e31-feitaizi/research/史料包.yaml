notes:
- 第29集结尾是杨骏独揽大权、贾后盯上他；本集不复述杨骏之乱。
- 299年十二月为元康九年十二月；300年为永康元年。迁许昌确日未核。
- 金墉城坐标为遗址近似点。式乾殿、东堂、建始殿、许昌宫具体位置未核。
- 人物相貌.yaml登记司马伦、司马冏等；本次看到目录有jia_mi.png，但相貌档案未核登记。
