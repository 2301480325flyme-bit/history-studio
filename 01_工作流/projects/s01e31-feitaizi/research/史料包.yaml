  地点:
  - 古名: 洛阳（汉魏洛阳故城）
    今址: 河南洛阳市偃师区一带
    gazetteer: 有 luoyang_han_wei，112.6183E,34.7195N；古城点不代表宫殿坐标。式乾殿、东堂、建始殿未有独立点。
  - 古名: 许昌（许昌宫）
    今址: 今河南许昌市
    gazetteer: 有 xuchang_approx，114.00971E,33.99189N；条目自注为现代城市近似点，非已考定的晋代宫址，等级/精度只支持城市级。
  - 古名: 金墉城
    今址: 汉魏洛阳故城西北隅，今孟津区翟泉村东/东北一带
    gazetteer: 无；studio.py places 查询为空。建议等级为洛阳城内离宫小城，不是郡县。遗址近似坐标112.61482E,34.74455N（Mapcarta/OSM），不可当具体殿门点。依据：https://mapcarta.com/W1198845652；https://www.zgbk.com/ecph/words?ID=534318&SiteID=1&SubID=192054&Type=bkzyb
  - 古名: 式乾殿、东堂、宫殿前、许昌宫、小坊
    今址: 洛阳或许昌的宫禁建筑区
    gazetteer: 无独立条目，精确遗址未核；不应给独立坐标或画精确宫内路线。
  演义 / 野史与史家争议:
  - topic: “贾后亲手灌醉/亲手杀人”戏剧化说法
    finding: 正史写贾后命令、潘岳草书、黄门执行；不把她亲自动手当史实。
    evidence:
    - quote: 其字半不成
      para: 晋书-p04290
    - quote: 贾后矫诏害庶人遹于许昌
      para: 晋书-p00097
  - topic: 赵王伦是否真为太子复仇
    finding: 《晋书》传记写孙秀建议延迟行动，待太子被害后借“报仇”立功；同文另揭二人谋篡位，复仇是政治名义而非唯一动机。
    evidence:
    - quote: 然后废贾后，为太子报仇，犹足以为功
      para: 晋书-p04292
    - reference: 资治通鉴·卷八十三（在线核对；本地语料未收）
      url: https://www.zhonghuashu.com/wiki/資治通鑑/卷083
      note: 在线文本已核对；不作为本地quote校验项。
  - topic: 张华在废太子议上的行动
    finding: 愍怀太子传称张华、裴頠证明太子；张华传详载张华反对废嫡，裴頠请验书。不可说张华完全沉默。
    evidence:
    - quote: 惟张华、裴頠证明太子
      para: 晋书-p04290
    - quote: 此国之大祸
      para: 晋书-p03366
  - topic: 年龄及“专权十一年”
    finding: 《晋书》称贾后在位十一年，291至300可概括近十年，不是完整十一年；司马遹时年二十三为本传直载。
    evidence:
    - quote: 后在位十一年
      para: 晋书-p03105
    - quote: 时年二十三
      para: 晋书-p04292
  - topic: “皇帝梦”时间
    finding: 300年四月伦已总督中外诸军，作为钩子说其权力野心正在膨胀可；正式篡位在301年。
    evidence:
    - quote: 自为相国、都督中外诸军
      para: 晋书-p00097
    - quote: 明年，赵王伦篡位，改元
      para: 晋书-p00699
  - topic: 资料覆盖
    finding: '本地sources未找到《资治通鉴》卷八十二至八十四，卷八十三改用中华文库在线本核对，外部原文均附URL、para: 无。'
