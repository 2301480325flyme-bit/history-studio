episode: s01e31-feitaizi
title: 贾南风害死太子，赵王伦起兵（299–300）
sections:
  事件表:
  - date: 约291–299（背景）
    people:
    - 贾南风
    - 司马衷
    - 贾谧
    - 张华
    - 裴頠
    place: 洛阳
    event: 承接前集杨骏之乱后，贾后掌权近十年，贾谧干预政事并推动对太子的猜疑；本集不重讲杨骏之乱。
    sources:
    - quote: 贾谧干预国事，权侔人主
      para: 晋书-p03102
    - quote: 谮太子于后曰
      para: 晋书-p04289
  - date: 299年十二月（元康九年）
    people:
    - 贾南风
    - 司马遹
    - 潘岳
    - 董猛
    - 张华
    - 裴頠
    place: 洛阳·宫内（式乾殿、东宫精确点位未核）
    event: 贾后称帝病重召太子，灌酒使醉，令其抄写潘岳草拟的谋逆文书并补字呈帝。张华、裴頠辨疑、请求核验。贾后请废太子为庶人，帝准，太子被幽金墉城。
    sources:
    - quote: 太子醉迷不觉，遂依而写之，其字半不成。既而补成之
      para: 晋书-p04290
    - quote: 后惧事变，乃表免太子为庶人，诏许之
      para: 晋书-p04290
    - reference: 资治通鉴·卷八十三（在线核对；本地语料未收）
      url: https://www.zhonghuashu.com/wiki/資治通鑑/卷083
      note: 原文已对照在线卷八十三；不作为本地quote校验项。
  - date: 300年（先于三月癸未被害；迁送年月日未核）
    people:
    - 司马遹
    - 东武公司马澹
    - 刘振
    place: 洛阳→许昌
    event: 太子被移送许昌宫幽禁；东武公澹以千兵防卫，刘振持节看守。
    sources:
    - reference: 资治通鉴·卷八十三（在线核对；本地语料未收）
      url: https://www.zhonghuashu.com/wiki/資治通鑑/卷083
      note: 在线文本已核对；不作为本地quote校验项。
    - quote: 癸未，贾后矫诏害庶人遹于许昌
      para: 晋书-p00097
  - date: 300年三月癸未（永康元年）
    people:
    - 司马遹
    - 贾南风
    - 孙虑
    - 刘振
    place: 许昌宫
    event: 贾后矫诏令孙虑赴许昌杀太子。太子拒服毒，孙虑以药杵击杀；《晋书》本传记太子时年二十三。
    sources:
    - quote: 癸未，贾后矫诏害庶人遹于许昌
      para: 晋书-p00097
    - quote: 虑乃逼太子以药，太子不肯服，因如厕，虑以药杵椎杀之
      para: 晋书-p04292
    - quote: 因如厕，虑以药杵椎杀之
      para: 晋书-p04292
  - date: 300年四月癸巳夜
    people:
    - 赵王司马伦
    - 孙秀
    - 齐王司马冏
    - 闾和
    - 三部司马
    - 贾谧
    - 贾南风
    place: 洛阳宫城
    event: 孙秀联络右卫佽飞督闾和，鼓声为号；伦矫诏调动三部司马，齐王冏率百人排阁入宫，内应迎惠帝至东堂。贾谧殿前遇害，贾后被废为庶人、幽于建始殿。
    sources:
    - quote: 伦又矫诏开门夜入，陈兵道南，遣翊军校尉、齐王冏将三部司马百人，排阁而入
      para: 晋书-p04584
    - quote: 遂废贾后为庶人，幽之于建始殿
      para: 晋书-p04584
    - reference: 资治通鉴·卷八十三（在线核对；本地语料未收）
      url: https://www.zhonghuashu.com/wiki/資治通鑑/卷083
      note: 在线文本已核对；不作为本地quote校验项。
