beats:
  # ---------------- 冷开场 ----------------
  - say: 她害死了太子。十六天后，轮到了她自己。
    map: '291-03'
    year: 300
    phase: 太子
    sources: [js-04]
    camera: {focus: [洛阳, 许昌], zoom: fit, move: 1.2}
    show:
      - sfx: 重拍转场
      - spot: {at: 许昌, text: 太子遇害, cue: 害死了太子}
      - spot: {at: 洛阳, text: 十六天后, cue: 十六天后}

  - say: 因为有人一直在等，等她先动手。
    sources: [js-59]
    show:
      - sfx: {name: 悬疑, delay: 0.2}

  - say: 她是皇后贾南风。等她的，是赵王司马伦。
    sources: [js-31, js-59]
    show:
      - enter: {who: 贾南风, side: left, cue: 贾南风, for: 3.4}
      - enter: {who: 司马伦, side: right, cue: 司马伦, for: 3.4}
      - sfx: {name: 帝王登场, cue: 司马伦}

  # ---------------- 第一章 废太子 ----------------
  - say: 先说一年前。太子司马遹二十二岁了。贾南风没有儿子，这个太子，越看越碍眼。
    phase: 废太子
    year: 299
    sources: [js-31, js-53]
    camera: {focus: 洛阳, zoom: 6, move: 1.4}
    show:
      - title_bar: {text: 贾南风害死太子, sub: 两晋 · 第31集, for: 3.2}
      - sfx: 片头鼓
      - enter: {who: 司马遹, side: right, cue: 司马遹, for: 3.6}

  - say: 她甚至假装怀孕，把妹妹家的孩子抱来养，想有一天顶替太子。
    sources: [js-31]
    show:
      - quote: {text: 后诈有身…取妹夫韩寿子慰祖养之…遂谋废太子，以所养代立, source: 晋书·后妃传, cue: 假装怀孕, for: 4.4}

  - say: 二九九年十二月，她骗太子进宫，说皇帝病了。人一到，却被关进偏房。
    sources: [js-53]
    camera: {focus: 洛阳, zoom: 9, move: 1.2}
    show:
      - act: {act: prison, at: 洛阳, text: 置于别室, cue: 偏房, for: 3.2}
      - sfx: {name: 城门关闭, cue: 偏房}

  - say: 宫女端来酒和枣，逼他一杯接一杯地喝。太子，醉了。
    sources: [js-53]
    show:
      - vignette: {image: illus_taizi_drunk, cue: 酒和枣, for: 9, text: 醉书}

  - say: 又递来纸笔和一份草稿，让他照着抄。草稿上写着：皇上和皇后要是不自己了结，我就亲手来了结。
    sources: [js-53]
    show:
      - act: {act: prop, at: 洛阳, item: 书信, text: 书草, cue: 草稿, size: 1.2, for: 3.6}
      - quote: {text: 陛下宜自了；不自了，吾当入了之, source: 晋书·愍怀太子传, era: 元康九年, cue: 了结, for: 4}
      - sfx: {name: 不祥鼓, cue: 了结}

  - say: 太子醉得迷迷糊糊，照着写了，一半的字都没写成。贾南风找人补全，送到了皇帝面前。
    sources: [js-53]
    show:
      - quote: {text: 太子醉迷不觉，遂依而写之，其字半不成。既而补成之, source: 晋书·愍怀太子传, cue: 没写成, for: 4}

  - say: 皇帝拿着信对大臣说：太子这样，赐死。满朝没人吭声，只有张华、裴頠站出来：这信有问题。
    sources: [js-53]
    show:
      - act: {act: edict, at: 洛阳, text: 赐死, sub: 遹书如此, cue: 赐死, for: 3}
      - enter: {who: 张华, side: left, cue: 张华, for: 3.2}
      - enter: {who: 裴頠, side: right, cue: 裴頠, for: 3.2}

  - say: 吵到太阳落山也没定。贾南风怕夜长梦多，改口先废为庶人。太子被押到许昌，关了起来。
    sources: [js-53]
    camera: {focus: [洛阳, 许昌], zoom: fit, move: 1.4}
    tells: [e01]
    show:
      - march: {from: 洛阳, to: 许昌, faction: 贾后, label: 押送庶人, cue: 押到许昌, grow: 1.6}
      - act: {act: prison, at: 许昌, text: 幽禁, cue: 关了起来, for: 3}
      - sfx: {name: 城门关闭, cue: 关了起来}

  # ---------------- 第二章 孙秀的算盘 ----------------
  - say: 太子冤，朝野都不服。有人去找掌握禁军的赵王，想联手废掉皇后，迎回太子。
    phase: 等
    year: 300
    sources: [js-53, js-59]
    camera: {focus: 洛阳, zoom: 6, move: 1.4}
    show:
      - flag: {at: 洛阳, name: 赵王, sub: 掌禁军, faction: 宗室, cue: 赵王, until: beat+6}
      - sfx: {name: 插旗, cue: 赵王}

  - say: 谋士孙秀一口答应。可他转念一想：太子聪明刚强，回来了，能放过他们这些贾家旧人吗？
    sources: [js-59]
    show:
      - quote: {text: 秀知太子聪明，若还东宫，将与贤人图政，量己必不得志, source: 晋书·赵王伦传, cue: 转念, for: 4.2}

  - say: 他劝赵王：先别动。等皇后杀了太子，咱们再废皇后，替太子报仇，功劳更大。
    sources: [js-59]
    show:
      - quote: {text: 今且缓其事，贾后必害太子，然后废后，为太子报仇, source: 晋书·赵王伦传, cue: 先别动, for: 4.4}
      - sfx: {name: 悬疑, cue: 先别动}

  - say: 孙秀还故意放出风声：宫里有人要废皇后、迎太子。
    sources: [js-53, js-59]
    show:
      - spot: {at: 洛阳, text: 微泄其谋, cue: 放出风声}

  - say: 贾南风果然慌了。三月，她派宦官孙虑去许昌，杀太子。
    sources: [js-04, js-53]
    camera: {focus: [洛阳, 许昌], zoom: fit, move: 1.4}
    show:
      - act: {act: courier, places: [洛阳, 许昌], text: 矫诏害太子, cue: 许昌, grow: 1.4, for: 3}
      - sfx: {name: 不祥鼓, cue: 杀太子}

  - say: 太子怕被毒死，一直自己煮饭吃。看守干脆断了他的饭。
    sources: [js-53]
    camera: {focus: 许昌, zoom: 9, move: 1.2}
    show:
      - vignette: {image: illus_taizi_cooking, cue: 自己煮饭, for: 5, text: 自煮其食}

  - say: 孙虑逼他吃药，太子不肯，借口去厕所。孙虑抄起捣药的木杵，把他打死了。墙外都听得见他的喊声。
    sources: [js-53]
    show:
      - exit: {who: 司马遹, at: 许昌, verb: 卒, portrait: true, cue: 打死了}
      - sfx: {name: 退场钟, cue: 打死了}

  - say: 太子死时，二十三岁。
    sources: [js-53]
    show:
      - quote: {text: 太子大呼，声闻于外。时年二十三, source: 晋书·愍怀太子传, era: 永康元年三月, cue: 二十三, for: 3.6}

  # ---------------- 第三章 金屑酒 ----------------
  - say: 十天后的夜里，赵王假传诏书，带兵开了宫门。齐王司马冏带着一百人，冲进后宫。
    phase: 拴狗
    sources: [js-04, js-59]
    camera: {focus: 洛阳, zoom: 9, move: 1.2}
    tells: [e05]
    show:
      - act: {act: night, places: [洛阳], cue: 夜里, for: 3}
      - enter: {who: 司马冏, side: right, cue: 齐王, for: 3.4}
      - battle: {at: 洛阳, text: 排阁而入, cue: 冲进后宫}
      - sfx: {name: 刀剑交击, cue: 冲进后宫}

  - say: 贾南风大惊：你来干什么？齐王说：有诏书，来抓皇后。她冷笑：
    sources: [js-31]
    scene: 宫中

  - say: 诏书都是从我这儿出的，你哪来的诏书！
    speaker: 贾南风
    to: 司马冏
    style: 又惊又怒，强撑皇后的威风，厉声质问
    scene: 宫中
    quote: 诏当从我出，何诏也
    sources: [js-31]

  - say: 她又问：谁带的头？一听是赵王，她叹了一句：
    sources: [js-31]
    scene: 宫中

  - say: 拴狗，就该拴住狗脖子，我却拴了尾巴！
    speaker: 贾南风
    style: 咬牙切齿，懊悔到极点，狠狠地自嘲
    scene: 宫中
    quote: 系狗当系颈，今反系其尾，何得不然
    sources: [js-31]
    show:
      - sfx: {name: 悬疑, delay: 0.2}

  - say: 皇后被废，关进金墉城。六天后，一杯金屑酒送到她面前。离太子被杀，正好十六天。
    sources: [js-04, js-31]
    camera: {focus: 洛阳, zoom: 7, move: 1.2}
    show:
      - act: {act: prison, at: 洛阳, text: 金墉城, cue: 金墉城, for: 3}
      - exit: {who: 贾南风, at: 洛阳, verb: 诛, portrait: true, cue: 金屑酒}
      - headline: {text: 十六天, sub: 癸未害太子 · 己亥赐死贾后, cue: 正好十六天, for: 3.4}
      - sfx: {name: 落幕锣, cue: 十六天}

  # ---------------- 第四章 收割 ----------------
  - say: 同一夜，赵王派人拿下张华、裴頠。张华临死说：太子被废那天，我是劝过的！
    phase: 相国
    sources: [js-36, js-59]
    show:
      - enter: {who: 张华, side: left, cue: 张华, for: 3.4}
      - quote: {text: 式乾之议，臣谏事具存，非不谏也, source: 晋书·张华传, cue: 劝过的, for: 4}

  - say: 张华六十九岁，裴頠三十四岁，都死在殿前。
    sources: [js-35, js-36]
    show:
      - exit: {who: 张华, at: 洛阳, verb: 诛, portrait: true, cue: 六十九}
      - exit: {who: 裴頠, at: 洛阳, verb: 诛, portrait: true, cue: 三十四}
      - sfx: {name: 处斩, cue: 殿前}

  - say: 第二天，赵王自封相国，总管内外军队。史书说，就像当年司马懿辅佐曹魏。
    sources: [js-04]
    camera: {focus: [洛阳, 许昌], zoom: fit, move: 1.4}
    tells: [e07]
    show:
      - flag: {at: 洛阳, name: 相国, sub: 赵王司马伦, faction: 宗室, cue: 相国}
      - quote: {text: 自为相国、都督中外诸军，如宣文辅魏故事, source: 晋书·惠帝纪, era: 永康元年四月, cue: 史书说, for: 4}
      - sfx: {name: 册封, cue: 相国}

  # ---------------- 收 ----------------
  - say: 贾南风为什么死得这么快？她以为杀了太子就安全了，可太子一死，她成了全天下的罪人。
    sources: [js-59]
    camera: {focus: 洛阳, zoom: 5, move: 1.4}
    show:
      - enter: {who: 贾南风, side: right, cue: 罪人, for: 3.4}

  - say: 上一回，她借别人的刀杀人。这一回，她自己成了别人手里的刀。
    sources: [js-59]
    show:
      - headline: {text: 她成了别人的刀, sub: 先借刀，后被借, cue: 别人手里的刀, for: 3.4}
      - sfx: {name: 史诗冲击, cue: 别人手里的刀}

  - say: 太子的死，该算在贾南风头上，还是孙秀头上？
    sources: [js-53, js-59]
    show:
      - card: {title: 史书怎么写, body: 孙秀说赵王：贾后必害太子，然后废后，为太子报仇, cue: 孙秀, for: 3.6}

  - say: 赵王住进了相府。可孙秀觉得：相国，还不够大。
    sources: [js-59]
    show:
      - enter: {who: 司马伦, side: right, cue: 相府, for: 3.4}
      - title_bar: {text: 下集, sub: 两晋 · 赵王伦篡位称帝, cue: 不够大, delay: 0.4, for: 3.0}
      - sfx: {name: 时代转折, cue: 不够大}
