# 快节奏版（2026-10-25）
# 《三国到隋》第31集 · 两晋：贾南风害死太子，赵王伦夺权（299–300）。大纲第 27 条。
# 本地语料核对（晋书）：
# 惠贾皇后传 p03104"后诈有身，内稿物为产具，遂取妹夫韩寿子慰祖养之…遂谋废太子，以所养代立"；
#   p03105 废后："后惊曰：卿何为来！冏曰：有诏收后。后曰：诏当从我出，何诏也？…又问冏曰：起事者谁？冏曰：梁、赵。后曰：系狗当系颈，今反系其尾，何得不然！…伦乃矫诏遣尚书刘弘等持节赍金屑酒赐后死"；
# 愍怀太子传 p04290 元康九年十二月"诈称上不和，呼太子入朝。既至，后不见，置于别室，遣婢陈舞赐以酒枣，逼饮醉之。使黄门侍郎潘岳作书草…令小婢承福以纸笔及书草使太子书之。文曰：陛下宜自了；不自了，吾当入了之。中宫又宜速自了；不了，吾当手了之…太子醉迷不觉，遂依而写之，其字半不成。既而补成之，后以呈帝…遍示诸公王，莫有言者，惟张华、裴頠证明太子…议至日西不决。后惧事变，乃表免太子为庶人"；
#   p04292 司马雅、许超说孙秀；秀说伦"太子为人刚猛…"；"三月，矫诏使黄门孙虑斋至许昌以害太子。初，太子恐见鸩，恆自煮食于前。虑以告刘振，振乃徙太子于小坊中，绝不与食…虑乃逼太子以药，太子不肯服，因如厕，虑以药杵椎杀之，太子大呼，声闻于外。时年二十三"；
# 赵王伦传 p04583 孙秀"今且缓其事，贾后必害太子，然后废后，为太子报仇，亦足以立功，岂徒免祸而已。伦从之。秀乃微泄其谋…伦、秀因劝谧等早害太子，以绝众望"；p04584"伦又矫诏开门夜入，陈兵道南，遣翊军校尉、齐王冏将三部司马百人，排阁而入…遂废贾后为庶人…执张华、裴頠、解结、杜斌等，于殿前杀之"；
# 惠帝纪 p00097 永康元年三月癸未"贾后矫诏害庶人遹于许昌"；四月辛卯日蚀；"癸巳…矫诏废贾后为庶人，司空张华、尚书仆射裴頠皆遇害"；"甲午，伦矫诏大赦，自为相国、都督中外诸军，如宣文辅魏故事"；"己亥，赵王伦矫诏害贾庶人于金墉城"（癸未→己亥 十六天：辛卯在四月，故癸未在三月下旬，相隔八天，非六十八天）；
# 张华传 p03368"华曰：式乾之议，臣谏事具存，非不谏也…遂害之于前殿马道南…时年六十九"；裴頠传 p03305"时年三十四"。
# 不用：太子在金墉城、许昌之间的移送日期（史料包：迁送年月日未核，只说"押到许昌"）；淮南王允八月起兵（不在本集主线）；"南风烈烈吹黄沙"童谣（留作可选彩蛋，本集不用）。

id: s01e31-feitaizi
title: 贾南风害死太子
series: 两晋 · 第31集
year: 299

notes:
  - 主线问题：贾南风害死太子，本想一劳永逸，为什么十六天后，死的是她自己？——有人故意等她动手：孙秀劝赵王先别救太子，等皇后杀了太子，再替太子报仇。上一集她借别人的刀，这一集她自己成了别人的刀。
  - 钩子候选：①"她害死了太子。十六天后，轮到了她自己"（反差3 具体3 悬念3 兑现3=12）②"有人故意等她杀了太子"（反差2 具体1 悬念3 兑现3=9）③"一封醉后抄写的信，废了一个太子"（反差2 具体3 悬念2 兑现3=10）→ 选①，②做第二拍。
  - 反差：想救太子的人，故意拖着不救；皇后说"诏书都是从我这儿出的"，最后却死在一道诏书下；太子怕被毒死自己煮饭，最后死在厕所里。
  - 细节：酒和枣；一半没写成的字；吵到太阳落山；自己煮饭、被断饭；药杵；"拴狗要拴脖子"；金屑酒；张华"式乾之议，我是劝过的"。
  - 动机：贾后无子，养妹妹家的孩子想顶替太子；孙秀怕太子回来清算贾党，宁可让太子先死。
  - 演义对照卡：本集无演义，结尾用"史书怎么写"（孙秀"贾后必害太子，然后废后，为太子报仇"）。

