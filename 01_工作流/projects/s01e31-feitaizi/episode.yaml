  summary: |
    299 年十二月，皇后贾南风骗太子司马遹进宫，灌醉后让他照着草稿抄了一封"谋反信"，一半的字都没写成。朝堂上只有张华、裴頠说信有问题，太子还是被废，押到许昌。
    想救太子的人去找赵王司马伦，谋士孙秀却劝赵王先别动：等皇后杀了太子，再废皇后、替太子报仇。300 年三月，太子在许昌被药杵打死，年仅二十三岁。十天后赵王带兵入宫，贾南风叹"拴狗要拴脖子"，又过六天被金屑酒赐死；张华、裴頠同夜遇害，赵王自封相国。
  tags: [西晋, 贾南风, 愍怀太子, 赵王伦, 孙秀, 八王之乱]
  next: 赵王伦篡位称帝

