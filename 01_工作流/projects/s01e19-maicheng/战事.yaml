open_questions:
- 徐晃救樊、于禁七军行进路线，及樊城周边阳陵陂、偃城、围头屯、四冢的位置均缺少足以确定路线与坐标的原文；本账未把推测点当作已核史址。
- 吕蒙出兵记作吴主传的“闰月”，而疆域.yaml和地图用219-11；农历闰月与地图年月的换算及江边哨候具体位置仍需统一核定。
- 吴主传作关羽于章乡被获，吕蒙传作漳乡，关羽传称于临沮被斩；章/漳异文及其与今湖北远安、临沮县治的关系未能由本地材料定点。
- 吴主传明记陆逊“别取宜都，获秭归、枝江、夷道”，但疆域.yaml的219-11、219-12事件没有单列宜都郡；是否应补宜都郡疆域变化及其起止月，交Claude验收决定。
- “梁、郏、陆浑群盗或遥受羽印号”只表示部分群盗远距离接受官印，不表示三地城邑被关羽军攻占；各地具体人数和接触路线未载。
- 关羽从樊城撤回当阳、麦城的准确先后日期与沿线地点未载；吴主传将其记在公安、江陵失守之后，关羽传只概称“引军退还”。
