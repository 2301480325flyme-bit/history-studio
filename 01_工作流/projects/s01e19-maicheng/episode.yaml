# 快节奏版（2026-10-14，按抖音数据：冷开场、只讲有戏的、无背景音乐）
# 《三国到隋》第19集：关羽水淹七军、威震华夏，吕蒙白衣渡江，关羽败走麦城（219）
# 本地语料核对：
# 关羽传"羽率众攻曹仁于樊。曹公遣于禁助仁。秋，大霖雨，汉水泛溢，禁所督七军皆没。禁降羽，羽又斩将军庞德。梁、郏、陆浑群盗或遥受羽印号，为之支党，羽威震华夏。曹公议徙许都以避其锐，司马宣王、蒋济以为关羽得志，孙权必不愿也。可遣人劝权蹑其后，许割江南以封权…
#   先是权遣使为子索羽女，羽骂辱其使，不许婚，权大怒。又南郡太守糜芳在江陵，将军傅士仁屯公安，素皆嫌羽轻自己。羽之出军，芳、仁供给军资，不悉相救，羽言还当治之，芳、仁咸怀惧不安…曹公遣徐晃救曹仁，羽不能克，引军退还"；
# 庞德传"独抱船覆水中，为羽所得，立而不跪…德骂羽曰：竖子，何谓降也！…我宁为国家鬼，不为贼将也。遂为羽所杀"；
# 吕蒙传"蒙至寻阳，尽伏其精兵舳舻中，使白衣摇橹，作商贾人服，昼夜兼行，至羽所置江边屯候，尽收缚之，是故羽不闻知。遂到南郡，士仁、麋芳皆降…蒙麾下士，是汝南人，取民家一笠，以覆官铠…遂垂涕斩之"；"羽人还，私相参讯，咸知家门无恙，见待过于平时，故羽吏士无斗心…羽自知孤穷，乃走麦城"；
# 吴主传"羽伪降，立幡旗为象人于城上，因遁走，兵皆解散，尚十余骑…十二月，璋司马马忠获羽及其子平、都督赵累等于章乡，遂定荆州"；关羽传刮骨去毒（无华佗、无时间地点）。
# 不用："虎女安肯嫁犬子"（典略，注文，未核对）；关羽首级送曹操（未核对）；华佗刮骨、玉泉山显圣（演义）。

id: s01e19-maicheng
title: 水淹七军
series: 三国 · 第19集
year: 219

notes:
  - 主线问题：威震华夏、吓得曹操想迁都的关羽，怎么半年不到就输光了？——前面打得越猛，身后越空；骂了盟友，又吓着了自己人；吕蒙抢的不是城，是他士兵的心。
  - 反差：秋天七军覆没、曹操议迁都；冬天身边只剩十几个骑兵。
  - 细节：庞德抱着翻船被抓，站着不跪；白衣摇橹的商船；吕蒙为一顶斗笠斩同乡；使者挨家挨户问候家属；城头插旗立假人。
  - 动机：孙权恨关羽辱使拒婚；糜芳、士仁怕"回来再收拾你们"；曹操用"许割江南"拉孙权下手。
  - 演义对照：刮骨疗毒确有其事，但史书没写华佗，也不在樊城；"大意失荆州"四个字是后人说的。

