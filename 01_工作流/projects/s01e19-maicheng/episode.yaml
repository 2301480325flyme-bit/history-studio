publish:
  hook: 吓得曹操想迁都的人，半年后只剩十几个骑兵
  big: [水淹七军]
  hero: 关羽
  at: 30
  summary: |
    关羽北上围樊城，秋雨连绵，汉水暴涨，于禁七军全军覆没，庞德被俘不屈。关羽威震华夏，曹操一度想把许都迁走。司马懿、蒋济劝曹操拉孙权从背后下手——孙权早就记恨关羽拒婚。
    吕蒙让精兵藏在船舱里，士兵穿白衣扮商人摇橹，悄悄绑了沿江哨所，糜芳、士仁开城投降。吕蒙善待关羽将士的家属，关羽的兵一听家里平安，再也无心作战。关羽败走麦城，在章乡被擒。
  tags: [水淹七军, 关羽, 吕蒙, 白衣渡江, 败走麦城]
  next: 曹操病逝，曹丕称帝

