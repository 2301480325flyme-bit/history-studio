open_questions:
- 各路晋军的兵力没有逐军数字，晋纪只说东西诸军二十余万；陶浚称可得二万人是其临时奏对口径，不能等同于实际出战人数。
- 《晋书》与《三国志》对孙皓降晋的受降对象叙述不同：晋纪说送玺绶给琅邪王伷，三国志说王濬最先到并受降；画面需区分递印与本人面降。
- 丹阳城、寻阳濑乡、高望城、江安、夷道乐乡及版桥的精确古址未核；尤其“丹阳城”不是丹阳郡，不能据同名直接映射郡域。
- 原文未列王浑、司马伷各军自集结地至前沿的逐站行程；这里只能给出出兵方向和明确记载的战场，不能将可能路线当作史实。
- 杜预所部“循江西上”只载十日累克城邑，未列城名；乐乡、荆门诸戍“相次来降”也无逐点日期。需Claude决定按战区概括还是逐条显示未核节点。
- 《晋书》只概述沅湘以南至交广诸州郡望风归命，未列各郡受降日；疆域.yaml的二月与三月郡域切换含地图时序表达，仍需与具体受降过程对齐。
- 289年宗王出镇句的来源《晋书》写秦王柬都督关中、楚王玮与淮南王允镇要害，并未逐一给出“扬州、许昌”对应王名、出发日期或行军过程；旁白概述可能压缩了分镇时间。
- 杨骏住太极殿及一百卫士尚未找到可核本地原文，此项标未核，不宜作为已证事实进入画面。
