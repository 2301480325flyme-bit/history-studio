# 快节奏版（2026-10-15，按抖音数据：冷开场、只讲有戏的、无背景音乐）
# 《三国到隋》第29集 · 两晋篇开篇：太康之治、罢州郡兵、宗室出镇、傻太子与贾南风、杨骏专权（280–290）
# 本地语料核对（晋书）：
# 惠帝纪 p00104"及天下荒乱，百姓饿死，帝曰：何不食肉糜？"；"帝之为太子也，朝廷咸知不堪政事，武帝亦疑焉"；
# 后妃传·惠贾皇后 p03099"卫公女有五可，贾公女有五不可。卫家种贤而多子，美而长白；贾家种妒而少子，丑而短黑。元后固请…乃定婚"；
#   p03100"帝常疑太子不慧…密封疑事，使太子决之…给使张泓曰：太子不学，而答诏引义，必责作草主…不如直以意对…泓素有小才，具草，令太子自写。帝省之，甚悦"；
# 卫瓘传 p03332"会宴陵云台，瓘托醉，因跪帝床前…因以手抚床曰：此座可惜！帝意乃悟，因谬曰：公真大醉耶？"；
# 食货志 p02375 占田、户调（"男子一人占田七十亩，女子三十亩"；"丁男之户，岁输绢三匹，绵三斤"）；p02376"是时天下无事，赋税平均，人咸安其业而乐其事"；
# 地理志上 p00743"太康元年，平吴，大凡户二百四十五万九千八百四十，口一千六百一十六万三千八百六十三"；"武帝泰始元年，封诸王以郡为国。邑二万户为大国，置上中下三军，兵五千人；邑万户为次国…兵三千人"；
# 武帝纪 p00059 泰始元年封安平王孚以下二十七王；p00083 太康十年十一月"改封南阳王柬为秦王，始平王玮为楚王，濮阳王允为淮南王，并假节之国，各统方州军事"；
#   p00085"知惠帝弗克负荷，然恃皇孙聪睿，故无废立之心…会帝小差，有诏以汝南王亮辅政…杨骏秘而不宣…杨后辄为诏以骏辅政…帝寻小间，问汝南王来未…左右答言未至，帝遂困笃。中朝之乱，实始于斯矣"；
#   p00084"夏四月…己酉，帝崩于含章殿，时年五十五"；
# 山涛传 p03741"吴平之后，帝诏天下罢军役…州郡悉去兵，大郡置武吏百人，小郡五十人…涛…以为不宜去州郡武备…帝称之曰：天下名言也。而不能用"；
# 汝南王亮传 p04567"以亮为…大都督、督豫州诸军事，出镇许昌"；淮南王允传 p04879"太康十年，徙封淮南，仍之国，都督扬江二州诸军事"；
# 胡贵嫔传 p03097"平吴之后复纳孙皓宫人数千，自此掖庭殆将万人…常乘羊车，恣其所之，至便宴寝。宫人乃取竹叶插户，以盐汁洒地，而引帝车"；
# 愍怀太子传 p04286"宫中尝夜失火，武帝登楼望之。太子时年五岁，牵帝裾入暗中…不宜令照见人君也…此兒当兴我家"；
# 齐王攸传 p03519–p03521 太康三年诏攸就国；"攸知勖、紞构己，愤怨发疾…辞出信宿，欧血而薨，时年三十六"；
# 杨骏传 p03627"骏遂当寄托之重，居太极殿。梓宫将殡，六宫出辞，而骏不下殿，以武贲百人自卫"。
# 不用：武帝"羊车"后的"宫人竹叶"以外的野史；"司马衷闻蛤蟆叫问公私"（留作后面惠帝集用）；民间"晋武帝立惠帝为保皇孙"的过度演绎（只按武帝纪"恃皇孙聪睿"讲）。

id: s01e29-taikang
title: 太康盛世与傻太子
series: 两晋 · 第29集
year: 280

notes:
  - 主线问题：晋武帝明知太子不行，为什么还要把天下交给他？——他押了三张牌：聪明的皇孙、握兵的宗室、可靠的外戚。结果三张牌后来全翻成了雷（下几集兑现）。
  - 钩子候选：①"百姓饿死，皇帝问：为什么不吃肉粥？"（反差3 具体3 悬念2 兑现3=11）②"他统一了天下，却亲手埋了三颗雷"（反差2 具体1 悬念3 兑现3=9）③"郡里一百个兵，王府五千个兵"（反差3 具体3 悬念1 兑现3=10）→ 选①。
  - 反差：州郡兵撤到大郡百人，王国却可以养兵五千；考题是太子"自己"答的；托孤诏书被外戚扣下。
  - 细节：羊车与竹叶盐水；卫瓘"此座可惜"、武帝"公真大醉耶"；张泓"不如直以意对"；五岁皇孙拉祖父躲进暗处；齐王攸带病被催上路、吐血而死；杨骏不下殿、百人自卫。
  - 动机：武帝纪"恃皇孙聪睿，故无废立之心"；又"恐杨氏之逼"，派儿子们出镇要地"以强帝室"。
  - 演义对照卡：本集无演义情节，结尾卡改为"史书怎么评"（武帝纪"中朝之乱，实始于斯矣"）。

