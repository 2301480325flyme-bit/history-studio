beats:
  # ---------------- 冷开场 ----------------
  - say: 百姓饿死了，消息传进宫里，皇帝问了一句：
    map: '280-03'
    year: 290
    phase: 何不食肉糜
    scene: 朝堂
    sources: [js-04]
    show:
      - sfx: 重拍转场

  - say: 他们没饭吃，为什么不吃肉粥呢？
    speaker: 司马衷
    style: 一脸天真，真心不解，语气认真地发问
    scene: 朝堂
    sources: [js-04]
    show:
      - quote: {text: 及天下荒乱，百姓饿死，帝曰：何不食肉糜？, source: 晋书·惠帝纪, for: 4.4}
      - sfx: {name: 悬疑, delay: 0.2}

  - say: 他就是晋惠帝司马衷。他爹晋武帝早就知道儿子不行，还是把天下交给了他。为什么？
    sources: [js-03, js-04]
    camera: {focus: 洛阳, zoom: 4, move: 1.4}
    show:
      - enter: {who: 司马炎, side: left, cue: 晋武帝, for: 4}
      - sfx: {name: 帝王登场, cue: 晋武帝}

  # ---------------- 第一章 太康 ----------------
  - say: 时间回到二八零年。吴国刚灭，天下一统。
    phase: 太康
    year: 280
    sources: [js-03]
    camera: {focus: [洛阳, 建业, 长安], zoom: fit, move: 1.6}
    show:
      - title_bar: {text: 太康盛世与傻太子, sub: 两晋 · 第29集, for: 3.2}
      - sfx: 片头鼓
      - breathe: {faction: 晋, cue: 天下一统}

  - say: 他推行占田制，男女各有田额，按户交绢。
    sources: [js-26]
    camera: {focus: 洛阳, zoom: 5, move: 1.2}
    show:
      - act: {act: farm, at: 洛阳, text: 占田, cue: 占田, for: 3.6}
      - act: {act: coins, at: 洛阳, text: 户调, cue: 交绢, for: 2.6}
      - sfx: {name: 钱币, cue: 交绢}

  - say: 全国登记两百四十五万户。史书说，那几年天下无事，人人安居乐业。
    sources: [js-14, js-26]
    camera: {focus: [洛阳, 建业, 长安], zoom: fit, move: 1.4}
    show:
      - headline: {text: 太康之治, sub: 户二百四十五万, cue: 两百四十五万, for: 3.2}
      - sfx: {name: 大标题, cue: 两百四十五万}
      - quote: {text: 是时天下无事，赋税平均，人咸安其业而乐其事, source: 晋书·食货志, era: 太康年间, cue: 史书说, for: 4}

  - say: 孙皓的几千宫女也被收进后宫，宫里快一万人。
    sources: [js-31]
    show:
      - act: {act: courier, places: [建业, 洛阳], text: 宫人数千, cue: 宫女, grow: 1.4, for: 3}
      - sfx: {name: 呼啸, cue: 宫女}

  - say: 他坐着羊车随便逛，羊停哪儿就睡哪儿。宫女们就在门口插竹叶、洒盐水，引羊过来。
    sources: [js-31]
    camera: {focus: 洛阳, zoom: 8, move: 1.2}
    show:
      - act: {act: prop, at: 洛阳, item: 马车, text: 羊车, cue: 羊车, size: 1.2, for: 3.4}
      - sfx: {name: 马嘶, cue: 羊车}
      - act: {act: prop, at: 洛阳, item: 宫殿, text: 竹叶插户, cue: 竹叶, size: 1.1, for: 3.4}

  # ---------------- 第二章 撤兵封王 ----------------
  - say: 天下太平，晋武帝下令撤掉州郡兵，大郡只留一百个武吏。
    phase: 撤兵封王
    sources: [js-43]
    camera: {focus: [洛阳, 建业, 长安], zoom: fit, move: 1.4}
    show:
      - act: {act: edict, at: 洛阳, text: 罢兵, sub: 州郡悉去兵, cue: 下令, for: 3.6}
      - sfx: {name: 诏书, cue: 下令}

  - say: 老臣山涛劝他：地方不能没有兵。晋武帝夸这是天下名言，可就是不听。
    sources: [js-43]
    show:
      - enter: {who: 山涛, side: right, cue: 山涛, for: 3.4}
      - quote: {text: 帝称之曰：天下名言也。而不能用, source: 晋书·山涛传, cue: 天下名言, for: 3.6}

  - say: 兵撤了，天下靠谁来守？他的答案是：自家人。
    sources: [js-14]
    show:
      - spot: {at: 洛阳, text: 自家人, cue: 自家人}
      - sfx: {name: 重低音落地, cue: 自家人}

  - say: 他登基那年，就封了二十七个同姓王。王国可以养兵，大国五千。
    sources: [js-03, js-14]
    show:
      - act: {act: prop, at: 洛阳, item: 印绶, text: 封二十七王, cue: 二十七, size: 1.2, for: 3.4}
      - sfx: {name: 册封, cue: 二十七}
      - quote: {text: 邑二万户为大国，置上中下三军，兵五千人, source: 晋书·地理志, era: 泰始元年, cue: 养兵, for: 4}

  - say: 一边，大郡只剩一百个武吏；一边，王府里有好几千人马。
    sources: [js-14, js-43]
    show:
      - forces: {left: {name: 州郡, sub: 大郡武吏百人}, right: {name: 王国, sub: 大国兵五千}, loser: left, delay: 0.4, for: 5}
      - sfx: {name: 对峙滚奏, delay: 0.4}
      - sfx: {name: 碎玻璃, delay: 3.8}

  - say: 二八九年，他又派儿子和叔叔出镇：关中、荆州、扬州、许昌。
    year: 289
    sources: [js-03, js-59, js-64]
    camera: {focus: [洛阳, 长安, 江陵, 寿春], zoom: fit, move: 1.4}
    show:
      - flag: {at: 长安, name: 秦王, sub: 司马柬, faction: 宗室, cue: 关中, until: beat+1}
      - sfx: {name: 插旗, cue: 关中}
      - flag: {at: 江陵, name: 楚王, sub: 司马玮, faction: 宗室, cue: 荆州, until: beat+1}
      - flag: {at: 寿春, name: 淮南, sub: 淮南王司马允, faction: 宗室, cue: 扬州, until: beat+1}
      - flag: {at: 许昌, name: 汝南, sub: 汝南王司马亮, faction: 宗室, cue: 许昌, until: beat+1}

  - say: 他想的是：儿子们握着兵，外人就不敢动我家的江山。
    sources: [js-03]
    show:
      - quote: {text: 楚王玮、淮南王允并镇守要害，以强帝室, source: 晋书·武帝纪, era: 太康十年, cue: 握着兵, for: 3.8}

  # ---------------- 第三章 太子 ----------------
  - say: 可最大的雷，埋在东宫。太子司马衷，满朝大臣都知道，他不太灵光。
    phase: 太子
    sources: [js-04]
    camera: {focus: 洛阳, zoom: 6, move: 1.2}
    show:
      - enter: {who: 司马衷, side: right, cue: 司马衷, for: 4}
      - sfx: {name: 不祥鼓, cue: 东宫}

  - say: 有一回宴会，老臣卫瓘借着酒劲，跪在皇帝床前，手抚着御座说：
    sources: [js-36]
    scene: 宴席

  - say: 这个座位，可惜了啊！
    speaker: 卫瓘
    to: 司马炎
    style: 借醉吐真言，欲言又止，最后重重一叹
    scene: 宴席
    quote: 此座可惜
    sources: [js-36]
    show:
      - sfx: {name: 悬疑, delay: 0.3}

  - say: 卫公，你是真喝醉了吧？
    speaker: 司马炎
    to: 卫瓘
    style: 心里明白，故意打哈哈，笑着岔开话题
    scene: 宴席
    quote: 公真大醉耶
    sources: [js-36]

  - say: 后来晋武帝出了道考题，密封着送进东宫，要太子自己答。
    sources: [js-31]
    camera: {focus: 洛阳, zoom: 8, move: 1.2}
    show:
      - act: {act: prop, at: 洛阳, item: 书信, text: 密封疑事, cue: 密封, size: 1.2, for: 3.2}
      - sfx: {name: 落印, cue: 密封}

  - say: 太子妃贾南风慌了，找人代答。小吏张泓说：太子不爱读书，答得太有学问，反而露馅。
    sources: [js-31]
    show:
      - enter: {who: 贾南风, side: right, cue: 贾南风, for: 4}
      - quote: {text: 太子不学，而答诏引义，必责作草主…不如直以意对, source: 晋书·后妃传, cue: 露馅, for: 4.4}

  - say: 张泓打好草稿，太子照着抄一遍。晋武帝一看，很满意。
    sources: [js-31]
    show:
      - act: {act: prop, at: 洛阳, item: 竹简, text: 太子自写, cue: 照着抄, size: 1.2, for: 3}

  - say: 贾南风是权臣贾充的女儿。晋武帝原本嫌她家善妒、又矮又黑，是杨皇后坚持要娶。
    sources: [js-31]
    show:
      - quote: {text: 贾家种妒而少子，丑而短黑, source: 晋书·后妃传, era: 泰始年间, cue: 又矮又黑, for: 4}

  # ---------------- 第四章 托孤 ----------------
  - say: 那晋武帝为什么不换太子？因为他还有一张牌：皇孙司马遹。
    phase: 托孤
    sources: [js-03, js-53]
    show:
      - enter: {who: 司马遹, side: right, cue: 司马遹, for: 4}

  - say: 宫里夜里失火，五岁的皇孙拉着爷爷躲进暗处：不能让火光照见皇上。
    sources: [js-53]
    camera: {focus: 洛阳, zoom: 10, move: 1.2}
    show:
      - fire: {at: 洛阳, cue: 失火, radius: 0.6, for: 3.6}
      - sfx: {name: 点火, cue: 失火}
      - act: {act: night, places: [洛阳], cue: 暗处, for: 3.4}

  - say: 晋武帝摸着孙子的背，对大臣说：
    sources: [js-53]
    scene: 朝堂

  - say: 这孩子，将来能让我司马家兴旺！
    speaker: 司马炎
    style: 抚着孙子的背，满心欢喜，语气笃定
    scene: 朝堂
    quote: 此兒当兴我家
    sources: [js-53]

  - say: 也有人想立他弟弟齐王司马攸。晋武帝把弟弟赶出京城，司马攸吐血而死。
    year: 283
    sources: [js-38]
    camera: {focus: [洛阳, 临淄], zoom: fit, move: 1.4}
    show:
      - enter: {who: 司马攸, side: right, cue: 司马攸, for: 3}
      - flee: {from: 洛阳, to: 临淄, label: 催上道, cue: 赶出京城}
      - exit: {who: 司马攸, at: 洛阳, verb: 薨, cue: 吐血}
      - sfx: {name: 退场钟, cue: 吐血}

  - say: 二九零年，晋武帝病危，下诏让汝南王回来辅政。诏书，被外戚杨骏扣下了。
    year: 290
    sources: [js-03, js-59]
    camera: {focus: [洛阳, 许昌], zoom: fit, move: 1.4}
    show:
      - act: {act: courier, places: [许昌, 洛阳], text: 留亮辅政, cue: 辅政, grow: 1.0, for: 2.6}
      - enter: {who: 杨骏, side: right, cue: 杨骏, for: 3.4}
      - sfx: {name: 不祥鼓, cue: 扣下}

  - say: 杨皇后另写遗诏：杨骏一人辅政。晋武帝醒来问：汝南王来了吗？左右说：还没到。
    sources: [js-03]
    camera: {focus: 洛阳, zoom: 8, move: 1.2}
    show:
      - act: {act: edict, at: 洛阳, text: 遗诏, sub: 以骏辅政, cue: 遗诏, for: 3.4}
      - quote: {text: 问汝南王来未…左右答言未至, source: 晋书·武帝纪, era: 太熙元年, cue: 来了吗, for: 3.8}

  - say: 四月，晋武帝死在含章殿，五十五岁。
    sources: [js-03]
    show:
      - act: {act: mourn, text: 崩, sub: 太熙元年 · 四月, cue: 含章殿, for: 3.4}
      - sfx: {name: 落幕锣, cue: 含章殿}

  - say: 杨骏住进太极殿，带着一百个卫士。连灵柩出殡，他都不下殿。
    sources: [js-40]
    show:
      - flag: {at: 洛阳, name: 杨骏, sub: 居太极殿, faction: 外戚, cue: 太极殿}
      - sfx: {name: 城门关闭, cue: 不下殿}
      - quote: {text: 骏不下殿，以武贲百人自卫, source: 晋书·杨骏传, era: 永熙元年, cue: 不下殿, for: 3.6}

  # ---------------- 收 ----------------
  - say: 晋武帝为什么敢传位给傻儿子？他押了三张牌：聪明的皇孙，握兵的宗室，可靠的外戚。
    sources: [js-03]
    camera: {focus: [洛阳, 长安, 江陵, 寿春], zoom: fit, move: 1.6}
    show:
      - enter: {who: 司马炎, side: left, cue: 三张牌, for: 4}

  - say: 可这三张牌，后来一张一张，全炸了。
    sources: [js-03]
    show:
      - card: {title: 史书怎么评, body: 武帝纪：中朝之乱，实始于斯矣, cue: 后来, for: 3.6}

  - say: 他撤掉了天下的兵，却把刀交到了自家人手里。
    sources: [js-43]
    show:
      - headline: {text: 刀在自家人手里, sub: 西晋之乱的种子, cue: 却把刀, for: 3.4}
      - sfx: {name: 史诗冲击, cue: 却把刀}

  - say: 如果你是晋武帝，这个太子，换，还是不换？
    sources: [js-03]
    show:
      - versus: {left: 司马炎, right: 司马衷, label: 换, cue: 换, for: 3.6}

  - say: 杨骏大权独揽。可他没想到，太子妃贾南风，已经盯上了他。
    sources: [js-40]
    show:
      - enter: {who: 贾南风, side: right, cue: 贾南风, for: 3.6}
      - title_bar: {text: 下集, sub: 两晋 · 贾南风借刀杀人, cue: 盯上, delay: 0.4, for: 3.0}
      - sfx: {name: 时代转折, cue: 盯上}
