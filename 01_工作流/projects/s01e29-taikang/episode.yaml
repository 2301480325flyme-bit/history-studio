publish:
  hook: 百姓饿死，皇帝问：为什么不吃肉粥？
  big: [太康盛世, 傻太子]
  hero: 司马炎
  at: 8
  summary: |
    280 年灭吴之后，晋武帝司马炎推行占田、户调，全国登记两百四十五万户，史称太康之治。可他也撤掉了州郡的兵，大郡只留百名武吏，宗室王国却能养兵五千；临终前又派儿子们出镇关中、荆州、扬州、许昌。
    太子司马衷"不堪政事"，卫瓘借酒摸着御座说"此座可惜"；武帝出考题，太子妃贾南风找人代答过关。武帝不换太子，是因为看好五岁就会护驾的皇孙司马遹。290 年武帝病危，托孤诏书被杨骏扣下，杨骏独揽大权——史书说，西晋之乱，从这里开始。
  tags: [西晋, 晋武帝, 司马衷, 贾南风, 何不食肉糜, 八王之乱]
  next: 贾南风借刀杀人

