open_questions:
- 对照疆域.yaml：304-08魏郡从成都王改回晋有惠帝纪和颖传支撑；是否将“邺城失守”仍按治所郡示意保留由Claude决定。
- 对照疆域.yaml：304-10汉赵仅列西河郡，成汉列蜀郡、广汉郡且 uncertain。李雄夺成都的纪年段与称成都王的304年段分开；广汉郡实际何时纳入、应否提前疆域事件待Claude决定。
- 对照疆域.yaml：302-307除现有304-08、304-10外，302-12冏杀与304-01乂死不产生郡级归属变化；无须新增郡级 set。
- 304-07邺由成都王控制，304-08王浚等破邺是否可以直接视作魏郡全郡转晋，仍属疆域表现尺度问题。
- 张方长安/霸上至洛阳路线未核；史书只记“向洛”、宜阳、河桥、洛阳西门、駃水桥西营。不得补入潼关/弘农/函谷关等节点而不注明推测。
- 惠帝303年秋驻次“宣武、石楼、豆田”及十三里桥、河桥、西晋洛阳城门、金墉城的精确位置均未核；是否纳入 gazetteer 由Claude决定。
- 王浚与东嬴公腾联军的具体起兵地、会师地、由幽州至邺的路线未核；可证内容为王浚屯冀州、与腾及乌丸羯朱袭颖。
- 荡阴之战双方路线仅能确定晋军由洛阳到安阳、石超次于荡阴；中间道路、渡口未核。
- 颖携惠帝自邺至洛阳，史书记五日至洛、羯朱追至朝歌；中间路线未知。卢志传记汲郡遇郝昌军，但不可据此断言全队沿汲郡大道。
- 鹿苑、七里涧与陆机“列军自朝歌至河桥”的地理关系未核；这是此前乂击退陆机之战，不是荡阴之战。
- 刘渊、李雄起兵只按疆域.yaml的初起根据地画斜纹/不确定区；不能把一城或首领称号解释成全郡稳定占有。
- 本地 sources 未返回《资治通鉴》卷八十二至八十四条目，通鉴出处暂未核；需有权限的语料索引或卷文才能完成双书互证。
- 立绘缺项：张方、石超、陆机、嵇绍、司马腾、刘渊、刘宣、李雄、罗尚、卢志、羯朱等均未见现存同名图片；是否为画面重点由Claude定。司马乂、冏、颖、颙、越、惠帝、王浚已有图。
