# 快节奏版（2026-10-25）
# 《三国到隋》第34集 · 两晋：荡阴之战，刘渊李雄起兵（304）。大纲第 29 条后半（前半长沙王之死在第 33 集）。
# 史料包：projects/s01e33-hunzhan/research/史料包.yaml（302–304）+ projects/s01e35-donghai/research/史料包.yaml（张方劫帝一条）。
# 本地语料核对（晋书）：
# 惠帝纪 p00101 永兴元年"秋七月丙申朔，右卫将军陈眕以诏召百僚入殿中，因勒兵讨成都王颖…东海王越…奉帝北征，至安阳，众十余万，颖遣其将石超距战。己未，六军败绩于荡阴，矢及乘舆，百官分散，侍中嵇绍死之。帝伤颊，中三矢，亡六玺。帝遂幸超军，馁甚，超进水，左右奉秋桃"；
#   "安北将军王浚遣乌丸骑攻成都王颖于鄴，大败之。颖舆帝单车走洛阳…次获嘉，市粗米饭，盛以瓦盆，帝啖两盂。有老父献蒸鸡…至温，将谒陵，帝丧履，纳从者之履"；
#   "冬十一月乙未，方请帝谒庙，因劫帝幸长安。方以所乘车入殿中，帝驰避后园竹中。方逼帝升车"；"李雄僭号成都王，刘元海僭号汉王"；
# 成都王颖传 p04629"军次安阳，众十余万，鄴中震惧。颖欲走，其掾步熊有道术，曰：勿动！南军必败"；"遣奋武将军石超率众五万，次于荡阴。二弟匡、规自鄴赴王师，云：鄴中皆已离散。由是不甚设备。超众奄至…乃弃天子于藁中"；
#   p04630"浚屯冀州不进，与腾及乌丸、羯硃袭颖…鄴中大震，百僚奔走，士卒分散。颖惧，将帐下数十骑，拥天子，与中书监卢志单车而走，五日至洛"；
# 嵇绍传 p06256"唯绍俨然端冕，以身捍卫，兵交御辇，飞箭雨集，绍遂被害于帝侧，血溅御服…左右欲浣衣，帝曰：此嵇侍中血，勿去"；
# 东海王越传 p04641"帝北征鄴，以越为大都督。六军败，越奔下邳…越径还东海"；
# 刘元海载记 p07033"元海至左国城，刘宣等上大单于之号，二旬之间，众已五万，都于离石"；p07034"夫帝王岂有常哉，大禹出于西戎，文王生于东夷…吾又汉氏之甥，约为兄弟，兄亡弟绍，不亦可乎？且可称汉"。
# 不用：王浚自幽州到邺的确切路线（史书只说屯冀州、袭颖；画成自蓟南下，示意）；司马腾自并州出兵的路线（画成自晋阳东来，示意）；李雄攻成都的过程（只讲称王）。

id: s01e34-dangyin
title: 荡阴之战
series: 两晋 · 第34集
year: 304

notes:
  - 主线问题：十几万大军护着皇帝出征，为什么一仗下来，皇帝身边只剩一个人？——谁都想把皇帝抢在手里当旗，可谁都没把他当回事；王爷们抢皇帝的这一年，匈奴人刘渊和巴氐人李雄看清了：晋朝，已经没人管了。
  - 钩子候选：①"十几万人护着皇帝出征，一仗打完，皇帝身边只剩一个人"（反差3 具体3 悬念3 兑现3=12）②"这是嵇侍中的血，别洗"（反差2 具体3 悬念2 兑现3=10）③"一年里，皇帝被抢了三次"（反差2 具体2 悬念2 兑现3=9）→ 选①，②做高潮台词，③做收尾。
  - 反差：十几万对五万，北征军却一触即溃；成都王抓到了皇帝，一个月后自己带着皇帝坐牛车逃；傻皇帝说"别洗"。
  - 细节：中了三箭、丢了六枚玉玺；被扔在草丛里，石超送水、左右摘秋桃；获嘉买粗米饭盛在瓦盆里；老人献蒸鸡；鞋丢了穿随从的；躲进后园竹林被拖上车。
  - 动机：成都王的两个弟弟谎报"邺城早散了"，北征军不设防；刘渊打"汉"的旗号，因为"晋人未必同我"。
  - 演义对照卡：本集无演义，结尾卡"史书怎么写"（嵇绍传"此嵇侍中血，勿去"）。

