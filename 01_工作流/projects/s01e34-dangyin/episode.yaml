publish:
  hook: 十几万人护着皇帝出征，一仗打完，皇帝身边只剩一个人
  big: [荡阴之战, 嵇侍中血]
  hero: 嵇绍
  at: 3
  summary: |
    304 年七月，东海王司马越等奉晋惠帝北征邺城的成都王颖，十几万人到了安阳。成都王的两个弟弟谎称"邺城早散了"，北征军不设防，被石超的五万人在荡阴一击即溃：箭射到御车上，皇帝脸上受伤、中了三箭、丢了六枚玉玺，百官逃散，只有侍中嵇绍挡在皇帝身前战死，血溅御服。事后皇帝说："这是嵇侍中的血，别洗。"
    一个月后，幽州王浚、并州司马腾带鲜卑乌桓骑兵攻破邺城，成都王带着皇帝坐牛车逃回洛阳，路上买粗米饭盛在瓦盆里吃。十月，匈奴刘渊在左国城称汉王，李雄在成都称成都王；十一月，张方又把躲进竹林的皇帝拖上车，劫往长安。
  tags: [西晋, 荡阴之战, 嵇绍, 晋惠帝, 刘渊, 八王之乱]
  next: 东海王胜出

