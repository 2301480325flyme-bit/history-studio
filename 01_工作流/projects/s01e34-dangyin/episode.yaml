    sources: [js-101]
    show:
      - quote: {text: 吾又汉氏之甥，约为兄弟，兄亡弟绍，不亦可乎？且可称汉, source: 晋书·刘元海载记, cue: 外甥, for: 4.4}

  - say: 西南，巴氐人李雄占了成都，自称成都王。
    map: '304-10-20'   # 李雄称成都王（与刘渊称汉王同月，分开上色）
    sources: [js-04]
    camera: {focus: [成都, 长安, 洛阳], zoom: fit, move: 1.4}
    show:
      - enter: {who: 李雄, side: right, cue: 李雄, for: 3.4}
      - flag: {at: 成都, name: 成都王, sub: 李雄, faction: 成汉, cue: 成都王, guest: true}

  - say: 十一月，河间王的大将张方进了洛阳，要把皇帝拉去长安。皇帝躲进后园竹林，还是被拖上了车。
    sources: [js-04]
    camera: {focus: [洛阳, 长安], zoom: fit, move: 1.4}
    tells: [e30]
    show:
      - vignette: {image: illus_bamboo_grove, cue: 竹林, for: 5, text: 帝驰避后园竹中}
      - march: {from: 洛阳, to: 长安, faction: 河间王, label: 劫帝幸长安, cue: 拖上了车, grow: 2.2}

  # ---------------- 收 ----------------
  - say: 一年里，皇帝从洛阳被拉到邺城，又逃回洛阳，再被拖去长安。
    sources: [js-04]
    camera: {focus: [洛阳, 邺, 长安], zoom: fit, move: 1.6}
    show:
      - headline: {text: 一年三迁, sub: 洛阳 · 邺 · 洛阳 · 长安, cue: 长安, for: 3.4}

  - say: 谁都想把皇帝抢在手里当旗，可谁都没把他当个人。
    sources: [js-04]
    show:
      - headline: {text: 皇帝成了一面旗, sub: 谁抢到谁有理, cue: 当旗, for: 3.4}
      - sfx: {name: 史诗冲击, cue: 当旗}

  - say: 这是嵇侍中的血，别洗。说这话的皇帝，你觉得他真傻吗？
    sources: [js-89]
    show:
      - card: {title: 史书怎么写, body: 嵇绍传：左右欲浣衣，帝曰：此嵇侍中血，勿去, cue: 真傻, for: 3.6}

  - say: 王爷们还在抢皇帝。匈奴人的刀，已经磨好了。
    sources: [js-101]
    show:
      - enter: {who: 刘渊, side: right, cue: 匈奴, for: 3.4}
      - title_bar: {text: 下集, sub: 两晋 · 东海王胜出, cue: 磨好了, delay: 0.4, for: 3.0}
      - sfx: {name: 时代转折, cue: 磨好了}
