  summary: |
    265 年，司马炎受魏禅，建立晋朝，天下只剩晋与吴。羊祜镇守荆州十年，来时军粮不够百日，后来存粮够吃十年；对面的陆抗病了，他送去良药，陆抗说"羊祜岂鸩人者"。羊祜屡次请战不成，临终推荐杜预接班，襄阳百姓罢市痛哭。
    280 年，王濬楼船顺江而下，草人木筏带走水下铁锥，灌油火炬烧断拦江铁锁；杜预克江陵，王濬直抵建业石头城，孙皓面缚出降。庆功宴上，晋武帝端着酒杯哭了："此羊太傅之功也。"三国九十六年，至此归晋。
  tags: [三分归晋, 羊祜, 陆抗, 王濬, 司马炎]
  next: 合集二·两晋开篇

