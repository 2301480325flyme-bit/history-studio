# 快节奏版（2026-10-14，按抖音数据：冷开场、只讲有戏的、无背景音乐）
# 《三国到隋》第28集：司马炎代魏、羊祜镇荆州、王濬楼船、孙皓出降，三分归晋（265–280）——三国篇收官
# 本地语料核对（晋书为主）：
# 羊祜传"祜卒二岁而吴平，群臣上寿，帝执爵流涕曰：此羊太傅之功也"；"祜之始至也，军无百日之粮，及至季年，有十年之积"；"在军常轻裘缓带，身不被甲"；
#   "抗尝病，祜馈之药，抗服之无疑心。人多谏抗，抗曰：羊祜岂鸩人者！…抗每告其戍曰：彼专为德，我专为暴，是不战而自服也。各保分界而已"；
#   "祜叹曰：天下不如意，恒十居七八，故有当断不断"；"疾渐笃，乃举杜预自代。寻卒，时年五十八…南州人征市日闻祜丧，莫不号恸，罢市，巷哭者声相接。吴守边将士亦为之泣"；
# 武帝纪"泰始元年冬十二月丙寅，设坛于南郊…封魏帝为陈留王"；"浚进破夏口、武昌，遂泛舟东下，所至皆平…三月壬申，王浚以舟师至于建邺之石头，孙皓大惧，面缚舆榇，降于军门…收其图籍，得州四，郡四十三，县三百一十三，户五十二万三千…男女口二百三十万"；"甲戌，杜预克江陵"；
# 王濬传"吴人于江险碛要害之处，并以铁锁横截之，又作铁锥长丈余，暗置江中，以逆距船…濬乃作大筏数十，亦方百余步，缚草为人，被甲持杖，令善水者以筏先行，筏遇铁锥，锥辄著筏去。又作火炬，长十余丈，大数十围，灌以麻油，在船前，遇锁，然炬烧之，须臾，融液断绝"。
# 不用：刘禹锡"一片降幡出石头"（唐诗，只在卡片里点到）。

id: s01e28-guijin
title: 三分归晋
series: 三国 · 第28集
year: 280

notes:
  - 主线问题：一个没赶上灭吴之战的人，凭什么是灭吴头功？——羊祜在荆州十年，攒下了粮，收服了人心，留下了方略和接班人；灭吴那一仗，十年前就开始了。
  - 反差：庆功宴上皇帝端着酒杯哭的，是一个死了两年的人；敌将生病，他送去的是药。
  - 细节：军中存粮从不够一百天到够吃十年；轻裘缓带、身不披甲；"羊祜岂鸩人者"；铁锁铁锥 vs 草人木筏和麻油火炬；孙皓面缚舆榇。
  - 动机：羊祜屡次请战被朝议阻拦，"天下不如意，恒十居七八"。
  - 收官：从黄巾起义到三分归晋，九十六年。

