open_questions:
- 三郡吏民叛应是否等同郡级疆域整体转属？疆域表列汉阳、安定为不确定区，天水与汉阳郡名口径待核。
- 赵云邓芝所经斜谷道只是扬声所称；诸葛亮和魏军到战场的逐段路线多未见记载。
- 西县、列柳城、南山、夹石地望未核，新增坐标都是示意点。
- 石亭战吴主传记八月、魏纪九月；本账依疆域表标228-09，跨国纪月对齐口径待定。
- 旁白称曹叡亲自坐镇长安，本地原文只称魏明帝西镇长安，与街亭战同月与否待核。
- 孙权称帝为229-04，超出地图终点228-12；地图是否扩展待定。
