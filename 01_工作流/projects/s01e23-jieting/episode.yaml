# 快节奏版（2026-10-14，按抖音数据：冷开场、只讲有戏的、无背景音乐）
# 《三国到隋》第23集：出师表、一出祁山、街亭之败、自贬三等、石亭之战、孙权称帝（227–229）
# 本地语料核对：
# 马谡传（马良传附）"先主临薨谓亮曰：马谡言过其实，不可大用，君其察之！亮犹谓不然…时有宿将魏延、吴壹等，论者皆言以为宜令为先锋，而亮违众拔谡…谡下狱物故，亮为之流涕"；
# 诸葛亮传 出师表"先帝创业未半而中道崩殂，今天下三分，益州疲弊，此诚危急存亡之秋也…亲贤臣，远小人，此先汉所以兴隆也；亲小人，远贤臣，此后汉所以倾颓也…临表涕零，不知所言"；
#   "六年春，扬声由斜谷道取郿，使赵云、邓芝为疑军，据箕谷，魏大将军曹真举众拒之。亮身率诸军攻祁山，戎陈整齐，赏罚肃而号令明，南安、天水、安定三郡叛魏应亮，关中响震。魏明帝西镇长安，命张郃拒亮…谡违亮节度，举动失宜，大为张郃所破。亮拔西县千余家，还于汉中，戮谡以谢众…至有街亭违命之阙，箕谷不戒之失，咎皆在臣授任无方…请自贬三等"；
# 张郃传"谡依阻南山，不下据城。郃绝其汲道，击，大破之"；王平传"谡舍水上山，举措烦扰，平连规谏谡，谡不能用…众尽星散，惟平所领千人鸣鼓自持，魏将张郃疑其伏兵，不往逼也。于是平徐徐收合诸营遗迸，率将士而还"；
# 吴主传"鄱阳太守周鲂伪叛，诱魏将曹休…使将军陆逊督诸将大破休于石亭"；周鲂传"休果信鲂，帅步骑十万…休幅裂瓦解"；"黄龙元年…夏四月…丙申，南郊即皇帝位"。
# 不用：空城计（注引郭冲三事，裴松之已驳）；"挥泪斩马谡"四字（襄阳记注文）——片中如实说两种记载。

id: s01e23-jieting
title: 街亭
series: 三国 · 第23集
year: 228

notes:
  - 主线问题：准备了五年的第一次北伐，怎么一下就输了？——输在一个刘备说过"不可大用"的人身上；诸葛亮自己的回答是：错在我用人不当。
  - 反差：三郡响应、关中震动，形势一片大好；一个先锋上了山，全盘皆输。
  - 细节：刘备临终"言过其实，不可大用"；马谡舍水上山，张郃断了汲水的路；王平千人敲鼓不动，张郃不敢逼；"请自贬三等"。
  - 动机：诸葛亮"违众拔谡"——他太欣赏马谡，常常和他从白天谈到深夜。
  - 演义对照：空城计出自注引《郭冲三事》，裴松之当时就驳了；马谡是被斩还是死在狱中，史书说法不一。

