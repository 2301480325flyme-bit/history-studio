beats:
  # ---------------- 冷开场 ----------------
  - say: 刘备临死前，特意叮嘱诸葛亮：有个人言过其实，不能大用。
    map: '225-09'
    year: 228
    phase: 不可大用
    sources: [sgz-39]
    show:
      - sfx: 重拍转场
      - quote: {text: 马谡言过其实，不可大用, source: 三国志·马良传, era: 章武三年, cue: 言过其实, for: 4.4}

  - say: 诸葛亮没听。五年后，这个人丢了街亭。
    sources: [sgz-39]
    camera: {focus: [汉中, 街亭, 祁山], zoom: fit, move: 1.6}
    show:
      - enter: {who: 马谡, side: right, cue: 这个人, for: 4}

  # ---------------- 第一章 出师表 ----------------
  - say: 二二七年，诸葛亮率大军北上汉中。临走前，他给刘禅上了一道奏章。
    map: '226-12'
    phase: 出师表
    year: 227
    sources: [sgz-35]
    camera: {focus: [成都, 汉中], zoom: fit, move: 1.6}
    tells: [e01]
    show:
      - title_bar: {text: 街亭, sub: 三国 · 第23集, for: 3.2}
      - sfx: 片头鼓
      - army: {head: 诸葛亮, from: 成都, to: 汉中, faction: 蜀汉, banner: 汉, troops: infantry, size: 2.8, label: 北驻汉中, cue: 北上, grow: 2.0}

  - say: 开头就说：先帝创业还没一半，就中途去世了。如今天下三分，益州疲弊，这真是危急存亡的时候。
    scene: 书房
    sources: [sgz-35]
    show:
      - quote: {text: 此诚危急存亡之秋也, source: 三国志·诸葛亮传·出师表, era: 建兴五年, cue: 危急存亡, for: 4.4}

  - say: 他叮嘱刘禅：亲近贤臣，远离小人，西汉因此兴隆；亲近小人，远离贤臣，东汉因此衰败。
    scene: 书房
    sources: [sgz-35]

  - say: 最后一句：如今要远行了，对着这道奏表，泪流满面，不知道该说什么。
    scene: 书房
    sources: [sgz-35]
    show:
      - quote: {text: 临表涕零，不知所言, source: 三国志·诸葛亮传·出师表, era: 建兴五年, cue: 泪流满面, for: 4}

  # ---------------- 第二章 祁山 ----------------
  - say: 二二八年春，诸葛亮放出风声：要走斜谷，去取郿县。让赵云、邓芝带一支疑兵，占住箕谷。
    phase: 祁山
    year: 228
    sources: [sgz-35]
    camera: {focus: [汉中, 箕谷, 郿, 长安], zoom: fit, move: 1.4}
    tells: [e02]
    show:
      - enter: {who: 赵云, side: left, cue: 赵云, for: 3}
      - march: {from: 汉中, to: 箕谷, faction: 蜀汉, label: 疑军, cue: 箕谷, grow: 1.6}

  - say: 魏国大将军曹真，赶紧带主力去堵。
    audit_ok: [遗忘]
    sources: [sgz-35]
    tells: [e03]
    show:
      - enter: {who: 曹真, side: right, cue: 曹真, for: 3}
      - army: {head: 曹真, from: 长安, to: 郿, faction: 魏, banner: 曹, troops: infantry, size: 2.8, cue: 主力, grow: 1.6}

  - say: 可诸葛亮自己，带着主力扑向了西边的祁山。
    sources: [sgz-35]
    camera: {focus: [汉中, 祁山, 冀], zoom: fit, move: 1.4}
    tells: [e04]
    show:
      - army: {head: 诸葛亮, from: 汉中, to: 祁山, faction: 蜀汉, banner: 汉, troops: infantry, size: 3.0, cue: 祁山, grow: 2.0}
      - sfx: {name: 低音转场, delay: -0.3}

  - say: 蜀军军容整齐，号令严明。南安、天水、安定三郡，一起背魏投蜀，关中震动。
    map: '228-02'
    owners_cue: 背魏投蜀
    sources: [sgz-35]
    tells: [e05, e05b]
    show:
      - quote: {text: 三郡叛魏应亮，关中响震, source: 三国志·诸葛亮传, era: 建兴六年, cue: 关中震动, for: 4}
      - sfx: {name: 疆域易手, cue: 背魏投蜀}

  - say: 魏明帝曹叡亲自坐镇长安，派老将张郃迎战。
    sources: [sgz-35]
    camera: {focus: [长安, 街亭, 祁山], zoom: fit, move: 1.4}
    show:
      - enter: {who: 曹叡, at: 长安, side: right, cue: 曹叡, for: 3}
      - army: {head: 张郃, from: 长安, to: 街亭, faction: 魏, banner: 张, troops: cavalry, size: 2.8, cue: 张郃, grow: 2.0}

  # ---------------- 第三章 街亭 ----------------
  - say: 最要紧的街亭，派谁去守？军中有魏延、吴懿这样的老将，大家都觉得该让他们当先锋。
    phase: 街亭
    sources: [sgz-39]
    camera: {focus: [祁山, 街亭], zoom: 10, move: 1.2}

  - say: 诸葛亮偏偏选了马谡。
    sources: [sgz-39]
    tells: [e06]
    show:
      - enter: {who: 马谡, side: left, cue: 马谡, for: 3.4}
      - march: {from: 祁山, to: 街亭, faction: 蜀汉, label: 马谡先锋, cue: 马谡, grow: 1.4}

  - say: 到了街亭，马谡不守城、不靠水，把军队拉上了南山。副将王平一次次劝，马谡不听。
    sources: [sgz-43, sgz-17]
    show:
      - enter: {who: 王平, side: right, cue: 王平, for: 3.6}
      - flag: {at: 街亭, name: 马谡, sub: 舍水上山, faction: 蜀汉, cue: 南山, guest: true}

  - say: 张郃一到，先断了山上取水的路，然后发起猛攻。
    sources: [sgz-17]
    tells: [e08]
    show:
      - enter: {who: 张郃, side: right, cue: 张郃, for: 3}
      - campaign:
          at: 街亭
          title: 街亭之战
          clash: 猛攻
          sides:
            - {from: 长安, faction: 魏, banner: 张, troops: cavalry, size: 2.8}
            - {from: 祁山, faction: 蜀汉, banner: 马, troops: infantry, size: 2.2}
      - sfx: {name: 古风擂鼓, cue: 猛攻}

  - say: 蜀军大乱，四散奔逃。只有王平那一千人，敲着鼓原地不动。张郃怀疑有伏兵，不敢逼近。
    audit_ok: [遗忘]
    sources: [sgz-43]
    show:
      - quote: {text: 惟平所领千人鸣鼓自持, source: 三国志·王平传, era: 建兴六年, cue: 敲着鼓, for: 4}

  - say: 王平慢慢收拢各营的散兵，带着大家撤了回来。
    sources: [sgz-43]

  - say: 街亭一丢，诸葛亮前面没了落脚的地方，只好带着西县一千多户百姓，退回汉中。
    map: '228-05'
    owners_cue: 退回汉中
    sources: [sgz-35]
    camera: {focus: [街亭, 祁山, 汉中], zoom: fit, move: 1.4}
    tells: [e12, e13, e13b]
    show:
      - army: {head: 诸葛亮, from: 祁山, to: 汉中, faction: 蜀汉, banner: 汉, troops: infantry, size: 2.4, label: 拔西县千余家, cue: 退回, grow: 2.0}   # 2026-10-25 整军而还，不画溃逃

  # ---------------- 第四章 自贬 ----------------
  - say: 马谡被关进大牢。一说被处死，一说死在狱中。诸葛亮为他流了泪。
    phase: 自贬
    sources: [sgz-35, sgz-39]
    show:
      - exit: {who: 马谡, at: 汉中, verb: 卒, portrait: true, cue: 大牢}
      - card: {title: 两种记载, body: 诸葛亮传"戮谡以谢众"；马良传"谡下狱物故，亮为之流涕", cue: 流了泪}

  - say: 诸葛亮上书刘禅：
    scene: 书房
    sources: [sgz-35]

  - say: 街亭违命，箕谷失利，错都在我用人不当。请把我降三级！
    speaker: 诸葛亮
    style: 沉痛自责，一字一顿，毫不推诿
    scene: 书房
    to: 刘禅
    sources: [sgz-35]
    show:
      - quote: {text: 咎皆在臣授任无方…请自贬三等, source: 三国志·诸葛亮传, era: 建兴六年, for: 4.4}

  - say: 刘禅降他为右将军，代理丞相，权力照旧。
    sources: [sgz-35]

  - say: 同一年秋天，东吴的周鲂假装投降，骗来了魏国大司马曹休的十万大军。
    sources: [sgz-47, sgz-60]
    camera: {focus: [皖, 石亭, 武昌], zoom: fit, move: 1.4}
    tells: [e15]
    show:
      - enter: {who: 曹休, side: right, cue: 曹休, for: 3}
      - army: {head: 曹休, from: 洛阳, to: 皖, faction: 魏, banner: 曹, troops: infantry, size: 3.0, cue: 十万, grow: 1.8}

  - say: 陆逊在石亭截住曹休，把他打得大败。
    sources: [sgz-47, sgz-60]
    tells: [e17]
    show:
      - enter: {who: 陆逊, side: left, cue: 陆逊, for: 3}
      - battle: {at: 石亭, text: 大破休于石亭, cue: 大败}

  - say: 第二年四月，孙权在武昌南郊登坛称帝。天下，有了三个皇帝。
    year: 229
    map: '228-12'   # 故意停在 228-12：229-03 蜀取武都留给第 24 集开场讲（史实审读 2026-10-24 复核）
    scene: 祭坛
    sources: [sgz-47]
    show:
      - enter: {who: 孙权, side: right, cue: 孙权, for: 4}
      - headline: {text: 三帝并立, sub: 公元二二九年, cue: 三个皇帝, for: 3.2}

  - say: 准备了五年的北伐，为什么一下就输了？输在一个刘备说过不能大用的人身上。
    sources: [sgz-39]
    camera: {focus: [汉中, 街亭, 长安, 成都], zoom: fit, move: 1.6}

  - say: 而诸葛亮的回答只有一句：错，在我。
    sources: [sgz-35]
    show:
      - card: {title: 演义 vs 正史, body: 空城计出自注引《郭冲三事》，裴松之已驳其不可信, cue: 错}

  - say: 街亭这一仗，你觉得该让魏延去守吗？
    sources: [sgz-39]

  - say: 诸葛亮没有停下。这一年冬天，他又出兵了。
    sources: [sgz-35]
