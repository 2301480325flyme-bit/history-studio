open_questions:
- 邓艾阴平行军原文分别出现“阴平道”“景谷道”“汉德阳亭”“江由左儋道”；这些名称是史书记录的路线标签，但精确线路、先后关系及是否全部为实际通行段尚未核，不宜直接画成摩天岭—景谷道单一确定路线。
- “摩天岭”在本地所查《三国志》《晋书》《华阳国志》《资治通鉴》原文中未检得；是否为后世地名附会，以及毛毡滚下的具体崖岭位置，未核。
- 魏纪、《三国志》记“冬十月”蜀主降，晋书记十一月；疆域.yaml现有日级日期明确是排序示意。应以哪个历法纪月作为地图变色月份，需统一口径；此账采用《三国志》263-10并保留异文说明。
- 汉城、乐城、阳安口、关城的具体遗址位置及空间关系未核；取汉中郡还是仅标为堡关失守作为疆域变化节点，需Claude结合疆域检查器决定。
- 刘禅出降后“巴蜀皆平”，蜀各郡县的逐个接收日期不见记载；本账只将成都及明载主要节点标为归魏，是否一拍全域变色需按检查器表达规则处理。
- 姜维在阴平桥头周旋时，廖化驻阴平与诸葛绪控制桥头的关系、援军具体站位未能由本地原文完全复原。
