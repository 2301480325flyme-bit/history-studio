  - say: 可事情还没完。第二年正月，邓艾被诬谋反，装进囚车押往京城。
    year: 264
    sources: [sgz-04]
    show:
      - act: {act: prison, at: 成都, text: 槛车征艾, cue: 囚车, for: 3.6}

  - say: 钟会想在蜀地自立，真的反了，姜维也跟着他起事。没几天，魏军哗变，钟会、姜维都死在乱兵之中。
    sources: [sgz-04, sgz-28]
    camera: {focus: 成都, zoom: 6, move: 1.2}
    show:
      - exit: {who: 钟会, at: 成都, verb: 诛, portrait: true, side: right, cue: 钟会}
      - exit: {who: 姜维, at: 成都, verb: 卒, portrait: true, cue: 乱兵}

  - say: 邓艾，也在押解的路上被杀了。
    sources: [sgz-04]
    show:
      - exit: {who: 邓艾, at: 绵竹, verb: 卒, portrait: true, cue: 被杀}
      - sfx: {name: 退场钟, cue: 被杀}

  - say: 刘禅被封为安乐公，送到了洛阳。据说司马昭问他：想念蜀地吗？他说：这里很快乐，不想。
    sources: [sgz-04, sgz-33]
    camera: {focus: [成都, 洛阳], zoom: fit, move: 1.4}
    show:
      - card: {title: 据说 · 乐不思蜀, body: 此间乐，不思蜀——后主传注引《汉晋春秋》, cue: 不想}

  - say: 十几万人攻不下的剑阁，蜀汉怎么还是亡了？邓艾走了一条没人敢走的路，绕到了背后。
    sources: [sgz-28]
    camera: {focus: [阴平, 剑阁, 成都], zoom: fit, move: 1.4}

  - say: 绵竹一败，成都里的人，已经没有守下去的心了。
    sources: [sgz-28]
    show:
      - vignette: {image: illus_liushan_surrender, cue: 成都, for: 8, text: 面缚舆榇}

  - say: 刘禅开城投降，你觉得是懦弱，还是保全了一城百姓？
    audit_ok: [投降]
    sources: [sgz-33]

  - say: 灭了蜀，司马昭离皇位只差一步。这一步，他没走完，他的儿子替他走完了。
    sources: [sgz-04]
    camera: {focus: [洛阳, 成都], zoom: fit, move: 1.6}
    show:
      - enter: {who: 司马昭, side: right, cue: 司马昭, for: 3.4}
      - title_bar: {text: 下集, sub: 三分归晋, cue: 儿子, delay: 0.4, for: 3.0}
