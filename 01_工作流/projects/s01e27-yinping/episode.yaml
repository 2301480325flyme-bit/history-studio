    263 年，司马昭三路伐蜀。钟会十几万大军被姜维挡在剑阁，怎么也攻不下来。邓艾上书："攻其无备，出其不意。"他从阴平出发，走了七百多里无人之地，凿山开路、架设栈道，到了绝壁就用毛毡裹住自己滚下去。
    魏军突然出现在江由，蜀将马邈投降；绵竹一战，诸葛亮之子诸葛瞻战死。刘禅带群臣六十多人反绑双手、抬着棺材出降，蜀汉灭亡。姜维的将士拔刀砍石；几个月后，钟会谋反，邓艾、钟会、姜维先后死于乱中。
  tags: [偷渡阴平, 邓艾, 姜维, 钟会, 蜀汉灭亡]
  next: 司马炎代魏，三分归晋

