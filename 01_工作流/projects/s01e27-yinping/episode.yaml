# 快节奏版（2026-10-14，按抖音数据：冷开场、只讲有戏的、无背景音乐）
# 《三国到隋》第27集：三路伐蜀、剑阁、邓艾偷渡阴平、绵竹、刘禅出降、钟会之乱（263–264）
# 本地语料核对：
# 邓艾传"维遂东引，还守剑阁。钟会攻维未能克。艾上言：今贼摧折，宜遂乘之，从阴平由邪径经汉德阳亭趣涪，出剑阁西百里，去成都三百余里，奇兵冲其腹心。剑阁之守必还赴涪，则会方轨而进；剑阁之军不还，则应涪之兵寡矣…攻其无备，出其不意"；
#   "冬十月，艾自阴平道行无人之地七百余里，凿山通道，造作桥阁。山高谷深，至为艰险，又粮运将匮，频于危殆。艾以毡自裹，推转而下。将士皆攀木缘崖，鱼贯而进。先登至江由，蜀守将马邈降。蜀卫将军诸葛瞻自涪还绵竹，列陈待艾。艾遣子惠唐亭侯忠等出其右…忠、纂战不利，并退还，曰：贼未可击。艾怒曰：存亡之分，在此一举，何不可之有？乃叱忠、纂等，将斩之。忠、纂驰还更战，大破之，斩瞻…进军到雒，刘禅遣使奉皇帝玺绶，为笺诣艾请降；艾至成都，禅率太子诸王及群臣六十余人面缚舆榇诣军门"；
# 钟会传"今遣钟会率十余万众伐蜀"；姜维传"寻被后主敕令，乃投戈放甲，诣会于涪军前，将士咸怒，拔刀斫石"；
# 三少帝纪"咸熙元年春正月壬戌，槛车征邓艾…是月，钟会反于蜀，为众所讨；邓艾亦见杀…丁亥，封刘禅为安乐公"。
# 注文（片中标"据说"）："此间乐，不思蜀"（后主传注引汉晋春秋）。

id: s01e27-yinping
title: 偷渡阴平
series: 三国 · 第27集
year: 263

notes:
  - 主线问题：十几万大军攻不下的剑阁，蜀汉怎么还是亡了？——邓艾走了一条没人敢走的路，绕到了背后；绵竹一败，成都已经没了守下去的心。
  - 反差：钟会十几万人卡在剑阁；邓艾几万人裹着毛毡从悬崖滚下去，反倒先到了成都。灭蜀的两员魏将，都没活过第二年正月。
  - 细节：凿山通道、造作桥阁；以毡自裹，推转而下；邓艾差点斩了打退堂鼓的亲儿子；刘禅面缚舆榇；姜维的将士拔刀砍石。
  - 动机：邓艾的算盘——剑阁守军回救，钟会就能长驱直入；不回救，涪城就空了。
  - 演义对照："乐不思蜀"出自注引《汉晋春秋》。

