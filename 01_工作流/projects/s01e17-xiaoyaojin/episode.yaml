      - battle: {at: 阳平关, text: 横山筑城十余里, cue: 攻不下}

  - say: 曹操只好撤兵。守军以为曹军走了，防备松懈。曹操派兵趁夜翻山偷袭，大破阳平关。
    sources: [sgz-01]
    camera: {focus: [阳平关, 南郑], zoom: fit, move: 1.2}
    show:
      - act: {act: night, places: [阳平关], cue: 趁夜, text: 乘险夜袭}
