    camera: {focus: [南郑, 阆中], zoom: fit, move: 1.2}
    show:
      - army: {from: 阆中, to: 南郑, faction: 张鲁, head: 张鲁, troops: infantry, size: 1.2, cue: 投降, grow: 1.6, camp: false}
      - flag: {at: 南郑, name: 张鲁, sub: 投降 · 封阆中侯, faction: 曹操, cue: 投降}

  - say: 汉中丢了，刘备怕后院起火，赶紧跟孙权讲和。
    sources: [sgz-32]
    camera: {focus: [南郑, 成都, 公安], zoom: fit, move: 1.6}

  - say: 两家以湘水为界：东边的江夏、长沙、桂阳归孙权，西边的南郡、零陵、武陵归刘备。
    map: '215-08'
    owners_cue: 湘水为界
    sources: [sgz-32, sgz-54]
    camera: {focus: [江陵, 长沙, 零陵], zoom: fit, move: 1.4}
    show:
      - army: {from: 益阳, to: 江陵, faction: 刘备, head: 关羽, troops: infantry, size: 2, cue: 湘水, grow: 1.6}
      - headline: {text: 湘水划界, sub: 建安二十年, cue: 湘水, for: 3.2}
      - sfx: {name: 疆域易手, cue: 湘水}

  # ---------------- 第三章 密函 ----------------
  - say: 曹操远在汉中。孙权一看机会来了，带着十万大军，包围了合肥。
    phase: 密函
    sources: [sgz-17, sgz-47]
    camera: {focus: [濡须, 合肥], zoom: 6, move: 1.4}
    show:
      - army: {from: 濡须, to: 合肥, faction: 孙权, head: 孙权, troops: infantry, size: 3.6, cue: 十万大军, grow: 1.6}
      - sfx: {name: 低音转场, delay: -0.3}

  - say: 合肥城里，只有张辽、乐进、李典，七千多人。
    sources: [sgz-17]
    show:
      - flag: {at: 合肥, name: 张辽 · 乐进 · 李典, sub: 七千余人, faction: 曹操, cue: 七千}
      - enter: {who: 李典, side: right, cue: 李典, for: 2.6}

  - say: 他们拆开曹操临走留下的密函，上面写着：敌人来了才能打开。
    sources: [sgz-17]
    show:
      - quote: {text: 贼至乃发, source: 三国志·张辽传, era: 建安二十年, cue: 密函, for: 3.6}

  - say: 信里说：孙权来了，张辽、李典出城迎战，乐进守城。将领们都犯嘀咕。张辽说：
    sources: [sgz-17]

  - say: 等救兵赶到，我们早完了！趁他们还没站稳，先打掉他们的锐气，城才守得住！
    speaker: 张辽
    style: 斩钉截铁，杀气腾腾，声如洪钟
    scene: 军帐
