  # ---------------- 第一章 讨荆州 ----------------
  - say: 事情要从荆州说起。刘备拿下益州，孙权派人来要荆州。刘备回话：
    phase: 讨荆州
    sources: [sgz-32]
    camera: {focus: [成都, 公安, 柴桑], zoom: fit, move: 1.6}
    show:
      - title_bar: {text: 逍遥津, sub: 三国 · 第17集, for: 3.2}
      - sfx: 片头鼓
      - versus: {left: 孙权, right: 刘备, label: 讨荆州, cue: 要荆州, for: 4}

  - say: 等我拿下凉州，荆州自然给你。
    speaker: 刘备
    style: 温和客气，不急不缓，打着太极
    sources: [sgz-32]

  - say: 凉州还在曹操手里。孙权大怒，派吕蒙一口气夺了长沙、零陵、桂阳。
    map: '215-05'
    owners_cue: 夺了
    sources: [sgz-32]
    camera: {focus: [公安, 长沙, 零陵, 桂阳], zoom: fit, move: 1.4}
    show:
      - enter: {who: 吕蒙, side: right, cue: 吕蒙, for: 3}
      - march: {from: 柴桑, to: 长沙, faction: 孙权, label: 袭夺三郡, cue: 夺了, grow: 1.6}
      - sfx: {name: 疆域易手, cue: 夺了}

  - say: 刘备带五万人赶到公安，派关羽进兵益阳，两家眼看就要开打。
    sources: [sgz-32]
    show:
      - army: {from: 江陵, to: 益阳, faction: 刘备, head: 关羽, troops: infantry, size: 2.4, cue: 益阳, grow: 1.6}
      - sfx: {name: 低音转场, delay: -0.3}

  - say: 鲁肃约关羽见面。兵马都停在一百步外，双方将领只带一把刀。
    sources: [sgz-54]
    camera: {focus: 益阳, zoom: 8, move: 1.2}
    show:
      - camp: {at: 益阳, unit: 鲁肃, faction: 孙权, text: 鲁肃, cue: 鲁肃, until: beat+11}
      - versus: {left: 鲁肃, right: 关羽, label: 单刀俱会, cue: 一把刀, for: 2.6}
      - sfx: {name: 拔剑, cue: 一把刀}

  - say: 鲁肃当面质问：当初借地给你们，是看你们打了败仗，没地方落脚。
    sources: [sgz-54]
    camera: {focus: 益阳, zoom: 11, move: 2.4}
    show:
      - quote: {text: 国家区区本以土地借卿家者，卿家军败远来，无以为资故也, source: 三国志·鲁肃传, era: 建安二十年, cue: 借地, for: 4.2}

  - say: 如今得了益州，连三个郡都不肯还？
    sources: [sgz-54]
    show:
      - quote: {text: 今已得益州，既无奉还之意，但求三郡，又不从命, source: 三国志·鲁肃传, era: 建安二十年, cue: 益州, for: 3.6}

  - say: 就在这时，曹操率大军去打汉中的张鲁。
    sources: [sgz-01]
    camera: {focus: [长安, 南郑, 成都, 公安], zoom: fit, move: 1.6}

  # ---------------- 第二章 汉中 ----------------
  - say: 曹军到了阳平关。张鲁派弟弟张卫守关，沿山筑起十几里的城墙，曹军怎么也攻不下。
    phase: 汉中
    sources: [sgz-01]
    camera: {focus: [长安, 阳平关, 南郑], zoom: fit, move: 1.4}
    show:
      - camp: {at: 阳平关, unit: 张卫, faction: 张鲁, text: 张卫, cue: 张卫}
