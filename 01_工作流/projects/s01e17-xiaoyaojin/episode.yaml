# 快节奏版（2026-10-14，按抖音数据：冷开场、只讲有戏的、无背景音乐）
# 《三国到隋》第17集：讨荆州、湘水划界、曹操取汉中、张辽威震逍遥津（215）
# 本地语料核对：
# 先主传"二十年，孙权以先主已得益州，使使报欲得荆州。先主言：须得凉州，当以荆州相与。权忿之，乃遣吕蒙袭夺长沙、零陵、桂阳三郡。先主引兵五万下公安，令关羽入益阳。是岁，曹公定汉中，张鲁遁走巴西。先主闻之，与权连和，分荆州…"；
# 鲁肃传"肃邀羽相见，各驻兵马百步上，但诸将军单刀俱会…坐有一人曰：夫土地者，惟德所在耳，何常之有！肃厉声呵之…羽操刀起谓曰：此自国家事，是人何知！目使之去。备遂割湘水为界"；
# 武帝纪"秋七月，公至阳平。张鲁使弟卫与将杨昂等据阳平关…攻之不能拔，乃引军还。贼见大军退，其守备解散。公乃密遣解剽、高祚等乘险夜袭，大破之…鲁溃奔巴中。公军入南郑"；
# 张鲁传"左右欲悉烧宝货仓库，鲁曰…宝货仓库，国家之有。遂封藏而去。太祖入南郑，甚嘉之"；
# 张辽传"太祖征张鲁，教与护军薛悌，署函边曰贼至乃发。俄而权率十万众围合肥…教曰：若孙权至者，张、李将军出战；乐将军守…辽夜募敢从之士，得八百人，椎牛飨将士…平旦，辽被甲持戟，先登陷陈，杀数十人，斩二将，大呼自名，冲垒入，至权麾下。权大惊…走登高冢，以长戟自守。辽叱权下战，权不敢动…乃聚围辽数重。辽左右麾围，直前急击，围开…余众号呼曰：将军弃我乎！辽复还突围，拔出余众…自旦战至日中，吴人夺气…权守合肥十余日，城不可拔，乃引退。辽率诸军追击，几复获权…建安二十一年，太祖复征孙权，到合肥，循行辽战处，叹息者良久"；
# 吴主传"权与淩统、甘宁等在津北为魏将张辽所袭，统等以死扞权。权乘骏马越津桥得去"。
# 不用："张辽止啼"（出自后世）；关羽"单刀赴会"的演义情节（史书是鲁肃邀关羽，双方各带刀）。

id: s01e17-xiaoyaojin
title: 逍遥津
series: 三国 · 第17集
year: 215

notes:
  - 主线问题：孙权十万大军围合肥，怎么被八百人打怕了？——趁敌人没站稳先打掉锐气；主将冲在最前，大喊自己的名字。
  - 反差：十万对七千，城外的人反倒先怕了；孙权站在土丘上举着长戟，不敢下来。
  - 细节：曹操留下的密函"贼至乃发"；杀牛犒劳八百死士；"将军弃我乎"——张辽又杀回去救人；孙权骑马跳过断了的津桥。
  - 动机：孙权趁曹操远在汉中出兵；刘备怕曹操从汉中南下，赶紧和孙权讲和，湘水划界。
  - 演义对照："单刀赴会"小说里是关羽的独角戏，史书是鲁肃邀关羽、双方将领各带一把刀会面，鲁肃占了上风。

