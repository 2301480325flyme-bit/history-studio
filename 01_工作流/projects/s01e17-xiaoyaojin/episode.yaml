  big: [威震逍遥津]
  hero: 张辽
  at: 30
  summary: |
    刘备拿下益州，孙权来讨荆州，刘备说"等我拿下凉州再给你"。孙权派吕蒙夺了三郡，鲁肃和关羽各带一把刀会面。曹操突然打下汉中，刘备只好讲和，湘水为界，平分荆州。
    孙权趁曹操远在汉中，带十万人围合肥。张辽拆开曹操留下的密函，连夜招募八百死士，天亮冲进吴军大营，大喊自己的名字，直杀到孙权的大旗下。孙权围城十几天不下，撤退时在逍遥津差点被追上，骑马跳过断桥才逃走。
  tags: [逍遥津, 张辽, 孙权, 合肥之战, 单刀会]
  next: 定军山，刘备夺汉中

