      - card: {title: 八百死士, body: 辽夜募敢从之士，得八百人，椎牛飨将士, cue: 八百人}

  # ---------------- 第四章 逍遥津 ----------------
  - say: 天一亮，张辽披甲持戟，第一个冲进敌阵，杀了几十人，斩了两员将，一路杀到孙权的大旗下。
    phase: 逍遥津
    sources: [sgz-17]
    camera: {focus: 合肥, zoom: 12, move: 1.2}
    show:
      - tactic: {layout: raid, title: 合肥之战 · 示意, attacker: 曹操, defender: 孙权, banner_a: 张, banner_d: 孙, labels: {a: 张辽 · 敢死八百, d: 孙权 · 号称十万, city: 合肥, mound: 高冢}, phase: charge, cue: 冲进敌阵}
      - sfx: {name: 刀剑交击, cue: 杀了}

  - say: 孙权吓坏了，跑上一个土丘，举着长戟护住自己。张辽在下面喊他下来打，孙权不敢动。
    sources: [sgz-17]
    show:
      - tactic: {layout: raid, title: 合肥之战 · 示意, attacker: 曹操, defender: 孙权, banner_a: 张, banner_d: 孙, labels: {a: 张辽 · 敢死八百, d: 孙权 · 号称十万, city: 合肥, mound: 高冢}, phase: climb, cue: 土丘}
      - enter: {who: 孙权, side: right, cue: 孙权, for: 3.6}

  - say: 吴军一层层围上来。张辽杀开一条口子冲了出去，身后的人喊：将军，你不要我们了吗！
    sources: [sgz-17]
    show:
      - tactic: {layout: raid, title: 合肥之战 · 示意, attacker: 曹操, defender: 孙权, banner_a: 张, banner_d: 孙, labels: {a: 张辽 · 敢死八百, d: 孙权 · 号称十万, city: 合肥, mound: 高冢}, phase: breakout, cue: 杀开, for: 6.5}
      - tactic: {layout: raid, title: 合肥之战 · 示意, attacker: 曹操, defender: 孙权, banner_a: 张, banner_d: 孙, labels: {a: 张辽 · 敢死八百, d: 孙权 · 号称十万, city: 合肥, mound: 高冢}, phase: surround, cue: 围上来}
      - quote: {text: 将军弃我乎, source: 三国志·张辽传, era: 建安二十年, cue: 不要我们, for: 3.6}

  - say: 张辽又杀了回去，把剩下的人全救了出来。从早上打到中午，吴军的士气，彻底垮了。
    sources: [sgz-17]
    show:
      - vignette: {image: illus_zhangliao_rescue, cue: 从早上, for: 4.5, text: 张辽杀回重围}
      - sfx: {name: 古风擂鼓, cue: 杀了回去}

  - say: 孙权围了十几天，合肥还是打不下，只好撤兵。
    sources: [sgz-17]

  - say: 撤到逍遥津北岸，张辽又追了上来。凌统、甘宁拼死挡住，孙权骑马跳过津桥，才逃了出去。
    sources: [sgz-47, sgz-17]
    camera: {focus: [合肥, 逍遥津], zoom: 18, move: 1.2}
    show:
      - enter: {who: 凌统, side: right, cue: 凌统, for: 3}
      - enter: {who: 甘宁, side: left, cue: 甘宁, for: 3.4}
      - rout: {at: 合肥, to: 濡须, faction: 孙权, head: 孙权, banner: 孙, cue: 撤到, size: 2.4}
      - battle: {at: 逍遥津, text: 越津桥得去, cue: 跳过}

  - say: 第二年，曹操来到合肥，在张辽打仗的地方转了一圈，叹息了很久。
    year: 216
    sources: [sgz-17]
    camera: {focus: [合肥, 濡须], zoom: fit, move: 1.4}
    show:
      - enter: {who: 曹操, side: left, cue: 曹操, for: 3.4}

  - say: 八百人凭什么吓退十万？趁敌人没站稳，先把锐气打掉；主将冲在最前面，喊着自己的名字。
    sources: [sgz-17]
    show:
      - headline: {text: 威震逍遥津, sub: 建安二十年, for: 3.4}
      - card: {title: 演义 vs 正史, body: 单刀赴会在史书里是鲁肃邀关羽、双方各带一刀，占上风的是鲁肃, cue: 主将}

  - say: 张辽和孙权，你觉得谁的胆子更大？
    sources: [sgz-17]

  - say: 可曹操这一走，汉中就交给了夏侯渊。法正对刘备说：汉中，必须拿下。
    sources: [sgz-32]
    camera: {focus: [南郑, 成都], zoom: fit, move: 1.6}
    show:
      - camp: {at: 南郑, unit: 夏侯渊, faction: 曹操, text: 夏侯渊, cue: 夏侯渊}
      - army: {from: 南郑, to: 长安, faction: 曹操, head: 曹操, troops: infantry, size: 2.4, cue: 这一走, grow: 1.8}
      - title_bar: {text: 下集, sub: 定军山 · 汉中王, cue: 汉中, delay: 0.4, for: 3.0}
