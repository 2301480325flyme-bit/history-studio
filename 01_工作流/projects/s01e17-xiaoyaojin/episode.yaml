      - rout: {at: 阳平关, to: 南郑, faction: 张鲁, unit: 张卫, cue: 大破, size: 1.6}

  - say: 张鲁逃往巴中。手下要烧掉仓库，张鲁拦住了：
    sources: [sgz-08]
    camera: {focus: [南郑, 阆中], zoom: fit, move: 1.2}
    show:
      - enter: {who: 张鲁, at: 南郑, side: right, cue: 张鲁, for: 3.6}
      - army: {from: 南郑, to: 阆中, faction: 张鲁, head: 张鲁, troops: infantry, size: 1.8, cue: 巴中, grow: 1.8}

  - say: 这些财宝仓库，是国家的，烧不得。
    speaker: 张鲁
    style: 平静诚恳，挥手制止，不慌不忙
    sources: [sgz-08]

  - say: 他把仓库封好才走。曹操进了南郑，见仓库完好无损，很是赞赏。
    map: '215-07'
    owners_cue: 南郑
    sources: [sgz-08, sgz-01]
    camera: {focus: [阳平关, 南郑, 阆中], zoom: fit, move: 1.2}
    show:
      - army: {from: 阳平关, to: 南郑, faction: 曹操, head: 曹操, troops: infantry, size: 2.6, cue: 南郑, grow: 1.8}

  - say: 张鲁本就想归顺朝廷。曹操派人去巴中安抚，张鲁带着全家出来投降，被封为阆中侯。
