beats:
  # ---------------- 第一章 白马与延津 ----------------
  - say: 上回说到，袁绍统一了河北。公元二百年，他挑出精兵十万、战马一万匹，向黄河边的黎阳开进，要一举拿下许县。
    phase: 白马与延津
    sources: [sgz-06]
    year: 200
    camera: {focus: [邺, 黎阳, 许], zoom: fit, move: 2.0}
    map: '200-01'
    show:
      - title_bar: {text: 官渡之战, sub: 三国 · 第9集, cue: 上回, for: 3.2}
      - forces: {left: {name: 曹军, sub: 兵不满万, who: 曹操}, right: {name: 袁军, sub: 精兵十万, who: 袁绍}, loser: right, cue: 精兵十万, for: 5.2}
      - sfx: 片头鼓
      - army: {from: 邺, to: 黎阳, faction: 袁绍, banner: 袁, troops: cavalry, size: 3.6, cue: 精兵十万, grow: 2.6}
      - sfx: {name: 大军号角, cue: 精兵十万}

  - say: 他先派大将颜良，渡河围攻白马。
    sources: [sgz-01]
    camera: {focus: [黎阳, 白马, 延津], zoom: fit, move: 1.2}
    show:
      - enter: {who: 颜良, side: left, cue: 颜良, for: 2.6}
      - siege: {at: 白马, text: 围, faction: 袁绍, cue: 白马, for: 3}

  - say: 曹操用了谋士荀攸的计策：先假装要从延津渡河，去抄袁绍的后路。袁绍果然分兵往西去拦。
    sources: [sgz-01, sgz-10]
    show:
      - arrow: {from: 官渡, to: 延津, kind: direction, faction: 曹操, cue: 假装, grow: 1.4}
      - march: {from: 黎阳, to: 延津, faction: 袁绍, cue: 分兵往西, grow: 1.4}

  - say: 曹操却突然掉头，带轻兵直扑白马。关羽远远望见颜良的车盖，策马冲进万人之中，一刀刺死颜良，斩下首级就回来了。袁军，没有一个人挡得住。
    sources: [sgz-36, sgz-01]
    show:
      - army: {from: 延津, to: 白马, faction: 曹操, banner: 曹, troops: cavalry, size: 1.6, cue: 掉头, grow: 1.6}
      - enter: {who: 关羽, side: right, cue: 关羽, for: 3.4}
      - act: {act: execute, at: 白马, text: 斩颜良, cue: 刺死颜良, for: 2.6}
      - exit: {who: 颜良, at: 白马, verb: 斩, cue: 斩下首级, portrait: true, side: left}
      - sfx: {name: 刀剑, cue: 刺死}

  - say: 袁绍渡河来追。曹操在延津南边的山坡下，让骑兵卸鞍放马，还把辎重扔在路上。
    sources: [sgz-01]
    camera: {focus: [白马, 延津], zoom: 6, move: 1.2}
    show:
      - act: {act: prop, at: 延津, item: 粮车, text: 弃辎重饵敌, cue: 辎重, for: 4}

  - say: 文丑和刘备带着五六千骑兵赶到，一看满地辎重，纷纷去抢。阵型，乱了。
    sources: [sgz-01]
    show:
      - army: {from: 白马, to: 延津, faction: 袁绍, banner: 文, troops: cavalry, size: 2.4, cue: 五六千骑兵, grow: 1.8}

  - say: 曹操这才下令上马。不到六百名骑兵杀出，大破袁军，斩了文丑。
    sources: [sgz-01]
    show:
      - battle: {at: 延津, text: 斩文丑, title: 延津之战, cue: 杀出}
      - exit: {who: 文丑, at: 延津, verb: 斩, cue: 斩了文丑}
      - card: {title: 演义 vs 正史, body: 关羽只斩颜良；文丑是曹军所斩, cue: 文丑}

  - say: 两员名将一战就没了，袁军大为震动。不久，关羽封还了曹操的赏赐，留下书信，回到了刘备身边。
    sources: [sgz-01, sgz-36]
    camera: {focus: [延津, 官渡], zoom: fit, move: 1.2}

  # ---------------- 第二章 官渡相持 ----------------
  - say: 八月，袁绍的大营推进到官渡，连营东西几十里。
    phase: 官渡相持
    sources: [sgz-01]
    camera: {focus: [黎阳, 官渡, 许], zoom: fit, move: 1.4}
    show:
      - campaign:
          at: 官渡
          title: 官渡之战
          clash: 连营
          sides:
            - {from: 黎阳, faction: 袁绍, banner: 袁, troops: infantry, size: 3.6}
            - {from: 许, faction: 曹操, banner: 曹, troops: infantry, size: 1.6}

  - say: 曹操的兵力远远少于袁绍。史书说他"兵不满万，伤者十之二三"，这个数字史家也有怀疑，但处境之难，可想而知。
    sources: [sgz-01]
    show:
      - quote: {text: 时公兵不满万，伤者十二三, source: 三国志·武帝纪, era: 建安五年, cue: 兵不满万}

  - say: 袁绍堆起土山、搭起高楼，从上往下朝曹营放箭。曹营里的人，走路都得顶着盾牌。
    sources: [sgz-06, sgz-01]
    camera: {focus: 官渡, zoom: 6, move: 1.2}
    show:
      - act: {act: prop, at: 官渡, item: 望楼, text: 高橹土山, cue: 高楼, for: 3.4}
      - act: {act: arrows, places: [黎阳, 官渡], cue: 放箭, for: 3}
      - sfx: {name: 箭雨, cue: 放箭}

  - say: 曹操造了一种发石车，把袁军的高楼一座座砸塌，袁军管它叫"霹雳车"。袁绍又挖地道，曹操就在营里挖长沟对付。
    sources: [sgz-06]
    show:
      - act: {act: catapult, places: [官渡, 白马], text: 霹雳车, cue: 发石车, for: 4}

  - say: 就这样相持了几个月。曹军粮食快吃光了，士兵疲惫，后方还有人暗通袁绍。曹操写信给留守许县的荀彧，说想退兵。
    sources: [sgz-01, sgz-10]
    camera: {focus: [官渡, 许], zoom: fit, move: 1.2}
    show:
      - act: {act: courier, places: [官渡, 许], text: 欲还许, cue: 写信, grow: 1.4, for: 3}

  - say: 荀彧回信说：
    sources: [sgz-10]
    show:
      - enter: {who: 荀彧, side: left, cue: 荀彧, for: 2.4}

  - say: 您用十分之一的兵力，扼住了袁绍的咽喉，让他半年动弹不得。他已经露出了底牌，必然生变。这正是出奇制胜的时候，千万不能错过！
    speaker: 荀彧
    style: 从容坚定，字字恳切，鼓舞人心
    sources: [sgz-10]

  - say: 曹操咬着牙，坚持了下来。
    sources: [sgz-10]

  # ---------------- 第三章 火烧乌巢 ----------------
  - say: 十月，袁绍派淳于琼带一万多人，押送一万多车粮草，屯在大营以北四十里的乌巢。
    phase: 火烧乌巢
    sources: [sgz-01]
    camera: {focus: [官渡, 乌巢], zoom: fit, move: 1.4}
    show:
      - act: {act: prop, at: 乌巢, item: 粮车, text: 辎重万余乘, cue: 粮草, size: 1.2, for: 4}
      - flag: {at: 乌巢, name: 淳于琼, sub: 屯乌巢, faction: 袁绍, cue: 淳于琼, guest: true}

  - say: 就在这时，袁绍的谋士许攸，因为家人犯法被抓，又嫌袁绍待他不够好，连夜投奔了曹操。
    sources: [sgz-01, sgz-10]
    show:
      - enter: {who: 许攸, side: left, cue: 许攸, for: 3}
      - march: {from: 乌巢, to: 官渡, faction: 袁绍, label: 许攸来奔, cue: 投奔, grow: 1.4}

  - say: 据说，曹操一听许攸来了，连鞋都顾不上穿，光着脚跑出来，拍着手大笑：
    sources: [sgz-01]
    show:
      - card: {title: 据说, body: 许攸来奔一段出自裴注引《曹瞒传》, cue: 据说}

  - say: 子远，你来了，我的大事成了！
    speaker: 曹操
    scene: 军帐
    quote: 子远，卿来，吾事济矣！
    style: 喜出望外，拍手大笑，热情激动
    sources: [sgz-01]

  - say: 两人一坐下，许攸就问：
    sources: [sgz-01]

  - say: 袁军这么强，你打算怎么对付？还有多少粮食？
    speaker: 许攸
    quote: 袁氏军盛，何以待之？今有几粮乎？
    style: 精明试探，似笑非笑，咄咄逼人
    sources: [sgz-01]
    show:
      - versus: {left: 许攸, right: 曹操, label: 问粮, for: 18}

  - say: 还能撑一年。
    speaker: 曹操
    quote: 尚可支一岁。
    style: 镇定自若，故作轻松
    sources: [sgz-01]

  - say: 没这回事，再说！
    speaker: 许攸
    quote: 无是，更言之！
    style: 冷笑拆穿，不耐烦
    sources: [sgz-01]

  - say: 能撑半年。
    speaker: 曹操
    quote: 可支半岁。
    style: 略一迟疑，仍在硬撑
    sources: [sgz-01]

  - say: 你难道不想打败袁绍吗？怎么净说假话！
    speaker: 许攸
    quote: 足下不欲破袁氏邪，何言之不实也！
    style: 拍案而起，又急又气，直戳要害
    sources: [sgz-01]

  - say: 刚才是开玩笑。其实，只够一个月了，怎么办？
    speaker: 曹操
    quote: 向言戏之耳。其实可一月，为之柰何？
    style: 无奈苦笑，压低声音，坦白求计
    sources: [sgz-01]

  - say: 许攸这才说出底牌：袁军一万多车粮草，全在乌巢，防备松懈。派轻兵突袭，烧了它，不出三天，袁军自己就垮了。
    sources: [sgz-01]
    show:
      - spot: {at: 乌巢, cue: 乌巢}

  - say: 将领们都怀疑有诈，只有荀攸、贾诩劝曹操去。曹操留曹洪守大营，亲自带五千步骑出发。
    sources: [sgz-10, sgz-01]

  - say: 他们全打着袁军的旗号，人嘴里衔着木片，马嘴也绑上，每人抱一捆柴草，趁着夜色，从小路直奔乌巢。
    sources: [sgz-01]
    camera: {focus: [官渡, 乌巢], zoom: 8, move: 1.4}
    show:
      - act: {act: night, places: [乌巢], cue: 夜色, for: 10}
      - army: {from: 官渡, to: 乌巢, faction: 曹操, banner: 袁, troops: cavalry, size: 1.4, cue: 小路, grow: 3.0}

  - say: 路上有人盘问，就说：袁公怕曹操抄后路，派我们来加强防备。问的人都信了。
    sources: [sgz-01]

  - say: 一到乌巢，围住营寨，放起大火。袁军大乱，淳于琼被斩。
    sources: [sgz-01]
    show:
      - fire: {at: 乌巢, cue: 放起大火, radius: 1.3, for: 8}
      - sfx: {name: 火攻, cue: 放起大火}
      - exit: {who: 淳于琼, at: 乌巢, verb: 斩, cue: 淳于琼}

  - say: 袁绍听说乌巢遭袭，没派主力去救，反而让张郃、高览去攻曹操大营。
    sources: [sgz-01, hhs-74]
    camera: {focus: [官渡, 乌巢, 黎阳], zoom: fit, move: 1.2}
    show:
      - enter: {who: 张郃, side: left, cue: 张郃, for: 2.6}

  - say: 张郃、高览攻不下来，又听说乌巢已经完了，干脆烧了攻城器械，投降了曹操。
    sources: [sgz-10]
    show:
      - defect: {who: 张郃, at: 官渡, to: 曹操, from: 袁绍, verb: 降, cue: 投降了曹操}

  - say: 袁军全线崩溃。袁绍和儿子袁谭只带着八百骑兵，狼狈逃过黄河。留下的袁军假装投降，被曹操坑杀了好几万。
    sources: [hhs-74]
    show:
      - rout: {at: 官渡, to: 黎阳, faction: 袁绍, banner: 袁, cue: 全线崩溃, size: 2.4}
      - headline: {text: 官渡之战, sub: 建安五年 · 以少胜多, cue: 八百骑兵, for: 3.4}
      - sfx: {name: 溃败哭喊, cue: 坑杀}

  - say: 兵力差好几倍，曹操凭什么赢？一靠荀彧那封信，让他咬牙撑住；二靠许攸带来的一个情报；三靠他敢赌，五千人深入敌后，一把火定了胜负。
    sources: [sgz-01, sgz-10]
    camera: {focus: [邺, 官渡, 许], zoom: fit, move: 1.4}
    show:
      - versus: {left: 袁绍, right: 曹操, label: 官渡, cue: 凭什么赢, for: 5}

  # ---------------- 第四章 江东易主 ----------------
  - say: 同一年，江东也出了大事。孙策本想趁曹袁对峙，偷袭许县、迎接天子。还没出兵，他外出打猎，被前吴郡太守许贡的门客刺成重伤。
    phase: 江东易主
    sources: [sgz-46, sgz-14]
    camera: {focus: [吴, 丹徒], zoom: fit, move: 1.6}
    show:
      - enter: {who: 孙策, side: right, cue: 孙策, for: 3}
      - act: {act: arrows, places: [丹徒], cue: 刺成重伤, for: 2.4}

  - say: 临死前，他把印绶交给弟弟孙权，说：
    sources: [sgz-46]
    show:
      - act: {act: prop, at: 吴, item: 印绶, text: 授印, cue: 印绶, for: 3}

  - say: 带着江东的兵马，在两军阵前决断，跟天下英雄争高下，你不如我。举贤任能，让人人尽心，保住江东，我不如你。
    speaker: 孙策
    voice_text: （虚弱而恳切）带着江东的兵马，在两军阵前决断，跟天下英雄争高下，你不如我。举贤任能，让人人尽心，保住江东，我不如你。
    style: 虚弱恳切，强撑着一字一句交代后事
    sources: [sgz-46]
    show:
      - versus: {left: 孙策, right: 孙权, label: 托付, for: 10}

  - say: 当天夜里，孙策去世，年仅二十六岁。接班的孙权，只有十九岁。
    sources: [sgz-46]
    owners_cue: 孙权
    map: '200-04'
    show:
      - exit: {who: 孙策, at: 吴, verb: 卒, cue: 去世, portrait: true}
      - enter: {who: 孙权, at: 吴, side: right, cue: 孙权, settle: true, settle_sub: 十九岁接班}

  - say: 而逃回河北的袁绍，手里还有三个儿子和大半个北方。官渡这一仗，还没有真正结束。
    sources: [hhs-74]
    camera: {focus: [邺, 黎阳], zoom: fit, move: 1.4}
    show:
      - title_bar: {text: 下集, sub: 平定河北 · 隆中对, cue: 没有真正结束, delay: 0.4, for: 3.0}
