publish:
  hook: 粮只够吃一个月，曹操凭什么赢官渡
  big: [只够一个月]
  hero: 曹操
  at: 60
  summary: |
    袁绍精兵十万南下，曹操兵力远远不及：白马关羽斩颜良，延津弃辎重诱敌斩文丑，可到了官渡，曹军被土山箭雨压得顶着盾牌走路，粮食眼看吃光，曹操想退。
    荀彧一封信劝住了他；袁绍的谋士许攸连夜来投，一问"还有多少粮"，问出了乌巢。五千人打着袁军旗号夜袭乌巢——一把火，烧掉了袁绍的半壁天下。
  tags: [官渡之战, 曹操, 袁绍, 许攸, 乌巢]
  next: 袁家大半个北方，为什么几年就没了

