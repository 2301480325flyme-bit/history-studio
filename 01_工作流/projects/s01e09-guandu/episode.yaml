# 快节奏版（2026-10-13，按抖音数据：冷开场、只讲有戏的、无背景音乐）
# 《三国到隋》第9集：官渡之战——曹操以少胜多击败袁绍；孙策遇刺，孙权接班（200）
# 2026-10-11 按故事稿写成旁白。关键原文均在本地语料核过：
# "简精卒十万，骑万匹"（袁绍传注）；关羽"策马刺良于万众之中，斩其首还"（关羽传）；延津"解鞍放马…骑不满六百…斩丑"（武帝纪）；
# "时公兵不满万，伤者十二三"（武帝纪，裴松之质疑）；"高橹，起土山…发石车…号曰霹雳车…地道"（袁绍传注）；
# 荀彧"公以十分居一之众…扼其喉而不得进，已半年矣。情见势竭，必将有变，此用奇之时，不可失也"（荀彧传）；
# 许攸来奔、"跣出迎之…子远，卿来，吾事济矣…尚可支一岁…可支半岁…何言之不实也…向言戏之耳。其实可一月"（武帝纪注引曹瞒传）；
# "皆用袁军旗帜，衔枚缚马口，夜从间道出，人抱束薪…大放火"（同上）；张郃、高览"烧攻橹降"（荀攸传）；
# "与八百骑度河…余众伪降，曹操尽坑之"（后汉书·袁绍传）；孙策"为许贡客所杀""卿不如我…我不如卿…至夜卒，时年二十六"（孙策传、郭嘉传）。

id: s01e09-guandu
title: 官渡之战
series: 三国 · 第9集
year: 200

notes:
  - 主线问题：兵力差好几倍，曹操凭什么赢？——许攸带来的一个情报，加上曹操敢赌。
  - 关羽只斩颜良；斩文丑的是曹军（演义说关羽斩文丑）。过五关斩六将不讲。
  - 兵不满万一说裴松之质疑，旁白说"远少于袁绍"并点明有争议；坑杀人数后汉书说八万，旁白说"好几万"。
  - 许攸和曹操对话出自裴注引《曹瞒传》，标"据说"。
  - 用户未定：江东易主默认放本集末尾。

