# 《三国到隋》第8集：袁术死在一碗蜜水上，公孙瓒易京自焚，孙策据江东，刘备反曹（199–200）
# 2026-10-11 按故事稿写成旁白。关键原文均在本地语料核过：
# 袁术"欲得蜜浆，又无蜜…袁术至于此乎！…呕血斗余而死"（袁术传注引吴书）；"术欲从下邳北过，公遣刘备、朱灵要之"（武帝纪）；
# 易京"积谷三百万斛…百楼不攻。今吾楼橹千重，食尽此谷，足知天下之事矣"（公孙瓒传）；"悉缢其姊妹妻子，然后引火自焚"（后汉书·公孙瓒传）；
# 孙策"美姿颜，好笑语""刘繇弃军遁逃""策自领会稽太守"（孙策传）；
# "今天下英雄，唯使君与操耳…先主方食，失匕箸"、董承"辞受帝衣带中密诏"、"杀徐州刺史车胄，留关羽守下邳"（先主传）；
# "夫刘备，人杰也…袁绍虽有大志，而见事迟，必不动也"（武帝纪）；关羽"拜为偏将军，礼之甚厚"（关羽传）。

id: s01e08-yijing
title: 易京与衣带诏
series: 三国 · 第8集
year: 199

notes:
  - 主线问题：群雄割据十年，北方为什么只剩下袁、曹两家？
  - 演义对照：煮酒论英雄只有"天下英雄唯使君与操""失匕箸"是史书原文，青梅煮酒、借雷掩饰是小说；"衣带诏"史书说董承"辞受"（自称接到），真假存疑；关羽"约三事""降汉不降曹"不讲。
  - 小霸王是小说称号，不用；用史书"美姿颜，好笑语"。
  - 江亭、离寿春八十里出自注引《吴书》。

