beats:
  # ---------------- 第一章 一碗蜜水 ----------------
  - say: 上回说到，吕布死了。而寿春的袁术，日子也到头了。
    phase: 一碗蜜水
    sources: [sgz-06]
    year: 199
    camera: {focus: 寿春, zoom: 2.6, move: 2.0}
    map: '198-12'
    show:
      - title_bar: {text: 易京与衣带诏, sub: 三国 · 第8集, cue: 上回, for: 3.2}
      - sfx: 片头鼓
      - flag: {at: 寿春, name: 袁术, sub: 仲家皇帝, faction: 袁术, cue: 袁术}

  - say: 称帝两年，他众叛亲离，粮食吃光，连自己的部将都不肯收留他。
    sources: [sgz-06]
    show:
      - enter: {who: 袁术, side: right, cue: 众叛亲离, for: 3.4}

  - say: 走投无路，袁术决定把皇帝的名号让给堂兄袁绍，自己北上青州，去投奔侄子袁谭。
    sources: [sgz-01, sgz-06]
    camera: {focus: [寿春, 下邳, 临淄], zoom: fit, move: 1.4}
    show:
      - arrow: {from: 寿春, to: 临淄, kind: direction, faction: 袁术, cue: 北上青州, grow: 1.8}
      - flag: {at: 临淄, name: 袁谭, sub: 青州刺史, faction: 袁绍, cue: 袁谭}

  - say: 去青州，必须从下邳往北走。曹操派刘备、朱灵带兵堵住了路。袁术过不去，只好往回走。
    sources: [sgz-01, sgz-32]
    show:
      - army: {from: 许, to: 下邳, faction: 曹操, banner: 刘, troops: infantry, size: 1.6, cue: 堵住了路, grow: 2.0}
      - march: {from: 下邳, to: 寿春, faction: 袁术, cue: 往回走, grow: 1.4}

  - say: 走到离寿春八十里的江亭，一问厨房，只剩下三十斛麦屑。
    sources: [sgz-06]
    camera: {focus: [寿春, 江亭], zoom: 14, move: 1.4}
    show:
      - flag: {at: 江亭, name: 袁术, sub: 退至江亭, faction: 袁术, cue: 江亭}
      - act: {act: prop, at: 江亭, item: 粮仓, text: 麦屑三十斛, cue: 麦屑, size: 0.8, for: 3}

  - say: 正是盛夏，袁术想喝一碗蜜水，可连蜂蜜也没有。
    sources: [sgz-06]
    show:
      - act: {act: prop, at: 江亭, item: 蜜水碗, text: 欲得蜜浆，又无蜜, cue: 蜜水, size: 1.3, for: 4.4}

  - say: 他坐在床上，叹息了很久，突然大喊一声：
    sources: [sgz-06]

  - say: 我袁术……竟然落到了这个地步！
    speaker: 袁术
    voice_text: （嘶哑绝望）我袁术……竟然落到了这个地步！
    style: 嘶哑绝望，长叹之后猛地大喊，悲愤难平
    sources: [sgz-06]

  - say: 喊完一头栽倒在床下，吐了一斗多的血，死了。
    sources: [sgz-06]
    owners_cue: 死了
    map: '199-02'
    show:
      - exit: {who: 袁术, at: 江亭, verb: 卒, cue: 死了, portrait: true}
      - sfx: {name: 凄凉风, cue: 栽倒}
      - sfx: {name: 退场钟, cue: 死了}

  # ---------------- 第二章 楼橹千重 ----------------
  - say: 再看北边。公孙瓒自从界桥兵败，一路退守，在易县修了一座城，叫"易京"。
    phase: 楼橹千重
    sources: [sgz-08]
    camera: {focus: [蓟, 易京, 邺], zoom: fit, move: 1.6}
    show:
      - enter: {who: 公孙瓒, at: 易京, side: right, cue: 公孙瓒, settle: true, settle_sub: 困守易京, guest: true}

  - say: 外面挖了十道壕沟，壕沟里堆起五六丈高的土台，台上再盖楼。他自己住在正中间，一座十丈高的楼里，囤了三百万斛粮食。
    sources: [sgz-08]
    camera: {focus: 易京, zoom: 6, move: 1.2}
    show:
      - act: {act: prop, at: 易京, item: 望楼, text: 易京, cue: 十丈高, size: 1.5, for: 5}
      - act: {act: prop, at: 易京, item: 粮仓, text: 积谷三百万斛, cue: 三百万斛, for: 3}

  - say: 他得意地说：
    sources: [sgz-08]

  - say: 兵法上说，一百座楼都不要去攻。我这里楼橹上千重，吃完这些粮食，天下大事早就定了！
    speaker: 公孙瓒
    style: 刚愎自负，得意洋洋，拍着城墙说
    sources: [sgz-08]

  - say: 袁绍连年围攻，攻不下来。他干脆让士兵挖地道，一直挖到楼底下，把楼基一座座挖空，再放火烧塌。
    sources: [sgz-08, hhs-73]
    camera: {focus: [邺, 易京], zoom: fit, move: 1.4}
    show:
      - army: {from: 邺, to: 易京, faction: 袁绍, banner: 袁, troops: infantry, size: 3, cue: 连年围攻, grow: 2.4}
      - siege: {at: 易京, text: 围, faction: 袁绍, cue: 挖地道, for: 3}

  - say: 一百九十九年三月，公孙瓒自知守不住了。他带着全家，点起一把大火，死在了易京。
    sources: [hhs-73]
    camera: {focus: 易京, zoom: 6, move: 1.2}
    show:
      - quote: {text: 悉缢其姊妹妻子，然后引火自焚, source: 后汉书·公孙瓒传, era: 建安四年, cue: 全家}
      - fire: {at: 易京, cue: 大火, radius: 1.2, for: 5}
      - exit: {who: 公孙瓒, at: 易京, verb: 亡, cue: 死在了易京, portrait: true}
      - sfx: {name: 燃烧, cue: 大火}

  - say: 从此，冀州、青州、幽州、并州，河北四州全归了袁绍。他手下的兵马几十万，成了天下最强的诸侯。
    sources: [hhs-74]
    camera: {focus: [邺, 蓟, 临淄], zoom: fit, move: 1.6}
    owners_cue: 四州
    map: '199-03'
    show:
      - sfx: {name: 疆域易手, cue: 四州}
      - headline: {text: 河北一统, sub: 袁绍兼有四州, cue: 最强, for: 3.2}

  # ---------------- 第三章 江东 ----------------
  - say: 南边的长江下游，也冒出了一股新势力。孙坚的长子孙策，从袁术手里讨回了父亲的旧部，渡过长江。
    phase: 江东
    sources: [sgz-46]
    camera: {focus: [寿春, 曲阿, 吴, 会稽], zoom: fit, move: 1.6}
    show:
      - enter: {who: 孙策, side: right, cue: 孙策, for: 3.4}
      - army: {from: 寿春, to: 曲阿, faction: 孙策, banner: 孙, troops: infantry, size: 1.6, cue: 渡过长江, grow: 2.2}

  - say: 扬州刺史刘繇不战而逃，孙策又南下占了会稽，自己当了会稽太守。袁术称帝后，他跟袁术一刀两断。
    sources: [sgz-46]
    owners_cue: 会稽
    map: '199-08'
    show:
      - replay: {path: [曲阿, 吴, 会稽], faction: 孙策, label: 孙策平江东, cue: 南下}
      - sfx: {name: 疆域易手, cue: 会稽}

  - say: 史书说他"美姿颜，好笑语"：长得俊，爱说笑，善于用人，江东的人见了他，都愿意替他卖命。
    sources: [sgz-46]
    show:
      - quote: {text: 美姿颜，好笑语，性阔达听受，善于用人, source: 三国志·孙策传, era: 兴平二年, cue: 美姿颜}

  # ---------------- 第四章 天下英雄 ----------------
  - say: 再说刘备。他投奔曹操以后，曹操待他极好，出门同坐一辆车，坐下同坐一张席。
    phase: 天下英雄
    year: 199
    sources: [sgz-32]
    camera: {focus: 许, zoom: 3.4, move: 1.6}
    show:
      - versus: {left: 曹操, right: 刘备, label: 同舆, cue: 同坐一辆车, for: 4}

  - say: 有一天，曹操不紧不慢地对刘备说：
    scene: 宴席
    sources: [sgz-32]

  - say: 如今天下的英雄，只有你和我曹操罢了。袁绍那些人，根本不值一提。
    speaker: 曹操
    style: 不紧不慢，似笑非笑，意味深长地试探
    scene: 宴席
    to: 刘备
    sources: [sgz-32]
    show:
      - versus: {left: 曹操, right: 刘备, label: 论英雄, for: 5}

  - say: 刘备正在吃饭，吓得筷子都掉了。
    scene: 宴席
    sources: [sgz-32]
    show:
      - card: {title: 演义 vs 正史, body: 史书只有"唯使君与操""失匕箸"；青梅煮酒、借雷掩饰是小说, cue: 筷子}

  - say: 刘备怕的不只是这句话。车骑将军董承暗中找过他，说自己接到了汉献帝藏在衣带里的密诏：诛杀曹操。
    sources: [sgz-32]
    show:
      - enter: {who: 董承, side: left, cue: 董承, for: 3}
      - act: {act: prop, at: 许, item: 衣带诏, text: 衣带中密诏, cue: 衣带, size: 1.4, for: 4.4}

  - say: 这封"衣带诏"到底是真是假，史书只说董承"自称接到"，历来有争议。
    sources: [sgz-32]
    show:
      - card: {title: 衣带诏, body: 先主传：董承"辞受帝衣带中密诏"，真伪存疑, cue: 争议}

  - say: 正好袁术要北上，刘备主动请命去拦截。出了许县，他就像鸟出了笼子。
    sources: [sgz-32, sgz-01]
    camera: {focus: [许, 下邳], zoom: fit, move: 1.4}
    show:
      - army: {from: 许, to: 下邳, faction: 刘备, banner: 刘, troops: infantry, size: 1.4, cue: 请命, grow: 2.2}

  - say: 到了下邳，刘备杀了曹操任命的徐州刺史车胄，留关羽守下邳，自己屯在小沛，公开反了曹操。
    sources: [sgz-32]
    camera: {focus: [下邳, 小沛], zoom: fit, move: 1.2}
    owners_cue: 反了曹操
    map: '199-12'
    show:
      - act: {act: execute, at: 下邳, text: 杀车胄, cue: 车胄, for: 2.4}
      - flag: {at: 下邳, name: 关羽, sub: 守下邳, faction: 刘备, cue: 关羽}
      - flag: {at: 小沛, name: 刘备, sub: 反曹, faction: 刘备, cue: 小沛}
      - sfx: {name: 疆域易手, cue: 反了曹操}

  - say: 第二年正月，董承等人密谋败露，全部被杀。曹操要亲自东征刘备。
    sources: [sgz-01]
    year: 200
    camera: {focus: [许, 小沛], zoom: fit, move: 1.4}
    show:
      - act: {act: execute, at: 许, text: 诛董承, cue: 全部被杀, for: 2.6}
      - exit: {who: 董承, at: 许, verb: 诛, cue: 全部被杀}

  - say: 将领们都慌了：跟您争天下的是袁绍，现在跑去打刘备，袁绍从背后打过来怎么办？曹操说：
    scene: 军帐
    sources: [sgz-01]
    show:
      - spot: {at: 邺, cue: 袁绍}

  - say: 刘备是人中豪杰，现在不打，必成后患！袁绍虽有大志，可是见事太迟，一定不会马上动。
    speaker: 曹操
    style: 果断冷静，胸有成竹，语速干脆
    scene: 军帐
    sources: [sgz-01]

  - say: 果然，曹操大军一到，刘备大败，独自逃往河北投奔袁绍。妻子儿女被俘，关羽也被擒。
    sources: [sgz-32, sgz-36]
    owners_cue: 大败
    map: '200-01'
    show:
      - army: {from: 许, to: 小沛, faction: 曹操, banner: 曹, troops: cavalry, size: 2.4, cue: 大军一到, grow: 2.0}
      - flee: {from: 小沛, to: 邺, faction: 刘备, cue: 逃往河北}
      - defect: {who: 关羽, at: 下邳, to: 曹操, from: 刘备, verb: 擒, cue: 被擒}

  - say: 曹操爱惜关羽，拜他做偏将军，待他极其优厚。
    sources: [sgz-36]
    show:
      - enter: {who: 关羽, side: right, cue: 关羽, for: 3.4}

  - say: 至此，北方只剩下两个人：河北的袁绍，和挟天子的曹操。
    sources: [sgz-01]
    camera: {focus: [邺, 许, 黎阳], zoom: fit, move: 1.4}
    show:
      - versus: {left: 袁绍, right: 曹操, label: 争天下, cue: 两个人, for: 4.6}

  - say: 袁绍终于下了决心。十万大军，向黄河边的黎阳集结。一场决定北方命运的大战，就要开始了。
    sources: [sgz-01]
    show:
