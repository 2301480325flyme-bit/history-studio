beats:
  # ---------------- 第一章 一碗蜜水 ----------------
  - say: 我袁术……竟然落到了这个地步！
    map: '198-12'
    year: 199
    phase: 一碗蜜水
    speaker: 袁术
    voice_text: （嘶哑绝望）我袁术……竟然落到了这个地步！
    style: 嘶哑绝望，长叹之后猛地大喊，悲愤难平
    sources: [sgz-06]
    show:
      - sfx: 重拍转场

  - say: 他当过皇帝。临死前只想喝一碗蜜水，可连蜂蜜都没有。
    sources: [sgz-06]
    show:
      - act: {act: prop, at: 江亭, item: 蜜水碗, text: 欲得蜜浆，又无蜜, cue: 蜜水, size: 1.3, for: 4.4}

  - say: 喊完一头栽倒，吐了一斗多的血，死了。
    sources: [sgz-06]
    map: '199-02'
    show:
      - exit: {who: 袁术, at: 江亭, verb: 卒, cue: 死了, portrait: true}
      - sfx: {name: 凄凉风, cue: 栽倒}
      - sfx: {name: 退场钟, cue: 死了}

  # ---------------- 第二章 楼橹千重 ----------------

  - say: 称帝两年，袁术众叛亲离。想北上投奔侄子袁谭，又被刘备堵了回来。
    sources: [sgz-06]
    show:
      - enter: {who: 袁术, side: right, cue: 众叛亲离, for: 3.4}
      - arrow: {from: 寿春, to: 临淄, kind: direction, faction: 袁术, grow: 1.8}
      - flag: {at: 临淄, name: 袁谭, sub: 青州刺史, faction: 袁绍, cue: 袁谭}
      - army: {from: 许, to: 下邳, faction: 曹操, banner: 刘, troops: infantry, size: 1.6, grow: 2.0}
      - march: {from: 下邳, to: 寿春, faction: 袁术, grow: 1.4}

  - say: 再看北边。公孙瓒在易县修了一座城，叫易京。
    phase: 楼橹千重
    sources: [sgz-08]
    camera: {focus: [蓟, 易京, 邺], zoom: fit, move: 1.6}
    show:
      - enter: {who: 公孙瓒, at: 易京, side: right, cue: 公孙瓒, settle: true, settle_sub: 困守易京, guest: true}
      - sfx: {name: 低音转场, delay: -0.3}

  - say: 十道壕沟，土台上再盖楼。他住在正中十丈高的楼里，囤粮三百万斛。
    sources: [sgz-08]
    camera: {focus: 易京, zoom: 6, move: 1.2}
    show:
      - act: {act: prop, at: 易京, item: 望楼, text: 易京, cue: 十丈高, size: 1.5, for: 5}
      - act: {act: prop, at: 易京, item: 粮仓, text: 积谷三百万斛, cue: 三百万斛, for: 3}

  - say: 我这里楼橹上千重，吃完这些粮食，天下大事早就定了！
    speaker: 公孙瓒
    style: 刚愎自负，得意洋洋，拍着城墙说
    sources: [sgz-08]

  - say: 袁绍让士兵挖地道，把楼基一座座挖空，再放火烧塌。
    sources: [sgz-08, hhs-73]
    camera: {focus: [邺, 易京], zoom: fit, move: 1.4}
    show:
      - army: {from: 邺, to: 易京, faction: 袁绍, banner: 袁, troops: infantry, size: 3, grow: 2.4}
      - siege: {at: 易京, text: 围, faction: 袁绍, cue: 挖地道, for: 3}

  - say: 公孙瓒自知守不住，带着全家，点起一把大火，死在了易京。
    sources: [hhs-73]
    camera: {focus: 易京, zoom: 6, move: 1.2}
    show:
      - quote: {text: 悉缢其姊妹妻子，然后引火自焚, source: 后汉书·公孙瓒传, era: 建安四年, cue: 全家}
      - fire: {at: 易京, cue: 大火, radius: 1.2, for: 5}
      - exit: {who: 公孙瓒, at: 易京, verb: 亡, cue: 死在了易京, portrait: true}
      - sfx: {name: 燃烧, cue: 大火}

  - say: 从此河北四州全归袁绍，他成了天下最强的诸侯。
    sources: [hhs-74]
    camera: {focus: [邺, 蓟, 临淄], zoom: fit, move: 1.6}
    map: '199-03'
    show:
      - sfx: {name: 疆域易手, cue: 四州}
      - headline: {text: 河北一统, sub: 袁绍兼有四州, cue: 最强, for: 3.2}

  # ---------------- 第三章 江东 ----------------

  - say: 南边，孙坚的长子孙策，渡过了长江。
    phase: 江东
    sources: [sgz-46]
    camera: {focus: [寿春, 会稽], zoom: 0.9, move: 1.6}   # 拉高到全国，再推到江东（2026-10-17 镜头试验）
    show:
      - enter: {who: 孙策, side: right, cue: 孙策, for: 3.4}
      - army: {from: 寿春, to: 曲阿, faction: 孙策, banner: 孙, troops: infantry, size: 1.6, grow: 2.2}
      - sfx: {name: 低音转场, delay: -0.3}

  - say: 刘繇不战而逃，孙策又占了会稽，跟称帝的袁术一刀两断。
    sources: [sgz-46]
    camera: {focus: [曲阿, 会稽], zoom: 3.0, move: 1.6}
    map: '199-08'
    show:
      - replay: {path: [曲阿, 吴, 会稽], faction: 孙策, label: 孙策平江东}
      - sfx: {name: 疆域易手, cue: 会稽}

  - say: 史书说他：长得俊，爱说笑，善用人，江东的人都愿意替他卖命。
    sources: [sgz-46]
    show:
      - quote: {text: 美姿颜，好笑语，性阔达听受，善于用人, source: 三国志·孙策传, era: 兴平二年}

  # ---------------- 第四章 天下英雄 ----------------

  - say: 再说刘备。他投奔曹操后，曹操待他极好，出门同车，坐下同席。
    phase: 天下英雄
    year: 199
    sources: [sgz-32]
    camera: {focus: 许, zoom: 3.4, move: 1.6}
    show:
      - versus: {left: 曹操, right: 刘备, label: 同舆, for: 4}
      - sfx: {name: 低音转场, delay: -0.3}

  - say: 有一天，曹操对刘备说：
    scene: 宴席
    sources: [sgz-32]

  - say: 如今天下的英雄，只有你和我曹操罢了！
    speaker: 曹操
    style: 不紧不慢，似笑非笑，意味深长地试探
    scene: 宴席
    to: 刘备
    sources: [sgz-32]
    show:
      - versus: {left: 曹操, right: 刘备, label: 论英雄, for: 5}

  - say: 刘备正在吃饭，吓得筷子都掉了。
    scene: 宴席
    sources: [sgz-32]
    show:
      - card: {title: 演义 vs 正史, body: 史书只有"唯使君与操""失匕箸"；青梅煮酒、借雷掩饰是小说, cue: 筷子}

  - say: 他怕的不只是这句话。董承暗中找过他，说接到了汉献帝藏在衣带里的密诏：诛杀曹操。
    sources: [sgz-32]
    show:
      - enter: {who: 董承, side: left, cue: 董承, for: 3}
      - act: {act: prop, at: 许, item: 衣带诏, text: 衣带中密诏, cue: 衣带, size: 1.4, for: 4.4}

  - say: 刘备主动请命去拦袁术。一出许县，他就像鸟出了笼子。
    sources: [sgz-32, sgz-01]
    camera: {focus: [许, 下邳], zoom: fit, move: 1.4}
    show:
      - army: {from: 许, to: 下邳, faction: 刘备, banner: 刘, troops: infantry, size: 1.4, cue: 请命, grow: 2.2}

  - say: 到了下邳，他杀了曹操的徐州刺史，公开反了。
    sources: [sgz-32]
    camera: {focus: [下邳, 小沛], zoom: fit, move: 1.2}
    map: '199-12'
    show:
      - act: {act: execute, at: 下邳, text: 杀车胄, for: 2.4}
      - flag: {at: 下邳, name: 关羽, sub: 守下邳, faction: 刘备}
      - flag: {at: 小沛, name: 刘备, sub: 反曹, faction: 刘备}
      - sfx: {name: 疆域易手}

  - say: 第二年正月，董承密谋败露，全部被杀。曹操要亲征刘备。
    sources: [sgz-01]
    year: 200
    camera: {focus: [许, 小沛], zoom: fit, move: 1.4}
    show:
      - act: {act: execute, at: 许, text: 诛董承, cue: 全部被杀, for: 2.6}
      - exit: {who: 董承, at: 许, verb: 诛, cue: 全部被杀}

  - say: 将领们慌了：袁绍从背后打过来怎么办？曹操说：
    scene: 军帐
    sources: [sgz-01]
    show:
      - spot: {at: 邺, cue: 袁绍}

  - say: 刘备是人中豪杰，现在不打，必成后患！袁绍见事太迟，一定不会马上动。
    speaker: 曹操
    style: 果断冷静，胸有成竹，语速干脆
    scene: 军帐
    sources: [sgz-01]

  - say: 果然，刘备大败，逃往河北。妻儿被俘，关羽也被擒。
    sources: [sgz-32, sgz-36]
    map: '200-01'
    show:
      - army: {from: 许, to: 小沛, faction: 曹操, banner: 曹, troops: cavalry, size: 2.4, grow: 2.0}
      - flee: {from: 小沛, to: 邺, faction: 刘备, cue: 逃往河北}
      - defect: {who: 关羽, at: 下邳, to: 曹操, from: 刘备, verb: 擒, cue: 被擒}

  - say: 曹操爱惜关羽，拜他做偏将军。
    sources: [sgz-36]
    show:
      - enter: {who: 关羽, side: right, cue: 关羽, for: 3.4}

  - say: 北方，只剩下两个人：袁绍，和曹操。
    sources: [sgz-01]
    camera: {focus: [邺, 许, 黎阳], zoom: fit, move: 1.4}
    show:
      - versus: {left: 袁绍, right: 曹操, label: 争天下, cue: 两个人, for: 4.6}

  - say: 袁绍兵多十倍，曹操凭什么赢？
    sources: [sgz-01]

  - say: 袁绍十万大军，向黎阳集结。
    sources: [sgz-01]
    show:
      - army: {from: 邺, to: 黎阳, faction: 袁绍, banner: 袁, troops: infantry, size: 3.4, cue: 十万大军, grow: 2.4}
      - title_bar: {text: 下集, sub: 官渡之战, delay: 0.6, for: 3.0}

