  big: [袁术, 至于此乎]
  hero: 袁术
  at: 20
  summary: |
    称帝两年，袁术众叛亲离，退到江亭时只剩麦屑三十斛，想喝一碗蜜水都没有，吐血而死；公孙瓒守着"楼橹千重"的易京，被袁绍挖空楼基，点火自焚。
    曹操对刘备说"今天下英雄，唯使君与操耳"，刘备吓得掉了筷子，转身就杀车胄、据徐州反曹——北方，只剩袁曹两家。
  tags: [袁术, 公孙瓒, 煮酒论英雄, 刘备, 衣带诏]
  next: 官渡：兵力差十倍，曹操凭什么赢

