      - act: {act: enthrone, who: 刘渊, at: 平阳, text: 汉, sub: 永嘉二年, cue: 称帝, for: 3}

  - say: 他手下两员大将，到处攻城。王弥在河南、山东横冲直撞，石勒在河北，打下了一百多座坞堡。
