      - sfx: {name: 刀剑交击, cue: 击退}

  - say: 三一零年六月，刘渊病死。刚即位的太子刘和，被弟弟刘聪杀了。刘聪当上了皇帝。
    year: 310
    sources: [js-05]
    camera: {focus: 平阳, zoom: 6, move: 1.2}
    map: '310-04'
    show:
      - exit: {who: 刘渊, at: 平阳, verb: 卒, portrait: true, cue: 病死}
      - enter: {who: 刘聪, side: right, cue: 刘聪当上, for: 3.4}
      - quote: {text: 刘元海死，其子和嗣伪位，和弟聪杀和而自立, source: 晋书·怀帝纪, era: 永嘉四年六月, cue: 杀了, for: 4}

  # ---------------- 第二章 棺材 ----------------
  - say: 这年冬天，东海王带着能打的兵和满朝大臣出了洛阳。宫里连守卫都没了，宫殿里死人横七竖八。
