  # ---------------- 第一章 汉国 ----------------
  - say: 先说三零八年。匈奴人刘渊在平阳称帝，国号汉。
    phase: 汉国
    year: 308
    map: '308-10'
    owners_cue: 称帝
    sources: [js-05]
    camera: {focus: [平阳, 洛阳, 邺], zoom: fit, move: 1.4}
    show:
