      - sfx: {name: 退场钟, cue: 病死}

  - say: 石勒的骑兵，在苦县宁平城追上了他们。他先把东海王的棺材烧了：
    sources: [js-59]
    camera: {focus: [项, 宁平城], zoom: 10, move: 1.2}
    tells: [b14]
    show:
      - army: {head: 石勒, from: 许昌, to: 宁平城, faction: 汉赵, banner: 石, troops: cavalry, size: 3.0, cue: 追上, grow: 1.6}
      - fire: {at: 宁平城, cue: 烧了, radius: 0.6, for: 3.4}

  - say: 这个人祸乱天下，我替天下报仇，烧了他的骨头，祭告天地！
    speaker: 石勒
    style: 粗豪凶狠，居高临下，对着燃烧的棺木大声宣告
    quote: 此人乱天下，吾为天下报之，故烧其骨以告天地
    sources: [js-59]
    show:
      - enter: {who: 石勒, side: right, cue: 这个人, for: 6}
      - sfx: {name: 燃烧, cue: 烧了}

  - say: 然后骑兵围成一圈，往里放箭。十几万人互相踩踏，堆成了山，没有一个逃出去。
    sources: [js-05, js-59]
    tells: [b15]
    show:
      - battle: {at: 宁平城, text: 相践如山, cue: 放箭}
      - vignette: {image: illus_ningping_ring, cue: 围成一圈, for: 6, text: 以骑围而射之}
      - sfx: {name: 箭雨, cue: 放箭}

  # ---------------- 第三章 王衍 ----------------
  - say: 王公大臣全成了俘虏。石勒问太尉王衍：晋朝怎么败成了这样？
    phase: 清谈
    sources: [js-43]
    show:
      - enter: {who: 王衍, side: left, cue: 王衍, for: 3.4}

  - say: 王衍说，这事怪不到我头上，我从小就不爱管事。他还劝石勒，干脆自己当皇帝。
    sources: [js-43]
    show:
      - vignette: {image: illus_wangyan_shile, cue: 怪不到我, for: 9, text: 问衍以晋故}

  - say: 石勒大怒：你名满天下，从年轻做官做到白头，还说不管事？天下坏成这样，正是你的罪！
    sources: [js-43]
    show:
      - enter: {who: 石勒, side: right, cue: 大怒, for: 3.6}
      - quote: {text: 破坏天下，正是君罪, source: 晋书·王衍传, cue: 你的罪, for: 3.6}
      - sfx: {name: 重低音落地, cue: 你的罪}

  - say: 石勒说，这种人不能用刀杀。半夜，让人推倒墙，把他们压死了。
