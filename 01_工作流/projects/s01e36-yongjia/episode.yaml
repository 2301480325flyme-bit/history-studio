  summary: |
    308 年匈奴刘渊在平阳称帝，国号汉；王弥转战河南、一度打到洛阳城下，石勒在河北攻下百余座坞壁；309 年上党太守以郡投降。310 年刘渊死，刘聪杀兄自立。同年冬，东海王司马越带着精兵和满朝官员出了洛阳，宫里连守卫都没了。
    311 年三月东海王病死项城，部下秘不发丧，护灵柩东归，在苦县宁平城被石勒追上：石勒烧了他的棺材，骑兵围射，十几万人相践如山。被俘的太尉王衍推说"不管事"，还劝石勒称帝，石勒骂他"破坏天下，正是君罪"，夜里推墙把他压死；王衍临死叹"要不是整天空谈，何至于此"。六月，呼延晏、王弥、刘曜攻破洛阳，晋怀帝从华林园出逃被俘，宫庙被焚，三万多王公百官被杀。
  tags: [西晋, 永嘉之乱, 石勒, 王衍, 宁平城之战, 晋怀帝]
  next: 西晋灭亡

