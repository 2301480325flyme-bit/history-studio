  - say: 王衍临死前叹了一句：我们要是不整天空谈，齐心救天下，也不至于落到今天。
    sources: [js-43]
    show:
      - quote: {text: 向若不祖尚浮虚，戮力以匡天下，犹可不至今日, source: 晋书·王衍传, era: 时年五十六, cue: 空谈, for: 4.6}

  # ---------------- 第四章 洛阳 ----------------
  - say: 洛阳，成了一座空城。六月，刘聪派大将呼延晏带两万七千人，从宜阳杀进来，晋军前后输了十二仗。
