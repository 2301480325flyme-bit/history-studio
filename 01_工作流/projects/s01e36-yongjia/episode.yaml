      - quote: {text: 王师前后十二败，死者三万余人, source: 晋书·刘聪载记, cue: 十二仗, for: 3.6}

  - say: 王弥、刘曜也到了，几路兵围住洛阳。城里饿得人吃人。
    sources: [js-102]
    show:
      - enter: {who: 刘曜, side: right, cue: 刘曜, for: 3.4}
      - army: {unit: 刘曜, from: 平阳, to: 洛阳, faction: 汉赵, banner: 曜, troops: cavalry, size: 3.0, cue: 围住, grow: 1.8, camp: false}
      - sfx: {name: 战鼓, cue: 围住}

  - say: 城门被攻破，皇宫被抢光，宫殿、宗庙，一把火全烧了。
    audit_ok: [易手]
    sources: [js-05, js-102]
    camera: {focus: 洛阳, zoom: 9, move: 1.2}
    tells: [b18, b21]
    show:
      - battle: {at: 洛阳, text: 宣阳门陷, cue: 攻破}
      - fire: {at: 洛阳, cue: 一把火, radius: 1.4, flash: true, for: 4}
      - sfx: {name: 火攻, cue: 一把火}

  - say: 晋怀帝从华林园偷偷跑出来，想逃往长安，没跑多远，就被刘曜的兵追上抓住了。
    sources: [js-05]
    show:
      - enter: {who: 司马炽, side: right, cue: 晋怀帝, for: 3.4}
      - vignette: {image: illus_huailin_flight, cue: 华林园, for: 5, text: 出河阴藕池}

  - say: 王公百官被杀了三万多人。晋朝的皇帝，被押去了平阳。
    sources: [js-102]
    camera: {focus: [洛阳, 平阳], zoom: fit, move: 1.4}
    show:
      - march: {from: 洛阳, to: 平阳, faction: 汉赵, label: 迁帝于平阳, cue: 押去了平阳, grow: 1.8}
      - sfx: {name: 落幕锣, cue: 平阳}

  # ---------------- 收 ----------------
  - say: 一国之都，怎么三年就丢了？能打的兵被东海王带出了城，又在宁平城一口气全没了。
    sources: [js-05, js-59]
    camera: {focus: [洛阳, 宁平城, 平阳], zoom: fit, move: 1.6}
    show:
      - headline: {text: 永嘉之乱, sub: 精兵尽于宁平城, cue: 全没了, for: 3.4}

  - say: 王衍那句话，说给整个西晋听：要不是整天空谈，何至于此。
    sources: [js-43]
    show:
      - headline: {text: 清谈误国, sub: 祖尚浮虚，犹可不至今日, cue: 空谈, for: 3.4}
      - sfx: {name: 史诗冲击, cue: 何至于此}

  - say: 王衍说自己不管事，你觉得，这能当借口吗？
    sources: [js-43]
    show:
      - card: {title: 成语出处, body: 清谈误国——王衍传：向若不祖尚浮虚…犹可不至今日, cue: 借口, for: 3.6}

  - say: 洛阳没了。晋朝在长安，又立了一个十几岁的小皇帝。
    sources: [js-05]
    show:
      - title_bar: {text: 下集, sub: 两晋 · 西晋灭亡, cue: 小皇帝, delay: 0.4, for: 3.0}
      - sfx: {name: 时代转折, cue: 小皇帝}
