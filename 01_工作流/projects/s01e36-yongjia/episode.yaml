# 快节奏版（2026-10-25）
# 《三国到隋》第36集 · 两晋：永嘉之乱，洛阳陷落（308–311）。大纲第 31 条。
# 本地语料核对（晋书）：
# 怀帝纪 p00110 永嘉二年"王弥寇青、徐、兗、豫四州。夏四月丁亥，入许昌…五月甲子，弥遂寇洛阳，司徒王衍帅众御之，弥退走"；"冬十月甲戌，刘元海僭帝号于平阳，仍称汉"；p00111"石勒攻陷冀州郡县百余壁"；"上党太守庞淳以郡降贼"；"聪至西明门，越御之，战于宣阳门外，大破之"；
#   p00112 永嘉四年"六月，刘元海死，其子和嗣伪位，和弟聪杀和而自立"；"十一月甲戌，东海王越帅众出许昌，以行台自随。宫省无复守卫，荒馑日甚，殿内死人交横"；
#   p00113 永嘉五年"四月戊子，石勒追东海王越丧，及于东郡，将军钱端战死，军溃，太尉王衍…皆遇害，王公已下死者十余万人"；"丁酉、刘曜、王弥入京师。帝开华林园门，出河阴藕池，欲幸长安，为曜等所追及。曜等遂焚烧宫庙"；
# 东海王越传 p04648"永嘉五年，薨于项。秘不发丧…还葬东海。石勒追及于苦县宁平城…勒命焚越柩曰：此人乱天下，吾为天下报之，故烧其骨以告天地。于是数十万众，勒以骑围而射之，相践如山。王公士庶死者十余万"；
# 王衍传 p03774"勒呼王公，与之相见，问衍以晋故。衍为陈祸败之由，云计不在己…因劝勒称尊号。勒怒曰：君名盖四海，身居重任，少壮登朝，至于白首，何得言不豫世事邪！破坏天下，正是君罪…使人夜排墙填杀之。衍将死，顾而言曰：呜呼！吾曹虽不如古人，向若不祖尚浮虚，戮力以匡天下，犹可不至今日。时年五十六"；
# 刘聪载记 p07046 呼延晏"配禁兵二万七千，自宜阳入洛川…王师前后十二败，死者三万余人…王弥、刘曜至，复与晏会围洛阳。时城内饥甚，人皆相食…宣阳门陷…曜于是害诸王公及百官已下三万余人…迁帝…于平阳"。
# 不用：怀帝纪"及于东郡"与越传"苦县宁平城"两说，地图按越传画在宁平城（坐标示意）；王弥弟璋"焚其余众，并食之"（过于残忍，不进旁白）；刘曜、王弥、石勒会师前各自路线（未载，不画）。

id: s01e36-yongjia
title: 永嘉之乱
series: 两晋 · 第36集
year: 308

notes:
  - 主线问题：洛阳是一国之都，怎么三年就丢了？——最能打的兵，被东海王带出城去；东海王一死，十几万人护着他的棺材，在宁平城被石勒一口气消灭。洛阳成了空城。
  - 钩子候选：①"十几万人护着一口棺材赶路，被追上，全军覆没"（反差3 具体3 悬念3 兑现3=12）②"天下坏成这样，就是你的罪"（反差2 具体2 悬念2 兑现3=9）③"晋朝皇帝，被匈奴人抓走了"（反差2 具体2 悬念2 兑现3=9）→ 选①。
  - 反差：十几万人对一支骑兵；名满天下的太尉，说自己"不管事"；不忍心用刀杀，就推墙压死。
  - 细节：宫里没了守卫、殿内死人横着；秘不发丧；石勒烧了东海王的棺材；骑兵围成圈射、人踩人堆成山；王衍劝石勒称帝；推墙；王衍临死"要不是整天空谈"；华林园、河阴藕池。
  - 演义对照卡：结尾卡"成语出处"——清谈误国（王衍传"祖尚浮虚"）。

