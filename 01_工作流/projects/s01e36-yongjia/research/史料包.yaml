    gazetteer: 洛阳底图有登记；细部未核
    level: 都城、宫苑、渡水点
  - name: 轘辕、小平津
    ancient: 轘辕关、小平津渡口
    modern: 河南登封附近山口；小平津在黄河渡口区域，具体定位未核
    gazetteer: 未核
    level: 关隘/渡口，须区分城点
  演义野史与史家争议:
  - issue: 传统演义叙述
    note: 《三国演义》不覆盖西晋末年，本地未检到可逐条对照的演义文本；不要将王衍临阵“清谈误国”、石勒与王衍对话、王弥劝进等戏剧化细节当作本集事实。
    evidence:
    - quote: 太尉王衍、吏部尚书刘望、廷尉诸葛铨、尚书郑豫、武陵王澹等皆遇害
      para: 晋书-p00113
  - issue: 刘渊国号与后世称呼
    note: 本纪明确“仍称汉”；后世史学常称汉赵以区别刘备蜀汉。写稿可称汉（汉赵），不是当时改国号为赵。
    evidence:
    - quote: 刘元海僭帝号于平阳，仍称汉。
      para: 晋书-p00110
  - issue: 司马越死亡地点
    note: 越传称“薨于项”，天文志及后续追丧叙事称宁平城；宜拆分疾病死亡和石勒追及军队的地点。
    evidence:
    - quote: 永嘉五年，薨于项。秘不发丧。
      para: 晋书-p04648
    - quote: 石勒追及于苦县宁平城
      para: 晋书-p04648
  - issue: 宁平城死者数
    note: 不同段落称“王公士庶死者十余万”“数十万众”；属于史书记数，不宜作为现代精确统计。
    evidence:
    - quote: 王公士庶死者十余万。
      para: 晋书-p04648
    - quote: 王公已下死者十余万人。
      para: 晋书-p00113
  - issue: 洛阳三路攻势
    note: 载记给出呼延晏主攻路线，并称刘曜、王弥、石勒进师会之；不能据此画出三条细节完整、各自独立的路线。
    evidence:
    - quote: 自宜阳入洛川，命王弥、刘曜及镇军石勒进师会之。
      para: 晋书-p07046
  - issue: “十余万精兵”措辞
    note: 司马越带走“众”及行台可证，离开后“宫省无复守卫”可证；“洛阳精兵十余万”不宜拼接成原史料明确数字。
    evidence:
    - quote: 东海王越帅众出许昌，以行台自随。宫省无复守卫
      para: 晋书-p00112
