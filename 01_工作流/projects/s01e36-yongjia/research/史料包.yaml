  illustration_scenes:
  - scene: 项城病死、秘不发丧，军队载丧东行被石勒追及宁平城；钱端出战，晋军溃散。
    evidence:
    - quote: 永嘉五年，薨于项。秘不发丧。
      para: 晋书-p04648
    - quote: 将军钱端出兵距勒，战死，军溃。
      para: 晋书-p04648
  - scene: 呼延晏军从宜阳进入洛川，留辎重张方故垒后冲击平昌门，洛阳城门与府寺起火。
    evidence:
    - quote: 自宜阳入洛川
      para: 晋书-p07046
    - quote: 留辎重于张方故垒，遂寇洛阳，攻陷平昌门，焚东阳、宣阳诸门及诸府寺。
      para: 晋书-p07046
  - scene: 晋怀帝从华林园出河阴藕池试图奔长安，遭刘曜追及；宫庙焚毁。
    evidence:
    - quote: 帝开华林园门，出河阴藕池，欲幸长安，为曜等所追及。
      para: 晋书-p00113
    - quote: 曜等遂焚烧宫庙
      para: 晋书-p00113
  - scene: 刘聪在平阳病榻前后，刘和继位，兄弟争位并导致刘聪杀刘和。
    evidence:
    - quote: 其子和嗣伪位，和弟聪杀和而自立。
      para: 晋书-p00112
  - scene: 洛阳城内饥荒、百官散走，荀籓荀组出轘辕、温几奔小平津。
    evidence:
    - quote: 时城内饥甚，人皆相食，百官分散
      para: 晋书-p07046
    - quote: 夜开广莫门奔小平津
      para: 晋书-p00113
  疆域对照:
    checked_file: 01_工作流\series\三国到隋\疆域.yaml
    events_308_311: []
    result: 当前疆域.yaml 没有 308–311 年的疆域事件条目。既有最后相关项为 307-05，魏郡标 uncertain，记汲桑、石勒陷鄴但未确认整郡控制。故本集建议 Claude 逐项审议：308年许昌受袭但王弥退走；309年上党太守庞淳以郡降汉赵；311年洛阳失陷、河南尹控制变化；不要从战术点自动推定周边全郡易手。
