episode: s01e36-yongjia
scope: 308–311；接续上一包308年刘渊称帝，主体覆盖刘渊死、司马越出项、宁平城战、洛阳陷落。
source_note: 本地 sources 检索到《晋书》怀帝纪、载记及相关列传；指定的《资治通鉴》卷85–90未检出可用段落。引用均为本地段落 ID；未核内容已明确列入 open_questions。年龄按公元年份相减，生日未知则不冒称周岁。
sections:
  events:
  - id: e01
    date: 308-10（永嘉二年）
    people:
    - 刘渊（刘元海）
    place: 平阳
    event: 刘元海称帝，国号仍称汉，迁都平阳。
    source_coverage: 怀帝纪与刘元海载记互见；《资治通鉴》本地未检出可用段落。
    evidence:
    - quote: 冬十月甲戌，刘元海僭帝号于平阳，仍称汉。
      para: 晋书-p00110
    - quote: 永嘉二年，元海僭即皇帝位，大赦境内，改元永凤。
      para: 晋书-p07037
  - id: e02
    date: 308-02/04
    people:
    - 王弥
    - 石勒
    - 和郁
    place: 常山、赵郡、鄴、卫国
    event: 石勒寇常山被王浚击退；同年秋石勒转寇赵郡，和郁弃鄴奔卫国。王弥春寇青徐兖豫，四月入许昌，五月攻洛阳后退走。
    source_coverage: 怀帝纪；细节部分本传需复核，通鉴本地未检出。
    evidence:
    - &id006
      quote: 庚子，石勒寇常山，安北将军王浚讨破之。
      para: 晋书-p00110
    - &id007
      quote: 王弥寇青、徐、兗、豫四州。夏四月丁亥，入许昌，诸郡守将皆奔走。五月甲子，弥遂寇洛阳，司徒王衍帅众御之，弥退走。
      para: 晋书-p00110
    - quote: 九月，石勒寇赵郡，征北将军和郁自鄴奔于卫国。
      para: 晋书-p00110
  - id: e03
    date: 309-07（永嘉三年）
    people:
    - 刘聪
    - 王弥
    - 刘琨
    - 庞淳
    place: 上党、壶关
    event: 刘聪遣子刘粲及王弥围壶关，刘琨救兵败；王旷、施融、曹超再败，施融、曹超战死；庞淳以郡降汉。
    source_coverage: 怀帝纪，细节主要一处。
    evidence:
    - &id002
      quote: 刘元海遣子聪及王弥寇上党，围壶关。并州刺史刘琨使兵救之，为聪所败。淮南内史王旷、将军施融、曹超及聪战，又败，超、融死之。上党太守庞淳以郡降贼。
      para: 晋书-p00111
  - id: e04
    date: 309-09
    people:
    - 刘聪
    - 司马越
    - 王衍
    place: 浚仪、洛阳宣阳门
    event: 刘聪围浚仪，晋军败；继而进抵洛阳西明门，在宣阳门外与司马越战败退。
    source_coverage: 怀帝纪一处。
    evidence:
    - &id003
      quote: 九月丙寅，刘聪围浚仪，遣平北将军曹武讨之。丁丑，王师败绩。东海王越人保京城。聪至西明门，越御之，战于宣阳门外，大破之。
      para: 晋书-p00111
  - id: e05
    date: 310-06（永嘉四年）
    people:
    - 刘渊
    - 刘和
    - 刘聪
    place: 平阳
    event: 刘渊死，刘和继位；刘聪杀兄刘和，自立。
    source_coverage: 怀帝纪一处可证刘渊死、刘和继位、刘聪杀和自立；刘元海载记本次未找到可用逐句段落，故不列第二出处。
    evidence:
    - &id001
      quote: 六月，刘元海死，其子和嗣伪位，和弟聪杀和而自立。
      para: 晋书-p00112
  - id: e06
    date: 310-07
    people:
    - 刘曜
    - 石勒
    - 宋抽
    place: 怀县
    event: 刘曜、石勒围怀，宋抽率救兵被刘曜击败并死。
    source_coverage: 怀帝纪一处；围城起讫和地望需审慎。
    evidence:
    - &id004
      quote: 秋七月，刘聪从弟曜及其将石勒围怀，诏征虏将军宋抽救之，为曜所败，抽死之。
      para: 晋书-p00112
  - id: e07
    date: 310-冬
    people:
    - 石勒
    - 刘琨
    - 张宾
    place: 河北诸郡
    event: 石勒攻陷冀州百余壁，主要活动区域在河北；具体逐站路径、关隘渡口，本地纪传段落未能逐点核实。
    source_coverage: 怀帝纪及石勒载记待补检；不可把“百余壁”改写为百余郡县。
    evidence:
    - &id011
      quote: 石勒攻陷冀州郡县百余壁。
      para: 晋书-p00111
  - id: e08
    date: 311-01（永嘉五年）
    people:
    - 司马越
    - 苟晞
    - 石勒
    place: 许昌、项城
    event: 司马越率众出许昌，携行台离洛；军次项城，洛阳留守力量削弱。
    source_coverage: 怀帝纪与越传应互证；本地《资治通鉴》未检出。
    evidence:
    - &id009
      quote: 东海王越帅众出许昌，以行台自随。宫省无复守卫
      para: 晋书-p00112
  - id: e09
    date: 311-03
    people:
    - 司马越
    - 石勒
    - 钱端
    - 王衍
    place: 项、苦县宁平城
    event: 司马越忧惧成疾死于项；军中秘不发丧，石勒在苦县宁平城追及越丧。钱端出战死，晋军溃败，王公士庶死者十余万（《晋书》不同处亦有“数十万众”等说法，数目不可当精确统计）。
    source_coverage: 越传、怀帝纪、天文志互见；死亡地点分别写“薨于项”与“死于宁平城”可能指病死、追及战场两阶段，勿合成一处。
    evidence:
    - &id010
      quote: 永嘉五年，薨于项。秘不发丧。
      para: 晋书-p04648
    - &id012
      quote: 石勒追及于苦县宁平城，将军钱端出兵距勒，战死，军溃。
      para: 晋书-p04648
    - quote: 四月戊子，石勒追东海王越丧，及于东郡，将军钱端战死，军溃，太尉王衍、吏部尚书刘望、廷尉诸葛铨、尚书郑豫、武陵王澹等皆遇害，王公已下死者十余万人。
      para: 晋书-p00113
    - quote: 五年三月，司马越死于宁平城，石勒攻破其众，死者十余万人。
      para: 晋书-p00735
  - id: e10
    date: 311-06癸未
    people:
    - 刘聪
    - 刘曜
    - 王弥
    - 石勒
    - 呼延晏
    - 怀帝
    place: 宜阳、洛川、张方故垒、洛阳
    event: 刘聪命呼延晏率二万七千前锋由宜阳入洛川，王弥、刘曜及石勒奉命进师会合。呼延晏途中与晋军屡战，留辎重于张方故垒后攻洛阳，陷平昌门、焚东阳宣阳诸门及府寺；刘默守社门败。
    source_coverage: 刘聪载记、怀帝纪互见；“三路”中的王弥、刘曜、石勒各自出发点和会师前逐站路线未详。
    evidence:
    - &id005
      quote: 署其卫尉呼延晏为使持节、前锋大都督、前军大将军。配禁兵二万七千，自宜阳入洛川，命王弥、刘曜及镇军石勒进师会之。晏比及河南，王师前后十二败，死者三万余人。
      para: 晋书-p07046
    - &id008
      quote: 留辎重于张方故垒，遂寇洛阳，攻陷平昌门，焚东阳、宣阳诸门及诸府寺。怀帝遣河南尹刘默距之，王师败于社门。
      para: 晋书-p07046
  - id: e11
    date: 311-06庚寅/丁酉
    people:
    - 刘曜
    - 王弥
    - 石勒
    - 荀籓
    - 荀组
    - 温几
    - 怀帝
    place: 洛阳、轘辕、小平津、河阴藕池
    event: 荀籓、荀组出轘辕，温几夜开广莫门奔小平津；晋帝企图水遁，舟楫被焚。六月丁酉刘曜、王弥入京师；怀帝出华林园至河阴藕池欲赴长安，被追获；宫庙焚毁，帝被俘。
    source_coverage: 怀帝纪、刘聪载记互见；怀帝纪此处只列刘曜王弥入京，不宜据此断言石勒亲入城。
    evidence:
    - &id013
      quote: 司空荀籓、光禄大夫荀组奔轘辕，太子左率温几夜开广莫门奔小平津。丁酉、刘曜、王弥入京师。帝开华林园门，出河阴藕池，欲幸长安，为曜等所追及。曜等遂焚烧宫庙。
      para: 晋书-p00113
    - &id014
      quote: 王弥、刘曜至，复与晏会围洛阳。时城内饥甚，人皆相食，百官分散。
      para: 晋书-p07046
