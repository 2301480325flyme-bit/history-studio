open_questions:
- 资治通鉴卷八十五至九十：本地 studio.py sources 对“晋书 资治通鉴”组合未检出通鉴段落；需补录通鉴原文或确认语料缺卷，当前各事件不能声称通鉴互证。
- 疆域.yaml 308–311年郡级事件逐条比对尚待直接核读：尤其308王弥入许昌、309庞淳以郡降汉、311洛阳陷落；缺失项建议由Claude决定是否补疆域事件。
- 石勒、王弥河北河南完整路线：纪传仅能复原常山—赵郡、青徐兖豫—许昌—洛阳等区域性节点，起点、道路、河渡、山口多未载；不得用现代直线补中间站。
- 宁平城与东郡记载差异：《怀帝纪》说追至东郡，《司马越传》说苦县宁平城；项城病死与宁平城追及应分作两事件，战场行政归属待核。
- 洛阳进攻不是已证实的“三条完整路线”：呼延晏路线有宜阳—洛川—张方故垒—平昌门；刘曜、王弥、石勒只知被命令会师，进军起点及会师前路径待考。
- 晋军“十余万”“数十万”以及呼延晏行军中十二战死三万余，均为史书记数，统计口径不明；王衍在宁平是否主动投降/对话的流行叙述本地引文未核。
- 检查疆域.yaml 中成汉与汉赵等 polity 名称、事件层级是否一致；本集“汉”具体按项目内部 polity 命名应统一为汉赵。
- 疆域.yaml 核查结果：308–311 年没有疆域事件；最后相关项为 307-05（魏郡 uncertain，汲桑、石勒陷鄴但未确认郡级易手）。需Claude决定是否增补 309 上党归汉赵及 311 河南尹/洛阳事件。
accepted: 2026-10-25 Claude 验收：统一地名、补 skip、去掉对不上脚本的途经点
