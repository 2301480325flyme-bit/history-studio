# 快节奏版（2026-10-25）
# 《三国到隋》第30集 · 两晋：贾南风借刀杀人（291）。大纲第 26 条。
# 本地语料核对（晋书）：
# 杨骏传 p03630"殿中中郎孟观、李肇，素不为骏所礼…贾后又令肇报大司马、汝南王亮，使连兵讨骏。亮曰：骏之凶暴，死亡无日，不足忧也。肇报楚王玮，玮然之。于是求入朝…及玮至，观、肇乃启帝，夜作诏，中外戒严，遣使奉诏废骏，以侯就第"；
#   p03631 主簿朱振"宜烧云龙门以示威…骏素怯懦，不决，乃曰：魏明帝造此大功，奈何烧之！"；
#   p03632"殿中兵出，烧骏府，又令弩士于阁上临骏府而射之…骏逃于马厩，以戟杀之…诛骏亲党，皆夷三族，死者数千人"；
# 后妃传·武悼杨皇后 p03077"后题帛为书，射之城外，曰救太傅者有赏，贾后因宣言太后同逆"；p03078"贾后夺之，绝膳而崩，时年三十四"；
# 惠帝纪 p00088 永平元年三月辛卯诛杨骏，"贾后矫诏废皇太后为庶人，徙于金墉城"；"征大司马、汝南王亮为太宰，与太保卫瓘辅政…楚王玮为卫将军，领北军中候"；
# 楚王玮传 p04579"亮、瓘以玮性很戾，不可大任，建议使与诸王之国，玮甚忿之…使惠帝为诏曰：太宰、太保欲为伊、霍之事，王宜宣诏…废二公。夜使黄门赍以授玮。玮欲覆奏，黄门曰：事恐漏泄，非密诏本意也。玮乃止"；
#   p04580"岐盛说玮，可因兵势诛贾模、郭彰…玮犹豫未决。会天明，帝用张华计，遣殿中将军王宫赍驺虞幡麾众曰：楚王矫诏。众皆释杖而走…惟一奴年十四…遂斩之，时年二十一。其日大风，雷雨霹雳…玮临死，出其怀中青纸诏，流涕以示监刑尚书刘颂曰：受诏而行，谓为社稷，今更为罪"；
# 卫瓘传 p03334"贾后素怨瓘…遂与子恆、岳、裔及孙等九人同被害，时年七十二"；
# 张华传 p03364 张华白帝"玮矫诏擅害二公…今可遣驺虞幡使外军解严"；p03365"以华庶族，儒雅有筹略…虽当暗主虐后之朝，而海内晏然，华之功也"；
# 后妃传·惠贾皇后 p03104"诛杨骏及汝南王亮、太保卫瓘、楚王玮等，皆临机专断"；"后母广城君以后无子，甚敬重愍怀"。
# 不用：杨骏"马厩"之外的野史细节；贾后与人私通等后宫秘闻（与本集主线无关）；汝南王亮遇害细节等史料包到了再补。

id: s01e30-jiahou
title: 贾南风借刀杀人
series: 两晋 · 第30集
year: 291

notes:
  - 主线问题：一个手里没有一兵一卒的皇后，怎么在一年里除掉三个最有权的人？——她每一次都拿着皇帝的诏书，让别人的刀去砍；用完了，连刀一起扔掉。
  - 钩子候选：①"她一刀没动，一年杀了三个辅政大臣"（反差3 具体2 悬念3 兑现3=11）②"替她杀人的楚王，最后也被她杀了"（反差3 具体2 悬念2 兑现3=10）③"一张诏书，杀了一个太傅"（反差2 具体2 悬念2 兑现3=9）→ 选①，②做第二拍。
  - 反差：楚王奉诏杀人，又因"矫诏"被杀；杨骏手里有兵却舍不得烧一道门；驺虞幡一挥，几千兵扔下兵器就跑。
  - 细节：杨骏"魏明帝造此大功，奈何烧之"；杨骏躲进马厩被戟刺死；太后帛书"救太傅者有赏"；楚王想复核诏书被拦；楚王身边只剩十四岁家奴；怀中青纸诏；行刑那天大风雷雨。
  - 动机：贾后"欲预政事而惮骏"；贾后"素怨瓘"（卫瓘当年劝换太子）；亮、瓘要夺楚王兵权，楚王"甚忿之"。
  - 演义对照卡：本集无演义情节，结尾卡用"史书怎么评"（张华传"虽当暗主虐后之朝，而海内晏然"）。

