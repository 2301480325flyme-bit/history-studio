  hook: 她一刀没动，一年杀了三个辅政大臣
  big: [贾南风, 借刀杀人]
  hero: 贾南风
  at: 3
  summary: |
    290 年晋武帝死，傻皇帝司马衷即位，太傅杨骏独揽朝政。皇后贾南风联络殿中军官孟观、李肇，请来镇守荆州的楚王司马玮。291 年三月一道诏书，杨骏躲进马厩被乱戟刺死，杨家夷三族，杨太后被废、绝食而死。
    接着汝南王司马亮、老臣卫瓘辅政，想夺楚王兵权；贾后又让皇帝写了一道诏书交给楚王，二公一夜被杀。天亮后张华献计，驺虞幡一挥，楚王的兵四散，他以"矫诏"之罪被斩，年仅二十一岁，临死掏出怀里的青纸诏书。此后贾后用张华、裴頠，天下反倒太平了九年。
  tags: [西晋, 贾南风, 杨骏, 楚王玮, 八王之乱, 晋惠帝]
  next: 贾南风害死太子

