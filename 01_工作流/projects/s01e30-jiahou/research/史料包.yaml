episode: s01e30-jiahou
title: 贾南风借刀杀人（291）
source_scope:
  local_search: "studio.py sources；检索《晋书》《资治通鉴》"
  result: "本地命中《晋书》纪传，未命中《资治通鉴》卷八十二至八十四相关段落；以下用《晋书》纪传互证。"
  previous_episode: "第29集收尾讲到杨骏居太极殿、百人自卫，贾南风已盯上杨骏。本集从政变行动展开，不重讲武帝临终和杨骏居殿。"
  geography: "洛阳条目 luoyang_han_wei 为汉魏洛阳故城近似点，不是宫殿坐标。宫门、武库、金墉城等未命中独立地名。"

事件表:
  - id: ev01
    date: "291年二月（永平元年；三月政变前）"
    people: [司马玮, 司马允, 贾南风, 杨骏]
    place: 洛阳
    event: "楚王玮、淮南王允入朝。贾后借诸王兵力筹划除杨骏。玮先镇荆州，但本次行军起点、路线、抵洛日期未核。"
    evidence:
      - {quote: "癸酉，镇南将军楚王玮、镇东将军淮南王允来朝。", para: 晋书-p00088}
      - {quote: "贾后悖妇姑之礼，阴欲诛杨骏而废太后，因骏专权，数言之于帝，又使人讽观。会楚王玮将讨骏，观受贾后旨宣诏，颇加诬其事。", para: 晋书-p04660}
    source_note: "惠帝纪与孟观传互见；资治通鉴本地未命中。"
  - id: ev02
    date: "291年三月（永平元年三月辛卯；未换算公历日）"
    people: [杨骏, 贾南风, 司马玮, 司马繇]
    place: 洛阳
    event: "宫中起事，杨骏试图调东宫及外营兵入宫反制而迟疑；发生宫门、府第一带的军事对峙，杨骏及党羽被诛。实际交战点、各军来源与伤亡数未核。"
    evidence:
      - {quote: "三月辛卯，诛太傅杨骏，骏弟卫将军珧，太子太保济，中护军张劭，散骑常侍段广、杨邈。", para: 晋书-p00088}
      - {quote: "时骏居曹爽故府，在武库南，闻内有变，召众官议之。太傅主簿硃振说骏曰：‘今内有变，其趣可知，必是阉竖为贾后设谋，不利于公。宜烧云龙门以示威，索造事都首，开万春门，引东宫及外营兵，公自拥翼皇太子，入宫取奸人。’……骏素怯懦，不决", para: 晋书-p03631}
    source_note: "惠帝纪记日期及诛杀名单；杨骏传记军情部署。谋议不可写成已经执行的行军。"
  - id: ev03
    date: "291年三月（杨骏被诛后）"
    people: [司马亮, 卫瓘]
    place: 洛阳
    event: "汝南王亮从许昌被征回洛阳，与卫瓘同辅政。亮、瓘建议令楚王玮就国，埋下六月冲突。返洛路线与具体日期未核。"
    evidence:
      - {quote: "壬寅，征大司马、汝南王亮为太宰，与太保卫瓘辅政。", para: 晋书-p00088}
      - {quote: "夜驰赴许昌，故得免。及骏诛，诏曰：‘大司马、汝南王亮体道冲粹，通识政理……其以亮为太宰、录尚书事……与太保卫瓘对掌朝政。’", para: 晋书-p04567}
  - id: ev04
    date: "291年六月（永平元年；日未核）"
    people: [司马玮, 司马亮, 卫瓘, 公孙宏, 岐盛, 李肇, 贾南风]
    place: 洛阳
    event: "公孙宏、岐盛借积弩将军李肇假称楚王命，向贾后诬告亮、瓘；贾后矫惠帝诏，令玮调兵屯宫门、废二公。亮、瓘及其子被杀。诸军驻地、路线、具体遇害处未核。"
    evidence:
      - {quote: "长史公孙宏、舍人岐盛并薄于行，为玮所昵。瓘等恶其为人，虑致祸乱，将收盛。盛知之，遂与宏谋，因积弩将军李肇矫称玮命，谮亮、瓘于贾后。", para: 晋书-p04579}
      - {quote: "使惠帝为诏曰：‘太宰、太保欲为伊、霍之事，王宜宣诏，令淮南、长沙、成都王屯宫诸门，废二公。’夜使黄门赍以授玮。", para: 晋书-p04579}
      - {quote: "楚王玮受密诏杀太宰汝南王亮、太保卫瓘等，内外兵扰，朝廷大恐，计无所出。", para: 晋书-p03364}
  - id: ev05
    date: "291年六月（接上）"
    people: [张华, 司马衷, 司马玮, 刘颂]
    place: 洛阳
    event: "张华建议发驺虞幡，宣告楚王玮矫诏，外军解严散去；玮被执于武贲署，后被斩，年二十一。"
    evidence:
      - {quote: "华白帝以‘玮矫诏擅害二公，将士仓卒，谓是国家意，故从之耳。今可遣驺虞幡使外军解严，理必风靡。’上从之，玮兵果败。", para: 晋书-p03364}
      - {quote: "帝用张华计，遣殿中将军王宫赍驺虞幡麾众曰：‘楚王矫诏。’众皆释杖而走。玮左右无复一人……执之于武贲署，遂下廷尉。诏以玮矫制害二公父子……遂斩之，时年二十一。", para: 晋书-p04580}
    source_note: "玮临刑称奉青纸诏；史书最后以矫诏定罪，双方叙述不可混为一谈。"
  - id: ev06
    date: "291—300年（元康年间；概括性时段）"
    people: [张华, 裴頠, 贾南风]
    place: 洛阳
    event: "张华、裴頠居中枢重臣位置，至300年遇害。‘撑住九年太平’是概括性说法，晋书没有称这九年为太平，期间亦有边地战争；不可说成天下无战事。"
    evidence:
      - {quote: "及玮诛，华以首谋有功，拜右光禄大夫、开府仪同三司、侍中、中书监", para: 晋书-p03364}
      - {quote: "以中书监张华为司空", para: 晋书-p00093}
      - {quote: "司空张华、尚书仆射裴頠皆遇害", para: 晋书-p00097}
  - id: ev07
    date: "元康九年至永康元年（299—300）"
    people: [贾南风, 司马遹, 韩慰祖]
    place: 洛阳
    event: "贾后无亲生儿子；她曾假称怀孕，收养妹夫韩寿之子韩慰祖，并谋废司马遹、以养子代立。这是下一阶段引线。"
    evidence:
      - {quote: "初，后诈有身，内稿物为产具，遂取妹夫韩寿子慰祖养之，托谅闇所生，故弗显。遂谋废太子，以所养代立。", para: 晋书-p03104}
      - {quote: "愍怀太子遹，字熙祖，惠帝长子，母曰谢才人。幼而聪慧，武帝爱之，恆在左右。", para: 晋书-p04286}

