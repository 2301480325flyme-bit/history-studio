  - scene: "清晨驺虞幡传令称玮矫诏，诸军释杖散去，司马玮被捕。"
    evidence: [{quote: "众皆释杖而走。玮左右无复一人", para: 晋书-p04580}, {quote: "执之于武贲署，遂下廷尉。", para: 晋书-p04580}]
  - scene: "贾后假称有孕、抱养韩慰祖并谋以养子代太子。"
    evidence: [{quote: "初，后诈有身，内稿物为产具", para: 晋书-p03104}, {quote: "遂谋废太子，以所养代立。", para: 晋书-p03104}]

