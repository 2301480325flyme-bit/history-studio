# 快节奏版（2026-10-13，按抖音数据：冷开场、只讲有戏的、无背景音乐）
# 《三国到隋》第10集：袁绍病死，二子相争，曹操水灌邺城、斩袁谭，平定河北（202–205）
# 2026-10-11 按故事稿（第10集上半）写成旁白；原第10集按 86 集方案拆成两集，乌桓 + 隆中对见第11集。
# 关键原文均在本地语料核过："绍自军破后，发病欧血，夏五月死"（武帝纪）；
# 郭嘉"袁绍爱此二子，莫适立也…急之则相持，缓之而后争心生。不如南向荆州，若征刘表者，以待其变"（郭嘉传）；
# "为堑，周四十里，初令浅，示若可越。配望而笑之…一夜掘之，广深二丈，决漳水以灌之，自五月至八月，城中饿死者过半"（袁绍传注）；
# 审配"汝为降虏，审配为忠臣，虽死，岂若汝生邪""我君在北"（袁绍传注引先贤行状）；
# "审配兄子荣夜开所守城东门…生禽配，斩之，邺定。公临祀绍墓，哭之流涕；慰劳绍妻，还其家人宝物"（武帝纪）。

id: s01e10-hebei
title: 平定河北
