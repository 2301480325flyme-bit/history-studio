beats:
  # ---------------- 第一章 兄弟阋墙 ----------------
  - say: 官渡之后，袁家还有大半个北方。不到五年，一寸都没剩下。
    map: '200-04'
    year: 201
    phase: 兄弟阋墙
    sources: [sgz-14]
    camera: {focus: [邺, 许], zoom: fit, move: 1.4}
    show:
      - headline: {text: 河北平定, sub: 建安十年, for: 3.2}
      - sfx: 重拍转场

  - say: 毁掉袁家的，不是曹操，是袁绍的两个亲儿子。
    sources: [sgz-14]
    map: '201-09'
    camera: {focus: [邺, 许], zoom: fit, move: 1.4}

  - say: 官渡大败，袁绍逃回河北，两年后吐血而死。
    sources: [sgz-06, hhs-74]
    year: 202
    camera: {focus: [邺, 黎阳], zoom: fit, move: 2.0}
    show:
      - title_bar: {text: 平定河北, sub: 三国 · 第10集, for: 3.2}
      - sfx: 片头鼓
      - flag: {at: 邺, name: 袁绍, sub: 大将军, faction: 袁绍, cue: 袁绍}
      - exit: {who: 袁绍, at: 邺, verb: 卒, portrait: true}
      - sfx: {name: 退场钟}

  - say: 他偏爱小儿子袁尚，谋士审配抢先拥立了袁尚。
    sources: [sgz-01, hhs-74]
    map: '202-05'
    owners_cue: 拥立
    show:
      - enter: {who: 袁尚, at: 邺, side: right, cue: 袁尚, settle: true, settle_sub: 继位冀州}

  - say: 长子袁谭不服，自封车骑将军。
    sources: [sgz-01]
    camera: {focus: [邺, 黎阳], zoom: fit, move: 1.2}
    show:
      - enter: {who: 袁谭, at: 黎阳, side: left, cue: 袁谭, settle: true, settle_sub: 车骑将军, guest: true}

  - say: 曹操北上，兄弟俩暂时联手，关起城门死守。
    sources: [sgz-01, sgz-14]
    camera: {focus: [许, 黎阳], zoom: fit, move: 1.4}
    show:
      - army: {from: 许, to: 黎阳, faction: 曹操, banner: 曹, troops: infantry, size: 2.4, cue: 北上, grow: 2.4}
      - battle: {at: 黎阳, text: 连战数克}

  - say: 将领们想猛攻，郭嘉却说：
    scene: 军帐
    sources: [sgz-14]
    show:
      - enter: {who: 郭嘉, side: left, cue: 郭嘉, for: 2.6}

  - say: 逼得太急，他们就抱成一团；放一放，他们自己就会打起来！
    speaker: 郭嘉
    style: 轻快笃定，胸有成竹，带着几分狡黠
    scene: 军帐
    to: 曹操
    sources: [sgz-14]

  - say: 曹操带兵往南，假装去打荆州。
    sources: [sgz-14]
    camera: {focus: [黎阳, 许, 襄阳], zoom: fit, move: 1.4}
    show:
      - arrow: {from: 许, to: 襄阳, kind: direction, faction: 曹操, cue: 往南, grow: 1.6}

  - say: 曹军刚走，兄弟俩果然打了起来。袁谭打不过弟弟，竟然向曹操求救。
    sources: [sgz-14, sgz-01]
    year: 203
    camera: {focus: [邺, 黎阳, 平原], zoom: fit, move: 1.4}
    map: '203-08'
    show:
      - versus: {left: 袁谭, right: 袁尚, label: 兄弟相攻, for: 4}
      - sfx: {name: 对峙滚奏, len: 4}
      - flee: {from: 黎阳, to: 平原, faction: 袁谭}
      - act: {act: courier, places: [平原, 许], text: 乞援, cue: 求救, grow: 1.6, for: 3}

  - say: 曹操等的，就是这一天。
    sources: [sgz-14]
    show:
      - enter: {who: 曹操, side: right, cue: 曹操, for: 3}

  # ---------------- 第二章 水灌邺城 ----------------

  - say: 他趁机包围了袁家的老巢：邺城。
    phase: 水灌邺城
    sources: [sgz-01]
    year: 204
    camera: {focus: [许, 邺], zoom: fit, move: 1.4}
    show:
      - army: {from: 许, to: 邺, faction: 曹操, banner: 曹, troops: infantry, size: 2.8, cue: 包围, grow: 2.4}
      - siege: {at: 邺, text: 围, faction: 曹操, cue: 邺城, for: 3}
      - sfx: {name: 低音转场, delay: -0.3}

  - say: 守城的，是审配。
    sources: [sgz-06]
    camera: {focus: 邺, zoom: 6, move: 1.2}
    show:
      - enter: {who: 审配, at: 邺, side: left, cue: 审配, for: 3.4}

  - say: 曹操在城外挖了一圈又浅又窄的壕沟。审配在城头看着直笑。
    sources: [sgz-06]

  - say: 没想到一夜之间，壕沟挖成两丈宽、两丈深，漳水灌进了邺城。
    sources: [sgz-06, sgz-01]
    show:
      - act: {act: flood, at: 邺, text: 决漳水灌城, cue: 灌进了邺城, for: 5}
      - sfx: {name: 水淹}

  - say: 从五月到八月，城里饿死了一大半人。
    sources: [sgz-06]
    show:
      - quote: {text: 自五月至八月，城中饿死者过半, source: 三国志·袁绍传注, era: 建安九年, cue: 饿死}

  - say: 袁尚回救大败，连印绶都丢了。曹操拿着印绶给城里人看，守军的心散了。
    sources: [sgz-01]
    show:
      - battle: {at: 邺, text: 袁尚大败, cue: 大败}
      - act: {act: prop, at: 邺, item: 印绶, text: 得尚印绶, cue: 印绶, for: 3.4}

  - say: 审配的侄子半夜打开城门，审配被活捉。
    sources: [sgz-01]
    map: '204-08'
    show:
      - act: {act: night, cue: 半夜, for: 3}
      - takeover: {at: 邺, from: 袁绍, to: 曹操, name: 曹操, sub: 入邺城, camera: false}
      - sfx: {name: 疆域易手}

  - say: 有个降将嘲笑他，审配厉声回答：
    scene: 刑场
    sources: [sgz-06]

  - say: 你是投降的俘虏，我审配是忠臣！就算死了，也比你这样活着强！
    speaker: 审配
    style: 厉声怒斥，刚烈不屈，声如洪钟
    scene: 刑场
    to: 曹操
    sources: [sgz-06]

  - say: 临刑前，他喝令刽子手，让他面朝北方：
    scene: 刑场
    sources: [sgz-06]

  - say: 我的主公，在北边！
    speaker: 审配
    style: 悲壮从容，一字一顿，昂首北望
    scene: 刑场
    to: 曹操
    sources: [sgz-06]
    show:
      - exit: {who: 审配, at: 邺, verb: 死, cue: 北边, portrait: true}

  - say: 曹操亲自到袁绍墓前祭拜，哭得泪流满面。
    sources: [sgz-01]
    show:
      - act: {act: prop, at: 邺, item: 陵墓, text: 临祀绍墓, cue: 墓前, for: 4}
      - quote: {text: 公临祀绍墓，哭之流涕, source: 三国志·武帝纪, era: 建安九年, cue: 泪流满面}

  - say: 十几年前，他们是一起讨董的盟友。如今，一个躺在墓里，一个站在墓前。
    sources: [sgz-01]
    show:
      - versus: {left: 袁绍, right: 曹操, label: 故友, cue: 盟友, for: 5}

  # ---------------- 第三章 南皮 ----------------

  - say: 第二年，曹操在南皮斩了袁谭。冀州、青州，全部平定。
    phase: 南皮
    sources: [sgz-01]
    year: 205
    camera: {focus: [邺, 南皮, 平原], zoom: fit, move: 1.4}
    map: '205-01'
    show:
      - exit: {who: 袁谭, at: 南皮, verb: 斩, portrait: true}
      - sfx: {name: 疆域易手, cue: 平定}
      - sfx: {name: 低音转场, delay: -0.3}

  - say: 袁尚、袁熙逃到了长城外的乌桓。
    sources: [sgz-01]
    camera: {focus: [邺, 蓟, 柳城], zoom: fit, move: 1.6}
    map: '206-03'
    show:
      - flee: {from: 邺, to: 蓟, faction: 袁尚}
      - flee: {from: 蓟, to: 柳城, faction: 袁尚}
      - flag: {at: 柳城, name: 袁尚 · 袁熙, sub: 投奔乌桓, faction: 袁尚, cue: 乌桓, guest: true}

  - say: 如果袁绍早定了继承人，曹操还打得下河北吗？
    sources: [sgz-01]
    camera: {focus: [邺, 柳城], zoom: fit, move: 1.4}

  - say: 要不要追到塞外？那就是一场穿越荒原的远征。
    sources: [sgz-01]
    camera: {focus: [邺, 柳城], zoom: fit, move: 1.4}
    show:
      - spot: {at: 柳城}
      - title_bar: {text: 下集, sub: 北征乌桓 · 隆中对, cue: 远征, delay: 0.6, for: 3.0}

