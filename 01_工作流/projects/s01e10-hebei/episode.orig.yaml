beats:
  # ---------------- 第一章 兄弟阋墙 ----------------
  - say: 上回说到，官渡大败，袁绍带着八百骑兵逃回河北。冀州不少城池趁机叛离，又被他一座座打了回来。
    phase: 兄弟阋墙
    sources: [sgz-06, hhs-74]
    year: 201
    camera: {focus: [邺, 黎阳], zoom: fit, move: 2.0}
    map: '200-04'
    show:
      - title_bar: {text: 平定河北, sub: 三国 · 第10集, cue: 上回, for: 3.2}
      - sfx: 片头鼓
      - flag: {at: 邺, name: 袁绍, sub: 大将军, faction: 袁绍, cue: 袁绍}

  - say: 可他的元气已经伤透了。两年后的夏天，袁绍发病吐血，死了。
    sources: [sgz-01]
    year: 202
    show:
      - exit: {who: 袁绍, at: 邺, verb: 卒, cue: 死了, portrait: true}
      - sfx: {name: 退场钟, cue: 死了}

  - say: 袁绍生前偏爱小儿子袁尚，一直没定继承人。谋士审配、逢纪抢先拥立了袁尚。
    sources: [sgz-01, hhs-74]
    show:
      - enter: {who: 袁尚, at: 邺, side: right, cue: 袁尚, settle: true, settle_sub: 继位冀州}

  - say: 长子袁谭不服，自己封自己做车骑将军，带兵屯在黎阳。
    sources: [sgz-01]
    camera: {focus: [邺, 黎阳], zoom: fit, move: 1.2}
    show:
      - enter: {who: 袁谭, at: 黎阳, side: left, cue: 袁谭, settle: true, settle_sub: 车骑将军, guest: true}

  - say: 曹操北上进攻。兄弟俩暂时联手，连吃败仗，就关起城门死守。
    sources: [sgz-01, sgz-14]
    camera: {focus: [许, 黎阳], zoom: fit, move: 1.4}
    show:
      - army: {from: 许, to: 黎阳, faction: 曹操, banner: 曹, troops: infantry, size: 2.4, cue: 北上, grow: 2.4}
      - battle: {at: 黎阳, text: 连战数克, cue: 败仗}

  - say: 将领们都想乘胜猛攻。郭嘉却说：
    scene: 军帐
    sources: [sgz-14]
    show:
      - enter: {who: 郭嘉, side: left, cue: 郭嘉, for: 2.6}

  - say: 袁绍偏爱这两个儿子，谁也没立。逼得太急，他们就抱成一团；放一放，他们自己就会打起来。不如假装南下去打刘表，等他们内讧，再一举拿下！
    speaker: 郭嘉
    style: 轻快笃定，胸有成竹，带着几分狡黠
    scene: 军帐
    to: 曹操
    sources: [sgz-14]

  - say: 曹操说：好！他带兵往南，做出要去打荆州的样子。
    sources: [sgz-14]
    camera: {focus: [黎阳, 许, 襄阳], zoom: fit, move: 1.4}
    show:
      - arrow: {from: 许, to: 襄阳, kind: direction, faction: 曹操, cue: 往南, grow: 1.6}

  - say: 曹军刚走，袁谭、袁尚果然为了争冀州动起了刀兵。袁谭打不过弟弟，逃到平原，竟然派人向曹操求救。
    sources: [sgz-14, sgz-01]
    year: 203
    camera: {focus: [邺, 黎阳, 平原], zoom: fit, move: 1.4}
    owners_cue: 平原
    map: '203-08'
    show:
      - versus: {left: 袁谭, right: 袁尚, label: 兄弟相攻, cue: 动起了刀兵, for: 4}
      - sfx: {name: 对峙滚奏, cue: 动起了刀兵, len: 4}
      - flee: {from: 黎阳, to: 平原, faction: 袁谭, cue: 逃到平原}
      - act: {act: courier, places: [平原, 许], text: 乞援, cue: 求救, grow: 1.6, for: 3}

  - say: 曹操等的就是这一天。
    sources: [sgz-14]
    show:
      - enter: {who: 曹操, side: right, cue: 曹操, for: 3}

  # ---------------- 第二章 水灌邺城 ----------------
  - say: 公元二百零四年，曹操趁袁尚出兵攻打袁谭，包围了袁家的老巢：邺城。
    phase: 水灌邺城
    sources: [sgz-01]
    year: 204
    camera: {focus: [许, 邺], zoom: fit, move: 1.4}
    show:
      - army: {from: 许, to: 邺, faction: 曹操, banner: 曹, troops: infantry, size: 2.8, cue: 包围, grow: 2.4}
      - siege: {at: 邺, text: 围, faction: 曹操, cue: 邺城, for: 3}

  - say: 守城的，是袁家的谋士审配。
    sources: [sgz-06]
    camera: {focus: 邺, zoom: 6, move: 1.2}
    show:
      - enter: {who: 审配, at: 邺, side: left, cue: 审配, for: 3.4}

  - say: 曹操先在城外挖了一圈壕沟，周长四十里，故意挖得又浅又窄，看上去一抬腿就能跨过去。审配在城头上看着直笑，连出来争都懒得争。
    sources: [sgz-06]

  - say: 没想到，曹操一夜之间，就把壕沟挖成宽两丈、深两丈，然后掘开漳水，灌进了邺城。
    sources: [sgz-06, sgz-01]
    show:
      - act: {act: flood, at: 邺, text: 决漳水灌城, cue: 灌进了邺城, for: 5}
      - sfx: {name: 水淹, cue: 掘开漳水}

  - say: 从五月到八月，城里饿死了一大半人。
    sources: [sgz-06]
    show:
      - quote: {text: 自五月至八月，城中饿死者过半, source: 三国志·袁绍传注, era: 建安九年, cue: 饿死}

  - say: 袁尚带兵回救，被曹操打得大败，连印绶、节钺都丢了。曹操把缴获的印绶拿给城里人看，守军的心彻底散了。
    sources: [sgz-01]
    show:
      - battle: {at: 邺, text: 袁尚大败, cue: 大败}
      - act: {act: prop, at: 邺, item: 印绶, text: 得尚印绶, cue: 印绶, for: 3.4}

  - say: 八月，审配的侄子半夜打开城东门，放曹军进城。审配被活捉了。
    sources: [sgz-01]
    owners_cue: 打开城东门
    map: '204-08'
    show:
      - act: {act: night, cue: 半夜, for: 3}
      - takeover: {at: 邺, from: 袁绍, to: 曹操, cue: 打开城东门, name: 曹操, sub: 入邺城, camera: false}
      - sfx: {name: 疆域易手, cue: 打开城东门}

  - say: 一个早先投降的冀州人张子谦，素来跟审配不和，笑着问他：正南，你现在比我怎么样？审配厉声回答：
    scene: 刑场
    sources: [sgz-06]

  - say: 你是投降的俘虏，我审配是忠臣！就算死了，也比你这样活着强！
    speaker: 审配
    style: 厉声怒斥，刚烈不屈，声如洪钟
    scene: 刑场
    to: 曹操
    sources: [sgz-06]

  - say: 临刑前，他喝令刽子手，让他面朝北方：
    scene: 刑场
    sources: [sgz-06]

  - say: 我的主公，在北边！
    speaker: 审配
    style: 悲壮从容，一字一顿，昂首北望
    scene: 刑场
    to: 曹操
    sources: [sgz-06]
    show:
      - exit: {who: 审配, at: 邺, verb: 死, cue: 北边, portrait: true}

  - say: 审配死后，曹操亲自来到袁绍的墓前祭拜，哭得泪流满面。他安抚袁绍的妻子，把袁家的财物都还了回去。
    sources: [sgz-01]
    show:
      - act: {act: prop, at: 邺, item: 陵墓, text: 临祀绍墓, cue: 墓前, for: 4}
      - quote: {text: 公临祀绍墓，哭之流涕, source: 三国志·武帝纪, era: 建安九年, cue: 泪流满面}

  - say: 十几年前，他们是一起起兵讨伐董卓的盟友。如今，一个躺在墓里，一个站在墓前。
    sources: [sgz-01]
    show:
      - versus: {left: 袁绍, right: 曹操, label: 故友, cue: 盟友, for: 5}

  # ---------------- 第三章 南皮 ----------------
  - say: 第二年正月，曹操在南皮攻破袁谭，斩了他。冀州、青州，全部平定。
    phase: 南皮
    sources: [sgz-01]
    year: 205
    camera: {focus: [邺, 南皮, 平原], zoom: fit, move: 1.4}
    owners_cue: 平定
    map: '205-01'
    show:
      - campaign:
          at: 南皮
          title: 南皮之战
          clash: 攻破
          loser: 袁谭
          sides:
            - {from: 邺, faction: 曹操, banner: 曹, troops: cavalry, size: 2.4}
            - {from: 平原, faction: 袁谭, banner: 谭, troops: infantry, size: 1.6}
      - exit: {who: 袁谭, at: 南皮, verb: 斩, cue: 斩了他, portrait: true}
      - sfx: {name: 疆域易手, cue: 平定}

  - say: 袁尚和二哥袁熙逃到幽州，又被部下赶了出来，最后，投奔了长城外的乌桓。
    sources: [sgz-01]
    camera: {focus: [邺, 蓟, 柳城], zoom: fit, move: 1.6}
    owners_cue: 乌桓
    map: '206-03'
    show:
      - flee: {from: 邺, to: 蓟, faction: 袁绍, cue: 逃到幽州}
      - flee: {from: 蓟, to: 柳城, faction: 袁绍, cue: 投奔}
      - flag: {at: 柳城, name: 袁尚 · 袁熙, sub: 投奔乌桓, faction: 袁绍, cue: 乌桓}

  - say: 官渡之后，袁家明明还有大半个北方，为什么几年就垮了？不是曹操打得太狠，而是兄弟俩，先把刀砍向了对方。
    sources: [sgz-14]
    camera: {focus: [邺, 许], zoom: fit, move: 1.4}
    show:
      - headline: {text: 河北平定, sub: 建安十年, cue: 垮了, for: 3.2}

  - say: 河北平了，可袁尚、袁熙还活着，躲在长城外的乌桓人那里。要不要追？追，就是一场穿越塞外荒原的远征。
    sources: [sgz-01]
    camera: {focus: [邺, 柳城], zoom: fit, move: 1.4}
    show:
      - spot: {at: 柳城, cue: 长城外}
      - title_bar: {text: 下集, sub: 北征乌桓 · 隆中对, cue: 远征, delay: 0.6, for: 3.0}
