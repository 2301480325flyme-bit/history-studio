  big: [我君在北]
  hero: 审配
  at: 40
  summary: |
    官渡大败后袁绍吐血而死，偏爱的小儿子袁尚和长子袁谭为了继承权反目。郭嘉一句"缓之而后争心生"，曹操佯装南征，兄弟俩果然打了起来。
    曹操挖浅壕诱敌，一夜之间掘成两丈深，引漳水灌邺城，城中饿死过半；审配被擒不降，临刑喝令面朝北方："我君在北！"
  tags: [曹操, 袁绍, 审配, 邺城, 郭嘉]
  next: 北征乌桓，隆中对

