open_questions:
- 王凌案《晋书》记沿流九日到甘城、武丘面缚、经贾逵庙至项，但河流、起航点及多处古址未核；示意坐标不能当作定论。
- 毌丘俭、文钦起兵与破钦分别记正月、闰月，地图疆域.yaml按255-01、255-02标注；闰月与公历月的换算及事件排序需统一。
- 全怿、全端开寿春东门投降不等于全城陷落；夏口督孙壹奔魏但原文未说夏口失守。是否把九江、江夏显示为争夺及如何画局部易手需核。
- 寿春陷落日期《三国志》吴纪记三月、少帝纪记二月；本账按疆域.yaml取258-02，需确认画面排序口径。
- 诸葛诞围城时姜维出骆谷至沈岭、驻芒水，史载牵制魏军但旁白未提；是否在地图补线由Claude决定。
