beats:
  # ---------------- 冷开场 ----------------
  - say: 一位皇帝，带着身边的人冲出宫门，要去讨伐自己的大臣。
    map: '238-08'
    year: 260
    phase: 刃出于背
    sources: [js-02]
    camera: {focus: 洛阳, zoom: 6, move: 1.6}
    show:
      - sfx: 重拍转场
      - enter: {who: 曹髦, side: left, cue: 皇帝, for: 4.4}

  - say: 一支长戈，刺进他的胸口，从背后穿了出来。他只有二十岁。
    sources: [js-02, sgz-04]
    show:
      - quote: {text: 刺之，刃出于背，天子崩于车中, source: 晋书·文帝纪, era: 甘露五年, cue: 背后, for: 4.4}
      - sfx: {name: 碎玻璃, cue: 刺进}

  - say: 他叫曹髦。他要讨伐的大臣，叫司马昭。
    sources: [js-02]
    show:
      - versus: {left: 曹髦, right: 司马昭, label: 君臣, cue: 司马昭, for: 3.6}

  # ---------------- 第一章 一叛 ----------------
  - say: 高平陵之后两年，镇守淮南的太尉王凌，想另立新君，对抗司马懿。
    phase: 一叛
    year: 251
    sources: [sgz-28]
    camera: {focus: [洛阳, 寿春], zoom: fit, move: 1.6}
    show:
      - enter: {who: 王凌, side: right, cue: 王凌, for: 3.4}
      - title_bar: {text: 司马昭之心, sub: 三国 · 第26集, for: 3.2}
      - sfx: 片头鼓
      - flag: {at: 寿春, name: 王凌, sub: 谋立新君, faction: 魏, cue: 王凌}

  - say: 七十三岁的司马懿亲率大军顺流南下。王凌来不及准备，自己绑着出来请罪。
    sources: [sgz-28]
    show:
      - enter: {who: 司马懿, side: right, cue: 司马懿, for: 3.4}
      - army: {head: 司马懿, from: 洛阳, to: 寿春, faction: 魏, banner: 司马, troops: infantry, size: 2.8, cue: 南下, grow: 2.0}

  - say: 押回京城的路上，王凌死在了项县。参与的人，全被诛灭三族。
    sources: [sgz-28]
    camera: {focus: [寿春, 项, 洛阳], zoom: fit, move: 1.2}
    tells: [e10]
    show:
      - march: {from: 寿春, to: 项, faction: 魏, label: 押凌还京, cue: 押回, grow: 1.6}   # 2026-10-25 战事账：押王凌经贾逵庙至项
      - exit: {who: 王凌, at: 项, verb: 卒, portrait: true, cue: 死在}   # 饮药死

  - say: 这年八月，司马懿病逝。据《晋书》记载，他临死前，梦见王凌来索命。
    sources: [js-01]
    show:
      - exit: {who: 司马懿, at: 洛阳, verb: 卒, portrait: true, cue: 病逝}
      - sfx: {name: 退场钟, cue: 病逝}

  # ---------------- 第二章 二叛 ----------------
  - say: 大权到了长子司马师手里。二五四年，他废掉皇帝曹芳，改立十四岁的曹髦。
    phase: 二叛
    year: 254
    sources: [sgz-04]
    camera: {focus: 洛阳, zoom: 5, move: 1.2}
    show:
      - enter: {who: 司马师, side: left, cue: 司马师, for: 3.4}

  - say: 第二年，淮南的毌丘俭、文钦，又起兵了。
    map: '255-01'
    owners_cue: 起兵
    year: 255
    sources: [sgz-04]
    camera: {focus: [寿春, 乐嘉, 许昌], zoom: fit, move: 1.4}
    tells: [e11, e12]
    show:
      - enter: {who: 文钦, side: left, cue: 文钦, for: 3}
      - enter: {who: 毌丘俭, side: right, cue: 毌丘俭, for: 3.4}
      - sfx: {name: 疆域易手, cue: 起兵}
      - army: {unit: 毌丘俭, from: 寿春, to: 项, faction: 魏, banner: 毌丘, troops: infantry, size: 2.6, cue: 起兵, grow: 1.8, camp: false}   # 2026-10-25 战事账：俭、钦渡淮西至项

  - say: 司马师眼睛上刚割了一个瘤，伤还没好，就带病亲征。
    sources: [js-02]
    tells: [e13, e17]
    show:
      - army: {head: 司马师, from: 洛阳, via: [许昌], to: 乐嘉, faction: 魏, banner: 司马, troops: infantry, size: 2.8, cue: 亲征, grow: 1.6}

  - say: 乐嘉一战，文钦十八岁的儿子文鸯带人夜里冲营。司马师一惊，眼珠子从伤口里迸了出来。
    sources: [js-02]
    camera: {focus: 乐嘉, zoom: 10, move: 1.2}
    tells: [e18]
    show:
      - enter: {who: 文鸯, side: left, cue: 文鸯, for: 3.4}
      - battle: {at: 乐嘉, text: 文鸯冲营, cue: 冲营}
      - quote: {text: 鸯之来攻也，惊而目出, source: 晋书·景帝纪, era: 正元二年, cue: 眼珠子, for: 4}

  - say: 他怕军心动摇，用被子蒙住头，疼得把被子都咬烂了，身边的人竟然都没发现。
    sources: [js-02]

  - say: 毌丘俭兵败被杀，文钦逃到了东吴。可司马师也没撑过去，死在许昌，四十八岁。
    map: '255-02'
    owners_cue: 兵败
    sources: [sgz-04, js-02]
    camera: {focus: [乐嘉, 许昌, 寿春], zoom: fit, move: 1.4}
    show:
      - exit: {who: 司马师, at: 许昌, verb: 卒, portrait: true, cue: 死在}
      - exit: {who: 毌丘俭, at: 项, verb: 诛, portrait: true, side: right, cue: 被杀, for: 3}

  # ---------------- 第三章 三叛 ----------------
  - say: 弟弟司马昭接了班。二五七年，淮南第三次起兵：镇东大将军诸葛诞，联合东吴，守住寿春。
    phase: 三叛
    map: '257-05'
    owners_cue: 起兵
    year: 257
    sources: [sgz-28]
    camera: {focus: [洛阳, 寿春, 建业], zoom: fit, move: 1.4}
    tells: [e28]
    show:
      - enter: {who: 司马昭, side: left, cue: 司马昭, for: 3}
      - enter: {who: 诸葛诞, side: right, cue: 诸葛诞, for: 3.4}
      - arrow: {from: 建业, to: 寿春, kind: relation, faction: 吴, cue: 东吴, grow: 1.2}
      - flag: {at: 寿春, name: 诸葛诞, sub: 保寿春, faction: 魏, cue: 守住}

  - say: 大军把寿春围得水泄不通。围了大半年，城里粮尽。
    sources: [sgz-28]
    camera: {focus: 寿春, zoom: 8, move: 1.2}
    tells: [e32]
    show:
      - army: {head: 司马昭, from: 洛阳, via: [项], to: 寿春, faction: 魏, banner: 司马, troops: infantry, size: 3.2, cue: 围得, grow: 1.8}

  - say: 钟会写了一封假信，骗得城里的东吴援将开门投降，城中人心大乱。
    sources: [sgz-28]
    tells: [e39]   # 吴将开门出降，全城未陷
    show:
      - enter: {who: 钟会, side: left, cue: 钟会, for: 3}
      - act: {act: courier, places: [洛阳, 寿春], text: 伪书, cue: 假信, grow: 1.2, for: 3}
      - stamp: {at: 寿春, text: 降, cue: 投降}   # 东吴援将全怿等开门出降

  - say: 二五八年，寿春城破，诸葛诞被杀。他手下几百人被一个一个问降不降，没有一个投降。
    map: '258-02'
    owners_cue: 城破
    year: 258
    sources: [sgz-28]
    tells: [e41]
    show:
      - exit: {who: 诸葛诞, at: 寿春, verb: 诛, portrait: true, cue: 被杀}

  - say: 他们都说：为诸葛公死，不后悔。
    sources: [sgz-28]
    show:
      - quote: {text: 为诸葛公死，不恨, source: 三国志·诸葛诞传, era: 甘露三年, for: 4}

  # ---------------- 第四章 曹髦 ----------------
  - say: 三次起兵，三次失败。洛阳城里，二十岁的曹髦，再也忍不下去了。
    phase: 曹髦
    year: 260
    sources: [sgz-04]
    camera: {focus: 洛阳, zoom: 6, move: 1.2}
    show:
      - army: {head: 司马昭, from: 寿春, via: [项], to: 洛阳, faction: 魏, banner: 司马, troops: infantry, size: 2.6, cue: 三次失败, grow: 2.2}   # 2026-10-25 班师：不然司马昭的营一直留在寿春，而曹髦讨伐的是洛阳的他

  - say: 据说他对大臣们说：
    scene: 朝堂
    sources: [sgz-04]

  - say: 司马昭的心思，连路上的行人都知道！我不能坐着等他来废我，今天，我要亲自去讨伐他！
    speaker: 曹髦
    style: 悲愤决绝，拍案而起，年轻的声音发颤
    scene: 朝堂
    sources: [sgz-04]
    show:
      - card: {title: 据说, body: 司马昭之心，路人所知也——三少帝纪注引《汉晋春秋》, for: 6}

  - say: 他带人冲向大将军府。相府的兵将不敢动手。贾充喝道：大将军养着你们，就是为了今天！
    sources: [js-02]
    show:
      - enter: {who: 贾充, side: right, cue: 贾充, for: 3.6}
      - quote: {text: 公畜养汝辈，正为今日耳, source: 晋书·文帝纪, era: 甘露五年, cue: 今天, for: 4}

  - say: 太子舍人成济举起长戈冲上去，刺穿了皇帝。
    sources: [js-02]
    show:
      - enter: {who: 成济, side: left, cue: 成济, for: 3}
      - exit: {who: 曹髦, at: 洛阳, verb: 卒, portrait: true, cue: 刺穿}
      - sfx: {name: 退场钟, cue: 刺穿}

  - say: 司马昭召集百官商量怎么收场。尚书仆射陈泰说：只有腰斩贾充，才能给天下一个交代。
    sources: [js-02]
    show:
      - enter: {who: 陈泰, side: left, cue: 陈泰, for: 3.6}

  - say: 司马昭问：还有别的办法吗？陈泰说：我只知道这一个，不知道别的。
    sources: [js-02]

  - say: 最后，司马昭把罪名推给成济，斩了他。贾充，一点事都没有。
    sources: [js-02]
    show:
      - exit: {who: 成济, at: 洛阳, verb: 斩, portrait: true, cue: 斩了他}

  - say: 为什么三次起兵、一位皇帝拼了命，都扳不倒司马家？兵权和禁军早就在他们手里。
    sources: [js-02, sgz-04]
    camera: {focus: [洛阳, 寿春, 许昌], zoom: fit, move: 1.4}

  - say: 淮南三次起兵，各打各的，被一个一个收拾掉。当年曹家挟天子，如今，轮到了司马家。
    sources: [sgz-28]

  - say: 曹髦明知必死还要冲出去，你觉得他是勇敢，还是冲动？
    sources: [sgz-04]
    show:
      - vignette: {image: illus_caomao_charge, cue: 冲出去, for: 5, text: 曹髦拔剑出宫}

  - say: 而司马昭的下一步，是灭掉蜀汉。
    sources: [js-02]
    camera: {focus: [洛阳, 成都], zoom: fit, move: 1.6}
    show:
      - title_bar: {text: 下集, sub: 偷渡阴平 · 蜀汉亡, cue: 蜀汉, delay: 0.4, for: 3.0}
