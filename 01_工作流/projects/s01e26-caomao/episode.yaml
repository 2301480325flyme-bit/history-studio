    高平陵之后，淮南三次起兵：王凌事败饮药而死；毌丘俭、文钦起兵，乐嘉夜战，文钦之子文鸯冲营，刚割了眼瘤的司马师惊得眼珠迸出，咬烂被子硬撑，不久死于许昌；诸葛诞据寿春联吴，城破后麾下数百人宁死不降："为诸葛公死，不恨。"
