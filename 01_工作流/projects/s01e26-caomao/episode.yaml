# 快节奏版（2026-10-14，按抖音数据：冷开场、只讲有戏的、无背景音乐）
# 《三国到隋》第26集：王凌、毌丘俭、诸葛诞淮南三叛，司马懿、司马师之死，曹髦被弑（251–260）
# 本地语料核对：
# 王凌传"淩至项，饮药死…诸相连者悉夷三族"；晋书·宣帝纪"六月，帝寝疾，梦贾逵、王凌为祟，甚恶之。秋八月戊寅，崩于京师，时年七十三"；
# 晋书·天文志"九月，帝废为齐王"；三少帝纪"镇东将军毌丘俭、扬州刺史文钦反…大将军司马景王征之…闰月己亥，破钦于乐嘉。钦遁走，遂奔吴…都尉斩俭，传首京都…司马景王薨于许昌"；
# 晋书·景帝纪"初，帝目有瘤疾，使医割之。鸯之来攻也，惊而目出。惧六军之恐，蒙之以被，痛甚，啮被败而左右莫知焉…崩于许昌，时年四十八"；"钦子鸯，年十八，勇冠三军"；
# 诸葛诞传"诞窘急，单乘马，将其麾下突小城门出…斩诞，传首，夷三族。诞麾下数百人，坐不降见斩，皆曰：为诸葛公死，不恨。其得人心如此"；钟会传"会建策，密为辉、仪作书…怿等恐惧，遂将所领开东城门出降…城中由是乖离"；
# 晋书·文帝纪"天子知事泄，帅左右攻相府，称有所讨，敢有动者族诛。相府兵将止不敢战，贾充叱诸将曰：公畜养汝辈，正为今日耳！太子舍人成济抽戈犯跸，刺之，刃出于背，天子崩于车中。帝召百僚谋其故，仆射陈泰不至…泰曰：惟腰斩贾充，微以谢天下。帝曰：卿更思其次。泰曰：但见其上，不见其次。于是归罪成济而斩之"；三少帝纪"高贵乡公卒，年二十"。
# 注文（片中标"据说"）：三少帝纪注引汉晋春秋 曹髦"司马昭之心，路人所知也。吾不能坐受废辱，今日当与卿等自出讨之"。

id: s01e26-caomao
title: 司马昭之心
series: 三国 · 第26集
year: 260

notes:
  - 主线问题：淮南三次起兵、皇帝亲自拼命，为什么都扳不倒司马家？——兵权和禁军早在他们手里；三次起兵各打各的，被一个一个收拾。
  - 反差：一国之君亲自带人去打自己的大臣，被一个太子舍人刺穿；凶手被斩，主使的贾充毫发无伤。
  - 细节：司马懿临死梦见王凌索命；司马师眼珠迸出，咬烂被子不出声；"为诸葛公死，不恨"；陈泰"只知道这个，不知道别的"。
  - 动机：王凌、毌丘俭、诸葛诞都是镇守淮南的重臣，眼看司马氏一步步篡权。
  - 史评：当年曹家挟天子，如今轮到司马家。

