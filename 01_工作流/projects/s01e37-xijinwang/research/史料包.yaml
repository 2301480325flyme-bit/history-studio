romance_and_debates:
  - “衣冠南渡”是后世概括；本地原文支持元帝渡江建都扬州和司马睿称晋王，未查到该四字作为当时原句。
  - 长安陷落的帝纪、载记月份表述有差异；可先定316年，具体月需Claude统一。
  - 胡崧获胜后按兵、还槐里的动机“虑麹、索功盛”属传记解释。
  - 313年石勒取邺未核；可查邺陷记载为307年汲桑所为。
  - 疆域.yaml缺少312–317年事件；长安、晋阳、河北郡级变化要按han-219郡名复核。
