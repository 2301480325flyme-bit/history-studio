# 快节奏版（2026-10-25）
# 《三国到隋》第37集 · 两晋：长安陷落，西晋灭亡（312–317）。大纲第 32 条（合集二收官）。
# 本地语料核对（晋书）：
# 怀帝纪 p00114"共奉秦王鄴为皇太子于长安"；p00115"刘聪大会，使帝著青衣行酒。侍中庾珉号哭，聪恶之。丁未，帝遇弑，崩于平阳，时年三十"；
# 愍帝纪 p00122"帝行酒洗爵，反而更衣，又使帝执盖，晋臣在坐者多失声而泣"（愍帝在平阳）；
# 愍帝纪 p00121 建兴四年"秋七月，刘曜攻北地，麹允帅步骑三万救之。王师不战而溃"；"曜进至泾阳，渭北诸城悉溃"；"冬十月，京师饥甚，米斗金二两，人相食，死者太半。太仓有曲数饼，麹允屑为粥以供帝，至是复尽。帝泣谓允曰：今窘厄如此，外无救援，死于社稷，是朕事也…庶令黎元免屠烂之苦"；"十一月乙未，使侍中宋敞送笺于曜，帝乘羊车，肉袒衔壁，舆榇出降。群臣号泣攀车"；"及帝如曜营，营实在城东豆田壁"；
# 愍帝纪 p00119 建兴二年"三月癸酉，石勒陷幽州，杀…王浚，焚烧城邑，害万余人"；石勒载记 p07175"浚遗勒麈尾，勒伪不敢执，悬之于壁，朝夕拜之"；
# 祖逖传 p04823"帝乃以逖为奋威将军、豫州刺史，给千人禀，布三千匹，不给铠仗，使自招募。仍将本流徙部曲百余家渡江，中流击楫而誓曰：祖逖不能清中原而复济者，有如大江"（建兴元年，313）；
# 王导传 p04933"洛京倾覆，中州士女避乱江左者十六七"；元帝纪 p00122"三月，琅邪王睿承制改元，称晋王于建康"。
# 不用：刘琨后被段匹磾所杀（318 年，超出本集，只说"孤守晋阳"）；"313 年石勒取邺"（史料包：未核）；愍帝出降月份异文（按愍帝纪十一月）。

id: s01e37-xijinwang
title: 西晋灭亡
series: 两晋 · 第37集
year: 312

notes:
  - 主线问题：统一天下的西晋，为什么只活了三十几年？——八个王把兵打光了，北边的人走进了空门；最后一个皇帝，连投降都要抬着棺材。
  - 钩子候选：①"晋朝两个皇帝，都穿着仆人的青衣，给匈奴皇帝倒过酒"（反差3 具体3 悬念3 兑现3=12）②"一斗米，卖二两金子"（反差2 具体3 悬念2 兑现3=10）③"最后一个皇帝，抬着棺材出城投降"（反差2 具体3 悬念2 兑现3=10）→ 选①。
  - 反差：皇帝给敌国皇帝倒酒；石勒把王浚送的麈尾挂在墙上天天拜，转头就杀了王浚；十几岁的皇帝说"死于社稷是我的事，可百姓不该跟着死"。
  - 细节：青衣行酒、晋臣失声痛哭；米斗金二两；几块酒曲磨粉做粥；羊车、肉袒、衔璧、舆榇；"天子何在豆田中"；中流击楫。
  - 演义对照卡：结尾卡"成语出处"——中流击楫（祖逖传）。

