publish:
  hook: 晋朝两个皇帝，都穿着仆人的青衣，给匈奴皇帝倒过酒
  big: [西晋灭亡, 衣冠南渡]
  hero: 司马邺
  at: 3
  summary: |
    洛阳陷落后，晋臣在长安立秦王司马邺为太子。313 年，平阳的刘聪大宴群臣，让被俘的晋怀帝穿青衣给客人倒酒，晋朝旧臣当场失声痛哭，不久怀帝被杀，司马邺即位为晋愍帝。同年祖逖带百余家部曲北伐，中流击楫发誓。314 年石勒先把王浚送的麈尾挂墙上天天拜，骗得信任后攻陷幽州、杀了王浚。
    316 年刘曜攻关中，晋军三万不战而溃，长安被围，米一斗卖金二两，几块酒曲磨粉做粥也吃完了。十几岁的愍帝说"死于社稷是我的事"，为免百姓被屠，十一月乘羊车、肉袒衔璧、抬着棺材出降，西晋灭亡。中原士族十之六七逃过长江，317 年琅邪王司马睿在建康称晋王，东晋由此开始。
  tags: [西晋灭亡, 晋愍帝, 青衣行酒, 祖逖, 中流击楫, 衣冠南渡]
  next: 东晋建立

