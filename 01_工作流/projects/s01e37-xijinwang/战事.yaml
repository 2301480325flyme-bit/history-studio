open_questions:
- 疆域.yaml目前止于307年，缺312–317年郡级事件。请Claude对照han-219郡名决定是否补：晋阳失守、刘曜攻北地及长安/京兆尹、石勒陷廪丘、幽州/蓟、长安陷落；称晋王是建制变化。
- 313年石勒取邺未核；当前可查邺陷为307年汲桑所为。
- 刘曜316年具体出发点、连续路线和关隘未载；可核链条仅北地→泾阳→渭北诸城→长安小城/外城，不补造子午道或潼关路线。
- 长安援军只知华辑屯霸上、胡崧屯遮马桥并至灵台；后两地望未核。
- 愍帝出降月份在帝纪、载记叙述中有差异；本账先列316年10/11月，需统一疆域变色月。
- 蓟城汉-219郡级归属待核；本账没有把幽州全州转手写成确定事实。
- 祖逖任命月份和渡江码头未核；日期只记317年。
- 本地 sources 未返回《资治通鉴》卷八十五至九十相关段落；需要双书互证时请另补检。
accepted: 2026-10-25 Claude 验收：统一地名、补 skip、去掉对不上脚本的途经点
