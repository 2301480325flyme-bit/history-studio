episode: s01e43-ranmin
title: 冉闵杀胡建魏，前秦在关中立国（349–352）
source_note: >-
  本地《晋书》语料可逐段核验；指定《资治通鉴》卷九十八至九十九未在本地语料检出，不伪造通鉴引文。
  载记数字照录，不当作现代人口统计。
events:
  - date: 349（永和五年）
    event: 石虎死，石世嗣位；石遵废石世自立，石冲起兵败死
    people: [石虎, 石世, 石遵, 石冲, 冉闵]
    place: [邺, 蓟, 平棘]
    summary: 石虎死后诸子争位；石遵杀石世自立，石冲自蓟讨遵，败后被赐死。
    evidence:
      - {quote: "石季龙死，子世嗣伪位。五月，石遵废世而自立。", para: 晋书-p00182}
      - {quote: "石冲时镇于蓟，闻遵杀世而自立", para: 晋书-p07370}
      - {quote: "战于平棘，冲师大败，获冲于元氏，赐死", para: 晋书-p07370}
  - date: 349（永和五年十一月）
    event: 石遵被杀，石鉴即位；石闵、李农控制禁军
    people: [石遵, 石鉴, 冉闵, 李农]
    place: 邺
    summary: 石遵议诛石闵，石闵与李农政变杀遵，改立石鉴。
    evidence:
      - {quote: "十一月丙辰，石鉴弑石遵而自立。", para: 晋书-p00182}
      - {quote: "使将军苏亥、周成率甲士三十执遵于如意观", para: 晋书-p07374}
      - {quote: "鉴乃僭位，大赦殊死已下。以石闵为大将军", para: 晋书-p07375}
  - date: 349–350（永和五年至六年）
    event: 邺城诛胡羯及“杀胡令”叙事
    people: [冉闵, 李农, 石鉴]
    place: 邺
    summary: 《晋书》记先禁六夷持兵，后令赵人斩胡首送凤阳门以赏官；未保存一份完整、题名为“杀胡令”的诏书。
    evidence:
      - {quote: "斩一胡首送凤阳门者，文官进位三等，武职悉拜牙门", para: 晋书-p07378}
      - {quote: "闵躬率赵人诛诸胡羯，无贵贱男女少长皆斩之，死者二十余万", para: 晋书-p07378}
      - {quote: "十一月，冉闵杀石遵，又尽杀胡十余万人", para: 晋书-p00674}
    note: p07378直接记“二十余万”；p00638追叙“十余万人”，数字不一。曝尸、野犬食尸、高鼻多须者误死等为原话，血腥，Claude 决定是否使用。
  - date: 350（永和六年）
    event: 冉闵杀石鉴，即皇帝位，国号大魏，复姓冉
    people: [冉闵, 石鉴, 李农]
    place: 邺
    summary: 冉闵、李农出兵后闻石鉴有异谋，急返邺杀鉴；冉闵称帝建魏、恢复冉姓。
    evidence:
      - {quote: "闵、农驰还，废鉴杀之，诛季龙孙三十八人", para: 晋书-p07381}
      - {quote: "于是僭即皇帝位于南郊，大赦，改元曰永兴，国号大魏，复姓冉氏", para: 晋书-p07384}
      - {quote: "闰月，冉闵弑石鉴，僭称天王，国号魏", para: 晋书-p00183}
    note: 载记称“皇帝”，本纪称“天王”；“冉魏”是史学区分名。
  - date: 350（永和六年）
    event: 冉闵破石琨等攻邺军
    people: [冉闵, 石琨, 张举, 王朗]
    place: 邺
    summary: 石琨等率七万人攻邺，冉闵率千余骑迎战。载记另记其在邯郸击败石琨军，可能为前后不同战次。
    evidence:
      - {quote: "石琨及张举、王朗率众七万伐鄴", para: 晋书-p07380}
      - {quote: "石闵率骑千余，距之城北", para: 晋书-p07380}
      - {quote: "闵大败琨于邯郸，死者万余", para: 晋书-p07386}
    note: 不要把“邺城北”与“邯郸”强并成同一战点；两战日期细分未核。
  - date: 350（永和六年）
    event: 冉闵在苍亭破张贺度等联军
    people: [冉闵, 刘群, 王泰, 崔通, 周成, 张贺度, 段勤, 刘国, 靳豚]
    place: [黄城, 苍亭, 阴安乡]
    summary: 王泰等率步骑十二万先屯黄城，冉闵率精兵八万继进，苍亭击败联军并追斩靳豚。
    evidence:
      - {quote: "帅步骑十二万次于黄城，闵躬统精卒八万继之，战于苍亭", para: 晋书-p07386}
      - {quote: "贺度等大败，死者二万八千，追斩勒豚于阴安乡", para: 晋书-p07386}
    note: 战事细节目前只有载记一处；第二处出处未核。
  - date: 350（三月，永和六年）
    event: 苻洪在枋头被麻秋毒杀，苻健继众
    people: [苻洪, 苻健, 麻秋]
    place: 枋头
    summary: 苻洪死前令苻健乘关中形胜西进；史载享年六十六。
    evidence:
      - {quote: "世子健收而斩之", para: 晋书-p07569}
      - {quote: "关中形胜，吾亡后便可鼓行而西", para: 晋书-p07569}
      - {quote: "三月，石季龙故将麻秋鸩杀苻洪于枋头", para: 晋书-p00183}
  - date: 350（秋八月，永和六年）
    event: 苻健由枋头西入关，破杜洪军并入长安
    people: [苻健, 苻雄, 苻菁, 杜洪, 张先]
    place: [枋头, 盟津, 轵关, 潼关, 赤水, 渭北, 阴槃, 长安, 司竹]
    summary: 苻健主力在盟津架浮桥渡河；苻雄率五千人入潼关，苻菁从轵关入河东。苻健继进，在潼关击破张先；后次赤水，苻雄取渭北、再败张先于阴槃，三辅城邑降，苻健入长安。
    evidence:
      - {quote: "起浮桥于盟津以济。遣其弟雄率步骑五千入潼关，兄子菁自轵关入河东", para: 晋书-p07571}
      - {quote: "健遂进军，次赤水，遣雄略地渭北，又败张先于阴槃", para: 晋书-p07571}
      - {quote: "健入而都之", para: 晋书-p07571}
      - {quote: "苻健帅众入关", para: 晋书-p00183}
    note: 关键节点可核，不是逐日行军日志；盟津为苻健主力渡河，苻雄走潼关，勿画成同一路线。
  - date: 351（永和七年）
    event: 苻健在长安称天王大单于、国号秦
    people: [苻健]
    place: 长安
    summary: 苻健建元皇始、置百官；政权史称前秦。
    evidence:
      - {quote: "永和七年，僭称天王、大单于，赦境内死罪，建元皇始", para: 晋书-p07572}
      - {quote: "置百官于长安", para: 晋书-p07572}
      - {quote: "苻健僭称王，国号秦", para: 晋书-p00184}
    note: 苻洪此前已自称“三秦王”；通常以前秦在关中立国指苻健351年称秦、建元置官。
  - date: 351（永和七年）
    event: 冉闵围襄国百余日，石祗获羌、燕援军后大败冉闵
    people: [冉闵, 石祗, 石琨, 姚弋仲, 姚襄, 慕容儁, 慕容恪, 悦绾]
    place: [邺, 襄国, 襄下场长芦, 黄丘, 滆头, 龙城]
    summary: 冉闵以十万步骑围襄国、筑土山地道。石祗称赵王求援；石琨、姚襄、前燕悦绾等合军十余万。胡睦、孙威先后败退，冉闵出战大败，潜返邺。
    evidence:
      - {quote: "闵率步骑十万攻石祗于襄国", para: 晋书-p07387}
      - {quote: "闵攻襄国百余日，为土山地道，筑室反耕", para: 晋书-p07387}
      - {quote: "弋仲复遣其子襄率骑三万八千至自滆头，俊遣将军悦绾率甲卒三万自龙城", para: 晋书-p07387}
      - {quote: "姚襄、悦绾、石琨等三面攻之，祗冲其后，闵师大败", para: 晋书-p07387}
      - {quote: "石祗大败冉闵于襄国", para: 晋书-p00184}
    note: 载记给出过程，本纪记结果；襄下场长芦、黄丘、滆头今址未核。
  - date: 351（永和七年）
    event: 刘显攻邺，冉闵反击；刘显杀石祗，后被冉闵袭杀
    people: [冉闵, 刘显, 石祗, 王泰]
    place: [邺, 明光宫, 阳平, 襄国]
    summary: 刘显率七万军屯明光宫附近；冉闵反击追至阳平，刘显请降并杀石祗。之后冉闵袭入襄国、杀刘显，迁其百姓往邺。
    evidence:
      - {quote: "石祗使刘显帅众七万攻鄴", para: 晋书-p07388}
      - {quote: "追奔及于阳平，斩首三万余级", para: 晋书-p07388}
      - {quote: "刘显果杀祗及其太宰赵鹿等十余人，传首于鄴", para: 晋书-p07388}
      - {quote: "遂入襄国，诛显及其公卿已下百余人，焚襄国宫室，迁其百姓于鄴", para: 晋书-p07390}
      - {quote: "刘显杀石祗", para: 晋书-p00184}
  - date: 351–352（永和七年至八年）
    event: 晋军入秦川，苻健在长安称帝
    people: [司马勋, 苻健]
    place: [汉中, 秦川, 五丈原, 长安]
    summary: 司马勋率三万自汉中入秦川，苻健在五丈原击败晋军；352年于太极前殿即皇帝位。
    evidence:
      - {quote: "勋率步骑三万入秦川，健败之于五丈原", para: 晋书-p07573}
      - {quote: "健僭即皇帝位于太极前殿", para: 晋书-p07574}
      - {quote: "自汉中入秦川，与苻健战于五丈原，王师败绩", para: 晋书-p00184}
    note: 351年称天王与352年称帝是两阶段。
  - date: 352（永和八年四月）
    event: 慕容恪在魏昌城擒冉闵，押送蓟
    people: [冉闵, 慕容恪, 慕容儁, 董闰, 张温]
    place: [魏昌城, 廉台, 蓟]
    summary: 冉闵与慕容恪遇于魏昌城。《晋书》写“十战皆败之”，随后记铁锁连马及五千善射者方阵；冉闵突击斩三百余人，燕军合围，朱龙马死，冉闵行二十余里后被擒。
    evidence:
      - {quote: "与慕容恪相遇于魏昌城", para: 晋书-p07391}
      - {quote: "十战皆败之。恪乃以铁锁连马", para: 晋书-p07391}
      - {quote: "行二十余里，马无故而死，为恪所擒", para: 晋书-p07391}
      - {quote: "夏四月，冉闵为慕容隽所灭", para: 晋书-p00185}
    note: “十战皆败之”指先前交战均败；“连马”见于晋书，详细“连环马”侧翼包抄叙事未必都有正史依据。魏昌城与廉台对应及精确位置有争议。
  - date: 352（永和八年）
    event: 冉闵于龙城附近遏陉山被处斩；慕容儁于中山称帝
    people: [冉闵, 慕容儁]
    place: [蓟, 龙城, 遏陉山, 中山]
    summary: 慕容儁送冉闵至龙城后于遏陉山处斩，追谥武悼天王；同年在中山称燕帝。
    evidence:
      - {quote: "俊送闵既至龙城，斩于遏陉山", para: 晋书-p07393}
      - {quote: "俊遣使者祀之，谥曰武悼天王", para: 晋书-p07393}
      - {quote: "隽僭帝号于中山，称燕", para: 晋书-p00185}
  - date: 352（永和八年）
    event: 前燕围邺，冉魏宗室被送蓟
    people: [冉智, 蒋干, 慕容评, 慕容儁]
    place: [邺, 蓟]
    summary: 慕容评围邺，冉智等向晋请援；城陷后冉闵妻儿、重臣等被送往蓟。邺陷精确日期未核。
    evidence:
      - {quote: "遣慕容评率众围鄴", para: 晋书-p07392}
      - {quote: "评送闵妻董氏、太子智", para: 晋书-p07392}
      - {quote: "夏四月，冉闵为慕容隽所灭", para: 晋书-p00185}
