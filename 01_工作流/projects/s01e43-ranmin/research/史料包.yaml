interpretation:
  - topic: “杀胡令”原文与死亡数字
    finding: >-
      《晋书》未保存完整且题为“杀胡令”的诏书。载记先写禁六夷持兵，后写以斩胡首赏官，并称四方承书诛杀。“二十余万”只见载记七p07378，志篇p00638追叙“十余万人”，数字有差；应表述为史书记载数，不当作精确统计。曝尸、野犬食尸、无贵贱男女少长皆杀、高鼻多须者误死等为原话且血腥，供Claude取舍。
    evidence:
      - {quote: "宣令内外六夷敢称兵杖者斩之", para: 晋书-p07378}
      - {quote: "斩一胡首送凤阳门者", para: 晋书-p07378}
      - {quote: "死者二十余万", para: 晋书-p07378}
      - {quote: "十一月，冉闵杀石遵，又尽杀胡十余万人", para: 晋书-p00674}
  - topic: 冉闵与“汉人英雄”后世叙事
    finding: >-
      《晋书》记冉闵父本姓冉、被石虎收养、后来复姓；也记其建魏、战事和诛杀胡羯。面对慕容儁时“我一时英雄”是冉闵自辩，不是史家称号。后世“汉人英雄”是后世阐释，应与可核事实、人物自述分层；史臣华夷论述也不等同现代民族概念。
    evidence:
      - {quote: "父瞻，字弘武，本姓冉，名良", para: 晋书-p07383}
      - {quote: "复姓冉氏", para: 晋书-p07384}
      - {quote: "我一时英雄，何为不可作帝王邪", para: 晋书-p07391}
      - {quote: "于时高鼻多须至有滥死者半", para: 晋书-p07378}
  - topic: 魏昌城、廉台与铁锁连马
    finding: >-
      《晋书》只明言魏昌城，并写“十战皆败之。恪乃以铁锁连马”。廉台属后世地名考证；现代定位有无极县西、定州陉邑两说。连马原文确有，但“连环马”及侧翼伏击等详尽战术不可都归于晋书。
    evidence:
      - {quote: "与慕容恪相遇于魏昌城", para: 晋书-p07391}
      - {quote: "十战皆败之。恪乃以铁锁连马", para: 晋书-p07391}
    references:
      - {work: 后世地理条目, url: "https://www.cidianwang.com/lishi/diming/1/9531eo.htm", note: 引后世地志，称廉台在无极县西}
      - {work: 地方文化材料, url: "https://www.visitbeijing.com.cn/article/47QpU1E116C", note: 指向定州陉邑，定位不同}
  - topic: 前秦建国节点
    finding: >-
      苻洪在枋头先自称大将军、大单于、三秦王；苻健350年入关都长安，351年称天王、大单于、国号秦并建元置官，352年才称帝。宜以351年在关中建秦为建国节点，勿把352称帝写成建国年。
    evidence:
      - {quote: "自称大将军、大单于、三秦王", para: 晋书-p07569}
      - {quote: "永和七年，僭称天王、大单于", para: 晋书-p07572}
      - {quote: "健僭即皇帝位于太极前殿", para: 晋书-p07574}
