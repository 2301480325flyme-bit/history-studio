  - say: 先说三四九年。石虎一死，儿子们抢皇位，一年换了三个皇帝。
    year: 349
    phase: 夺权
    sources: [js-107]
    camera: {focus: [邺, 襄国], zoom: 7, move: 1.4}
    show:
      - title_bar: {text: 冉闵, sub: 十六国 · 第43集, for: 3.2}
      - sfx: 片头鼓

  - say: 石遵夺位前，许诺冉闵：事成了，立你当太子。
    sources: [js-107]
    show:
      - enter: {who: 石遵, side: left, cue: 石遵, for: 3.2}
