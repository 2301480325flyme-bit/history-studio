      - quote: {text: 关中形胜，吾亡后便可鼓行而西, source: 晋书·苻洪载记, cue: 往西打, for: 4}

  - say: 苻健偏装作不想走，在枋头修宫殿、种麦子，谁不种，就杀谁。
    sources: [js-112]
    tells: [e17]
    show:
      - enter: {who: 苻健, side: right, cue: 苻健, for: 3.2}
      - vignette: {image: illus_zhongmai, cue: 种麦子, for: 5, text: 课所部种麦，示无西意}

  - say: 这年秋天，他突然全军西进，在盟津架桥过河，拉着侄子苻菁的手说：
    sources: [js-08, js-112]
    camera: {focus: [枋头, 盟津, 长安], zoom: fit, move: 1.4}
    tells: [e18]
    show:
      - army: {head: 苻健, from: 枋头, to: 盟津, faction: 前秦, banner: 健, troops: cavalry, size: 3.0, cue: 全军西进, grow: 1.6, camp: false}
      - act: {act: pontoon, at: 盟津, text: 起浮桥于盟津以济, cue: 架桥, for: 3.6}

  - say: 这一仗要是败了，你死在河北，我死在河南，到了黄泉，都别再见面！
    speaker: 苻健
    style: 紧握对方的手，压着情绪，斩钉截铁，诀别的口吻
    quote: 事若不捷，汝死河北，我死河南，不及黄泉无相见也
    sources: [js-112]
    show:
      - enter: {who: 苻健, side: right, cue: 这一仗, for: 5}

  - say: 过了河就烧桥。一路连战连胜，进了长安。
    map: '350-11'
    owners_cue: 进了长安
    sources: [js-112]
    tells: [e20, e22]
    show:
      - vignette: {image: illus_mengjin_bridge, cue: 烧桥, for: 4.5, text: 既济，焚桥}
      - army: {head: 苻健, from: 盟津, via: [潼关], to: 长安, faction: 前秦, banner: 健, troops: cavalry, size: 3.0, cue: 连战连胜, grow: 1.8}
      - battle: {at: 潼关, text: 逆击破张先, cue: 连战连胜}

  - say: 第二年正月，苻健自称天王，国号秦。史称前秦。
    audit_ok: [遗忘]
    year: 351
    sources: [js-08, js-112]
    show:
      - act: {act: enthrone, who: 苻健, at: 长安, text: 天王 · 国号秦, sub: 永和七年, cue: 国号秦, for: 3.2}

  # ---------------- 第四章 襄国 ----------------
  - say: 再说冉闵。他带十万大军围襄国，打了一百多天。
    year: 350
    phase: 襄国
    sources: [js-08, js-107]
    camera: {focus: [邺, 襄国, 蓟], zoom: fit, move: 1.4}
    show:
      - army: {head: 冉闵, from: 邺, to: 襄国, faction: 冉魏, banner: 闵, troops: infantry, size: 3.4, cue: 十万大军, grow: 1.6, stop: approach}
      - siege: {at: 襄国, text: 攻襄国百余日, faction: 冉魏, cue: 一百多天}

  - say: 石祗向羌人、鲜卑求救，十几万援军压了过来。
    year: 351
    sources: [js-107]
    tells: [e12]
    show:
      - enter: {who: 姚弋仲, side: left, cue: 羌人, for: 2.8}
      - army: {unit: 悦绾, from: 蓟, to: 襄国, faction: 前燕, banner: 燕, troops: cavalry, size: 2.6, cue: 援军, grow: 1.6, stop: approach, camp: false}

  - say: 大将王泰劝他别出战。一个道士却说：太白经昴，该杀胡王，一战百胜！
    sources: [js-107]
    show:
      - vignette: {image: illus_taibai, cue: 一个道士, for: 6, text: 太白经昴，当杀胡王}

  - say: 冉闵一挥袖子：我决心已定，再劝的，斩！
    sources: [js-107]
    show:
      - quote: {text: 吾战决矣，敢谏者斩, source: 晋书·石季龙载记下, cue: 再劝的, for: 3.4}

  - say: 结果三面受敌，十几万人死在襄国城下。冉闵只带着十几个骑兵，逃回了邺城。
    sources: [js-08, js-107]
    tells: [e10, e13]
    show:
      - battle: {at: 襄国, text: 闵师大败, cue: 三面受敌}
      - rout: {at: 襄国, to: 邺, faction: 冉魏, banner: 闵, head: 冉闵, cue: 逃回了邺城, size: 1}
      - sfx: {name: 溃败哭喊, cue: 死在襄国城下}

  - say: 没多久，石祗被自己的部将刘显杀了。后赵，彻底亡了。
    map: '351-04'
    owners_cue: 亡了
    sources: [js-08]
    show:
      - exit: {who: 石祗, at: 襄国, verb: 杀, portrait: true, cue: 杀了}
      - sfx: {name: 落幕锣, cue: 亡了}

  # ---------------- 第五章 魏昌城 ----------------
  - say: 三五二年，冉闵重整兵马，打进襄国，杀了刘显。可北边的前燕，已经压到了冀州。
    year: 352
    map: '352-01'
    owners_cue: 打进襄国
    phase: 魏昌城
    sources: [js-08, js-107]
    camera: {focus: [邺, 中山, 蓟], zoom: fit, move: 1.4}
    tells: [e16]
    show:
      - camp: {at: 邺, unit: 冉闵, faction: 冉魏, text: 冉闵, cue: 重整兵马}
      - army: {head: 冉闵, from: 邺, to: 襄国, faction: 冉魏, banner: 闵, troops: cavalry, size: 2.8, cue: 打进襄国, grow: 1.2}

  - say: 冉闵带兵迎上去，在魏昌城撞上了慕容恪。
    sources: [js-107]
    show:
      - army: {head: 冉闵, from: 襄国, to: 魏昌城, faction: 冉魏, banner: 闵, troops: cavalry, size: 2.8, cue: 迎上去, grow: 1.4, stop: approach}
      - army: {head: 慕容恪, from: 中山, to: 魏昌城, faction: 前燕, banner: 恪, troops: cavalry, size: 3.2, cue: 慕容恪, grow: 1.2, stop: approach}
      - enter: {who: 慕容恪, side: left, cue: 撞上了, for: 3}

  - say: 部将劝他避一避。冉闵大怒：遇上慕容恪就躲，人家要笑话我！
    sources: [js-107]
    show:
      - quote: {text: 今遇恪而避之，人将侮我矣, source: 晋书·石季龙载记下, cue: 笑话我, for: 3.6}

  - say: 前后十仗，冉闵仗仗都赢。
    sources: [js-107]
    tells: [e25]
    show:
      - battle: {at: 魏昌城, text: 十战皆败之, cue: 十仗}

  - say: 慕容恪就用铁锁把战马连在一起，排成方阵，一步一步压过来。
    sources: [js-107]
    show:
      - vignette: {image: illus_tiesuo, cue: 铁锁, for: 6, text: 恪乃以铁锁连马，方阵而前}

  - say: 冉闵骑着赤马朱龙，左手双刃矛，右手钩戟，一口气杀了三百多人。
    sources: [js-107]
    show:
      - enter: {who: 冉闵, side: right, cue: 赤马朱龙, for: 4}
      - sfx: {name: 刀剑交击, cue: 三百多人}

  - say: 可燕军越围越多。他突围跑了二十多里，战马无故倒地而死。冉闵被擒。
    map: '352-04'
    owners_cue: 被擒
    sources: [js-08, js-107]
    show:
      - battle: {at: 魏昌城, text: 围之数周, cue: 越围越多}
      - exit: {who: 冉闵, at: 魏昌城, verb: 囚, portrait: true, cue: 被擒}

  - say: 慕容儁问他：你一个奴才，凭什么自称天子？
    sources: [js-107]
    show:
      - enter: {who: 慕容儁, side: left, cue: 慕容儁, for: 4}

  - say: 天下大乱，你们这些人面兽心的，都想篡位当皇帝。我一时英雄，凭什么不能当！
    speaker: 冉闵
    style: 被缚仍昂头，怒极反笑，一字一顿地顶回去
    quote: 天下大乱，尔曹夷狄，人面兽心，尚欲篡逆；我一时英雄，何为不可作帝王邪
    sources: [js-107]
    show:
      - enter: {who: 冉闵, side: right, cue: 天下大乱, for: 6}
      - sfx: {name: 重低音落地, cue: 凭什么不能当}

  - say: 冉闵在龙城遏陉山被斩。史书说，山上七里草木全枯，大半年没下雨。
    sources: [js-107]
    camera: {focus: [魏昌城, 龙城], zoom: fit, move: 1.4}
    tells: [e26, e27]
    show:
      - march: {from: 魏昌城, via: [蓟], to: 龙城, faction: 前燕, label: 送闵于龙城, cue: 龙城, grow: 1.8}
      - exit: {who: 冉闵, at: 龙城, verb: 诛, portrait: true, cue: 被斩}
      - quote: {text: 山左右七里草木悉枯…五月不雨，至于十二月, source: 晋书·石季龙载记下, cue: 草木全枯, for: 4}

  - say: 同一年，慕容儁在中山称帝。八月，邺城也落进了前燕手里。
    map: '352-08'
    owners_cue: 邺城
    sources: [js-08]
    camera: {focus: [长安, 邺, 龙城], zoom: fit, move: 1.6}
    tells: [e28]
    show:
      - act: {act: enthrone, who: 慕容儁, at: 中山, text: 燕帝, sub: 永和八年, cue: 称帝, for: 3}

  # ---------------- 收 ----------------
  - say: 冉闵为什么三年就亡？靠杀戮立国，四面八方都是仇人，再能打也守不住。
    sources: [js-107]
    show:
      - headline: {text: 三年冉魏, sub: 四面皆敌, cue: 四面八方, for: 3.6}

  - say: 北方从此成了前燕、前秦，加上南边东晋，三家对峙。
    sources: [js-08]
    show:
      - faction_bar: {left: 前燕, right: 前秦, cue: 三家对峙, for: 3.4}
      - sfx: {name: 史诗冲击, cue: 三家对峙}

  - say: 后世有人说冉闵是英雄，也有人说他是屠夫。你怎么看？
    sources: [js-107]
    show:
      - card: {title: 史书怎么写, body: 这是冉闵自己说的：我一时英雄，何为不可作帝王邪, cue: 你怎么看, for: 4}

  - say: 北方大乱，东晋的桓温，坐不住了。
    sources: [js-08]
    show:
      - title_bar: {text: 下集, sub: 两晋 · 桓温北伐, cue: 坐不住了, delay: 0.4, for: 3.0}
      - sfx: {name: 时代转折, cue: 坐不住了}
