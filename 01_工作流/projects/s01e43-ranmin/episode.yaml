  - say: 冉闵先下手杀了石遵，立了石鉴。石鉴又派人半夜杀他，没成。
    sources: [js-107]
    show:
      - exit: {who: 石遵, at: 邺, verb: 杀, portrait: true, cue: 杀了石遵}
      - enter: {who: 石鉴, side: left, cue: 石鉴, for: 3}

  # ---------------- 第二章 杀胡 ----------------
  - say: 宫里三千羯兵起兵杀他，被杀得血流成河。冉闵下令：胡人敢拿兵器的，斩！
    phase: 杀胡
    sources: [js-107]
    camera: {focus: 邺, zoom: 8, move: 1.2}
    show:
      - battle: {at: 邺, text: 流血成渠, cue: 血流成河}
      - quote: {text: 宣令内外六夷敢称兵杖者斩之, source: 晋书·石季龙载记下, cue: 斩, for: 3.6}

  - say: 他又打开城门：跟我一条心的留下，不愿意的随便走。
    sources: [js-107]
    show:
