      - spot: {at: 襄国, text: 石祗僭称尊号, cue: 称了帝, for: 3}

  # ---------------- 第三章 前秦 ----------------
  - say: 北边，慕容家趁乱拿下蓟城。枋头的氐族首领苻洪，也想争天下。
