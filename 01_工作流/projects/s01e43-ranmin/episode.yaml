# 快节奏版（2026-10-25）
# 《三国到隋》第43集 · 十六国：冉闵杀胡建魏，前秦在关中立国（349–352）。大纲第 37 条。
# 史料包：projects/s01e43-ranmin/research/史料包.yaml（Codex）；战事账：战事.yaml。
# 本地语料核对（晋书）：
# 石季龙载记下 p07374 石遵"努力事成，以尔为储贰。既而立衍，闵甚失望…遵召石鉴等入议…皆请诛之"；"乃杀之于琨华殿"；p07376 石鉴"夜诛闵农于琨华殿，不克"；
#   p07378"孙伏都、刘铢等结羯士三千伏于胡天，亦欲诛闵等…横尸相枕，流血成渠。宣令内外六夷敢称兵杖者斩之…令城内曰：与官同心者住，不同心者各任所之…于是赵人百里内悉入城，胡羯去者填门。闵知胡之不为己用也，班令内外赵人斩一胡首送凤阳门者，文官进位三等，武职悉拜牙门。一日之中，斩首数万…死者二十余万…于时高鼻多须至有滥死者半"；
#   p07383"闵字永曾，小字棘奴，季龙之养孙也。父瞻…本姓冉，名良，魏郡内黄人也"；p07384"僭即皇帝位于南郊…国号大魏，复姓冉氏"；p07385"石祗闻鉴死，僭称尊号于襄国，诸六夷据州郡拥兵者皆应之"；
#   p07387"闵率步骑十万攻石祗于襄国…攻襄国百余日…弋仲复遣其子襄率骑三万八千…俊遣将军悦绾率甲卒三万…三方劲卒合十余万…卫将军王泰谏…道士法饶进曰：太白经昴，当杀胡王，一战百克，不可失也。闵攘袂大言曰：吾战决矣，敢谏者斩！…姚襄、悦绾、石琨等三面攻之，祗冲其后，闵师大败。闵潜于襄国行宫，与十余骑奔邺…诸将士死者十余万"；
#   p07390"遂入襄国，诛显"；p07391"与慕容恪相遇于魏昌城…闵怒曰：吾成师以出，将平幽州，斩慕容俊；今遇恪而避之，人将侮我矣。乃与恪遇，十战皆败之。恪乃以铁锁连马…闵所乘赤马曰朱龙，日行千里，左杖双刃矛，右执钩戟，顺风击之，斩鲜卑三百余级。俄而燕骑大至，围之数周…跃马溃围东走，行二十余里，马无故而死，为恪所擒…俊立闵而问之曰：汝奴仆下才，何自妄称天子？闵曰：天下大乱，尔曹夷狄，人面兽心，尚欲篡逆；我一时英雄，何为不可作帝王邪！"；
#   p07393"俊送闵既至龙城，斩于遏陉山。山左右七里草木悉枯，蝗虫大起，五月不雨，至于十二月"；
# 苻洪载记 p07569"既而秋因宴鸩洪…洪将死，谓健曰：…关中形胜，吾亡后便可鼓行而西"；苻健载记 p07571"缮宫室于枋头，课所部种麦，示无西意，有知而不种者，健杀之以徇…起浮桥于盟津以济…兄子菁自轵关入河东。健执菁手曰：事若不捷，汝死河北，我死河南，不及黄泉无相见也。既济，焚桥…三辅略定。健引兵至长安…入而都之"；p07572"永和七年，僭称天王、大单于"；
# 穆帝纪 p00183-p00185：350 闰月冉闵称天王国号魏；八月苻健帅众入关；十一月冉闵围襄国；351 正月苻健称王国号秦；二月石祗大败冉闵于襄国；四月刘显杀石祗；352 正月冉闵杀刘显；四月冉闵为慕容隽所灭，隽称帝于中山；八月冉智以邺降。
# 不用：曝尸、野犬食尸、"无贵贱男女少长皆斩之"（过于残酷；旁白只说史书记载的人数）；"连环马"侧翼包抄等后世演绎（只用晋书"铁锁连马"）；"汉人英雄"作为定论（旁白只引冉闵自辩，结尾交给观众）。

id: s01e43-ranmin
title: 冉闵
series: 十六国 · 第43集
year: 350

notes:
  - 主线问题：石虎死后一年换了三个皇帝，石虎的养孙冉闵怎么从辅政大将变成魏国皇帝，又为什么三年就亡了？同时，枋头的苻家如何趁乱西进，在关中建了秦。
  - 钩子候选：①"一道命令下去，邺城一天之内杀了几万人"（反差2 具体3 悬念3 兑现3=11）②"他是石虎的养孙，最后却把石家杀了个干净"（反差3 具体2 悬念3 兑现3=11）→ 合并：先说命令，再揭身份。
  - 反差：养孙灭了石家；打开城门任人去留，汉人涌进、胡人挤出；苻健种麦装作不走，突然西进烧桥；冉闵十战十胜，最后一仗马无故而死。
  - 细节：努力事成以尔为储贰；六夷敢称兵杖者斩；赵人入城胡羯填门；斩一胡首文官进位三等；高鼻多须滥死；课所部种麦；汝死河北我死河南；既济焚桥；太白经昴；吾战决矣敢谏者斩；十余骑奔邺；十战皆败之；铁锁连马；赤马朱龙；马无故而死；汝奴仆下才；我一时英雄；遏陉山草木悉枯。
  - 演义对照卡：结尾卡"史书怎么写"（冉闵自辩"我一时英雄，何为不可作帝王邪"——这是他自己的话，不是史家评语）。

