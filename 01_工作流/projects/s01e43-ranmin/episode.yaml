publish:
  hook: 一道命令下去，邺城一天之内杀了几万人。下令的，是石虎的养孙
  big: [冉闵, 前秦立国]
  hero: 冉闵
  at: 3
  summary: |
    349 年石虎死，儿子们一年里换了三个皇帝。石虎的养孙冉闵本姓冉，是魏郡内黄的汉人，先帮石遵杀石世夺位，石遵许他做太子又反悔、想杀他，冉闵便杀石遵、立石鉴，石鉴又谋杀他未成。羯族卫士作乱被平后，冉闵下令"六夷敢称兵杖者斩"，打开城门任人去留，汉人涌入、胡羯填门而出；又令送一胡首者进官，史书记死者二十余万，高鼻多须者多被滥杀。350 年闰正月他杀石鉴称帝，国号魏，复姓冉。石祗在襄国称帝，各地胡人兵马都附石祗。
    枋头的氐帅苻洪被麻秋毒死，临终叫儿子苻健西取关中。苻健在枋头种麦装作不走，350 年秋突然全军西进，盟津架桥渡河、过河焚桥，对侄子苻菁说"汝死河北，我死河南"，三辅略定，入长安，351 年称天王、国号秦。
    冉闵围襄国百余日，羌、燕援军十余万赶到，他不听劝谏，信道士"太白经昴，当杀胡王"，说"吾战决矣，敢谏者斩"，三面受敌大败，带十余骑逃回邺。352 年他在魏昌城遇慕容恪，十战皆胜，慕容恪以铁锁连马结方阵，冉闵骑赤马朱龙杀三百余人后突围，马无故而死被擒。他对慕容儁说"我一时英雄，何为不可作帝王邪"，被斩于龙城遏陉山。同年慕容儁称帝，邺入前燕。
  tags: [十六国, 冉闵, 冉魏, 杀胡令, 前秦, 苻健, 慕容恪, 前燕]
  next: 桓温北伐

