# 快节奏版（2026-10-13，按抖音数据：冷开场、只讲有戏的、无背景音乐）
# 《三国到隋》第5集：李傕郭汜攻破长安，曹操收编青州兵、血洗徐州、后院起火（192–195）
# 2026-10-11 按故事稿写成旁白。关键原文均在本地语料核过：贾诩"一亭长能束君"（贾诩传 / 后汉书董卓传）；
# 王允"奉身以死之"（后汉书·王允传）；吕布"卓死后六旬…出武关"（吕布传、武帝纪）；"青州黄巾众百万入兖州"、
# 鲍信"刻木如信形状"、"受降卒三十余万，男女百余万口…号为青州兵"、"谷一斛五十余万钱，人相食；陶谦死，刘备代之"（武帝纪）；
# "泗水为之不流"（陶谦传）；"所过多所残戮"（武帝纪）；"我若不还，往依孟卓"、"唯鄄城、东阿、范为太祖守"（张邈传）；
# 荀彧"深根固本""将军当安所归乎"（荀彧传）；傕汜相攻（后汉书·董卓列传）。

id: s01e05-changan
title: 李傕郭汜破长安
series: 三国 · 第5集
year: 192

notes:
  - 主线问题：董卓死了，天下为什么更乱了？
  - 曹嵩之死：武帝纪说"为陶谦所害"，裴注说法不一。旁白说"死在陶谦的地盘上，曹操认定是陶谦干的"。
  - 屠徐州：不报具体杀人数（后汉书"数十万"可能夸大），只说"死者万数，泗水为之不流"和"所过多有屠戮"。
  - 刘备接徐州不用"三让徐州"（演义加工）。

