  big: [一亭长能束君]
  hero: 贾诩
  at: 30
  summary: |
    董卓一死，王允拒绝赦免西凉旧部。谋士贾诩一句话，让走投无路的李傕、郭汜杀回长安：吕布出逃，王允殉国，天子又落入武夫之手。
    东边，曹操收编三十万青州兵起家，为父报仇两征徐州，却被老友张邈、谋士陈宫从背后捅了一刀，兖州只剩三座城。
  tags: [李傕郭汜, 贾诩, 曹操, 吕布, 青州兵]
  next: 落难天子，谁来接？

