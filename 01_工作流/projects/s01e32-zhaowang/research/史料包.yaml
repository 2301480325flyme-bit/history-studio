episode: s01e32-zhaowang
title: 赵王伦篡位，三王起兵
year: 301
handoff:
  - 接第29集杨骏居太极殿、贾南风盯上杨骏；本集不重复杨骏掌权和被诛。
  - 以伦称帝、诸王响应、战事、宫廷内应、惠帝复位、冏辅政为范围；乂讨冏作下集钩子。
  - “三王”是简称，惠帝纪还列常山王乂及地方将领响应。
  - 本地sources未返回通鉴段落；通鉴异文附在线原文，para: 无。
events:
  - id: e01
    date: 301-01
    people: [司马伦, 孙秀]
    place: 洛阳
    event: 伦篡位称帝、改元建始；滥封官爵，出现“貂不足，狗尾续”谚。
    evidence:
      - {quote: "乃僭即帝位，大赦，改元建始。", para: 晋书-p04589}
      - {quote: "每朝会，貂蝉盈坐，时人为之颜曰：‘貂不足，狗尾续。’", para: 晋书-p04589}
    note: 两句同出赵王伦传，典故直接出处仅此一处。
  - id: e02
    date: 301-01
    people: [司马伦, 司马衷]
    place: 金墉城
    event: 惠帝被迁出宫城、尊为太上皇；惠帝纪称改金墉为永昌宫。
    evidence:
      - {quote: "丙寅，迁帝于金墉城，号曰太上皇，改金墉曰永昌宫。", para: 晋书-p00098}
      - {quote: "惠帝乘云母车，卤簿数百人，自华林西门出居金墉城。", para: 晋书-p04588}
    note: 金墉城宫址未核。
  - id: e03
    date: 301-03
    people: [司马冏, 司马颖, 司马颙, 司马乂, 李毅, 王彦, 司马歆]
    place: 许昌、阳翟、邺、长安
    event: 冏起兵讨伦、屯阳翟；颖、颙、常山王乂及地方将领响应。阳翟是前沿屯点，不是许昌城。
    evidence:
      - {quote: "平东将军、齐王冏起兵以讨伦，传檄州郡，屯于阳翟。", para: 晋书-p00098}
      - {quote: "征北大将军、成都王颖，征西大将军、河间王颙，常山王乂，豫州刺史李毅，兗州刺史王彦，南中朗将、新野公歆，皆举兵应之，众数十万。", para: 晋书-p00098}
  - id: e04
    date: 301-03
    people: [闾和, 张泓, 孙辅, 孙会, 士猗, 许超]
    place: 伊阙、堮坂、黄桥
    event: 伦军分路出击：闾和出伊阙，张泓孙辅出堮坂，孙会士猗许超出黄桥迎颖军。
    evidence:
      - {quote: "伦遣其将闾和出伊阙，张泓、孙辅出堮坂以距冏，孙会、士猗、许超出黄桥以距颍。", para: 晋书-p00098}
      - {quote: "伦遣其将闾和、张泓、孙辅出堮坂，与冏交战。", para: 晋书-p04599}
    note: 两传路线有差异，不选唯一说法。
  - id: e05
    date: 301-03
    people: [司马颖, 赵骧, 石超, 孙会, 士猗, 许超]
    place: 黄桥
    event: 黄桥交战；伦传记杀伤万余，颖传称赵骧初到黄桥死者八千余，或属不同阶段/口径。
    evidence:
      - {quote: "许超等与成都王颖军战于黄桥，杀伤万余人。", para: 晋书-p04593}
      - {quote: "赵骧至黄桥，为伦将士猗、许超所败，死者八千余人，士众震骇。", para: 晋书-p04625}
  - id: e06
    date: 301-03
    people: [赵骧, 石超, 孙会]
    place: 湨水（本地惠帝纪作溴水）
    event: 赵骧、石超与孙会军战，孙会军败走；河名及战序有异文。
    evidence:
      - {quote: "及颖将赵骧、石超战于溴水，会等大败，弃军走。", para: 晋书-p00098}
    note: 本地未索引通鉴；在线晋书与通鉴考异有湨/激异文（在线校勘线索：https://www.shidianguji.com/book/LS0005/chapter/LS0005_49；https://guwensou.com/book/zizhitongjian/a3885609.html），verify_quotes仅核本地引文；地名资料释为济源—孟州漭河水系，河段未核。
  - id: e07
    date: 301-04
    people: [何勖, 张泓, 孙辅, 司马冏]
    place: 阳翟
    event: 冏军大破张泓、斩孙辅等，之后率军入洛。
    evidence:
      - {quote: "冏将何勖等击张泓于阳翟，大破之，斩孙辅等。", para: 晋书-p00098}
      - {quote: "冏屯军阳翟，伦遣其将闾和、张泓、孙辅出堮坂，与冏交战。冏军失利，坚垒自守。会成都军破伦众于黄桥，冏乃出军攻和等，大破之。", para: 晋书-p04599}
  - id: e08
    date: 301-04
    people: [王舆, 淮陵王漼, 孙秀, 孙会, 许超, 士猗, 骆休, 司马伦]
    place: 洛阳宫城、南掖门
    event: 王舆率七百余营兵从南掖门入宫，宫兵响应、杀孙秀等伦党；伦被逐归第，惠帝当日复位。伦最终死法及地点未由目标段落核实。
    evidence:
      - {quote: "左卫将军王舆与尚书、淮陵王漼勒兵入宫，禽伦党孙秀、孙会、许超、士猗、骆休等，皆斩之。", para: 晋书-p00098}
      - {quote: "王舆反之，率营兵七百余人自南掖门入，敕宫中兵各守卫诸门，三部司马为应于内。舆自往攻秀，秀闭中书南门。舆放兵登墙烧屋，秀及超、猗遽走出，左卫将军赵泉斩秀等以徇。", para: 晋书-p04594}
  - id: e09
    date: 301-04
    people: [司马衷, 司马伦, 司马冏]
    place: 洛阳
    event: 伦败、惠帝复位，冏率军入洛；没有郡级易手。
    evidence:
      - {quote: "逐伦归第，即日乘舆反正。", para: 晋书-p00098}
      - {quote: "及王舆废伦，惠帝反正，冏诛讨贼党既毕，率众入洛，顿军通章署，甲士数十万，旌旗器械之盛，震于京都。", para: 晋书-p04599}
  - id: e10
    date: 301-06
    people: [司马冏, 司马衷]
    place: 洛阳
    event: 冏留洛辅政、坐拜百官、符敕台府、大筑宅第。疆域.yaml记许昌归晋在301-06。
    evidence:
      - {quote: "齐王冏既诛赵王伦，因留辅政，坐拜百官，符敕台府", para: 晋书-p02513}
      - {quote: "大筑第馆，北取五谷市，南开诸署，毁坏庐舍以百数，使大匠营制，与西宫等。", para: 晋书-p04600}
  - id: e11
    date: 303-12（钩子）
    people: [司马乂, 司马冏]
    place: 洛阳
    event: 颖、颙后来檄长沙王乂讨冏，乂奉惠帝攻杀冏；只作下集钩子。
    evidence:
      - {quote: "河间王颙表齐王冏窥伺神器，有无君之心，与成都王颍、新野王歆、范阳王虓同会洛阳，请废冏还第。长沙王乂奉乘舆屯南止车门，攻冏，杀之。", para: 晋书-p00099}
      - {quote: "是月，成都、河间檄长沙王乂讨之，冏、乂交战，攻焚宫阙，冏兵败，夷灭。", para: 晋书-p00630}

