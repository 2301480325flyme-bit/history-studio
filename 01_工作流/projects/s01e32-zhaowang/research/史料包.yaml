differences_and_disputes:
  - 演义：此为西晋八王之乱，《三国演义》无可核对应情节；网络转述戏剧化处以纪传为准。
  - 水名：本地惠帝纪溴水，在线晋书湨水，通鉴考异引赵王伦传激水，不统一改字。
  - 战序：惠帝纪压缩黄桥与湨/溴水；伦传、冏传叙述顺序及冏军胜负阶段不同。
  - 伤亡：伦传杀伤万余、颖传死者八千余，可能不同阶段/口径，不合并。
  - “众数十万”是响应军总数；伦军三路合计2.4万非全军数。
  - 金墉改名惠帝纪作永昌宫，五行志作永安宫（晋书-p02573）。
  - 伦被逐归第后的赐死时间、方式、地点未核；多数人物生年未核。
