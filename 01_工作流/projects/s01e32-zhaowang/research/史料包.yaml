  - {scene: 伦称帝、貂蝉满座, source: [{quote: "每朝会，貂蝉盈坐，时人为之颜曰：‘貂不足，狗尾续。’", para: 晋书-p04589}]}
  - {scene: 诸王檄书和伦军多路出击, source: [{quote: "齐王冏起兵以讨伦，传檄州郡，屯于阳翟。", para: 晋书-p00098}, {quote: "伦遣其将闾和出伊阙，张泓、孙辅出堮坂以距冏，孙会、士猗、许超出黄桥以距颍。", para: 晋书-p00098}]}
  - {scene: 黄桥战后敛葬（阶段待核）, source: [{quote: "颖乃造棺八千余枚，以成都国秩为衣服，敛祭，葬于黄桥北。", para: 晋书-p04626}]}
  - {scene: 南掖门内应、七百兵入宫, source: [{quote: "率营兵七百余人自南掖门入，敕宫中兵各守卫诸门，三部司马为应于内。", para: 晋书-p04594}]}
  - {scene: 冏军入洛、辅政后扩宅, source: [{quote: "率众入洛，顿军通章署，甲士数十万，旌旗器械之盛，震于京都。", para: 晋书-p04599}, {quote: "大筑第馆，北取五谷市，南开诸署，毁坏庐舍以百数。", para: 晋书-p04600}]}
