# 快节奏版（2026-10-25）
# 《三国到隋》第32集 · 两晋：赵王伦篡位，三王起兵（301）。大纲第 28 条。
# 本地语料核对（晋书）：
# 惠帝纪 p00098 永宁元年"春正月乙丑，赵王伦篡帝位。丙寅，迁帝于金墉城，号曰太上皇"；"三月，平东将军、齐王冏起兵以讨伦，传檄州郡，屯于阳翟。征北大将军、成都王颖，征西大将军、河间王颙…皆举兵应之，众数十万。伦遣其将闾和出伊阙，张泓、孙辅出堮坂以距冏，孙会、士猗、许超出黄桥以距颍"；"辛酉，左卫将军王舆…勒兵入宫，禽伦党孙秀…逐伦归第，即日乘舆反正"（正月乙丑至四月辛酉，中有闰三月，约一百一十六天，旁白说"一百多天"）；
# 赵王伦传 p04588"秀使牙门赵奉诈为宣帝神语，命伦早入西宫…惠帝乘云母车，卤簿数百人，自华林西门出居金墉城"；"每朝会，貂蝉盈坐，时人为之颜曰：貂不足，狗尾续"；
#   p04594 王舆"率营兵七百余人自南掖门入…秀闭中书南门。舆放兵登墙烧屋，秀及超、猗遽走出，左卫将军赵泉斩秀等以徇"；
#   p04596"遣尚书袁敞持节赐伦死，饮以金屑苦酒。伦惭，以巾覆面，曰：孙秀误我！孙秀误我！…自兵兴六十余日，战所杀害仅十万人"；
# 成都王颖传 p04625"至朝歌，众二十余万。赵骧至黄桥，为伦将士猗、许超所败，死者八千余人，士众震骇。颖欲退保朝歌，用卢志、王彦策，又使赵骧率众八万…未及温十余里，复大战，猗等奔溃。颖遂过河，乘胜长驱"；p04626 卢志劝葬黄桥战亡者，"颖乃造棺八千余枚…葬于黄桥北"；
# 齐王冏传"冏屯军阳翟…冏军失利，坚垒自守。会成都军破伦众于黄桥，冏乃出军攻和等，大破之"；"率众入洛，顿军通章署，甲士数十万"；"大筑第馆…毁坏庐舍以百数…与西宫等"。
# 不用：堮坂、通章署、南掖门的精确地点（未核，地图只画到伊阙、阳翟、黄桥、温、洛阳）；黄桥坐标只是候选（淇县西），旁白只说"黄桥"不说今地；伦被赐死的具体地点（金墉城，按惠帝纪"诛赵王伦"、伦传"赐伦死"画在洛阳）。

id: s01e32-zhaowang
title: 赵王伦篡位
series: 两晋 · 第32集
year: 301

notes:
  - 主线问题：赵王伦抢到了皇位，为什么只坐了一百多天？——他手里只有洛阳的禁军，而晋武帝早把兵分到了各地王府里；三个王一起兵，几十万人压过来，洛阳城里的人先倒了戈。
  - 钩子候选：①"六十多天，死了将近十万人，只为赶走一个皇帝"（反差3 具体3 悬念3 兑现3=12）②"狗尾续貂，说的就是他"（反差2 具体2 悬念2 兑现3=9）③"他当了一百天皇帝，临死只喊一句：孙秀害我"（反差2 具体3 悬念2 兑现3=10）→ 选①，③做结尾高潮。
  - 反差：孙秀找人扮司马懿显灵；貂尾不够用狗尾凑；黄桥大败八千人，成都王却没退，下一仗大胜；赶走篡位的赵王，迎来骄横的齐王。
  - 细节：云母车、金墉城；狗尾续貂；八千口棺材；七百人从南掖门杀进宫、爬墙放火；头巾蒙脸"孙秀误我"。
  - 动机：孙秀怕赵王只当相国不够稳；成都王听卢志的"退了士气就散了"。
  - 演义对照卡：结尾卡用"成语出处"——狗尾续貂，出自本集。

