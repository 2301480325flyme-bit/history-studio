  hero: 司马伦
  at: 3
  summary: |
    301 年正月，赵王司马伦在孙秀撺掇下逼晋惠帝"禅让"，把傻皇帝用云母车送进金墉城，自己称帝；为收买人心滥封官爵，貂尾不够用狗尾凑，留下"狗尾续貂"。
    三月齐王司马冏在许昌起兵，成都王司马颖、河间王司马颙响应，众数十万。成都王先锋在黄桥大败、死者八千余人，他听卢志的没有退，在温县附近大破伦军渡河；齐王也在阳翟反败为胜。四月王舆率七百人从南掖门杀进宫，斩孙秀，惠帝复位。赵王饮金屑酒前以巾覆面："孙秀误我！"六十余日的仗，死者近十万。随后齐王率数十万甲士入洛辅政，大修府第。
  tags: [西晋, 赵王伦, 狗尾续貂, 齐王冏, 成都王颖, 八王之乱]
  next: 长沙王成都王河间王混战

