  - say: 赵王为什么只当了一百多天皇帝？他手里只有洛阳的禁军，而刀，早就分到了各地的王府里。
    sources: [js-04]
    camera: {focus: [洛阳, 邺, 许昌, 长安], zoom: fit, move: 1.6}
    show:
      - flag: {at: 邺, name: 成都王, faction: 成都王, cue: 王府}
      - flag: {at: 长安, name: 河间王, faction: 河间王, cue: 王府}

  - say: 赶走了一个篡位的王，迎来了一个骄横的王。
    sources: [js-59]
    show:
      - headline: {text: 一个王走了, sub: 另一个王来了, cue: 骄横, for: 3.4}
      - sfx: {name: 史诗冲击, cue: 骄横}

  - say: 如果你是成都王，黄桥一仗死了八千人，退，还是打？
    sources: [js-59]
    show:
      - card: {title: 成语出处, body: 狗尾续貂——晋书·赵王伦传：貂不足，狗尾续, cue: 退, for: 3.6}

  - say: 齐王得意不到一年。他的堂弟长沙王司马乂，已经在洛阳城里磨刀了。
    sources: [js-04]
    show:
      - enter: {who: 司马冏, side: right, cue: 齐王, for: 3.4}
      - title_bar: {text: 下集, sub: 两晋 · 诸王混战, cue: 磨刀, delay: 0.4, for: 3.0}
      - sfx: {name: 时代转折, cue: 磨刀}
