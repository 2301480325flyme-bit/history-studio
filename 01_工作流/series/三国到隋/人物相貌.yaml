  夏侯渊:
    id: xiahou_yuan
    age: 约五十五至六十岁（219年定军山；生年不详，本传只记其早年从曹操起兵，年龄为视觉估值）
    recorded: 无明确相貌记载。《三国志·卷九·夏侯渊传》记其“赴急疾，常出敌之不意”，此为行军特点，不当作脸部史实。
    face: 设计：偏长瘦削的风霜脸，窄颧与略凹双颊，细长清楚的鼻梁和薄唇；眼角纹与眼下松弛明确，较细低平眉、上眼皮略沉；稀疏花白短髭与短下颌须，两颊无连腮须，鬓发明显灰白；日晒赭黄肤色；不加伤疤。年龄感、凹颊长脸、须发与眉眼均用于区别曹操，不宣称史载相貌。
    expression: 头略前倾、微侧向右，眼神专注而带疲惫感、嘴唇轻抿，不用倒八字怒眉；一手抬至胸侧作短促止进手势，另一手收在腹前，双肘内收。不拔刀、不表现被斩。将原“眉心紧”细化为克制专注，以免生成为曹操式怒视。
    colors: [锈赭, 暗褐, 麻白]
    silhouette: 低矮软武冠、贴身轻甲和窄肩披膊；不用曹操的高黑冠与厚披风。
    apart_from: 曹操（本标准像46岁感、宽方颧、浓黑短髭连腮须、怒挑眉）对比本人的近六十岁皱纹、瘦长凹颊、花白稀须灰鬓、沉眼低平眉；张郃（较年轻、宽额、整齐黑短须、冷青甲）；郭淮（约四十岁、宽圆下脸、黑短髭而下巴干净、铜褐灰）。脸部至少年龄感、脸型、须发、眉眼四项不同，冠甲配色只作辅助。
    status: done

  张郃:
