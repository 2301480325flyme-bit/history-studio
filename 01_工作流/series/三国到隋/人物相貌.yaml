# 《三国到隋》人物相貌档案（2026-10-23 建）
# 立绘撞脸的根源是"只规定道具、不规定脸"。每个人画立绘前先在这里写一条，Codex 负责研究和填写，Claude 负责审。
# 规范：~/.codex/skills/history-portrait 第二节之二；对照工具：01_工作流/history-studio/tools/portrait_faces.py
#
# 字段（每条都要有依据；史书没写的写"设计"，并说明为什么这样设计）：
#   id          立绘文件名（拼音）
#   age         本系列主要出场时的年龄，写出算法（生年 → 事件年）
#   recorded    史载相貌原文 + 出处；没有就写 无
#   face        脸型 · 体型 · 眉眼 · 鼻嘴 · 胡须与须发颜色 · 肤色 · 标记
#   expression  招牌表情与动作（他在本系列最有戏的一刻）
#   colors      2–3 个主色（同阵营、同框的人不重复）
#   silhouette  独有的冠 / 盔 / 巾 / 披风 / 兵器 / 发式
#   family      同族的共同特征（没有就省略）
#   apart_from  最容易撞脸的 3 人，以及至少三项不同
#   status      todo（待画）/ done（已按本档案重画）/ old（旧图，未按档案）

people:
