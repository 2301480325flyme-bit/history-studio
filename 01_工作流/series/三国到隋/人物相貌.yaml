    silhouette: 低顶覆耳武盔、肩部简洁片甲；不加翎羽，轮廓与夏侯渊的软冠、郭淮的平巾分开。
    apart_from: 法正（约四十五岁、削窄面颊、淡须或无颊须、深梅褐文袍）；郭淮（约四十岁、宽圆下颌、短髭、铜褐灰）；夏侯渊（年长风霜脸、灰鬓、锈赭轻甲）。至少年龄、脸型、胡须、配色、冠盔五项不同。
    status: done

  法正:
    id: fa_zheng
    age: 四十四岁（虚岁；《三国志·法正传》记定军山次年“明年卒，时年四十五”，即 220 年卒、176 年生，219 年定军山时四十四）
    recorded: 无明确相貌记载。《三国志·卷三十七·法正传》记其“内为谋主”，并载其向刘备献取益州之策；相貌不能从谋略反推。
