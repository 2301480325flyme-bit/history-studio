# 《三国到隋》疆域时间线：全系列唯一的"谁占哪里"。
# 每集的拍只写 `map: 年-月`（例如 map: 196-06），引擎按这里推算到那个时刻为止的全部归属（郡级，han-140 格子），
# 不再在各集手抄 owners。改一处，所有集同步；上一集结尾和下一集开场自动对得上。
# 单位可以写州（整州）或郡国名；后面的事件覆盖前面的归属。势力的颜色与名字位置在 polities 里统一定义（各集可覆盖 label_at）。
# 日期以史实为准；少数同年事件按片中讲述顺序排了先后（如 199 年先讲袁术之死、再讲易京），已在 note 里注明。
# 检查：python history-studio/consistency.py --series s01e

polities:
  汉室: {slot: stone, main: true, label_at: 洛阳}   # 2026-10-13 中性灰：名义归汉、没有军阀割据的地方，不再像一块无主的色块
  黄巾: {slot: lemon, label_at: 广宗}
  刘焉: {slot: lime, label_at: 绵竹}
  刘璋: {slot: lime, label_at: 成都}
  董卓: {slot: violet, label_at: 长安}
  关东: {slot: sky, label_at: 酸枣}
  凉州军: {slot: lavender, label_at: 长安}
  关中诸将: {slot: lavender, label_at: 长安}
  张鲁: {slot: orange, label_at: 南郑}
  公孙度: {slot: blue, label_at: 襄平}
  公孙康: {slot: blue, label_at: 襄平}
  公孙渊: {slot: blue, label_at: 襄平}
  韩馥: {slot: teal, label_at: 邺}
  袁绍: {slot: sky, label_at: 邺}
  袁谭: {slot: aqua, label_at: 平原}
  袁尚: {slot: sky, label_at: 邺}       # 继袁绍冀州，沿用袁家的蓝
  袁熙: {slot: teal, label_at: 蓟}
  高干: {slot: salmon, label_at: 晋阳}
  公孙瓒: {slot: orange, label_at: 蓟}
  刘虞: {slot: pink, label_at: 蓟}        # 2026-10-15 参考外部动态图复核：191–193 幽州牧刘虞仍据蓟
  张杨: {slot: salmon, label_at: 野王}    # 2026-10-15 复核：董卓以杨为河内太守，屯野王，198 年被部将所杀
  刘岱: {slot: tan, label_at: 陈留}
  袁术: {slot: rose, label_at: 寿春}
  陈王: {slot: olive, label_at: 陈}       # 2026-10-15 陈王刘宠拥强弩自守、自称辅汉大将军；原先画成灰色"汉室"，观众看不懂
  刘表: {slot: olive, label_at: 襄阳}
  陶谦: {slot: aqua, label_at: 郯}
  曹操: {slot: jade, label_at: 许}
  吕布: {slot: brick, label_at: 下邳}
  刘备: {slot: pink, label_at: 下邳}
  张绣: {slot: tan, label_at: 宛}
  孙策: {slot: lemon, label_at: 吴}
  孙权: {slot: lemon, label_at: 吴}
  魏: {slot: jade, main: true, label_at: 洛阳}       # 220-10 曹丕受禅起，曹操的地盘改称魏
  蜀汉: {slot: pink, label_at: 成都}      # 221-04 刘备称帝（国号汉，史称蜀汉）
  吴: {slot: lemon, label_at: 武昌}       # 221-08 孙权受封吴王（229 称帝）
  晋: {slot: jade, main: true, label_at: 洛阳}       # 265-12 司马炎受禅，魏改称晋
  # ---- 两晋篇（2026-10-15 新增）----
  # 八王里只有以外镇为根据地、和洛阳朝廷对着干的才单独上色：齐王（许昌）、成都王（邺）、河间王（长安）、东海王（东海）。
  # 汝南王亮、楚王玮、赵王伦、长沙王乂都是在洛阳掌朝廷，地图上仍算"晋"，用旗牌和人物表示，不另上色。
  齐王: {slot: orange, label_at: 许昌}     # 301-03 齐王冏起兵许昌讨赵王伦
  成都王: {slot: sky, label_at: 邺}        # 299-01 镇邺；301 起兵后以邺为根据地遥控朝政
  河间王: {slot: lavender, label_at: 长安}  # 299-01 镇关中；301 起兵后据关中
  东海王: {slot: aqua, label_at: 郯}       # 304 荡阴之战后奔东海；写到第 3x 集时再补事件
  汉赵: {slot: pink, label_at: 离石}       # 304-10 刘渊称汉王于左国城（国号汉，史称前赵/汉赵）
  成汉: {slot: lime, label_at: 成都}   
  前赵: {slot: pink, label_at: 长安}       # 319 刘曜迁长安、改国号赵（史称前赵）；汉赵西部诸郡转此
  后赵: {slot: sky, label_at: 襄国}      # 319-11 石勒称赵王于襄国（史称后赵）；此前石勒名义属汉，地盘记汉赵       # 304-10 李雄称成都王（306 称帝，国号大成，史称成汉）
  前燕: {slot: violet, label_at: 棘城}      # 337-11 慕容皝自立燕王于棘城（史称前燕）；此前慕容部名义奉晋，地图仍记晋（2026-10-25 第42集）
  冉魏: {slot: orange, label_at: 邺}        # 350 闰正月冉闵杀石鉴称天王，国号魏（史称冉魏），352 亡（2026-10-25 第43集）
  前秦: {slot: rose, label_at: 长安}        # 350 苻健入长安，351 称天王、国号秦（史称前秦）（第43集）

# 史实上就是孤悬的小块（检查器不再报"飞地"）：jun + polity + 理由
allow_enclaves:
  - {jun: 魏郡, polity: 冉魏, note: 350 年冉闵只据邺城一带，四周后赵诸郡已加斜纹（各地屯结不从）；冉魏本就是被包围的孤城政权, source: 晋书·石季龙载记下}
  - {jun: 乐浪郡, polity: 晋, note: 313 年后为高句丽所据，地图不画高句丽，只留斜纹；被前燕包围是画法所致, source: 第42集}
  - {jun: 广阳郡, polity: 汉赵, note: 314 年石勒袭幽州、杀王浚、留刘翰戍蓟；其间冀州诸郡逐郡归属无原文，暂不填色，故成飞地（斜纹）, source: 晋书·石勒载记上}
  - {jun: 广阳郡, polity: 后赵, note: 同上，319 年石勒称赵王后改记后赵；321 年冀幽诸郡并入后才连成一片, source: 晋书·石勒载记下}
  - {jun: 赵国, polity: 后赵, note: 石勒以襄国为都；周边冀州诸郡 321 年前逐郡归属无原文，暂留晋色（示意），故与本家不相连, source: 晋书·石勒载记}
  - {jun: 广汉属国, polity: 魏, note: 263 年冬邓艾自阴平出江由，北面武都在争夺（斜纹）、剑阁仍在姜维手中，阴平一线是邓艾孤军开出的路, source: 三国志·邓艾传}
  - {jun: 广汉郡, polity: 魏, note: 263 年冬邓艾破绵竹后孤军深入，北面梓潼（剑阁）仍在姜维手中，至刘禅出降, source: 三国志·邓艾传}
  - {jun: 赵国, polity: 汉室, note: 184 年黄巾遍布冀州，赵国未见陷落记载（示意）}
  - {jun: 广阳郡, polity: 黄巾, note: 幽州黄巾杀刺史郭勋、太守刘卫, source: 后汉书·灵帝纪}
  - {jun: 南阳郡, polity: 黄巾, note: 宛城张曼成、赵弘、韩忠部坚持到 184 年冬}
  - {jun: 陈留郡, polity: 吕布, note: 张邈据陈留迎吕布，与吕布兖州诸郡隔着曹操的东郡、济阴}
  - {jun: 梁国, polity: 汉室, note: 豫州东部的梁国、鲁国名义属汉（汉王国，王无兵权），史无军阀据有的记载；198 年曹操东征吕布后入曹（推定）}
  - {jun: 鲁国, polity: 汉室, note: 同上}
  - {jun: 陈国, polity: 陈王, note: 陈王刘宠拥强弩自守，197 年为袁术所杀, source: 后汉书·陈敬王羡传}
  - {jun: 庐江郡, polity: 袁术, note: 袁术死后庐江太守刘勋据皖，199 年冬为孙策所破}
  - {jun: 庐江郡, polity: 孙策, note: 庐江与丹阳隔江相望（格子按水面不相连）}
  - {jun: 庐江郡, polity: 孙权, note: 同上}
  - {jun: 河南尹, polity: 汉室, note: 196 年上半年洛阳残破、天子七月还洛阳，八月曹操到后才归曹}
  - {jun: 九江郡, polity: 曹操, note: 199 年冬刘备据徐州反曹，九江、广陵暂与曹操本土隔开}
  - {jun: 广陵郡, polity: 曹操, note: 同上（陈登守广陵）}
  - {jun: 广汉郡, polity: 刘备, note: 212-12 至 214-06 刘备据涪、葭萌、白水关，北接张鲁、南对刘璋，本就是插进益州的一块}
  - {jun: 广汉属国, polity: 刘备, note: 同上（白水关以北）}
  - {jun: 江夏郡, polity: 刘备, note: 208-09 至 209-12 刘琦据江夏，与刘备新得的荆南四郡隔着曹仁守的南郡和长江水面}
  - {jun: 颍川郡, polity: 齐王, note: 301 年齐王冏起兵许昌，只画治所郡（示意），四周仍是晋的州郡}
  - {jun: 魏郡, polity: 成都王, note: 成都王颖以邺为根据地（301–304），只画治所郡（示意）}
  - {jun: 京兆尹, polity: 河间王, note: 河间王颙镇长安（301–306），只画治所郡（示意）}
  - {jun: 西河郡, polity: 汉赵, note: 304 年刘渊起于左国城，初起只有根据地}
  - {jun: 蜀郡, polity: 成汉, note: 304 年李雄据成都，初起只有成都、广汉一带}
  - {jun: 广汉郡, polity: 成汉, note: 同上}
  - {jun: 交趾郡, polity: 魏, note: 263 年吕兴以交阯降魏，隔着吴的交州远附}
  - {jun: 交趾郡, polity: 晋, note: 265–271 年交趾、九真、日南属晋，与本土不相连}
  - {jun: 北海国, polity: 汉室, note: 孔融为北海相，据北海、东莱，与陶谦、刘备的徐州隔着城阳}
  - {jun: 东莱郡, polity: 汉室, note: 同上}
  - {jun: 弘农郡, polity: 凉州军, note: 192 年董卓死后旧部李傕等屯陕（弘农），与凉州本土隔着关中}
  - {jun: 河东郡, polity: 凉州军, note: 同上（牛辅屯安邑）}

